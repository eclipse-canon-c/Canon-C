# .github/actions/framac-setup/action.yml
#
# Shared Frama-C toolchain setup, extracted verbatim from the `frama-c`
# job's setup steps so every per-header WP job can reuse it via
#   - uses: ./.github/actions/framac-setup
# instead of duplicating ~80 lines of opam/cvc5/why3 boilerplate.
#
# IMPORTANT: the calling job MUST run `actions/checkout@v6` BEFORE this
# action — a local composite action requires the repo already checked out.
#
# The job-level `env:` block (OCAML_VERSION / FRAMAC_VERSION / CVC5_VERSION)
# does NOT propagate into a composite action, so those values are passed as
# inputs with defaults matching the originals. The defaults reproduce the
# exact cache key string the monolithic job used
# (opam-Linux-ocaml-4.14.2-framac-29.0-z3-v8), so the existing cache is hit
# — no cold rebuild on first run.

name: "Frama-C setup"
description: "Install and configure Frama-C, Alt-Ergo, Z3, CVC5, and Why3 for WP runs"

inputs:
  ocaml-version:
    description: "OCaml compiler version"
    default: "4.14.2"
  framac-version:
    description: "Frama-C version"
    default: "29.0"
  cvc5-version:
    description: "CVC5 CLI binary version"
    default: "1.2.1"
  cvc5-sha256:
    description: "SHA-256 of that version's cvc5-Linux-x86_64-static.zip (change it with the version)"
    default: "6d44abc233980a14d72cc5809287d27c3335b1d6ee863381d0b5ffcbd0d8de56"
  altergo-version:
    description: "Alt-Ergo version (pinned — see the install step)"
    default: "2.6.3"
  why3-version:
    description: "Why3 version (pinned)"
    default: "1.7.2"
  z3-version:
    description: "Z3 version (pinned)"
    default: "4.15.2"

runs:
  using: "composite"
  steps:
    - name: Cache opam switch
      # Restored first (VERIFY-060), so that the next step knows a hit.
      id: cache-opam
      uses: actions/cache@v5
      with:
        path: ~/.opam
        # Cache key bumped to v8 because the cvc5 opam package was removed.
        # The old v7 cache contains the library-only cvc5 build which we
        # no longer need. v8 cache will be smaller and faster to restore.
        #
        # NOTE: uses inputs.* (NOT env.*) because job-level env does not
        # reach a composite action. With the default input values this
        # produces the identical key string the monolithic job used, so
        # the existing cache entry is reused.
        key: opam-${{ runner.os }}-ocaml-${{ inputs.ocaml-version }}-framac-${{ inputs.framac-version }}-ae${{ inputs.altergo-version }}-why3${{ inputs.why3-version }}-z3${{ inputs.z3-version }}-v9

    - name: Install system dependencies for opam and Frama-C
      # The opam cvc5 package is removed from this install list (see
      # the separate CVC5 CLI installation step below for rationale).
      # python3-tomli was a cvc5-opam-specific build dep — also removed.
      #
      # VERIFY-060: on a cache hit, only opam's own binary, without the
      # packages apt recommends with it. The full list is for building the
      # switch: it is 136 packages and 173 MB, among them Ubuntu's own OCaml
      # (the switch has its own) and the GTK libraries of the GUI, which no
      # job runs. With every Frama-C job downloading it, the Ubuntu mirror
      # stalled: setups of 40 to 185 minutes, and frama-c-lifetime cancelled
      # twice inside this step (4 · Proofs: core/ #25 and #26). A cache miss
      # still installs the full list.
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache-opam.outputs.cache-hit }}
      run: |
        sudo apt-get update
        if [ "${CACHE_HIT}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends opam
        else
          sudo apt-get install -y \
            opam \
            m4 \
            pkg-config \
            libgmp-dev \
            zlib1g-dev \
            autoconf \
            autotools-dev \
            graphviz \
            libcairo2-dev \
            libgtk-3-dev \
            libgtksourceview-3.0-dev \
            cmake \
            wget
        fi

    - name: Initialise opam (cache miss only)
      # cvc5 is NO LONGER installed via opam here. The opam cvc5.1.3.0
      # package ships only OCaml library bindings, not the CLI binary
      # that why3 needs for `-wp-prover cvc5`. We fetch the official
      # prebuilt cvc5 binary from GitHub releases in a separate step
      # below. Removing cvc5 from opam also shrinks the cache and
      # eliminates the conf-python3-tomli dependency chain.
      if: steps.cache-opam.outputs.cache-hit != 'true'
      shell: bash
      env:
        OCAML_VERSION: ${{ inputs.ocaml-version }}
        FRAMAC_VERSION: ${{ inputs.framac-version }}
        ALTERGO_VERSION: ${{ inputs.altergo-version }}
        WHY3_VERSION: ${{ inputs.why3-version }}
        Z3_VERSION: ${{ inputs.z3-version }}
      run: |
        rm -rf ~/.opam
        opam init -y --bare --no-setup --disable-sandboxing
        opam switch create frama-c ocaml-base-compiler.${OCAML_VERSION}
        eval $(opam env --switch=frama-c)
        # PINNED. Only frama-c was pinned before; alt-ergo, why3 and z3 took
        # whatever opam resolved on the last cold build, held constant solely
        # by the cache key below. That made every residual set in this repo
        # relative to an unrecorded solver version, and the cache is evicted
        # after 7 days without a hit.
        opam install -y --confirm-level=unsafe-yes --assume-depexts \
          frama-c.${FRAMAC_VERSION} \
          alt-ergo.${ALTERGO_VERSION} \
          why3.${WHY3_VERSION} \
          z3.${Z3_VERSION}

    # The cvc5 release archive is kept in GitHub's cache (VERIFY-065). When
    # about 140 jobs set up at once, the release site refused 47 of their
    # anonymous downloads, and wget gave up after five tries in 21 s; a
    # re-run of the 47 lost 23 more the same way (VERIFY-065 run 1). GitHub
    # limits unauthenticated requests more tightly since May 2025.
    # Restored from the cache, the archive is not downloaded at all. On a
    # miss, a job waits a random moment and looks again, so that the first
    # download, saved at once, serves the others. Then it downloads through
    # GitHub's API with the job's token, and only if that fails, anonymously,
    # retrying for up to ten minutes. The archive is checked against its
    # SHA-256 and its binary's version before it is used or saved.
    - name: Restore the cvc5 release archive
      id: cvc5-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/cvc5-archive
        key: cvc5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cvc5-version }}-${{ inputs.cvc5-sha256 }}

    - name: On a miss, wait a random moment for another job's download
      if: steps.cvc5-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        s=$(( RANDOM % 120 ))
        echo "No cvc5 archive in the cache: waiting ${s} s before looking again"
        sleep "${s}"

    - name: Restore the cvc5 release archive, again
      id: cvc5-cache-again
      if: steps.cvc5-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/cvc5-archive
        key: cvc5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cvc5-version }}-${{ inputs.cvc5-sha256 }}

    - name: Install cvc5 CLI binary from GitHub releases
      # The opam `cvc5` package installs OCaml bindings, not a CLI
      # binary. WP + why3 need the standalone `cvc5` executable.
      # We fetch it from the official cvc5 GitHub release and
      # install to /usr/local/bin, which is on PATH by default.
      #
      # Version pinned to the cvc5-version input, and the archive to
      # cvc5-sha256, so CI remains deterministic. Bumping the version
      # changes both inputs, and with them the cache key above.
      shell: bash
      env:
        CVC5_VERSION: ${{ inputs.cvc5-version }}
        CVC5_SHA256: ${{ inputs.cvc5-sha256 }}
        GH_TOKEN: ${{ github.token }}
      run: |
        CVC5_URL="https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static.zip"
        ARCHIVE="${HOME}/cvc5-archive/cvc5.zip"
        mkdir -p "${HOME}/cvc5-archive"
        if [ -s "${ARCHIVE}" ] && echo "${CVC5_SHA256}  ${ARCHIVE}" | sha256sum -c --status -; then
          echo "cvc5 ${CVC5_VERSION}: the archive restored from the cache, its SHA-256 checked"
        else
          if [ -e "${ARCHIVE}" ]; then
            echo "The cached cvc5 archive does not match cvc5-sha256: downloading it again"
          fi
          rm -f "${ARCHIVE}"
          # First through GitHub's API, with the job's token: authenticated
          # requests are not held to the anonymous limits.
          for i in 1 2 3 4 5; do
            echo "Downloading cvc5 ${CVC5_VERSION} through the API, try ${i}"
            if gh release download "cvc5-${CVC5_VERSION}" --repo cvc5/cvc5 \
                 --pattern cvc5-Linux-x86_64-static.zip \
                 --output "${ARCHIVE}" --clobber; then
              break
            fi
            rm -f "${ARCHIVE}"
            sleep $(( i * 20 ))
          done
          if [ ! -s "${ARCHIVE}" ]; then
            echo "Downloading cvc5 ${CVC5_VERSION} from ${CVC5_URL}"
            # curl retries on any error, the site's refusals included, waiting
            # 1, 2, 4, ... s between tries, for up to ten minutes in all.
            curl -fsSL --retry 10 --retry-all-errors --retry-max-time 600 \
                 --connect-timeout 30 --max-time 300 \
                 -o "${ARCHIVE}" "${CVC5_URL}" \
              || { echo "ERROR: cvc5 ${CVC5_VERSION} download failed, through the API and after ten minutes of anonymous retries (${CVC5_URL})"; rm -f "${ARCHIVE}"; exit 1; }
          fi
          echo "${CVC5_SHA256}  ${ARCHIVE}" | sha256sum -c - \
            || { echo "ERROR: the downloaded cvc5 archive is not the one pinned by cvc5-sha256"; rm -f "${ARCHIVE}"; exit 1; }
        fi
        unzip -q -o "${ARCHIVE}" -d /tmp/cvc5-release
        # The zip extracts to a directory like cvc5-Linux-x86_64-static/bin/cvc5
        CVC5_EXTRACTED=$(find /tmp/cvc5-release -name cvc5 -type f | head -1)
        if [ -z "${CVC5_EXTRACTED}" ]; then
          echo "ERROR: cvc5 binary not found in downloaded archive"
          echo "Archive contents:"
          find /tmp/cvc5-release -type f
          exit 1
        fi
        if ! "${CVC5_EXTRACTED}" --version 2>&1 | head -1 | grep -qF "version ${CVC5_VERSION} "; then
          echo "ERROR: the archive's cvc5 is not version ${CVC5_VERSION}:"
          "${CVC5_EXTRACTED}" --version 2>&1 | head -1
          exit 1
        fi
        echo "Found cvc5 binary at: ${CVC5_EXTRACTED}"
        sudo cp "${CVC5_EXTRACTED}" /usr/local/bin/cvc5
        sudo chmod +x /usr/local/bin/cvc5
        echo "Installed cvc5 to /usr/local/bin/cvc5"
        /usr/local/bin/cvc5 --version | head -3

    - name: Save the cvc5 release archive
      # Only a job that downloaded it, once it is checked. Another job saving
      # the same key at the same time is reported, not an error.
      if: steps.cvc5-cache.outputs.cache-hit != 'true' && steps.cvc5-cache-again.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ~/cvc5-archive
        key: cvc5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cvc5-version }}-${{ inputs.cvc5-sha256 }}

    - name: Activate opam environment and configure Why3 provers
      # why3 config detect auto-registers Alt-Ergo 2.6.3 and Z3 4.15.2
      # (with "version not recognized" warnings because the installed
      # versions are newer than why3 1.7.2's detection regex). It does
      # NOT auto-register cvc5 because why3's version regex is tuned
      # to cvc5 1.0.x. We work around this with `why3 config add-prover`,
      # which bypasses version detection and stores the prover under
      # [partial_prover] with manual = true.
      #
      # cvc5 binary location: /usr/local/bin/cvc5 (installed in the
      # previous step from the official GitHub release). why3 needs
      # an absolute path for add-prover, and /usr/local/bin is on
      # PATH by default.
      #
      # The OPAM_BIN line writes to $GITHUB_PATH, which propagates the
      # opam switch's bin dir to the PARENT job's subsequent steps —
      # so the WP steps that follow `uses: ./.github/actions/framac-setup`
      # in the calling job inherit the toolchain on PATH. (They also each
      # re-run `eval $(opam env --switch=frama-c)`, so this is belt-and-
      # braces.)
      #
      # Robustness: `set +e` and explicit error handling keep this
      # step from failing catastrophically if cvc5 registration fails.
      # The WP steps then fall back to Alt-Ergo + Z3 only, same as
      # before cvc5 was introduced.
      shell: bash
      run: |
        set +e
        eval $(opam env --switch=frama-c)
        OPAM_BIN="$(opam var --switch=frama-c bin)"
        echo "${OPAM_BIN}" >> $GITHUB_PATH
        export PATH="${OPAM_BIN}:${PATH}"

        echo "--- Versions ---"
        frama-c -version
        alt-ergo --version

        CVC5_BIN="/usr/local/bin/cvc5"
        if [ -x "${CVC5_BIN}" ]; then
          echo "cvc5 binary: ${CVC5_BIN}"
          "${CVC5_BIN}" --version | head -5
        else
          echo "WARN: cvc5 binary not found at ${CVC5_BIN}"
          echo "      WP will run without cvc5"
        fi

        echo ""
        echo "--- Supported prover families (grep cvc5 for confirmation) ---"
        why3 config list-supported-provers 2>&1 | grep -i cvc5 \
          || echo "cvc5 family not found in why3 supported-provers list"

        echo ""
        echo "--- Auto-detect provers (why3 config detect) ---"
        why3 config detect

        if [ -x "${CVC5_BIN}" ]; then
          echo ""
          echo "--- Manual cvc5 registration (add-prover) ---"
          # Try common cvc5 prover family names. why3's prover family
          # naming has varied across versions; try lowercase first, then
          # uppercase, fall through gracefully if both fail.
          REGISTERED=0
          for FAMILY_NAME in cvc5 CVC5; do
            echo "Attempting: why3 config add-prover ${FAMILY_NAME} ${CVC5_BIN} cvc5"
            if why3 config add-prover "${FAMILY_NAME}" "${CVC5_BIN}" cvc5 2>&1; then
              echo "cvc5 registered successfully under family name '${FAMILY_NAME}'"
              REGISTERED=1
              break
            else
              echo "Registration with family name '${FAMILY_NAME}' failed, trying next..."
            fi
          done
          if [ "${REGISTERED}" -ne 1 ]; then
            echo "FAIL: all cvc5 registration attempts failed."
            echo "      Every class-(a) deviation in docs/deviations.md is"
            echo "      licensed by a 'triple-prover-resistant' claim, which"
            echo "      means Alt-Ergo, Z3 AND cvc5 were all tried and all"
            echo "      failed. Running dual-prover silently invalidates that"
            echo "      standard for every goal measured in this run, so this"
            echo "      is gated here — at the one place the claim is either"
            echo "      true or false — rather than per job, where a TU that"
            echo "      simply never needs cvc5 is indistinguishable from a"
            echo "      broken configuration."
            exit 1
          fi
        else
          echo ""
          echo "--- Skipping manual cvc5 registration (binary missing) ---"
        fi

        echo ""
        echo "--- Registered provers after manual add (why3 config list-provers) ---"
        why3 config list-provers 2>&1 || true

        echo ""
        echo "--- Registered prover sections in why3.conf ---"
        grep -E '^\[(partial_)?prover\]|^name = |^version = ' ~/.why3.conf \
          2>/dev/null || echo "(why3.conf not found or no prover sections)"

        # Force exit 0 — this step is diagnostic configuration only;
        # any individual command failure has been handled above.
        exit 0
