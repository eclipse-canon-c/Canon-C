          BASELINE_EOF
          sort -u -o res64.txt res64.txt

          # Best-effort coupling check: pull the 64-bit job's CHECKS array
          # out of this workflow and compare it with the baseline embedded
          # above. Advisory only — a formatting change could defeat the
          # parse, and a parse failure must not masquerade as a proof result.
          WF=.github/workflows/cmake-multi-platform.yml
          awk '/wp_arena_output.txt/{f=1} f&&/CHECKS=\(/{g=1;next} g&&/^ *\)/{exit} g{print}' "$WF" \
            | tr -d '" ' | grep -E '^typed_cast_' | sort -u > res64_from_wf.txt || true
          if [ -s res64_from_wf.txt ]; then
            if diff -q res64.txt res64_from_wf.txt > /dev/null; then
              echo "  coupling check: this job's baseline matches the 64-bit"
              echo "  job's CHECKS array ($(wc -l < res64.txt) names)."
            else
              echo "  WARNING: this job's embedded baseline DIFFERS from the"
              echo "  64-bit job's CHECKS array. One was ratcheted without the"
              echo "  other. Reconcile before trusting the comparison:"
              diff res64.txt res64_from_wf.txt | head -20 || true
            fi
          else
            echo "  coupling check: could not parse the 64-bit CHECKS array"
            echo "  (advisory only — not a failure)."
          fi

          ONLY64=$(comm -23 res64.txt res32.txt | wc -l)
          ONLY32=$(comm -13 res64.txt res32.txt | wc -l)
          BOTH=$(comm -12 res64.txt res32.txt | wc -l)

          echo ""
          echo "  --- Residual at 64-bit, NOT at 32-bit (newly PROVED) ---"
          comm -23 res64.txt res32.txt | sed 's/^/    /' || true
          echo "  count: ${ONLY64}"
          echo ""
          echo "  --- Residual at 32-bit, NOT at 64-bit (width-specific) ---"
          comm -13 res64.txt res32.txt | sed 's/^/    /' || true
          echo "  count: ${ONLY32}"
          echo ""
          echo "  --- Present at both widths ---"
          echo "  count: ${BOTH}"
          echo "==============================================="

          # ---- GATES (enforced as of CI #1210) ----------------------------
          FAILURES=0

          # Gate A — the control must hold, or nothing below means anything.
          if [ "${CONTROL_OK}" -ne 1 ]; then
            echo "FAIL: machdep control not established — the comparison is"
            echo "      not evidence about 32-bit. Fix the control first."
            FAILURES=$((FAILURES + 1))
          fi

          # Gate B — no falsified contract, at any width.
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED at 32-bit. A contract"
            echo "      that holds at 64-bit is falsified at a width Tier 1"
            echo "      promises. Classify in VERIFY-009 before anything else."
            FAILURES=$((FAILURES + 1))
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_arena32_output.txt
            FAILURES=$((FAILURES + 1))
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_arena32_output.txt
            FAILURES=$((FAILURES + 1))
          fi

          # Gate C — pinned goal surface, must move with the 64-bit pin.
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "3444 / 3527" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 3444 / 3527)."
            echo "      If arena's 64-bit pin also moved, ratchet BOTH jobs"
            echo "      and this job's embedded baseline in one commit."
            FAILURES=$((FAILURES + 1))
          fi

          # Gate D — set equality with the 64-bit residuals, both directions.
          # This is the whole point of the job: the claim is not "91 residuals"
          # but "the same 91". A goal newly proved at 32-bit is as much a
          # surface change as one newly resistant, and both land here.
          if [ "${ONLY64}" -ne 0 ] || [ "${ONLY32}" -ne 0 ]; then
            echo "FAIL: the 32-bit residual set is no longer identical to the"
            echo "      64-bit set (${ONLY64} newly proved, ${ONLY32} width-specific)."
            echo "      Width-invariance is the claim this job enforces."
            echo "      Reclassify in VERIFY-009, then ratchet deliberately."
            FAILURES=$((FAILURES + 1))
          fi

          if [ "${FAILURES}" -eq 0 ]; then
            echo "PASS: arena.h proves identically at 32-bit and 64-bit —"
            echo "      3444/3527, 83 residuals, same 83 names, zero delta."
            echo "      Machdep control established. Tier 1's minimum width"
            echo "      is evidenced, not asserted."
          else
            echo "FAIL: ${FAILURES} enforcement check(s) missed — see above."
          fi
          echo "==============================================="
          if [ "${FAILURES}" -ne 0 ]; then exit 1; fi
      - name: Upload WP proof output (arena.h, 32-bit)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-arena-32
          path: |
            wp_arena32_output.txt
            res32.txt
            res64.txt
          retention-days: 90

  # -------------------------------------------------------------------------
  # semantics/error.h — ENFORCED. First header of the semantics/ layer.
  #
  # error.h is a plain int-backed enum plus four pure lookup/predicate
  # functions. No void* casts, so it uses WP's DEFAULT Typed model (not
  # Typed+Cast like the core/ headers from compare.h onward). All four
  # functions are expected to prove fully automatically with ZERO residuals
  # (VERIFY-013) — the calibration baseline for the semantics/ layer.
  #
  # error_message carries the weak postcondition `\result != \null` that the
  # public contract actually guarantees, NOT full string validity. Asserting
  # valid_read_string(\result) would cross the libc strlen/valid_string
  # boundary documented in VERIFY-007 cat 2; the weak spec keeps error.h at
  # 0 residuals. See docs/verification.md, error.h section.
  # -------------------------------------------------------------------------
  frama-c-error:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: semantics/error.h"
        # error.h is expected to prove 100% automatically — 0 unproved goals.
        # Any unproved goal is a regression and fails the job. If a future
        # edit strengthens error_message's spec to valid_read_string and that
        # introduces a residual, this wrapper must be updated AND a VERIFY-013
        # category added to docs/deviations.md before the count is changed.
        # (2026-07-16 retrofit): Failed gated at zero explicitly; Proved
        # line pinned hard (65 / 65).
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            semantics/error.h 2>&1 | tee wp_error_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (error.h) exit status: ${WP_EXIT}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_error_output.txt || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            echo ""
            echo "FAIL: WP did not produce a verification summary."
            echo "      frama-c aborted before running WP, likely due to"
            echo "      an ACSL syntax error in error.h or an include"
            echo "      resolution failure. Check the WP output above for"
            echo "      [kernel:annot-error] or [kernel] User Error messages."
            echo ""
            echo "First diagnostic lines from WP output:"
            grep -E "^\[(kernel|wp)" wp_error_output.txt | head -10 || true
            echo "==============================================="
            exit 1
          fi
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_error_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_error_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_error_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_error_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_error_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          EXPECTED_UNPROVED=0
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED —"
            echo "      a contract in error.h is falsified:"
            grep -E "^\[wp\] \[Failed\]" wp_error_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_error_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_error_output.txt
            exit 1
          fi
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "65 / 65" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 65 / 65)."
            echo "      The goal surface drifted — a VERIFY-013 category is"
            echo "      required in docs/deviations.md before this pin moves."
            exit 1
          fi
          if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
            echo ""
            echo "FAIL: error.h should have 0 unproved goals."
            echo "      Found ${UNPROVED_COUNT} unproved goals — this is a"
            echo "      regression. error.h is the semantics/ layer's clean"
            echo "      baseline; any residual needs a VERIFY-013 category in"
            echo "      docs/deviations.md before this wrapper is updated."
            echo ""
            echo "Observed unproved goals:"
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\]" wp_error_output.txt || true
            exit 1
          fi
          echo "PASS: error.h fully verified — all goals proved automatically,"
          echo "      0 residuals. semantics/ layer baseline established."
          echo "==============================================="
      - name: Upload WP proof output (error.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-error
          path: wp_error_output.txt
          retention-days: 90
  # -------------------------------------------------------------------------
  # semantics/option — ENFORCED. First Shape-B macro-module driver.
  #
  # option is the first verified module whose functions are macro-generated
  # (Shape B per vmacros.md): there is no option_int_* function to point WP
  # at until DEFINE_OPTION_FUNCTIONS(static inline, int) instantiates one.
  # WP runs over vmacros/vdrivers/option_verify.h — a driver that instantiates
  # the REAL shipped macros and attaches ACSL contracts to the generated
  # prototypes (integrity rule: one source of truth, never a verified copy).
  # The driver's contracted prototypes are static inline to match the linkage
  # of DEFINE_OPTION_FUNCTIONS(static inline, int) — a bare external-linkage
  # prototype ahead of a static-inline definition is a C99 6.2.2p7 conflict.
  #
  # Default Typed model (NOT Typed+Cast): option_T is a by-value tagged struct
  # { bool has_value; T value; } with no void* casts — same situation as
  # error.h, so this job omits the CVC5-presence check the core/ headers carry.
  #
  # Promoted from report-only to enforced as of CI #1065 (VERIFY-014):
  # 189 / 223 proved, exactly 34 unproved. Two categories:
  #   (a) INHERITED (2) — contract.h handler non-termination. option_impl.h
  #       includes contract.h; error.h avoided this pair by including only
  #       types.h, but option cannot (expect/get/unwrap/replace/take route
  #       through it). The VERIFY-006 cat-4 pair, re-emitted. option is the
  #       first semantics/ header to inherit them.
  #   (b) OWN (32) — function-pointer dispatch across the six combinators
  #       (map / and_then / or_else / filter / combine_with / eq). WP has no
  #       `calls` clause for an arbitrary pointer, \valid_function is
  #       unimplemented in Frama-C 29, and the unknown callee is treated as
  #       possibly non-terminating / memory-clobbering. Same limitation as
  #       region_end (OWN-003 / VERIFY-011 cat 1) — its first recurrence
  #       outside region_end. Every non-combinator function proves fully;
  #       for each combinator the non-calling branch is proved and the
  #       calling branch is the residual.
  #
  # The residual set is name-stable: category (b) is deterministic (each goal
  # resolves in <5ms then buckets as unprovable — \valid_function will not
  # prove in FC29), not solver-capacity-bound. Only the 2 category-(a) goals
  # are genuine full timeouts, identical to the pair pinned in six other
  # headers. The by-name roll-call below pins all 34: if a future Frama-C
  # implements \valid_function, the count stays 34 but a name check fails,
  # which is the signal to revisit rather than silently absorb.
  # -------------------------------------------------------------------------
  frama-c-option:
    needs: build
