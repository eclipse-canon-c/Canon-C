  # judgment calls in the __FRAMAC__ block.
  #
  # MODEL: Typed+Cast, forced by diag.h's OWN byte-view casts (the
  # (char *) views of Diag/DiagFrame at the memset/memmove sites and in
  # push_no_alias) — first semantics/ header to originate the requirement
