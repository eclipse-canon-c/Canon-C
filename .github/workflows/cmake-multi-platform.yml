    #                    restore the ~3h profile every other WP job runs at.
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: data/bitset.h"
        # bitset.h — VERIFY-020, PATCH 1 of N, REPORT-ONLY.
        #
        # NOT an in-place header, contrary to the original classification.
        # bitset.h uses option_usize but never instantiates it, so frama-c
        # aborts in the PARSER when handed the header directly. See the
        # banner in bitset_verify.h. Its own 32 functions are still
        # contracted IN PLACE in bitset.h; the driver exists solely to
        # interpose a CONTRACTED option_usize (vec run-1 lesson R1: a bare
        # CANON_OPTION leaves the combinators spec-less and drowns the
        # caller). Smallest driver in the project; contracts none of the
        # subject module.
        #
        # Scope of THIS run: the ACSL logic layer plus Group 1 only — the
        # ten functions that carry no dependency on bits.h (word_of,
        # mask_of, clear_padding, init, close, set, clear, toggle, test,
        # assign) plus the two lifetime helpers. count / find_first /
        # find_next / find_last and the three _option wrappers are NOT yet
        # contracted, deliberately: bits_popcount and bits_ctz are
        # specified at RANGE strength only, by a written decision in
        # bits.h, so those seven functions are subject to a
        # SPECIFICATION-STRENGTH CAP that has no precedent in this
        # campaign. Every prior ceiling was PROVER weakness (timeouts, WP
        # feature gaps). This one is upstream SPECIFICATION weakness
        # propagating downward. It gets its own record in VERIFY-020, and
        # its own patch.
        #
        # MODEL: Typed+Cast, forced by bitset_as_bytes / bitset_as_cbytes
        # handing bs->words (u64*) to bytes_from / cbytes_from. Goal names
        # therefore carry the typed_cast_ prefix (diag.h / vec precedent).
        # A plain-Typed run would be a different unit; do not "simplify"
        # this to Typed without re-deriving the roll-call.
        #
        # ENFORCE=0 ON PURPOSE. Nothing is pinned until the predictions
        # below have been checked against a real run and recorded in
        # VERIFY-020. Do not set ENFORCE=1 in the same commit that first
        # turns this job green.
        run: |
          eval $(opam env --switch=frama-c)
          # ---- ENFORCED as of VERIFY-020, baseline CI #1259 (95526a9) ----
          ENFORCE=1
          EXPECTED_UNPROVED=163
          EXPECTED_PROVED="4845 / 5008"   # VERIFY-023: +6 goals, set unchanged
          WP_MODEL="Typed+Cast"   # forced by as_bytes / as_cbytes
          # ------------------------------------------------------------------
          FAILURES=0
          note_fail() {
            echo "$1"
            FAILURES=$((FAILURES + 1))
          }
          set +e
          frama-c \
            -wp -wp-rte \
            -wp-model "${WP_MODEL}" \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I data \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            vmacros/vdrivers/bitset_verify.h 2>&1 | tee wp_bitset_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (bitset.h) exit status: ${WP_EXIT}"
          if [ "${ENFORCE}" -eq 1 ]; then
            echo "  MODE: ENFORCED  MODEL: ${WP_MODEL}"
          else
            echo "  MODE: report-only (ENFORCE=${ENFORCE})  MODEL: ${WP_MODEL}"
          fi
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_bitset_output.txt || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            note_fail "FAIL: WP did not produce a verification summary."
            echo "      frama-c aborted before running WP — check for"
            echo "      [kernel:annot-error] or [kernel] User Error above."
            echo "      Most likely cause on patch 1: an ACSL syntax error in"
            echo "      the logic layer, or option_usize not instantiated"
            echo "      (bitset.h needs CANON_OPTION(usize) from the includer;"
            echo "      if WP cannot see it, that is a REAL finding about the"
            echo "      header's self-containedness, not a job bug)."
            echo ""
            echo "First diagnostic lines from WP output:"
            grep -E "^\[(kernel|wp)" wp_bitset_output.txt | head -20 || true
          else
            TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_bitset_output.txt || true)
            UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_bitset_output.txt || true)
            FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_bitset_output.txt || true)
            INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_bitset_output.txt || true)
            STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_bitset_output.txt || true)
            UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
            echo "  Timeouts: ${TIMEOUT_COUNT}"
            echo "  Unknown:  ${UNKNOWN_COUNT}"
            echo "  Failed:   ${FAILED_COUNT}"
            echo "  Total unproved (T+U): ${UNPROVED_COUNT}"
            # Failed / Invalid are NOT residuals and are never pinned. On a
            # report-only first run they are the single most important
            # signal: they mean a contract written above is FALSE, not
            # merely hard. Surfaced loudly even though the job stays green.
            if [ "${FAILED_COUNT}" -ne 0 ]; then
              echo ""
              echo "  !!! ${FAILED_COUNT} goal(s) FAILED — a contract in"
              echo "      bitset.h is falsified. On patch 1 the likely"
              echo "      culprits, in order: bitset_pad preservation in"
              echo "      set/clear/toggle (see P1), the \\separated clause"
              echo "      in init, or bitset_mask_of's \\result != 0."
              grep -E "^\[wp\] \[Failed\]" wp_bitset_output.txt || true
            fi
            if [ "${INVALID_COUNT}" -ne 0 ]; then
              echo ""
              echo "  !!! ${INVALID_COUNT} goal(s) INVALID — a contract is"
              echo "      FALSIFIED WITH A COUNTER-EXAMPLE. Invalid is WP's"
              echo "      refutation verdict; it can never be pinned and is"
              echo "      categorically different from a residual. Read the"
              echo "      counter-example before touching anything else."
              grep -E "^\\[wp\\] \\[Invalid\\]" wp_bitset_output.txt
            fi
            if [ "${STEPOUT_COUNT}" -ne 0 ]; then
              echo "  NOTE: ${STEPOUT_COUNT} Stepout — never observed in this"
              echo "        project. Not pooled into the residual count."
              grep -E "^\\[wp\\] \\[Stepout\\]" wp_bitset_output.txt
            fi
            if [ -n "${EXPECTED_UNPROVED}" ] && \
               [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
              note_fail "FAIL: unproved count ${UNPROVED_COUNT} != pinned ${EXPECTED_UNPROVED}."
            fi
            PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
            echo "  Proved: ${PROVED_COUNT}"
            if [ -n "${EXPECTED_PROVED}" ] && \
               [ "${PROVED_COUNT}" != "${EXPECTED_PROVED}" ]; then
              note_fail "FAIL: proved count ${PROVED_COUNT} != pinned ${EXPECTED_PROVED}."
            fi
            echo ""
            echo "  --- All unproved goals (name-stability record) ---"
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\]" wp_bitset_output.txt || \
              echo "  (none)"
            # ── BY-NAME ROLL-CALL (set equality), VERIFY-020 ──────────────
            # The count gate above is necessary but NOT sufficient: a residual
            # could vanish while a new one appears and the total would not move.
            # This checks all 158 by NAME, and separately that no unlisted goal
            # is unproved -- both directions, i.e. set equality, as vec and
            # deque pin.
            #
            # THE LIST WAS GENERATED, NOT TRANSCRIBED. Hand-copying 158 names is
            # exactly the mechanical-error class this arc kept tripping on. The
            # array below was produced by script from #1259 output and its arm
            # partition verified arithmetically -- 2 + 32 + 58 + 66 = 158
            # when written; 71 own / 163 total since #1264. No
            # duplicates, nothing unclassified -- before being written here.
            CHECKS=(
              # ARM C — contract.h handler pair. Definition-presence only.
              "typed_cast_contract_default_handler_loop_invariant_established"
              "typed_cast_contract_default_handler_terminates"
              # ARM A — option_usize, INHERITANCE via the interposition driver (32).
              "typed_cast_option_usize_map_terminates_part2"
              "typed_cast_option_usize_map_terminates_part3"
              "typed_cast_option_usize_map_exits_part1"
              "typed_cast_option_usize_map_assert_rte_function_pointer"
              "typed_cast_option_usize_map_assigns_exit_part2"
              "typed_cast_option_usize_map_assigns_normal_part2"
              "typed_cast_option_usize_and_then_terminates_part2"
              "typed_cast_option_usize_and_then_terminates_part3"
              "typed_cast_option_usize_and_then_exits_part1"
              "typed_cast_option_usize_and_then_assert_rte_function_pointer"
              "typed_cast_option_usize_and_then_assigns_exit_part2"
              "typed_cast_option_usize_and_then_assigns_normal_part2"
              "typed_cast_option_usize_or_else_terminates_part1"
              "typed_cast_option_usize_or_else_terminates_part2"
              "typed_cast_option_usize_or_else_assert_rte_function_pointer"
              "typed_cast_option_usize_or_else_assigns_part2"
              "typed_cast_option_usize_filter_terminates_part2"
              "typed_cast_option_usize_filter_terminates_part3"
              "typed_cast_option_usize_filter_exits_part1"
              "typed_cast_option_usize_filter_assert_rte_function_pointer"
              "typed_cast_option_usize_filter_assigns_exit_part2"
              "typed_cast_option_usize_filter_assigns_normal_part2"
              "typed_cast_option_usize_combine_with_terminates_part2"
              "typed_cast_option_usize_combine_with_terminates_part3"
              "typed_cast_option_usize_combine_with_exits_part1"
              "typed_cast_option_usize_combine_with_assert_rte_function_pointer"
              "typed_cast_option_usize_combine_with_assigns_exit_part2"
              "typed_cast_option_usize_combine_with_assigns_normal_part2"
              "typed_cast_option_usize_eq_terminates_part2"
              "typed_cast_option_usize_eq_terminates_part4"
              "typed_cast_option_usize_eq_assert_rte_function_pointer_part2"
              "typed_cast_option_usize_eq_assigns_part5"
              # ARM S — CORE SUBSTRATE, 58, byte-identical to each home module's
              #         pinned list modulo the typed_cast_ prefix: bits 15,
              #         memory 20, slice-libc 13, ptr 6, checked 2, borrow 2.
              "typed_cast_bits_clear_ensures"
              "typed_cast_bits_insert_full_width_ensures_part2"
              "typed_cast_bits_insert_normal_ensures_part3"
              "typed_cast_bits_popcount_ensures"
              "typed_cast_bits_rotl_assert_rte_shift_2"
              "typed_cast_bits_rotl_nonzero_shift_ensures_part2"
              "typed_cast_bits_rotr_assert_rte_shift_2"
              "typed_cast_bits_rotr_nonzero_shift_ensures_part2"
              "typed_cast_bits_next_power_of_two_normal_ensures_part3"
              "typed_cast_bits_next_power_of_two_normal_ensures_2_part3"
              "typed_cast_bits_next_power_of_two_normal_ensures_3_part3"
              "typed_cast_bits_next_power_of_two_normal_ensures_4_part3"
              "typed_cast_bits_bswap16_assert_rte_signed_overflow"
              "typed_cast_bits_bswap32_ensures"
              "typed_cast_bits_bswap64_ensures"
              "typed_cast_checked_add_overflow_ensures"
              "typed_cast_checked_add_u64_overflow_ensures"
              "typed_cast_align_up_ensures"
              "typed_cast_align_down_ensures"
              "typed_cast_align_padding_ensures"
              "typed_cast_ptr_align_up_call_align_up_requires_3"
              "typed_cast_ptr_align_padding_call_align_padding_requires_3"
              "typed_cast_ptr_align_padding_nonnull_ensures_part2"
              "typed_cast_bytes_equal_call_memcmp_requires_valid_s1"
              "typed_cast_bytes_equal_call_memcmp_requires_valid_s2"
              "typed_cast_bytes_equal_call_memcmp_requires_danglingness_s1"
              "typed_cast_bytes_equal_call_memcmp_requires_danglingness_s2"
              "typed_cast_str_from_cstr_call_strlen_requires_valid_string_s"
              "typed_cast_str_equal_call_memcmp_requires_valid_s1"
              "typed_cast_str_equal_call_memcmp_requires_valid_s2"
              "typed_cast_str_equal_call_memcmp_requires_danglingness_s1"
              "typed_cast_str_equal_call_memcmp_requires_danglingness_s2"
              "typed_cast_str_starts_with_call_memcmp_requires_danglingness_s1"
              "typed_cast_str_starts_with_call_memcmp_requires_danglingness_s2"
              "typed_cast_str_ends_with_call_memcmp_requires_danglingness_s1"
              "typed_cast_str_ends_with_call_memcmp_requires_danglingness_s2"
              "typed_cast_mem_alloc_assigns_normal_part2"
              "typed_cast_mem_alloc_nonzero_size_ensures_part2"
              "typed_cast_mem_free_assigns_normal"
              "typed_cast_mem_free_call_free_requires_freeable"
              "typed_cast_mem_alloc_array_checked_nonoverflow_ensures_part3"
              "typed_cast_mem_align_normal_ensures_part3"
              "typed_cast_mem_align_normal_ensures_2_part3"
              "typed_cast_mem_align_to_normal_ensures_part3"
              "typed_cast_mem_align_to_normal_ensures_2_part3"
              "typed_cast_mem_get_alignment_assert_rte_signed_overflow"
              "typed_cast_mem_is_aligned_nonnull_aligned_ensures"
              "typed_cast_mem_is_aligned_nonnull_unaligned_ensures"
              "typed_cast_mem_get_alignment_nonnull_ensures_part2"
              "typed_cast_mem_get_alignment_nonnull_ensures_2_part2"
              "typed_cast_mem_compare_call_memcmp_requires_danglingness_s1"
              "typed_cast_mem_compare_call_memcmp_requires_danglingness_s2"
              "typed_cast_mem_equal_call_memcmp_requires_danglingness_s1"
              "typed_cast_mem_equal_call_memcmp_requires_danglingness_s2"
              "typed_cast_mem_equal_bytes_call_memcmp_requires_danglingness_s1"
              "typed_cast_mem_equal_bytes_call_memcmp_requires_danglingness_s2"
              "typed_cast_borrowed_bytes_eq_call_memcmp_requires_danglingness_s1"
              "typed_cast_borrowed_bytes_eq_call_memcmp_requires_danglingness_s2"
              # ARM D — bitset's OWN residuals, 71 (was 66; +5 at CI #1264, see the
              #         F5 proof-cost note in the commit message).
              "typed_cast_bitset_clear_padding_ensures_2_part1"
              "typed_cast_bitset_clear_padding_ensures_3_part1"
              "typed_cast_bitset_clear_padding_ensures_part1"
              "typed_cast_bitset_init_assigns_exit_part5"
              "typed_cast_bitset_init_assigns_normal_part5"
              "typed_cast_bitset_init_call_mem_zero_requires"
              "typed_cast_bitset_init_ensures_3"
              "typed_cast_bitset_init_ensures_4"
              "typed_cast_bitset_init_ensures_5"
              "typed_cast_bitset_init_ensures_6"
              "typed_cast_bitset_set_assert_rte_mem_access"
              "typed_cast_bitset_set_live_ensures_3_part3"
              "typed_cast_bitset_set_live_ensures_4_part3"
              "typed_cast_bitset_clear_assert_rte_mem_access"
              "typed_cast_bitset_clear_live_ensures_3_part3"
              "typed_cast_bitset_clear_live_ensures_4_part3"
              "typed_cast_bitset_toggle_assert_rte_mem_access"
              "typed_cast_bitset_toggle_live_ensures_3_part3"
              "typed_cast_bitset_toggle_live_ensures_4_part3"
              "typed_cast_bitset_test_assert_rte_mem_access"
              "typed_cast_bitset_assign_null_assigns_normal_part1"
              "typed_cast_bitset_assign_null_assigns_normal_part2"
              "typed_cast_bitset_clear_all_assert_rte_mem_access"
              "typed_cast_bitset_clear_all_call_mem_zero_requires"
              "typed_cast_bitset_clear_all_live_assigns_normal"
              "typed_cast_bitset_clear_all_live_ensures_2_part3"
              "typed_cast_bitset_clear_all_live_ensures_part3"
              "typed_cast_bitset_set_all_assert_rte_mem_access"
              "typed_cast_bitset_set_all_call_mem_set_requires"
              "typed_cast_bitset_set_all_live_assigns_exit_part1"
              "typed_cast_bitset_set_all_live_assigns_normal_part1"
              "typed_cast_bitset_not_assert_rte_mem_access"
              "typed_cast_bitset_not_live_assigns_exit_part1"
              "typed_cast_bitset_not_live_assigns_normal_part1"
              "typed_cast_bitset_not_loop_invariant_2_preserved"
              "typed_cast_bitset_and_assert_rte_mem_access_11_part1"
              "typed_cast_bitset_and_assert_rte_mem_access_11_part2"
              "typed_cast_bitset_and_live_assigns_part5"
              "typed_cast_bitset_and_live_assigns_part6"
              "typed_cast_bitset_and_live_ensures_part3"
              "typed_cast_bitset_and_live_ensures_part4"
              "typed_cast_bitset_and_loop_invariant_2_preserved_part1"
              "typed_cast_bitset_and_loop_invariant_2_preserved_part2"
              "typed_cast_bitset_and_loop_invariant_3_established_part1"
              "typed_cast_bitset_and_loop_invariant_3_established_part2"
              "typed_cast_bitset_and_loop_invariant_3_preserved_part1"
              "typed_cast_bitset_and_loop_invariant_3_preserved_part2"
              "typed_cast_bitset_or_live_ensures_part3"
              "typed_cast_bitset_or_live_ensures_part4"
              "typed_cast_bitset_or_loop_invariant_2_preserved_part1"
              "typed_cast_bitset_or_loop_invariant_2_preserved_part2"
              "typed_cast_bitset_xor_call_bitset_clear_padding_requires_part1"
              "typed_cast_bitset_xor_call_bitset_clear_padding_requires_part2"
              "typed_cast_bitset_xor_live_assigns_normal_part5"
              "typed_cast_bitset_xor_live_assigns_normal_part6"
              "typed_cast_bitset_xor_loop_invariant_2_preserved_part1"
              "typed_cast_bitset_xor_loop_invariant_2_preserved_part2"
              "typed_cast_bitset_count_assert_rte_mem_access"
              "typed_cast_bitset_is_empty_assert_rte_mem_access"
              "typed_cast_bitset_is_full_assert_rte_mem_access"
              "typed_cast_bitset_find_first_assert_rte_mem_access"
              "typed_cast_bitset_find_next_assert_rte_mem_access"
              "typed_cast_bitset_find_next_ensures_3_part7"
              "typed_cast_bitset_find_next_option_ensures_2_part2"
              "typed_cast_bitset_find_last_assert_rte_mem_access"
              "typed_cast_bitset_as_bytes_assert_rte_mem_access"
              "typed_cast_bitset_as_bytes_call_bytes_from_requires_2"
              "typed_cast_bitset_as_cbytes_assert_rte_mem_access"
              "typed_cast_bitset_as_cbytes_call_cbytes_from_requires_2"
              "typed_cast_bitset_as_borrowed_bytes_assert_rte_mem_access"
              "typed_cast_bitset_as_borrowed_bytes_call_borrowed_bytes_from_lifetime_requires_readable_region"
            )
            MISSING=0
            for g in "${CHECKS[@]}"; do
              if ! grep -qE "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\] ${g}( |$)" \
                    wp_bitset_output.txt; then
                echo "  MISSING from residual set: ${g}"
                MISSING=$((MISSING + 1))
              fi
            done
            echo ""
            echo "  --- Roll-call (set equality) ---"
            echo "    listed:  ${#CHECKS[@]}"
            echo "    missing: ${MISSING}"
            if [ "${MISSING}" -ne 0 ]; then
              note_fail "FAIL: ${MISSING} pinned residual(s) absent."
              echo "      A goal that starts proving is GOOD NEWS and a RED RUN"
              echo "      by design: ratchet the pin in its own commit rather"
              echo "      than widening the gate. Do not delete names to pass."
            fi
            grep -oE "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\] [A-Za-z0-9_]+" \
              wp_bitset_output.txt | awk '{print $3}' | sort -u > /tmp/bitset_seen.txt
            printf '%s\n' "${CHECKS[@]}" | sort -u > /tmp/bitset_pinned.txt
            EXTRA=$(comm -23 /tmp/bitset_seen.txt /tmp/bitset_pinned.txt | wc -l)
            echo "    unpinned-but-unproved: ${EXTRA}"
            if [ "${EXTRA}" -ne 0 ]; then
              note_fail "FAIL: ${EXTRA} unproved goal(s) not in the pinned set."
              comm -23 /tmp/bitset_seen.txt /tmp/bitset_pinned.txt | sed 's/^/      /'
            fi

            echo ""
            echo "  ================================================="
            echo "   PREDICTIONS — written before the first run"
            echo "  ================================================="
            echo ""
            echo "  P1: the one hard spot is bitset_pad preservation in the"
            echo "      FINAL word. Every other Group 1 goal is either a"
            echo "      syntactic match to the code or plain bitvector work."
            echo "      The exception is set/clear/toggle/assign proving"
            echo "      'ensures bitset_pad(bs)'. When word_l(i) < wc-1 it is"
            echo "      trivial. When the index lands IN the final word, WP"
            echo "      must derive i % 64 < capacity % 64 from i < capacity"
            echo "      and i / 64 == (capacity+63)/64 - 1. True, but"
            echo "      integer-division reasoning rather than bitvector."
            echo "      If it times out the fix is a LEMMA, not a"
            echo "      justification row."
            echo ""
            echo "  P2 (REVISED before first green run): the FULL 92-goal"
            echo "      arm appears in patch 1 — contract 2 + bits 15 +"
            echo "      memory 20 + slice-libc 13 + ptr 6 + checked 2 +"
            echo "      borrow 2 + option 32 = 92. The original prediction of"
            echo "      a 43-goal SUBSET was wrong twice: option enters now"
            echo "      because the driver contracts option_usize, and"
            echo "      bits.h enters now because bits.h's OWN functions"
            echo "      carry contracts and WP verifies every contracted"
            echo "      function in the TU — nothing to do with whether"
            echo "      bitset contracts its callers. Strictly better: it"
            echo "      makes P3 testable on run 1 instead of patch 2."
            echo ""
            echo "  P3: bits.h's 15 residuals re-emit BYTE-IDENTICALLY."
            echo "      bitset is the FIRST verified module whose closure"
            echo "      contains bits.h — all eleven previously verified"
            echo "      headers were checked and none include it. So this is"
            echo "      byte-identity's first test on a timeout-class"
            echo "      ARITHMETIC surface; every prior test was libc or"
            echo "      WP-feature-gap. No instantiation prefix to differ."
            echo "      IF THIS PREDICTION FAILS, STOP: it is a finding"
            echo "      about the method, not about bitset."
            echo ""
            echo "  P4: a Typed+Cast bridging class at the as_bytes /"
            echo "      as_cbytes / as_borrowed_bytes sites, analogous to"
            echo "      vec's class (h), but over 3 sites rather than vec's"
            echo "      surface. NOT expected in patch 1 — those three are"
            echo "      uncontracted here — so any bridging goal appearing"
            echo "      NOW is unpredicted and worth reading."
            echo "      (Corrected before first run: an earlier draft of"
            echo "      this arc predicted plain Typed. bitset_as_bytes"
            echo "      makes that wrong.)"
            echo ""
            echo "  ================================================="
            echo "   VERDICTS — scored at CI #1260, the enforcing run"
            echo "  ================================================="
            echo "  P1  REFUTED, then SUBSUMED. It called for a LEMMA to"
            echo "      derive i%64 < capacity%64. No lemma was ever written:"
            echo "      E1's division-free form made the same fact plain"
            echo "      SUBTRACTION. And the goals P1 named are residuals"
            echo "      anyway. Right that the obstacle was arithmetic,"
            echo "      wrong about the mechanism and wrong about the fix."
            echo "  P2  EXACT. 92, family by family, on every run from #1251"
            echo "      to #1260. The only prediction in this arc that was"
            echo "      right first time and never adjusted."
            echo "  P3  CONFIRMED. bits.h's 15 re-emit byte-identically."
            echo "      bitset is the first verified module whose closure"
            echo "      contains bits.h, so this was byte-identity's first"
            echo "      test on a timeout-class ARITHMETIC surface rather"
            echo "      than libc or a WP feature gap. It held."
            echo "  P4  CONFIRMED, OVER-COUNTED. The Typed+Cast bridging"
            echo "      class is real and sits exactly where predicted, but"
            echo "      at 6 goals (2 per site), not the 9 estimated. Right"
            echo "      mechanism, wrong size."
            echo ""
            echo "  NOT PREDICTED, and the arc's most useful finding: a"
            echo "  disjunct that is REDUNDANT FOR THE LOGIC can be"
            echo "  LOAD-BEARING FOR THE PROVER. E1 removed"
            echo "  'capacity%64 == 0 ||' from bitset_pad as a"
            echo "  simplification and took the CI runner down twice --"
            echo "  the shift exponent stopped being syntactically bounded"
            echo "  in [0,63] and became x/2^k with k a free variable."
            echo "  See the DO-NOT-SIMPLIFY note on bitset_pad."

            echo ""
            echo "  --- Per-function roll-call (all 32 contracted) ---"
            # CORRECTED 2026-08-23. The first version of this block grepped
            # the whole log for "typed_cast_<fn>" and printed "NOT SEEN ...
            # contract may not have attached" when absent. That reading is
            # INVERTED: the log names only UNPROVED goals, so absence means
            # the function proved CLEANLY. On the first run it flagged
            # word_of, mask_of, test and close — precisely the four that
            # reached zero residuals. A reader trusting it would have chased
            # four phantoms.
            #
            # Two independent facts, read from two different places:
            #   ANALYSED  <- the "[rte:annot] annotating function <fn>" list,
            #                which is what WP actually saw. Absence here is
            #                the real alarm: the function never entered the
            #                TU, or its ACSL block failed to attach.
            #   residuals <- count of unproved goals naming it. Zero is BEST.
            for fn in bitset_word_of bitset_mask_of bitset_clear_padding \
                      bitset_init bitset_close bitset_set bitset_clear \
                      bitset_toggle bitset_test bitset_assign \
                      bitset_lifetime_open_ bitset_lifetime_close_; do
              if grep -qE "^\[rte:annot\] annotating function ${fn}$" wp_bitset_output.txt; then
                # Anchor on the goal-clause suffix set, NOT a bare prefix.
                # CORRECTED 2026-08-23, the SECOND fix to this block: the
                # first rewrite left `typed_cast_${fn}_` matching by prefix,
                # so bitset_set_ swallowed bitset_set_all_*, and
                # bitset_clear_ swallowed BOTH bitset_clear_all_* and
                # bitset_clear_padding_*. CI #1252 reported set=6 and
                # clear=8; the true counts are 2 and 2. An inverted check was
                # replaced by a miscounting one, directly beside it.
                N=$(grep -cE "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\] typed_cast_${fn}_(null|live|normal|exit|terminates|exits|assigns|ensures|requires|assert|call|loop|variant)" \
                      wp_bitset_output.txt || true)
                if [ "${N}" -eq 0 ]; then
                  printf "    %-26s analysed, 0 residuals  (fully proved)\n" "${fn}"
                else
                  printf "    %-26s analysed, %s residual(s)\n" "${fn}" "${N}"
                fi
              else
                printf "    %-26s NOT ANALYSED  <- real problem: absent from the\n" "${fn}"
                echo   "                               TU, or its ACSL block did not attach"
              fi
            done
            echo ""
            echo "  --- Residual split: inherited vs bitset-own ---"
            INH=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\] typed_cast_(contract_|option_usize_|bits_|checked_|align_(up|down|padding)_|ptr_|bytes_|str_|mem_|borrowed_bytes_)" \
                    wp_bitset_output.txt || true)
            OWN=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\] typed_cast_bitset_" \
                    wp_bitset_output.txt || true)
            echo "    inherited: ${INH}   (P2 predicts 92: contract 2 + bits 15 +"
            echo "               memory 20 + slice-libc 13 + ptr 6 + checked 2 +"
            echo "               borrow 2 + option 32)"
            echo "    bitset-own: ${OWN}"
            # CORRECTED after CI #1260. This NOTE said "most bitset-own
            # residuals belong to functions that are NOT YET CONTRACTED
            # (Group 2/3) ... do not pin them". True when written at patch 1;
            # false since Group 3 landed at #1259. ALL 32 functions are
            # contracted and the job IS pinned. Replaced with what the 66
            # actually are.
            # DE-HARDCODED at CI #1267. This printed a fixed "66" and a fixed
            # class breakdown. At #1264 AND #1266 the job printed
            # "bitset-own: 71" and then, two lines later, "none of the 66 is
            # pending work". The ratchet commit SAID it had fixed this; it had
            # not. The edit was made, then lost when the file was restored
            # after a near-miss on frama-c-deque's array, and the post-restore
            # check only re-verified the CHECKS count and the two pins. The
            # commit message asserted something about the tree that was not in
            # the tree -- the same defect class the message was about.
            # Counts are DERIVED now; only the class names are prose.
            echo "    All 32 bitset functions are contracted (Groups 1-3"
            echo "    complete), so none of the ${OWN} is pending work. By class:"
            CLS_SUM=0
            CLASSES=(
              "array framing on and/or/xor/not:bitset_(and|or|xor|not)_(loop_invariant|live_assigns|live_ensures|assert_rte|call)" \
                       "Group 1 single-bit family + init:bitset_(init|clear_padding|set|clear|toggle|test|assign)_(null|live|normal|exit|terminates|exits|assigns|ensures|requires|assert|call|loop|variant)" \
                       "clear_all/set_all frames over mem_zero/mem_set:bitset_(clear_all|set_all)_" \
                       "P4 Typed+Cast bridge at the three as_bytes sites:bitset_as_(bytes|cbytes|borrowed_bytes)_" \
                       "queries and finds:bitset_(count|is_empty|is_full|is_disjoint|find_)"
            )
            for cls in "${CLASSES[@]}"; do
              NAME="${cls%%:*}"; RE="${cls#*:}"
              C=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\] typed_cast_${RE}" \
                    wp_bitset_output.txt || true)
              printf "      %3s  %s\n" "${C}" "${NAME}"
              CLS_SUM=$((CLS_SUM + C))
            done
            # SELF-BALANCING. The first version of this breakdown summed to 77
            # (prefix collision: bitset_set_ swallowed bitset_set_all_, and
            # bitset_clear_ swallowed clear_all_ and clear_padding_ -- the
            # SAME bug the roll-call hit at #1252, third occurrence in this
            # job), then to 68 once anchored (test_* and xor_call_* fell
            # through no class at all). Both were found by summing, not by
            # reading. So the block now sums itself and names the remainder;
            # a class list that stops partitioning says so instead of
            # quietly under-reporting.
            OTHER=$((OWN - CLS_SUM))
            if [ "${OTHER}" -ne 0 ]; then
              printf "      %3s  UNCLASSIFIED -- the class list no longer partitions\n" "${OTHER}"
              grep -oE "^\[wp\] \[(Timeout|Unknown)\] typed_cast_bitset_[A-Za-z0-9_]+" \
                wp_bitset_output.txt | awk '{print $3}' | sort -u > /tmp/bs_own.txt
              : > /tmp/bs_cls.txt
              for cls in "${CLASSES[@]}"; do
                grep -oE "^typed_cast_${cls#*:}[A-Za-z0-9_]*" /tmp/bs_own.txt >> /tmp/bs_cls.txt || true
              done
              sort -u /tmp/bs_cls.txt -o /tmp/bs_cls.txt
              comm -23 /tmp/bs_own.txt /tmp/bs_cls.txt | sed 's/^/           /'
            fi 
          fi
          echo ""
          echo "==============================================="
          if [ "${FAILURES}" -gt 0 ]; then
            echo "  ${FAILURES} check(s) reported."
          fi
          # CORRECTED after CI #1260. This footer was unconditional text
          # written when the job was created and never revisited: it printed
          # "REPORT-ONLY: this job does not gate the build. Record the
          # baseline in VERIFY-020 before pinning" FOUR LINES BELOW a header
          # reading "MODE: ENFORCED", on a run that gated correctly.
          #
          # The gate was right and the narration was lying. That is the
          # lifetime.h shape exactly -- a false `assigns \nothing` survived
          # eleven copies because no verified configuration ever translated
          # it. Text nobody re-reads decays silently. Make the footer read
          # the same variable the gate reads.
          if [ "${ENFORCE}" -eq 1 ]; then
            if [ "${FAILURES}" -eq 0 ]; then
              echo "  VERIFY-020 ENFORCED PASS: ${EXPECTED_PROVED} proved, 0 Failed,"
              echo "        count ${UNPROVED_COUNT}/${EXPECTED_UNPROVED}, and all"
              echo "        ${EXPECTED_UNPROVED} residuals verified BY NAME in both"
              echo "        directions (set equality). Arms: 2 handler + 32"
              echo "        option_usize (inheritance) + 58 core substrate +"
              echo "        ${OWN} bitset-own."
              echo ""
              echo "        ${OWN} own is the smallest own-residual set of any"
              echo "        driver-verified module in the project: vec 196,"
              echo "        pool 119, region 114, arena 91, deque 67."
              echo "        (66 until F2/F5 at #1264 -- VERIFY-020 F5 records"
              echo "        why removing a redundant precondition cost five.)"
              echo ""
              echo "        A residual that starts PROVING turns this job RED."
              echo "        That is good news arriving as a red run, by design."
              echo "        Ratchet the pin in its own commit; never delete a"
              echo "        name to make the gate pass."
              echo ""
              echo "        See docs/verification.md (data/bitset.h section)"
              echo "        and docs/deviations.md (VERIFY-020) for the full"
              echo "        residual classification and findings F1-F5;"
              echo "        MCDC-012 for the coverage-stream record."
            else
              echo "  VERIFY-020 ENFORCED FAIL: ${FAILURES} check(s) above."
              echo "        missing  -> a pinned residual now proves: RATCHET."
              echo "        unpinned -> a NEW residual appeared: INVESTIGATE."
              echo "        both     -> a goal oscillates across runs; the pin"
              echo "                    is flaky and that is the finding."
            fi
          else
            echo "  REPORT-ONLY: this job does not gate the build."
            echo "  Record the baseline in VERIFY-020 before pinning."
          fi
          echo "==============================================="
          # ADDED 2026-09-06 (VERIFY-023 ratchet). This job has printed
          # "ENFORCED" since CI #1259 and has never been able to fail the
          # build: every other accumulator-style job ends with this gate;
          # this one did not. Found at CI #1284, when the step printed
          # "VERIFY-020 ENFORCED FAIL: 1 check(s)" and the job went green.
          # The name-stability evidence from #1259 onward is real -- every
          # roll-call printed missing 0 / unpinned 0 -- but ENFORCEMENT
          # begins at this commit, not at #1259, and VERIFY-020 must say so.
          if [ "${ENFORCE}" -eq 1 ] && [ "${FAILURES}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload WP bitset log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-bitset
          path: wp_bitset_output.txt
          retention-days: 90

  # -------------------------------------------------------------------------
  # core/primitives/lifetime.h — ENFORCED as of CI #1275 (VERIFY-021)
  #
  # INSTRUMENT INTEGRITY, not ownership semantics. This job verifies the token
  # GENERATOR. It says nothing about whether client code obeys the borrow
  # discipline — that is a typestate property over all callers, WP proves
  # contracts on functions, and it remains issue #7's territory (-fanalyzer /
  # EVA). The entry must not be written as if this job did more.
  #
  # WHY A NEW CONFIGURATION RATHER THAN A NEW CONTRACT.
  # Until 2026-09 lifetime.h carried no ACSL, deliberately, on the grounds
  # that every WP job runs with CANON_LIFETIME off, so a contract there would
  # be unchecked decoration. That reasoning was correct and is NOT overturned
  # here — it is satisfied. Two of the eleven superseded private copies of
  # this function carried `assigns \nothing`, which is FALSE (it writes the
  # counter) and survived precisely because nothing translated it. The fix for
  # an unchecked annotation is a configuration that checks it, not a better
  # annotation. This job is that configuration.
  #
  # VERIFIED CONFIGURATION: CANON_LIFETIME_DEBUG on, CANON_LIFETIME_NO_ATOMICS
  # forcing ladder level 4. Levels 1-3 are excluded PERMANENTLY: WP has no
  # concurrency model for atomic_fetch_add_explicit, __atomic_fetch_add or
  # _InterlockedIncrement64. The contract is #if-gated on
  # CANON_LIFETIME_ATOMIC_LEVEL_ == 4 so it cannot silently acquire authority
  # over the other three paths. The ladder's correctness argument stays prose
  # in docs/thread-safety.md, and the roadmap row reads "verified at level 4
  # only" — NOT "verified". That distinction is the honesty of the arc and
  # must survive every future edit to the docs.
  #
  # -DCANON_NO_REQUIRE -DNDEBUG are carried for comparability with every other
  # WP job in this workflow. lifetime.h contains no require_msg, so they are
  # inert here; they are present so the configuration differs from the house
  # configuration in exactly the two lifetime flags and nothing else.
  #
  # THE VACUOUS-PASS HAZARD, and why step 1 exists.
  # If the gate does not open — a dropped flag, a ladder regression, an
  # __FRAMAC__ assumption that stops holding — the contract disappears from
  # the translation unit and WP analyses an unannotated 12-line function. It
  # would report success over an empty obligation set. A job that can pass
  # while proving nothing is worse than no job. Step 1 therefore proves the
  # gate opens BEFORE WP runs, and the goal-count floor below catches the
  # residual case.
  #
  # PRE-REGISTERED PREDICTIONS (docs/VERIFY-021 prereg; scored, not gating):
  #   ARM A  ensures \result != REGION_ID_STATIC proves. It depends only on
  #          the total guard, not on how the model interprets the
  #          pointer-to-integer cast, so it should hold under Typed AND
  #          Typed+Cast. If it proves only under Typed+Cast, that reasoning
  #          is wrong and the entry says so.
  #   ARM B  assigns counter_ — predicted to be where run 0 breaks. CONFIRMED
  #          at CI #1267 that it broke there; REFUTED on the reason. Not a
  #          naming problem: a function-local static is not in scope where a
  #          function contract is parsed, so the clause is not writable at all
  #          without changing the shipped program. No frame is now claimed.
  #   ARM C  INHERITED = 0. Closure is <stdbool.h> + types.h, and types.h
  #          pulls only <stddef.h> <stdint.h> <stdbool.h>. No contract.h, so
  #          not even the 2-goal handler pair every residual-carrying header
  #          has inherited to date. First unit in the project with none.
  #   ARM D  TOTAL goals 2-10, 0 Failed/Invalid/Stepout, 0 residual. A count
  #          above 10 means the cast emitted more than expected; the entry
  #          explains what rather than moving the number quietly.
  #   ARM E  No new residual class. If one survives it is the cast, which is
  #          class (h) Typed+Cast bridging, already named by VERIFY-018.
  #
  # NOT DRIVEN, BY DECISION: the REGION_ID_STATIC guard's TRUE leg. It fires
  # when c_ == (uintptr_t)owner_, i.e. the call counter equals the owner's
  # address — order 1e14 calls on this runner, a few thousand on a low-address
  # embedded target. It takes an MC/DC JUSTIFICATION ROW, the bitset J1-J4
  # precedent, not a contrived driver: forcing it would mean an injectable
  # counter, i.e. verifying a copy.
  #
  # PROMOTION: done. #1271, #1273, #1274 name-identical (4/4, Terminating 1 /
  # Unreachable 1 / Qed 2), enforced at #1275. The blocking open item is
  # closed: -wp-print at #1274 showed the postcondition SPLIT ALONG THIS
  # GUARD — goal (1/2) tagged Then, (2/2) tagged Else, both Qed-valid. WP
  # proves the postcondition THROUGH the branch above and does not hold it
  # unreachable, so the two streams AGREE: reachable in the model,
  # undriveable on this host. The residual "Unreachable: 1" is some other
  # point and is still unnamed — a curiosity, not a blocker.
  # -------------------------------------------------------------------------
  frama-c-lifetime:
    needs: build
    runs-on: ubuntu-latest
    # 15, not the 60 every other WP job carries. Run 0 (CI #1271) analysed
    # 4 goals in seconds. A 60-minute ceiling on a unit this size would let
    # a hang look like slowness for an hour before failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "Gate tripwire: contract is translated at level 4"
        # Step 1 of 2. Proves the ACSL is actually IN the translation unit WP
        # will see. Replicates the exact define set with __FRAMAC__ forced, and
        # fails loudly rather than letting the WP step pass over an empty
        # obligation set.
        run: |
          set -e
          cat > /tmp/gate_probe.c <<'PROBE'
          #include "core/primitives/lifetime.h"
          #if !defined(CANON_LIFETIME_ATOMIC_LEVEL_)
          #  error "CANON_LIFETIME_ATOMIC_LEVEL_ undefined - MISRA 20.9 fix regressed"
          #endif
          #if CANON_LIFETIME_ATOMIC_LEVEL_ != 4
          #  error "ladder did not select level 4 under CANON_LIFETIME_NO_ATOMICS"
          #endif
          #if CANON_LIFETIME_ATOMIC_IDS != 0
          #  error "level 4 selected but CANON_LIFETIME_ATOMIC_IDS is not 0"
          #endif
          int main(void) { return 0; }
          PROBE
          gcc -std=c99 -I core/primitives -I core -I . \
              -D__FRAMAC__ \
              -DCANON_LIFETIME_DEBUG -DCANON_LIFETIME_NO_ATOMICS \
              -DCANON_NO_REQUIRE -DNDEBUG \
              -fsyntax-only /tmp/gate_probe.c
          echo "  ladder level: 4, atomic ids: 0 — gate open."
          # The contract text must survive preprocessing. Checked positively:
          # a gate that closes silently is the failure mode this job exists to
          # make impossible.
          gcc -std=c99 -I core/primitives -I core -I . -E -C \
              -D__FRAMAC__ \
              -DCANON_LIFETIME_DEBUG -DCANON_LIFETIME_NO_ATOMICS \
              -DCANON_NO_REQUIRE -DNDEBUG \
              /tmp/gate_probe.c > /tmp/gate_pp.i
          if ! grep -q 'ensures[[:space:]]*\\result != REGION_ID_STATIC' /tmp/gate_pp.i; then
            echo "FAIL: the ACSL postcondition is NOT present in the"
            echo "      preprocessed unit. The #if gate on"
            echo "      CANON_LIFETIME_ATOMIC_LEVEL_ == 4 did not open, so WP"
            echo "      would analyse an unannotated function and report"
            echo "      success over an empty obligation set."
            exit 1
          fi
          # NOT checked: an `assigns` clause. There is none, deliberately.
          # `counter_` is a function-local static and so is not in scope where
          # a function contract is parsed — Frama-C reports "unbound logic
          # variable counter_" and rejects the whole specification. Writing
          # `assigns \nothing` instead would be FALSE and is the historical
          # defect this arc corrects; hoisting the variable under __FRAMAC__
          # would verify a different program than the one that ships. So no
          # frame is claimed, WP assumes \everything, and the effect is
          # witnessed by test_counter_advances instead. See VERIFY-021 ARM B,
          # recorded as a refuted prediction.
          echo "  contract present in preprocessed unit (ensures clause)."
      - name: "WP: core/primitives/lifetime.h (VERIFY-021, enforced)"
        run: |
          eval $(opam env --switch=frama-c)
          # ENFORCED as of CI #1275. Three name-identical JOB results:
          # #1271, #1273, #1274, all "Proved goals: 4 / 4" with the same
          # Terminating 1 / Unreachable 1 / Qed 2 decomposition. #1273 and
          # #1274 were cancelled at the WORKFLOW level after this job had
          # finished (unrelated long WP jobs stopped to save minutes), so
          # the evidence is job-level; #1275 is the first uncancelled run
          # under enforcement. Enforcement was not set in the commit that
          # first turned this job green — that was #1271. The open
          # item that blocked promotion is closed: -wp-print at #1274 showed
          # the postcondition SPLIT ALONG THE GUARD into goal (1/2) tagged
          # Then and (2/2) tagged Else, both scheduled and both Qed-valid.
          # WP therefore reasons about the case where the REGION_ID_STATIC
          # guard fires and proves the postcondition through it — it does
          # NOT hold that branch unreachable, so it does not contradict
          # MCDC-013's justification row. The residual "Unreachable: 1" is
          # some other point and remains unnamed; that is now a curiosity,
          # not a blocker.
          ENFORCE=1
          WP_MODEL=Typed
          EXPECTED_TOTAL=4
          EXPECTED_UNPROVED=0
          # Pre-registered, printed against observed. Not gating at ENFORCE=0.
          PREDICT_INHERITED=0
          PREDICT_OWN=0
          PREDICT_UNPROVED=$((PREDICT_INHERITED + PREDICT_OWN))
          PREDICT_TOTAL_MIN=2
          PREDICT_TOTAL_MAX=10
          # Arm-sum self-check, the CI #1237 lesson: deque's "TOTAL 67/67"
          # once matched by CANCELLATION between two equal and opposite arm
          # errors. Exit before invoking WP if the arms do not sum.
          if [ $((PREDICT_INHERITED + PREDICT_OWN)) -ne "${PREDICT_UNPROVED}" ]; then
            echo "FAIL: arm predictions do not sum to the predicted total."
            exit 1
          fi
          set +e
          frama-c -wp -wp-rte \
            -wp-model ${WP_MODEL} \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_LIFETIME_DEBUG \
              -DCANON_LIFETIME_NO_ATOMICS \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/lifetime.h 2>&1 | tee wp_lifetime_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (lifetime.h) exit status: ${WP_EXIT}"
          if [ "${ENFORCE}" -eq 1 ]; then MODE_LABEL=enforced; else MODE_LABEL=report-only; fi
          echo "  MODE: ${MODE_LABEL} (ENFORCE=${ENFORCE})  MODEL: ${WP_MODEL}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_lifetime_output.txt || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            echo "FAIL: WP produced no verification summary — frama-c aborted"
            echo "      before running WP, most likely an ACSL syntax error"
            echo "      or an unresolved name in the assigns clause. ARM B"
            echo "      predicted exactly this, on counter_ being a"
            echo "      function-local static that Frama-C hoists and renames."
            grep -E "^\[(kernel|wp)" wp_lifetime_output.txt | head -20 || true
            exit 1
          fi
          TOTAL_GOALS=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \K\d+' | head -1 || true)
          # Goal-count floor: step 2 of the vacuous-pass tripwire. A unit whose
          # contract vanished can still print a summary — over zero goals.
          if [ -z "${TOTAL_GOALS}" ] || [ "${TOTAL_GOALS}" -lt 1 ]; then
            echo "FAIL: WP ran over ZERO goals. The contract is not in the"
            echo "      analysed unit despite the gate probe passing. Do not"
            echo "      read this as a clean run — it is a vacuous one."
            exit 1
          fi
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_lifetime_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_lifetime_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_lifetime_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\[wp\] \[Invalid\]" wp_lifetime_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\[wp\] \[Stepout\]" wp_lifetime_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          echo "  Total goals: ${TOTAL_GOALS} (predicted ${PREDICT_TOTAL_MIN}-${PREDICT_TOTAL_MAX})"
          echo "  Timeouts:    ${TIMEOUT_COUNT}"
          echo "  Unknown:     ${UNKNOWN_COUNT}"
          echo "  Failed:      ${FAILED_COUNT}"
          echo "  Unproved (T+U): ${UNPROVED_COUNT} (predicted ${PREDICT_UNPROVED})"
          # Gated even in report-only. A Failed or Invalid goal means a
          # contract is falsified; report-only exists to let a RESIDUAL COUNT
          # settle, never to tolerate a false contract. This is the one place
          # the historical `assigns \nothing` would have been caught, and it
          # is why the gate is unconditional.
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED — a contract in"
            echo "      lifetime.h is falsified."
            grep -E "^\[wp\] \[Failed\]" wp_lifetime_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      REFUTED with a counter-example. Never pinnable."
            grep -E "^\[wp\] \[Invalid\]" wp_lifetime_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Never observed in this project; the residual set is"
            echo "      defined as Timeout u Unknown, so decide whether to"
            echo "      pool it and update the definition before proceeding."
            grep -E "^\[wp\] \[Stepout\]" wp_lifetime_output.txt
            exit 1
          fi
          echo ""
          echo "  --- prediction scorecard (never gates; the pins above do) ---"
          if [ "${TOTAL_GOALS}" -ge "${PREDICT_TOTAL_MIN}" ] && \
             [ "${TOTAL_GOALS}" -le "${PREDICT_TOTAL_MAX}" ]; then
            echo "  ARM D goal count:  CONFIRMED (${TOTAL_GOALS})"
          else
            echo "  ARM D goal count:  REFUTED (${TOTAL_GOALS}, predicted"
            echo "                     ${PREDICT_TOTAL_MIN}-${PREDICT_TOTAL_MAX}) — record the refutation."
          fi
          if [ "${UNPROVED_COUNT}" -eq "${PREDICT_UNPROVED}" ]; then
            echo "  ARM C/D residual:  CONFIRMED (${UNPROVED_COUNT})"
          else
            echo "  ARM C/D residual:  REFUTED (${UNPROVED_COUNT}, predicted ${PREDICT_UNPROVED})"
            echo "                     Observed unproved goals:"
            grep -E "^\[wp\] \[(Timeout|Unknown)\]" wp_lifetime_output.txt || true
          fi
          echo ""
          if [ "${ENFORCE}" -eq 1 ]; then
            if [ "${TOTAL_GOALS}" -ne "${EXPECTED_TOTAL}" ]; then
              echo "FAIL: total goals ${TOTAL_GOALS}, pinned ${EXPECTED_TOTAL}."
              echo "      A MOVED total is not automatically a regression --"
              echo "      it may be a contract improvement -- but it is never"
              echo "      silent. Re-measure, update the pin deliberately, and"
              echo "      say why in VERIFY-021."
              exit 1
            fi
            if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
              echo "FAIL: unproved ${UNPROVED_COUNT}, pinned ${EXPECTED_UNPROVED}."
              grep -E "^\\[wp\\] \\[(Timeout|Unknown)\\]" wp_lifetime_output.txt || true
              exit 1
            fi
            echo "ENFORCED PASS: ${TOTAL_GOALS}/${TOTAL_GOALS}, 0 unproved,"
            echo "      pinned exactly. Scope remains ladder level 4 only and"
            echo "      one ensures clause -- see VERIFY-021 before quoting"
            echo "      this as \"lifetime.h is verified\"."
          else
            echo "REPORT-ONLY PASS: nothing pinned."
          fi
          echo "==============================================="
      - name: "WP goal-level detail (diagnostic, never fails)"
        # Added after run 0 (CI #1271): the summary reports
        #   Proved goals: 4/4 — Terminating 1, Unreachable 1, Qed 2
        # and does not say WHICH program point WP called unreachable.
        # That matters: if it is the REGION_ID_STATIC guard, it contradicts
        # MCDC-013, whose justification row disposes of that same branch as
        # reachable-but-undriveable. "Cannot drive it on this host" and
        # "cannot reach it at all" are different claims, and two instruments
        # disagreeing about one branch is a finding.
        #
        # First attempt (CI #1273) used -wp-verbose 2 and FAILED: verbosity
        # does not name goals, it only repeats the category counts, so the
        # grep matched the summary lines and the artifact was 414 bytes of
        # nothing. Corrected here to -wp-out, which writes the generated
        # obligations to a directory where the FILENAMES carry goal names.
        # Both -wp-print and the directory listing are emitted because the
        # exact output shape has not been reproduced locally — no Frama-C in
        # the authoring environment — so this casts a wide net on purpose.
        #
        # Separate invocation: the main step's parse of the pinned Proved
        # line stays byte-stable. Never fails — a diagnostic that can break
        # the build gets deleted the first time it is inconvenient.
        if: always()
        run: |
          eval $(opam env --switch=frama-c)
          rm -rf /tmp/wpout && mkdir -p /tmp/wpout
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -wp-out /tmp/wpout \
            -wp-print \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_LIFETIME_DEBUG \
              -DCANON_LIFETIME_NO_ATOMICS \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/lifetime.h > wp_lifetime_goals.txt 2>&1
          set -e
          echo "==============================================="
          echo "  Goal-level detail — VERIFY-021 open item"
          echo "==============================================="
          echo "--- generated obligation files (names carry the goals) ---"
          # Expect this to be EMPTY, and that is informative rather than a
          # failure: -wp-out only writes a file for a goal that is sent to a
          # PROVER, and Qed closes every goal in this unit first. Same reason
          # -wp-print below lists only the two scheduled postcondition goals.
          find /tmp/wpout -type f | sed "s|/tmp/wpout/||" | sort || true
          echo ""
          echo "--- goal text from -wp-print (scheduled goals only) ---"
          cat wp_lifetime_goals.txt || true
          echo ""
          echo "--- ALL goals, including the ones Qed closes silently ---"
          # -wp-prover none generates every goal and proves none, so the
          # Terminating and Unreachable obligations become visible instead of
          # being absorbed into the summary counts. This is the only way to
          # see them: they never reach a prover and so never reach -wp-out.
          # Both belong to canon_lifetime_next_id_ -- it is the only function
          # in the header. Never fails; if the flag is wrong the raw output
          # is still uploaded.
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed \
            -wp-prover none \
            -wp-print \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_LIFETIME_DEBUG \
              -DCANON_LIFETIME_NO_ATOMICS \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/lifetime.h > wp_lifetime_allgoals.txt 2>&1
          set -e
          cat wp_lifetime_allgoals.txt || true
          echo ""
          echo "  RESOLVED at CI #1275, and the question was malformed."
          echo "  -wp-prover none generates every goal and proves none. It"
          echo "  lists TWO goals: the postcondition split Then/Else. So the"
          echo "  Terminating and Unreachable entries in the summary are not"
          echo "  generated obligations over program points -- there is no"
          echo "  branch for them to name. They are structural entries in"
          echo "  the WP property tally, discharged without an obligation."
          echo "  This step is kept as a regression detector: if a future"
          echo "  change makes WP emit a THIRD goal here, it shows up below"
          echo "  before the pinned count catches it. See VERIFY-021."
          echo "==============================================="
          # keep the obligation tree in the artifact too
          tar czf wp_lifetime_obligations.tar.gz -C /tmp wpout 2>/dev/null || true
      - name: Upload WP goal detail (lifetime.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-goals-lifetime
          path: |
            wp_lifetime_goals.txt
            wp_lifetime_allgoals.txt
            wp_lifetime_obligations.tar.gz
          retention-days: 90
      - name: Upload WP proof output (lifetime.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-lifetime
          path: wp_lifetime_output.txt
          retention-days: 90

  # -------------------------------------------------------------------------
  # data/priority_queue.h — ENFORCED (VERIFY-022; runs 0-7 at CI #1281-#1289,
  # run 6 = 7 own; commit 7 closes the last one that was pq's, run 7 pending)
  #
  # Shape: verified IN PLACE, no cover TU and no driver. The 40 non-macro
  # functions carry the contracts; DEFINE_PRIORITY_QUEUE's 17 typed wrappers
  # are PARKED, on the borrow.h and diag.h precedent (docs/vmacros.md).
  #
  # SCOPE, declared before the run rather than discovered in the residuals:
  # the STRUCTURAL invariant only — validity, bounds, len <= capacity, exact
  # accessor results, and the len arithmetic of push/pop/remove.
  #
  # HEAP ORDER IS NOT CLAIMED AND CANNOT BE. pq_sift_up_ and pq_sift_down_
  # decide every swap by calling pq->cmp(a, b, ctx), an indirect call through
  # a caller-supplied function pointer. Frama-C 29 has no `calls` clause and
  # \valid_function is unimplemented, so "parent <= child" would be a
  # statement about an uninterpreted function. Not a timeout; no budget
  # touches it. Same ceiling as option's 32 and result's 28 dispatch
  # residuals — met here for the first time in a container whose CORRECTNESS
  # ARGUMENT depends on it, since vec and deque are ordered by insertion and
  # never needed the comparator. A priority queue's whole point is the
  # ordering, and the ordering is the part that cannot be specified.
  # Heap order is covered by the runtime suite instead: every pop sequence in
  # priority_queue_test.c asserts ascending order, including through the
  # byte-wise swap path for elements over CANON_MEM_SWAP_MAX.
  #
  # RUN-0 PREDICTIONS, scored at CI #1281/#1282 — kept as the record. The
  # RUN-1/RUN-2 arms are the ones in the WP step below.
  #   ARM A  Run 0 does NOT come back clean. CONFIRMED in outcome, REFUTED in
  #          mechanism: predicted ACSL syntax/name failure; every contract
  #          parsed and WP reached proving. What killed run 0 was the
  #          90-minute budget, sized from lifetime.h's 4 goals.
  #   ARM B  Behaviour-local assigns on pq_push_result fragile. REFUTED: WP
  #          accepted them and synthesised the default frame (run 1).
  #   ARM C  ptr_elem's void* arithmetic forces Typed+Cast. CONFIRMED: run 0
  #          under Typed left 56 substrate goals unproved that prove at home,
  #          all at cast sites.
  #   ARM D  Own residuals break the descending trend upward, above 71.
  #          CONFIRMED at 199 (run 1) — but for missing annotations rather
  #          than heap algorithmics; see the commit-2 message.
  #   ARM E  Inherited surface = memory.h's TU. CONFIRMED: 43/43 by name.
  #
  # ENFORCE=0 ON PURPOSE. Nothing is pinned until run 2 is recorded. Do not
  # set ENFORCE=1 in the same commit that first turns this job green.
  # -------------------------------------------------------------------------
  frama-c-priority-queue:
    needs: build
    runs-on: ubuntu-latest
    # 330: run 1 (CI #1282) took 3h55m against 240 — five minutes to spare —
    # and commit 2's loop annotations add preservation and variant goals.
    # Still under GitHub's 6h kill, same reasoning as region's 350.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "Gate tripwire: contracts are in the analysed unit"
        # A job that can pass while proving nothing is worse than no job.
        # Proves the ACSL survives preprocessing BEFORE WP runs; the
        # goal-count floor below catches the residual case.
        run: |
          set -e
          gcc -std=c99 -I data -I core -I core/primitives -I semantics -I . \
              -D__FRAMAC__ -DCANON_NO_REQUIRE -DNDEBUG -E -C \
              -o /tmp/pq_pp.i - <<'PROBE'
          #include "data/priority_queue.h"
          int main(void) { return 0; }
          PROBE
          # Backslash-free probes on purpose: grep reads the \r in
          # "\\result" as an escape, so a probe containing it fails on a
          # CORRECTLY contracted header. Caught locally, before this job ran.
          for clause in "predicate pq_wf" "requires pq_wf(pq)" \
                        "behavior accepted" "complete behaviors" \
                        "loop invariant pq_wf(pq)"; do
            if ! grep -q "$clause" /tmp/pq_pp.i; then
              echo "FAIL: '$clause' is absent from the preprocessed unit."
              echo "      The __FRAMAC__ gate did not open, so WP would"
              echo "      analyse an unannotated header and report success"
              echo "      over an empty obligation set."
              exit 1
            fi
          done
          echo "  contracts present in preprocessed unit (5 probes)."
      - name: "WP: data/priority_queue.h (VERIFY-022, report-only, Typed+Cast)"
        run: |
          eval $(opam env --switch=frama-c)
          ENFORCE=1
          # Typed+Cast, NOT Typed. The closure includes ptr.h, compare.h,
          # slice.h and memory.h, all verified at home under Typed+Cast and
          # all cast-originating (sint8* <-> uint8* at every byte-view site).
          # deque could run on plain Typed only because its closure excludes
          # every such header (VERIFY-019 "Model: Typed, not Typed+Cast");
          # that exemption does not apply here. Run 0 (CI #1281) ran Typed
          # and produced 56 substrate residuals that prove at home, all at
          # cast sites -- recorded in VERIFY-022 as the model's negative
          # control, not as a result about priority_queue.
          WP_MODEL=Typed+Cast
          set +e
          frama-c -wp -wp-rte \
            -wp-model ${WP_MODEL} \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I data \
              -I core \
              -I core/primitives \
              -I semantics \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            data/priority_queue.h 2>&1 | tee wp_pq_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (priority_queue.h) exit: ${WP_EXIT}"
          if [ "${ENFORCE}" -eq 1 ]; then echo "  MODE: ENFORCED (VERIFY-022, pinned at CI #1289)  MODEL: ${WP_MODEL}"; else echo "  MODE: report-only (ENFORCE=${ENFORCE})  MODEL: ${WP_MODEL}"; fi
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_pq_output.txt || true)
          if [ -z "${PROVED_LINE}" ]; then
            echo "ARM 0 (run-0 style abort): WP produced no summary."
            echo "      Either frama-c aborted before running (ACSL syntax or"
            echo "      an unresolved name) or the job was cancelled by the"
            echo "      time budget. The kernel messages follow."
            grep -E "^\[(kernel|wp)" wp_pq_output.txt | head -40 || true
            exit 1
          fi
          echo "  ${PROVED_LINE}"
          TOTAL=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \K\d+' | head -1 || true)
          if [ -z "${TOTAL}" ] || [ "${TOTAL}" -lt 1 ]; then
            echo "FAIL: WP ran over ZERO goals -- a vacuous pass, not a clean"
            echo "      one, despite the gate probe succeeding."
            exit 1
          fi
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_pq_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_pq_output.txt || true)
          FAILED_COUNT=$(grep -cE  "^\[wp\] \[Failed\]"  wp_pq_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\[wp\] \[Invalid\]" wp_pq_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\[wp\] \[Stepout\]" wp_pq_output.txt || true)
          UNPROVED=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          echo "  Total goals: ${TOTAL}"
          echo "  Timeouts:    ${TIMEOUT_COUNT}"
          echo "  Unknown:     ${UNKNOWN_COUNT}"
          echo "  Failed:      ${FAILED_COUNT}"
          echo "  Invalid:     ${INVALID_COUNT}"
          echo "  Stepout:     ${STEPOUT_COUNT}"
          echo "  Unproved (T+U): ${UNPROVED}"
          # Failed / Invalid / Stepout are NOT residual verdicts. Invalid and
          # Stepout gate even in report-only (same rule as the deque and
          # region jobs); Failed is listed for triage on a first pass.
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID -- a contract is"
            echo "      REFUTED with a counter-example. Never pinnable, and"
            echo "      gated even in report-only."
            grep -E "^\[wp\] \[Invalid\]" wp_pq_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit -- a"
            echo "      verdict this project has never observed. Deliberately"
            echo "      NOT pooled into the residual count; decide whether to"
            echo "      pool it and update the definition before pinning."
            grep -E "^\[wp\] \[Stepout\]" wp_pq_output.txt
            exit 1
          fi
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "NOTE: ${FAILED_COUNT} Failed goal(s). On a FIRST PASS this"
            echo "      most likely means a contract is wrong rather than the"
            echo "      code -- these were written without a local Frama-C."
            echo "      Listed for triage; not gated at ENFORCE=0."
            grep -E "^\[wp\] \[Failed\]" wp_pq_output.txt | head -30
          fi
          echo ""
          echo "  --- ARM A: positive control -- did -wp-model Typed+Cast take effect? ---"
          # Same discipline as VERIFY-019-M / f4-control.yml: a null result
          # is evidence only when the instrument is known to have changed.
          CAST_RESID=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\] typed_cast_" wp_pq_output.txt || true)
          PLAIN_RESID=$(grep -E "^\[wp\] \[(Timeout|Unknown)\] typed_" wp_pq_output.txt | grep -vc "typed_cast_" || true)
          echo "  typed_cast_ prefixed unproved goals: ${CAST_RESID}"
          echo "  plain typed_ prefixed unproved goals: ${PLAIN_RESID}  (predicted 0)"
          if [ "${UNPROVED}" -gt 0 ] && [ "${CAST_RESID}" -eq 0 ]; then
            echo "FAIL: residuals exist but none is typed_cast_ prefixed --"
            echo "      the model flag did not take effect. Every ARM below"
            echo "      is VOID; do not record this run against any of them."
            exit 1
          fi
          echo ""
          echo "  --- ARM B: inheritance -- Inh(pq) == Residual(memory.h TU), mod prefix ---"
          # Predicted BEFORE run 1 (VERIFY-022): priority_queue's core
          # closure is memory.h's translation unit (contract, checked, ptr,
          # slice, memory) plus compare.h and error.h. compare and error have
          # EMPTY home residual sets. By the set-union identity the inherited
          # set is memory.h's pinned 43, exactly, with the same prefix.
          # CONFIRMED at CI #1282: 43/43 present, 0 missing.
          #
          # The baseline is read from the frama-c-memory job's CHECKS array
          # in THIS workflow file at run time -- there is no second copy of
          # the list to drift out of step (the fix VERIFY-016/§7 named for
          # the arena-32 differential gate).
          WF=".github/workflows/cmake-multi-platform.yml"
          MEM_START=$(grep -n '^  frama-c-memory:' "${WF}" | head -1 | cut -d: -f1)
          # first CHECKS=( after the job header, up to its closing paren, then stop
          awk -v s="${MEM_START}" 'NR>=s && /CHECKS=\(/ {f=1} f {print} f && /^ *\)/ {exit}' "${WF}" \
            | grep -o '"typed_cast_[^"]*"' | tr -d '"' | sort -u > /tmp/mem_checks.txt
          MEM_N=$(wc -l < /tmp/mem_checks.txt)
          if [ "${MEM_N}" -ne 43 ]; then
            echo "FAIL: parsed ${MEM_N} names from frama-c-memory's CHECKS,"
            echo "      expected 43. The extraction is broken; ARM B is VOID."
            exit 1
          fi
          grep -E "^\[wp\] \[(Timeout|Unknown)\] " wp_pq_output.txt \
            | awk '{print $3}' | sort -u > /tmp/pq_resid.txt
          # completeness: every memory.h residual re-appears
          comm -23 /tmp/mem_checks.txt /tmp/pq_resid.txt > /tmp/armb_missing.txt
          # soundness of context: no substrate goal that proves at home is
          # residual here. Substrate = anything that is not pq's own and not
          # the fresh result(bool, Error) instantiation.
          #
          # REGEX CORRECTED after CI #1282. The C identifier is
          # result__Bool_Error (double underscore, from _Bool token-pasting),
          # but WP emits goal names as result_Bool_Error (single). The run-1
          # job matched the C spelling, so all 22 result goals fell through
          # to "extra substrate" and ARM C read 0/0. ARM E still summed --
          # the goals were counted, just misfiled -- which is how it was
          # caught. vec's and deque's CHECKS arrays use the single form.
          comm -13 /tmp/mem_checks.txt /tmp/pq_resid.txt \
            | grep -vE '^typed_cast_pq_' \
            | grep -vE '^typed_cast_result_Bool_Error_' > /tmp/armb_extra.txt || true
          MISSING_N=$(wc -l < /tmp/armb_missing.txt)
          EXTRA_N=$(wc -l < /tmp/armb_extra.txt)
          INH_N=$(comm -12 /tmp/mem_checks.txt /tmp/pq_resid.txt | wc -l)
          echo "  memory.h names present:   ${INH_N} / 43"
          echo "  memory.h names MISSING:   ${MISSING_N}   (predicted 0 -- completeness)"
          [ "${MISSING_N}" -gt 0 ] && sed 's/^/      /' /tmp/armb_missing.txt
          echo "  substrate goals EXTRA:    ${EXTRA_N}   (predicted 0 -- soundness of context)"
          [ "${EXTRA_N}" -gt 0 ] && sed 's/^/      /' /tmp/armb_extra.txt | head -60
          echo ""
          echo "  --- ARM C: fresh result(bool, Error) arm, UNcontracted ---"
          # Pre-registered as a CLASS, not a count: the instantiation is the
          # shipped CANON_RESULT(bool, Error) with no ACSL attached, so only
          # -wp-rte goals exist for it. Firm sub-prediction: get_ok and
          # get_err each carry an unproved assert_rte_mem_access, because
          # nothing states \valid(out) -- the VERIFY-018 F4 shape, met a
          # third time.
          # CONFIRMED at CI #1282 once the regex above was corrected: 22
          # goals, get_ok/get_err 1/1. And 22 is EXACTLY vec's pre-F4 count
          # for the same fresh instantiation under the same model with no
          # driver contracts -- the second reproduction of that profile.
          RES_N=$(grep -cE '^typed_cast_result_Bool_Error_' /tmp/pq_resid.txt || true)
          GET_OK=$(grep -cE  '^typed_cast_result_Bool_Error_get_ok_assert_rte_mem_access( |$)'  /tmp/pq_resid.txt || true)
          GET_ERR=$(grep -cE '^typed_cast_result_Bool_Error_get_err_assert_rte_mem_access( |$)' /tmp/pq_resid.txt || true)
          echo "  result arm residuals:     ${RES_N}   (run 1: 22; vec pre-F4: 22)"
          echo "  get_ok/get_err mem_access: ${GET_OK}/${GET_ERR}   (predicted 1/1)"
          grep -E '^typed_cast_result_Bool_Error_' /tmp/pq_resid.txt | sed 's/^/      /' || true
          echo ""
          echo "  --- ARM D: priority_queue's own residuals ---"
          # RUN 1 (CI #1282): 199. Classified in the commit-2 message: ~110
          # from two unannotated loops (assigns-everything cascade), ~50 from
          # the lifetime stubs having no frame (deque run-1 F1 recurring),
          # ~20 uncontracted functions, 12 pq_swap_, 1 genuine contract
          # error (pq_is_full), 1 ptr_elem_const \from gap.
          #
          # RUN 2 (CI #1283): 170 own. The run-2 prediction of < 60 was
          # REFUTED and stays in the record. Root cause was not the cmp
          # ceiling (41 of 170) but ptr_elem/ptr_offset having NO ensures on
          # \result -- every element address was opaque to WP (~85), plus
          # ptr_elem's overflow-bound requires that pq_wf did not carry
          # (~20). VERIFY-023 closes the first in ptr.h; commit 3 closes the
          # second in pq_wf.
          #
          # RUNS 2-4 (CI #1283/#1284/#1285): 170, 143, 144 own. Three count
          # predictions (< 60, < 90, < 130) REFUTED in a row, each because a
          # cause was inferred from a symptom and not traced in the log:
          #   run 2  "ptr_elem opacity" -- partly right, mostly the cmp cascade
          #   run 3  "41 cmp-ceiling"   -- a grep of goal NAMES; the cascade
          #                               after the first pq->cmp call was ~99
          #   run 4  "\\separated"      -- zero effect; the real cause of
          #                               push_result's failures was the
          #                               UNCONTRACTED result constructors at
          #                               its return statements, and of
          #                               pop_raw's the unconstrained `out`
          # Run 4 also regressed heapify a second time from the same cause
          # (a pq_wf conjunct added without following it into heapify's
          # hand-copied requires). Commit 5 splits pq_wf_buf out so that
          # cannot recur.
          #
          # NO COUNT IS PREDICTED FOR RUN 5. Counting is what kept going wrong.
          # Instead, every remaining residual must land in one of the classes
          # below, and the tally is printed per function so any function that
          # does not reach the class it should is visible by name:
          #
          #   CEILING (the verified-configuration shape, lifetime.h precedent):
          #     pq_cmp_*                       -- the comparator boundary. A
          #        `calls` clause names compare.h's 24 built-in comparators
          #        (VERIFY-005, 208/208, all `assigns \\nothing`), and pq_wf
          #        requires pq->cmp to be one of them, so the wrapper's frame
          #        and termination are THEOREMS, not a trusted axiom. The
          #        verified claim narrows to the built-in family; a caller-
          #        supplied comparator is outside it. Expected residual: 1 --
          #        assert_rte_function_pointer, \\valid_function being
          #        unimplemented in Frama-C 29. If assigns or terminates ALSO
          #        appear here, the calls clause did not take and the axiom
          #        alternative (documented in the header) is the fallback.
          #   PROVER LIMIT:
          #     pq_swap__call_mem_swap_requires_2 -- two element ranges are
          #        disjoint because a != b, lifted through elem_size:
          #        multiplication. 1 goal. Same class may appear at
          #        remove_at_result's mem_copy (slot i vs slot len) and at
          #        as_bytes/as_cbytes (len*es <= capacity*es). If those appear
          #        they are THIS class, not a contract error; if they do not,
          #        Alt-Ergo handled the monotonicity and the class is 1.
          #   EVERYTHING ELSE: 0 per function. Every function in the header
          #     now carries a contract. A residual outside the two classes
          #     above is a contract error to read, not a number to record.
          OWN_N=$(grep -cE '^typed_cast_pq_' /tmp/pq_resid.txt || true)
          echo "  pq_* residuals:           ${OWN_N}   (run 1: 199; run 2: 170; run 3: 143; run 4: 144; run 5: 18; run 6: 7)"
          # RUN 5 (CI #1287): 144 -> 18. The calls clause TOOK: pq_cmp_ carries
          # exactly one goal, \\valid_function -- but this regex said 0, because
          # WP names RTE goals with a SINGLE underscore (pq_cmp_assert_...) and
          # call goals with a double (pq_swap__call_...). Third instance of
          # the prefix/underscore class in this workflow. Anchored on the
          # single form now; nothing else in the header starts pq_cmp_.
          CEIL_N=$(grep -cE '^typed_cast_pq_cmp_' /tmp/pq_resid.txt || true)
          # Bin 2 RENAMED at run 5. It was "multiplication / range disjointness";
          # the log says otherwise. mem_copy's 3rd and mem_swap's 2nd requires
          # are !regions_overlap(a, b, size), and memory.h DEFINES that
          # predicate by POINTER ORDERING: a < b + size && b < a + size. Under
          # WP, ordering two pointers into different bases is meaningless, so
          # \\separated(elem, buffer) -- which pq_wf and the contracts give --
          # cannot discharge it. Four mem_copy sites and one mem_swap site.
          # remove_at's is the same-base case and additionally needs
          # multiplication. This is a memory.h CONTRACT-SHAPE finding of the
          # VERIFY-023 kind, not a pq residual: the fix is to state
          # regions_overlap with \\separated, which is a substrate arc
          # (VERIFY-024 candidate) with its own ratchet. Named here, not fixed
          # here.
          MULT_N=$(grep -cE '^typed_cast_pq_(swap__call_mem_swap_requires|remove_at_result_call_mem_copy_requires|push_result_call_mem_copy_requires|pop_raw_call_mem_copy_requires|peek_call_mem_copy_requires)' /tmp/pq_resid.txt || true)
          REST_N=$((OWN_N - CEIL_N - MULT_N))
          echo "    comparator boundary (pq_cmp_):     ${CEIL_N}   (expected 1: \\valid_function only -- calls clause over the 24 built-ins)"
          echo "    regions_overlap by pointer order:  ${MULT_N}   (expected 5: memory.h contract shape, VERIFY-024 candidate)"
          echo "    everything else:                   ${REST_N}   (expected 0 -- anything here is a contract to read)"
          if [ "${REST_N}" -eq 0 ]; then
            echo "  run-7 class prediction:   CONFIRMED -- every residual is in a named class"
          else
            echo "  run-7 class prediction:   REFUTED -- ${REST_N} residual(s) outside both classes, listed by function:"
          fi
          echo "  --- per-function tally (own residuals) ---"
          # Explicit names with anchored prefixes. pq_push is a prefix of
          # pq_push_result, pq_pop of pq_pop_raw, pq_peek of pq_peek_raw,
          # pq_remove_at of pq_remove_at_result, pq_swap of pq_swap_ -- the
          # bitset job miscounted twice on exactly this shape (CI #1252), so
          # each row subtracts the longer names that share its prefix.
          tally() {  # $1 = label, $2 = regex to count, $3 = regex to exclude (may be empty)
            if [ -n "$3" ]; then n=$(grep -E "$2" /tmp/pq_resid.txt | grep -vcE "$3" || true)
            else n=$(grep -cE "$2" /tmp/pq_resid.txt || true); fi
            [ "$n" -gt 0 ] && printf '    %4d  %s\n' "$n" "$1"
            return 0
          }
          tally pq_cmp_            '^typed_cast_pq_cmp_'                  ''
          tally pq_swap_           '^typed_cast_pq_swap__'                ''
          tally pq_sift_up_        '^typed_cast_pq_sift_up_'              ''
          tally pq_sift_down_      '^typed_cast_pq_sift_down_'            ''
          tally pq_init            '^typed_cast_pq_init_'                 ''
          tally pq_heapify         '^typed_cast_pq_heapify_'              ''
          tally pq_push_result     '^typed_cast_pq_push_result_'          ''
          tally pq_push            '^typed_cast_pq_push_'                 '^typed_cast_pq_push_result_'
          tally pq_pop_raw         '^typed_cast_pq_pop_raw_'              ''
          tally pq_pop             '^typed_cast_pq_pop_'                  '^typed_cast_pq_pop_raw_'
          tally pq_peek_raw        '^typed_cast_pq_peek_raw_'             ''
          tally pq_peek            '^typed_cast_pq_peek_'                 '^typed_cast_pq_peek_raw_'
          tally pq_remove_at_result '^typed_cast_pq_remove_at_result_'   ''
          tally pq_remove_at       '^typed_cast_pq_remove_at_'            '^typed_cast_pq_remove_at_result_'
          tally pq_as_bytes        '^typed_cast_pq_as_bytes_'             ''
          tally pq_as_cbytes       '^typed_cast_pq_as_cbytes_'            ''
          tally accessors          '^typed_cast_pq_(len|capacity|remaining|is_empty|is_full|parent_|left_child_|right_child_|lifetime_)' ''
          echo ""
          echo "  --- ARM E: the arms must sum to the total ---"
          # VERIFY-019's bookkeeping lesson: #1234's arms matched by
          # cancellation. Sum before interpreting.
          ARM_SUM=$((INH_N + EXTRA_N + RES_N + OWN_N))
          echo "  ${INH_N} inherited + ${EXTRA_N} extra-substrate + ${RES_N} result + ${OWN_N} own = ${ARM_SUM}"
          echo "  observed unproved (T+U):                                  ${UNPROVED}"
          if [ "${ARM_SUM}" -ne "${UNPROVED}" ]; then
            echo "  MISMATCH: a residual matched no arm (or two). Listing:"
            cat /tmp/mem_checks.txt /tmp/armb_extra.txt > /tmp/covered.txt
            grep -E '^typed_cast_(pq|result_Bool_Error)_' /tmp/pq_resid.txt >> /tmp/covered.txt || true
            sort -u /tmp/covered.txt > /tmp/covered_s.txt
            comm -23 /tmp/pq_resid.txt /tmp/covered_s.txt | sed 's/^/      /'
          fi
          echo ""
          if [ "${ENFORCE}" -eq 1 ]; then
            # ===============================================================
            # ENFORCED as of VERIFY-022 commit 8, pinned at CI #1289 (run 7).
            # Seven commits, seven runs: 199, 170, 143, 144, 18, 7, 6 own.
            # Three count predictions refuted (< 60, < 90, < 130); the
            # comparator-boundary and separation-class predictions held.
            #
            # The 71-name residual set = 43 inherited from memory.h (taken
            # from the memory job's own list at run time, so the two pins
            # cannot drift apart silently) + 22 result(bool, Error) + 6 own:
            #   1  \\valid_function(pq->cmp)             -- Frama-C 29 limit
            #   5  !regions_overlap at mem_copy x4 / mem_swap x1 -- memory.h
            #      states the predicate by pointer ORDERING, which \\separated
            #      cannot discharge across bases: VERIFY-024 candidate.
            # THIS is the name-stability run: CI #1289 is the first
            # measurement at this contract state, and the enforcing run is
            # the second. If it goes red with no header change, the pin is
            # flaky and that is the finding -- deque's run-2 shape.
            # ===============================================================
            EXPECTED_PROVED="4513 / 4584"
            EXPECTED_UNPROVED=71
            PIN_NAMES=(
            "typed_cast_result_Bool_Error_and_then_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_and_then_terminates_part1"
            "typed_cast_result_Bool_Error_and_then_terminates_part2"
            "typed_cast_result_Bool_Error_eq_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_eq_assert_rte_function_pointer_2"
            "typed_cast_result_Bool_Error_eq_terminates_part1"
            "typed_cast_result_Bool_Error_eq_terminates_part2"
            "typed_cast_result_Bool_Error_eq_terminates_part3"
            "typed_cast_result_Bool_Error_eq_terminates_part4"
            "typed_cast_result_Bool_Error_get_err_assert_rte_mem_access"
            "typed_cast_result_Bool_Error_get_ok_assert_rte_mem_access"
            "typed_cast_result_Bool_Error_map_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_map_err_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_map_err_exits"
            "typed_cast_result_Bool_Error_map_err_terminates_part2"
            "typed_cast_result_Bool_Error_map_err_terminates_part3"
            "typed_cast_result_Bool_Error_map_exits"
            "typed_cast_result_Bool_Error_map_terminates_part2"
            "typed_cast_result_Bool_Error_map_terminates_part3"
            "typed_cast_result_Bool_Error_or_else_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_or_else_terminates_part1"
            "typed_cast_result_Bool_Error_or_else_terminates_part2"
            "typed_cast_pq_cmp_assert_rte_function_pointer"
            "typed_cast_pq_swap__call_mem_swap_requires_2"
            "typed_cast_pq_push_result_call_mem_copy_requires_3"
            "typed_cast_pq_pop_raw_call_mem_copy_requires_3"
            "typed_cast_pq_remove_at_result_call_mem_copy_requires_3"
            "typed_cast_pq_peek_call_mem_copy_requires_3"
            )
            FAILURES=0
            PROVED_COUNT=$(printf '%s' "${PROVED_LINE}" | sed -E 's/^.*Proved goals: *//; s/[[:space:]]+$//')
            if [ "${PROVED_COUNT}" != "${EXPECTED_PROVED}" ]; then
              echo "FAIL: proved-goal summary ${PROVED_COUNT} != pinned ${EXPECTED_PROVED}."
              echo "      Reclassify in VERIFY-022, then ratchet this pin and the"
              echo "      PIN_NAMES list together in one acknowledged commit."
              FAILURES=$((FAILURES+1))
            fi
            if [ "${FAILED_COUNT}" -ne 0 ]; then
              echo "FAIL: ${FAILED_COUNT} Failed goal(s) -- a REAL finding, never pinnable."
              FAILURES=$((FAILURES+1))
            fi
            printf '%s\n' "${PIN_NAMES[@]}" | sort -u > /tmp/pq_pin_own.txt
            sort -u /tmp/mem_checks.txt /tmp/pq_pin_own.txt > /tmp/pq_pin_all.txt
            PIN_N=$(wc -l < /tmp/pq_pin_all.txt)
            comm -23 /tmp/pq_pin_all.txt /tmp/pq_resid.txt > /tmp/pq_missing.txt
            comm -13 /tmp/pq_pin_all.txt /tmp/pq_resid.txt > /tmp/pq_unpinned.txt
            echo "  --- Roll-call (set equality, ${PIN_N} pinned = 43 memory + 22 result + 6 own) ---"
            echo "    missing (pinned, now proved):    $(wc -l < /tmp/pq_missing.txt)"; sed 's/^/      /' /tmp/pq_missing.txt
            echo "    unpinned (new, unproved):        $(wc -l < /tmp/pq_unpinned.txt)"; sed 's/^/      /' /tmp/pq_unpinned.txt
            if [ "${PIN_N}" -ne "${EXPECTED_UNPROVED}" ]; then
              echo "FAIL: pin list has ${PIN_N} names, EXPECTED_UNPROVED is ${EXPECTED_UNPROVED} -- the job is inconsistent."
              FAILURES=$((FAILURES+1))
            fi
            if [ -s /tmp/pq_missing.txt ] || [ -s /tmp/pq_unpinned.txt ]; then
              echo "FAIL: residual set differs from the pin by name."
              echo "        missing  -> a pinned residual now proves: RATCHET."
              echo "        unpinned -> a NEW residual appeared: INVESTIGATE."
              echo "        both     -> a goal oscillates across runs; the pin"
              echo "                    is flaky and that is the finding."
              FAILURES=$((FAILURES+1))
            fi
            if [ "${FAILURES}" -eq 0 ]; then
              echo "PASS: priority_queue.h verified -- ${PROVED_COUNT} proved, ${EXPECTED_UNPROVED}"
              echo "      residuals all observed by name (VERIFY-022)."
            else
              echo "VERIFY-022 ENFORCED FAIL: ${FAILURES} check(s) above."
            fi
            echo "==============================================="
            if [ "${FAILURES}" -ne 0 ]; then exit 1; fi
          else
            echo "REPORT-ONLY: nothing pinned. Record this run against ARMs A-E"
            echo "      in VERIFY-022 before interpreting any of it. Do NOT"
            echo "      promote until name-stable across repeated runs."
            echo "==============================================="
          fi
      - name: Upload WP proof output (priority_queue.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-priority-queue
          path: wp_pq_output.txt
          retention-days: 90
  # -------------------------------------------------------------------------
  # 6. MC/DC coverage — GCC 14 -fcondition-coverage (Linux only)
  #
  #    -DCANON_CHECKED_FORCE_FALLBACK and -DCANON_BITS_FORCE_FALLBACK are
  #    passed so the fallback paths in checked.h and bits.h are exercised.
  #    Without these flags, GCC expands builtins to single instructions
  #    with no branches, the #else fallback blocks become dead code, and
  #    gcov reports 0% MC/DC on them. Forcing the fallback makes coverage
  #    measure the same code Frama-C is proving — the two tracks stay
  #    consistent.
  # -------------------------------------------------------------------------
  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC 14 and lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 lcov
      - name: Configure CMake with MC/DC coverage instrumentation
        # CANON_CHECKED_FORCE_FALLBACK: exercise the same fallback path WP
        #   verifies (otherwise GCC expands __builtin_*_overflow to single
        #   instructions with no branches for gcov to see).
        # CANON_BITS_FORCE_FALLBACK: same rationale for bits.h — forces the
        #   portable fallback paths for popcount, clz, ctz, and bswap
        #   instead of compiler builtins.
        # CANON_NO_REQUIRE: compiles CHECKED_ASSERT_RESULT(result) out to
        #   nothing. Without this, every function contains a runtime NULL
        #   assertion whose NULL branch is structurally unreachable (the
        #   ACSL `requires \valid(result)` clause proves it for every
        #   caller), yet gcov counts it as an uncovered branch. Defining
        #   CANON_NO_REQUIRE removes the assertion from the preprocessed
        #   source, keeping MC/DC measurement focused on real branches.
        #   The frama-c job passes the same flag for the same reason, so
        #   the WP and coverage evidence streams stay aligned.
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fcondition-coverage -DCANON_CHECKED_FORCE_FALLBACK -DCANON_BITS_FORCE_FALLBACK -DCANON_NO_REQUIRE" \
            -DENABLE_SANITIZERS=OFF \
            -DENABLE_COVERAGE_TUS=ON \
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build build
      - name: Run tests
        working-directory: build
        # contract_test is excluded here: the coverage build defines
        # CANON_NO_REQUIRE, which compiles require()/require_msg() into
        # ((void)0). contract_test's entire purpose is to verify that
        # those macros fire when preconditions are violated, so with
        # the macros disabled every assertion in the test fails by
        # design. contract_test still runs (and passes) in every other
        # CI job — build, valgrind, fuzzing — where CANON_NO_REQUIRE is
        # not defined. Excluding it here is honest about what the
        # coverage build measures: the fallback path of the Canon-C
        # library headers, not the assertion infrastructure itself.
        # Also excluded: the two test/integration/ guards. They are
        # COMPILE-TIME assertions — header_combination_test proves public
        # headers can be combined, const_correctness_test proves read-only
        # accessors reject mutable use (API-001). Neither adds behavioural
        # coverage, but both include many headers shallowly, and the MC/DC
        # aggregation below takes the MAX condition total per file across
        # translation units. A broad-but-shallow TU therefore DISPLACES a
        # narrow-but-thorough one as the max and lowers the reported
        # percentage for files nobody changed. Excluding them keeps the
        # report measuring behavioural coverage. They still run in every
        # other job, where their failure modes (compile errors) surface.
        run: ctest --build-config Debug --output-on-failure --exclude-regex '^(contract_test|header_combination_test|const_correctness_test)$'
      - name: Run MC/DC cover TUs (Shape-B modules)
        working-directory: build
        # Cover TUs are not ctests — run them directly so their .gcda is
        # written. They exit 0; they exist to emit coverage, not to assert.
        run: |
          ./option_cover
          ./result_cover
          ./vec_cover
          ./deque_cover
          ./deque_cover
      
      - name: Collect branch coverage data (lcov)
        run: |
          lcov --capture \
            --directory build \
            --output-file coverage_raw.info \
            --rc branch_coverage=1 \
            --ignore-errors unused \
            --gcov-tool gcov-14
          lcov --remove coverage_raw.info \
            '/usr/*' \
            '*/test/*' \
            --output-file coverage.info \
            --rc branch_coverage=1 \
            --ignore-errors unused
      - name: Collect MC/DC condition coverage (gcov-14 --conditions)
        run: |
          cd build
          for gcda in $(find . -name "*.gcda" | sort); do
            gcov-14 --conditions "$gcda" 2>/dev/null
          done > gcov_output.txt 2>&1
          awk '
            /^File / {
              current = $0
              sub(/^File /, "", current)
              gsub(/'\''/, "", current)
              have_file = 1
              next
            }
            /^Condition outcomes covered:/ {
              if (have_file) {
                print current "\t" $0
                have_file = 0
              }
            }
          ' gcov_output.txt | \
            grep -v "/test/" | \
            sed "s|${{ github.workspace }}/||" | \
            tee mcdc_per_file.txt
          python3 << 'PYEOF'
          import re
          best = {}
          with open("mcdc_per_file.txt") as f:
              for line in f:
                  parts = line.strip().split("\t")
                  if len(parts) < 2:
                      continue
                  filename = parts[0].strip()
                  m = re.search(r"([\d.]+)% of (\d+)", parts[1])
                  if not m:
                      continue
                  pct = float(m.group(1))
                  total = int(m.group(2))
                  hit = int(total * pct / 100 + 0.5)
                  if filename not in best:
                      best[filename] = (pct, hit, total)
                  else:
                      cur_pct, cur_hit, cur_total = best[filename]
                      if total > cur_total or (total == cur_total and pct > cur_pct):
                          best[filename] = (pct, hit, total)
          results = [(v[0], v[1], v[2], v[2]-v[1], k) for k, v in best.items()]
          results.sort()
          total_hit = sum(r[1] for r in results)
          total_all = sum(r[2] for r in results)
          overall = 100.0 * total_hit / total_all if total_all else 0
          print()
          print("=" * 85)
          print("  Canon-C MC/DC Condition Coverage (GCC 14 -fcondition-coverage)")
          print("=" * 85)
          print(f"  {'File':<50} {'MC/DC%':>8} {'Hit':>5} {'Total':>6} {'Missed':>7}")
          print("-" * 85)
          for pct, hit, total, missed, f in results:
              print(f"  {f:<50} {pct:>7.1f}% {hit:>5} {total:>6} {missed:>7}")
          print("-" * 85)
          print(f"  {'TOTAL':<50} {overall:>7.1f}% {total_hit:>5} {total_all:>6} {total_all-total_hit:>7}")
          print("=" * 85)
          with open("mcdc_summary.txt", "w") as out:
              out.write(f"{overall:.1f}\n")
              out.write(f"{total_hit}\n")
              out.write(f"{total_all}\n")
          PYEOF
      - name: "Debug: per-line MC/DC detail for checked.h"
        run: |
          cd build
          CHECKED_GCDA=$(find . -name "checked_test*.gcda" | head -1)
          if [ -z "$CHECKED_GCDA" ]; then
            echo "ERROR: could not locate checked_test gcda file"
            find . -name "*.gcda" | head -20
            exit 1
          fi
          echo "Running gcov on: $CHECKED_GCDA"
          gcov-14 --conditions --all-blocks "$CHECKED_GCDA" 2>&1 | \
            grep -A 200 "checked.h" | head -500
          echo ""
          echo "=== Looking for the generated .gcov file for checked.h ==="
          find . -name "checked.h.gcov" -exec echo "Found: {}" \;
          CHECKED_GCOV=$(find . -name "checked.h.gcov" | head -1)
          if [ -n "$CHECKED_GCOV" ]; then
            echo ""
            echo "=== Full contents of $CHECKED_GCOV ==="
            cat "$CHECKED_GCOV"
          else
            echo "No checked.h.gcov file generated — trying alternative approach"
            for d in $(find . -type d -name "*.dir"); do
              ls "$d"/*checked* 2>/dev/null || true
            done
          fi
      - name: "Debug: per-line MC/DC detail for ptr.h"
        # Identifies which specific conditions in ptr.h are uncovered.
        # As of CI #788, ptr.h reached 100% MC/DC (42/42). This debug
        # step remains in place to catch future regressions — if a new
        # function is added without corresponding tests, the output
        # will show which conditions drop below 100%.
        run: |
          cd build
          PTR_GCDA=$(find . -name "ptr_test*.gcda" | head -1)
          if [ -z "$PTR_GCDA" ]; then
            echo "ERROR: could not locate ptr_test gcda file"
            find . -name "*.gcda" | head -20
            exit 1
          fi
          echo "Running gcov on: $PTR_GCDA"
          gcov-14 --conditions --all-blocks "$PTR_GCDA" 2>&1 | \
            grep -A 200 "ptr.h" | head -500
          echo ""
          echo "=== Looking for the generated .gcov file for ptr.h ==="
          find . -name "ptr.h.gcov" -exec echo "Found: {}" \;
          PTR_GCOV=$(find . -name "ptr.h.gcov" | head -1)
          if [ -n "$PTR_GCOV" ]; then
            echo ""
            echo "=== Full contents of $PTR_GCOV ==="
            cat "$PTR_GCOV"
          else
            echo "No ptr.h.gcov file generated — trying alternative approach"
            for d in $(find . -type d -name "*.dir"); do
              ls "$d"/*ptr* 2>/dev/null || true
            done
          fi
      - name: "Debug: per-line MC/DC detail for slice.h"
        # Identifies which specific conditions in slice.h are uncovered.
        # As of CI #816, slice.h reached its achievable MC/DC ceiling at
        # 93.1% (54/58, 4 missed). The 4 remaining outcomes are documented
        # in docs/deviations.md as MCDC-002 — they are the `!ptr` left-side
        # of OR in bytes_slice (line 117), bytes_skip (line 130),
        # str_slice (line 194), and str_skip (line 207). All four are
        # API-unreachable in MC/DC isolation.
        #
        # This step remains in place as a regression detector — if a
        # new function is added without corresponding tests, or if any
        # of the previously-closed reachable gaps regress, the output
        # will show which conditions drop below the documented ceiling.
        #
        # When VERIFY-007 confirms WP discharges the four MCDC-002
        # branches as unreachable, MCDC-002 transitions from "API-
        # unreachable" to "WP-discharged unreachable" — but the gcov
        # measurement remains at 93.1% because gcov instruments the
        # source, not the proof. The two evidence streams complement
        # each other rather than converge.
        run: |
          cd build
          SLICE_GCDA=$(find . -name "slice_test*.gcda" | head -1)
          if [ -z "$SLICE_GCDA" ]; then
            echo "ERROR: could not locate slice_test gcda file"
            find . -name "*.gcda" | head -20
            exit 1
          fi
          echo "Running gcov on: $SLICE_GCDA"
          gcov-14 --conditions --all-blocks "$SLICE_GCDA" 2>&1 | \
            grep -A 200 "slice.h" | head -500
          echo ""
          echo "=== Looking for the generated .gcov file for slice.h ==="
          find . -name "slice.h.gcov" -exec echo "Found: {}" \;
          SLICE_GCOV=$(find . -name "slice.h.gcov" | head -1)
          if [ -n "$SLICE_GCOV" ]; then
            echo ""
            echo "=== Full contents of $SLICE_GCOV ==="
            cat "$SLICE_GCOV"
          else
            echo "No slice.h.gcov file generated — trying alternative approach"
            for d in $(find . -type d -name "*.dir"); do
              ls "$d"/*slice* 2>/dev/null || true
            done
          fi
      - name: "Debug: per-line MC/DC detail for memory.h"
        # Identifies which specific conditions in memory.h are uncovered.
        # As of CI #831, memory.h reached 88.3% MC/DC (113/128, 15 missed).
        # The 15 remaining outcomes split into three rough categories
        # (estimated, to be confirmed by reading this debug output and
