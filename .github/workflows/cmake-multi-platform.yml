              note_fail "FAIL: proved count ${PROVED_COUNT} != pinned ${EXPECTED_PROVED}."
              echo "      This may indicate added or removed functions, a new"
              echo "      timeout, or a newly-proved goal. Review the output and"
              echo "      update VERIFY-017 in docs/deviations.md before updating"
              echo "      this wrapper."
            fi
            echo ""
            echo "  --- All unproved goals (name-stability record) ---"
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\]" wp_diag_output.txt || \
              echo "  (none)"
            echo ""
            echo "  --- Inherited roll-call: 2 expected re-emissions ---"
            # contract.h handler pair — VERIFY-006 cat 4, definition-presence
            # only (CANON_NO_REQUIRE compiles out every handler call site);
            # typed_cast_ prefix per this TU's model (VERIFY-016 precedent).
            INHERITED=(
              "typed_cast_contract_default_handler_terminates"
              "typed_cast_contract_default_handler_loop_invariant_established"
            )
            INHERITED_SEEN=0
            for goal in "${INHERITED[@]}"; do
