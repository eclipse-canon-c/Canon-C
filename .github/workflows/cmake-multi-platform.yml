  # -------------------------------------------------------------------------
  # data/deque via vmacros/vdrivers/deque_verify.h — REPORT-ONLY (VERIFY-019)
  #
  # Fourth Shape-B macro-module driver, second data/-layer module. THE ONLY
  # NON-ENFORCED WP JOB IN THIS WORKFLOW, deliberately, until the three-run
  # pinning discipline completes: run 1 establishes the surface, run 2 must
  # reproduce it name-identically, run 3 becomes the baseline and only then
  # does ENFORCE flip to 1. Do not pin from a single run — vec's run 1 (362
  # unproved) and run 3 (196) differ by more than half again, and the point
  # of the discipline is that the first number is not the answer.
  #
  # MODEL: Typed, NOT vec's Typed+Cast. This is deliberate and must not be
  # "harmonised" with the vec job for consistency's sake. deque's own impl
  # contains zero casts and its include closure is types/limits/contract/
  # ownership + error + option + result — no memory.h, ptr.h, slice.h,
  # arena.h or checked.h, i.e. none of the cast-originating headers. Two
  # things ride on it:
  #   1. The option arm should re-emit with NO prefix transform (vec needed
  #      typed_ -> typed_cast_ to diff its option edge).
  #   2. It makes this run the separating experiment for VERIFY-018 F4 — the
  #      get_ok/get_err rte_mem_access pair on the fresh result(Bool, Error)
  #      instance, the only two goals in the dataset with no pinned class.
  #      vec ran that same instance under Typed+Cast.
  #
  # PRE-REGISTERED PREDICTIONS (deque_verify.h banner, ARMs A-D). Counts are
  # derived from the frozen roll-calls in this same file, not estimated:
  #   ARM C  contract handler pair ....................  2
  #   ARM A  option_int_*, INHERITANCE .................  32
  #          (option's job pins 34 = these 32 + the shared handler pair;
  #           the pair is counted once here, under ARM C)
  #   ARM B  result_Bool_Error_*, FRESH INSTANTIATION ..  30
  #          result's home unit residual is 30 = 2 handler + 28 own. vec's
  #          instance showed 22 = 20 profile-matching + 2 get_* − the 8
  #          home `assigns` goals its lighter contracts never emitted. THIS
  #          driver attaches the FULL home contract set (the instantiation-
  #          identity rule's first option, where vec took the second), so
  #          those 8 SHOULD come back: 20 + 8 + 2 = 30. Their absence means
  #          the retyping dropped a clause.
  #   ARM D  deque_int_* own residuals .................  0
  #          No allocation (vec's class (e)), no mem_copy/mem_move (class
  #          (d) — deque moves single elements by assignment), no
  #          fn-pointer parameters (class (f)/OWN-003), no Typed+Cast
  #          bridging (class (h)), and NO LOOPS AT ALL, so class (g) has
  #          nothing to attach to. The roadmap forward-flagged "deque's
  #          shift loops" into (g); a ring shifts nothing and deque_impl.h
  #          contains exactly one `while`, the do/while(0) contract idiom.
  #          That pre-classification is withdrawn.
  #   core substrate arm ..............................  0
  #          vec inherited 89 byte-identically from arena.h. deque's
  #          closure excludes every header those goals come from. This is
  #          the first module whose inherited surface is SMALLER than its
  #          predecessor's — composability tested in the other direction.
  #   ----------------------------------------------------------------
  #   TOTAL PREDICTED UNPROVED ........................  64
  #
  # RUNTIME: expect well under the vec job's ~2h50m. vec's wall clock was
  # timeout-dominated (193 x 120s), mostly the 89-goal core arm plus 24
  # fill-loop goals, neither of which exists here. timeout-minutes is 240
  # anyway for the first runs — measure before tightening. If this job
  # approaches vec's, ARM D is wrong somewhere and runtime is the first
  # symptom.
  # -------------------------------------------------------------------------
  frama-c-deque:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: vmacros/vdrivers/deque_verify.h (VERIFY-019, report-only)"
        run: |
          eval $(opam env --switch=frama-c)
          # ---- PROMOTED TO ENFORCED at CI #1237 (VERIFY-019) ----
          # Three-run discipline satisfied:
          #   #1231  run 0 — pre-fix measurement, 71 unproved. SUPERSEDED: its
          #          value was the ARM A-D scorecard, not the counts. Four of
          #          its nine own residuals were a missing default `assigns`
          #          on the pop_*/peek_* callees — a drafting error, fixed the
          #          vec_int_pop way — so the driver changed and the clock reset.
          #   #1234  run 1 — 1601/1668, 67 unproved. Surface established.
          #   #1237  run 2 — 1601/1668, 67 unproved, SET-IDENTICAL to #1234.
          # Between #1234 and #1237 the driver took COMMENT-ONLY edits. The
          # evidence that they were semantically inert is in the numbers, not
          # in the intent: goals scheduled (1583), goals total (1668), goals
          # proved (1601) and all 67 residual names unchanged; only the line
          # references in WP's warnings moved (526 -> 533, the added comments).
          ENFORCE=1
          EXPECTED_UNPROVED=67
          EXPECTED_PROVED="1601 / 1668"
          # Pre-registered arm counts (see banner). Printed against observed
          # in every run; they do not gate until ENFORCE=1.
          PREDICT_HANDLER=2
          PREDICT_OPTION=32
          # 28, NOT 30. The pre-run-1 arithmetic was 20 (family profile) + 8
          # (home assigns clauses this driver attaches and vec's reduced
          # surface omitted) + 2 (the F4 get_ok/get_err pair) = 30. Runs
          # #1231 and #1234 both observed the F4 pair ABSENT under Typed, so
          # the arm is 20 + 8 = 28. This value was left stale at 30 for
          # #1234 while PREDICT_TOTAL was correctly updated to 67 — two
          # equal and opposite errors, so TOTAL read 67/67 by cancellation
          # rather than by being right. Corrected here, and the self-check
          # below now makes that class of drift impossible to repeat.
          # If the Typed+Cast control brings the pair back, ARM B under
          # THAT model is 30 and this line does not change.
          PREDICT_RESULT=28
          # RUN-2 VALUES. Run 1 (CI #1231) observed ARM D = 9 against a
          # predicted 0. Four of the nine were a missing default `assigns`
          # on the pop_*/peek_* callees (my drafting error, now fixed the
          # vec_int_pop way); five are the swap ensures cluster, which vec
          # pins too and which deque shows is not cast-model-specific.
          # So: 5 expected, all swap, and the four wrapper goals must NOT
          # return — if they do, the framing problem is deeper than a
          # missing clause and the fix was wrong.
          PREDICT_OWN=5
          PREDICT_TOTAL=67
          # Self-check: the arms partition the residual set, so their
          # predictions must sum to the total prediction. #1234 shipped with
          # a sum of 69 against a total of 67 and nobody noticed, because the
          # observed total matched anyway. An internally inconsistent
          # prediction cannot be confirmed OR refuted by a run — it is not a
          # prediction. This fires before WP is even invoked.
          PREDICT_SUM=$((PREDICT_HANDLER + PREDICT_OPTION + PREDICT_RESULT + PREDICT_OWN))
          if [ "${PREDICT_SUM}" -ne "${PREDICT_TOTAL}" ]; then
            echo "FAIL: prediction bookkeeping is inconsistent —"
            echo "      arms sum to ${PREDICT_SUM} but PREDICT_TOTAL is ${PREDICT_TOTAL}."
            echo "      Reconcile before reading anything below as evidence."
            exit 1
          fi
          FAILURES=0
          note_fail() {
            echo "$1"
            FAILURES=$((FAILURES + 1))
          }
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I data \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            vmacros/vdrivers/deque_verify.h 2>&1 | tee wp_deque_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (deque_verify.h) exit status: ${WP_EXIT}"
          if [ "${ENFORCE}" -eq 1 ]; then
            echo "  MODE: ENFORCED"
          else
            echo "  MODE: report-only (ENFORCE=${ENFORCE}) — nothing is pinned."
            echo "        Transcribe the scorecard, re-run unchanged, then pin."
          fi
          echo "  model=Typed provers=alt-ergo,z3,cvc5 timeout=120 split=on"
          echo "  config=-DCANON_NO_REQUIRE -DNDEBUG (CANON_LIFETIME off)"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_deque_output.txt || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            note_fail "FAIL: WP did not produce a verification summary."
            echo "      frama-c aborted before running WP, likely due to an"
            echo "      ACSL syntax error in deque_verify.h or an include"
            echo "      resolution failure. Check the WP output above for"
            echo "      [kernel:annot-error] or [kernel] User Error messages."
            echo ""
            echo "First diagnostic lines from WP output:"
            grep -E "^\[(kernel|wp)" wp_deque_output.txt | head -20 || true
          else
            TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_deque_output.txt || true)
            UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_deque_output.txt || true)
            FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_deque_output.txt || true)
            INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_deque_output.txt || true)
            STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_deque_output.txt || true)
            UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
            echo "  Timeouts: ${TIMEOUT_COUNT}"
            echo "  Unknown:  ${UNKNOWN_COUNT}"
            echo "  Failed:   ${FAILED_COUNT}"
            echo "  Total unproved (T+U): ${UNPROVED_COUNT} (predicted ${PREDICT_TOTAL})"
            # Failed / Invalid / Stepout are NOT residual verdicts and are
            # gated even in report-only: a Failed goal means a contract in
            # deque_verify.h is falsified, which is a drafting bug to fix,
            # not a number to write down. House rule, gate 1.
            if [ "${FAILED_COUNT}" -ne 0 ]; then
              note_fail "FAIL: ${FAILED_COUNT} goal(s) FAILED — a contract in deque_verify.h is falsified:"
              grep -E "^\[wp\] \[Failed\]" wp_deque_output.txt || true
            fi
            if [ "${INVALID_COUNT}" -ne 0 ]; then
              note_fail "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is FALSIFIED with a counter-example. Invalid is WP's refutation verdict; Failed is a prover error. Neither can ever be pinned:"
              grep -E "^\\[wp\\] \\[Invalid\\]" wp_deque_output.txt || true
            fi
            if [ "${STEPOUT_COUNT}" -ne 0 ]; then
              note_fail "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit — a verdict this project has never observed. It is deliberately NOT pooled into the residual count (residual = Timeout u Unknown); decide whether to pool it and update the definition before pinning anything:"
              grep -E "^\\[wp\\] \\[Stepout\\]" wp_deque_output.txt || true
            fi
            if [ -n "${EXPECTED_UNPROVED}" ] && \
               [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
              note_fail "FAIL: unproved count ${UNPROVED_COUNT} != pinned ${EXPECTED_UNPROVED}."
            fi
            PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
            echo "  Proved: ${PROVED_COUNT}"
            if [ -n "${EXPECTED_PROVED}" ] && \
               [ "${PROVED_COUNT}" != "${EXPECTED_PROVED}" ]; then
              note_fail "FAIL: proved count ${PROVED_COUNT} != pinned ${EXPECTED_PROVED}."
            fi
            echo ""
            echo "  --- All unproved goals (name-stability record) ---"
            echo "  This list IS the run-1 deliverable. Run 2 must reproduce"
            echo "  it name-identically before run 3 pins anything."
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\]" wp_deque_output.txt || \
              echo "  (none)"

            # ── ARM C: contract handler pair ──────────────────────────────
            # Definition-presence inheritance only: deque has ZERO direct
            # CANON_INVOKE_HANDLER_ calls (the clean-audit shape, like vec
            # and result), so no deque function reaches the handler. The
            # goals appear because the handler is DEFINED in the TU.
            echo ""
            echo "  --- ARM C: contract handler ---"
            HANDLER_SEEN=$(grep -cE "\[(Timeout|Unknown)\].*contract_default_handler" wp_deque_output.txt || true)
            echo "  observed ${HANDLER_SEEN} / predicted ${PREDICT_HANDLER}"

            # ── ARM A: option arm, INHERITANCE ────────────────────────────
            echo ""
            echo "  --- ARM A: option arm (INHERITANCE) ---"
            OPTION_SEEN=$(grep -cE "\[(Timeout|Unknown)\].*typed_option_int_" wp_deque_output.txt || true)
            OPTION_CAST=$(grep -cE "\[(Timeout|Unknown)\].*typed_cast_option_int_" wp_deque_output.txt || true)
            echo "  typed_option_int_*      observed ${OPTION_SEEN} / predicted ${PREDICT_OPTION}"
            echo "  typed_cast_option_int_* observed ${OPTION_CAST} / predicted 0"
            if [ "${OPTION_CAST}" -ne 0 ]; then
              note_fail "FAIL: Typed+Cast-prefixed option goals under -wp-model Typed — this job's model claim is wrong, and the F4 experiment below is void."
            fi

            # ── ARM B: result(Bool, Error) arm, FRESH INSTANTIATION ───────
            echo ""
            echo "  --- ARM B: result(Bool, Error) arm (FRESH) ---"
            RESULT_SEEN=$(grep -cE "\[(Timeout|Unknown)\].*result_Bool_Error_" wp_deque_output.txt || true)
            RESULT_ASSIGNS=$(grep -cE "\[(Timeout|Unknown)\].*result_Bool_Error_.*assigns" wp_deque_output.txt || true)
            echo "  result_Bool_Error_*  observed ${RESULT_SEEN} / predicted ${PREDICT_RESULT}"
            echo "  of which assigns:    observed ${RESULT_ASSIGNS} / predicted 8"
            echo "  vec's reduced surface emitted ZERO assigns goals here. This"
            echo "  driver attaches result's full home contract set, so 8 is the"
            echo "  PREDICTED outcome, not a regression. Zero would mean the"
            echo "  int->bool / VErr->Error retyping dropped a clause."

            # ── VERIFY-018 F4 separating experiment ───────────────────────
            echo ""
            echo "  --- F4 separating experiment (Typed vs vec's Typed+Cast) ---"
            F4_OK=$(grep -cE "\[(Timeout|Unknown)\].*result_Bool_Error_get_ok_assert_rte_mem_access" wp_deque_output.txt || true)
            F4_ERR=$(grep -cE "\[(Timeout|Unknown)\].*result_Bool_Error_get_err_assert_rte_mem_access" wp_deque_output.txt || true)
            F4_TOTAL=$((F4_OK + F4_ERR))
            echo "  get_ok  rte_mem_access unproved: ${F4_OK}"
            echo "  get_err rte_mem_access unproved: ${F4_ERR}"
            echo "  F4 is CLOSED (2026-08-15) as a CONTRACT-SURFACE effect."
            echo "  History, kept because the mistake is the useful part: run 1"
            echo "  (CI #1231) printed 'model-emission effect' from an"
            echo "  experiment with TWO variables moved, not one — vec runs"
            echo "  Typed+Cast with a REDUCED result contract surface, this"
            echo "  driver runs Typed with the FULL home set, which adds"
            echo "  'requires \\valid(out)' to get_ok/get_err. The control"
            echo "  (.github/workflows/f4-control.yml, manual) held the"
            echo "  contracts fixed and moved only the model: the pair is"
            echo "  ABSENT under Typed+Cast too, twice, with the positive"
            echo "  control established (67 cast-prefixed / 0 plain). The"
            echo "  model is eliminated; the added requires is what discharges"
            echo "  the union read. See VERIFY-018 F4 and VERIFY-019-M."
            echo "  The lines below therefore remain an OBSERVATION of this"
            echo "  configuration, not a re-derivation of that conclusion."
            if [ "${F4_TOTAL}" -eq 2 ]; then
              echo "  F4 OBSERVATION: pair PRESENT under Typed."
              echo "    => consistent with a type/contract-surface effect."
            elif [ "${F4_TOTAL}" -eq 0 ]; then
              echo "  F4 OBSERVATION: pair ABSENT under Typed."
              echo "    => consistent with EITHER a Typed+Cast model effect OR"
              echo "       the added requires discharging the union read."
            else
              echo "  F4 OBSERVATION: SPLIT (${F4_TOTAL}/2) — one of the pair only."
              echo "    => neither hypothesis as stated. Do NOT close F4;"
              echo "       investigate which of the two differs and why."
            fi
            echo "  Do not re-derive F4 from this job — it cannot: this job"
            echo "  runs one model. If this pair ever REAPPEARS here, that is"
            echo "  a finding against VERIFY-018 F4's closure, not a routine"
            echo "  residual: re-run the Typed+Cast control before touching"
            echo "  anything."

            # ── ARM D: deque's own surface, predicted ZERO ────────────────
            echo ""
            echo "  --- ARM D: deque's own residuals ---"
            OWN_SEEN=$(grep -cE "\[(Timeout|Unknown)\].*deque_int_" wp_deque_output.txt || true)
            echo "  deque_int_*  observed ${OWN_SEEN} / predicted ${PREDICT_OWN}"
            WRAPPER_SEEN=$(grep -cE "\[(Timeout|Unknown)\].*deque_int_(pop|peek)_(front|back)_option" wp_deque_output.txt || true)
            SWAP_SEEN=$(grep -cE "\[(Timeout|Unknown)\].*deque_int_swap_" wp_deque_output.txt || true)
            OTHER_OWN=$((OWN_SEEN - WRAPPER_SEEN - SWAP_SEEN))
            echo "    of which swap cluster:    ${SWAP_SEEN} (expected 5)"
            echo "    of which *_option frame:  ${WRAPPER_SEEN} (expected 0 after the run-1 fix)"
            echo "    of which anything else:   ${OTHER_OWN} (expected 0)"
            if [ "${WRAPPER_SEEN}" -ne 0 ]; then
              echo "  The four *_option assigns goals RETURNED. The run-1 fix"
              echo "  (default assigns on the pop_*/peek_* callees, vec_int_pop"
              echo "  shape) is therefore NOT the explanation, and the framing"
              echo "  problem is deeper than a missing clause. Do not re-fix by"
              echo "  guessing — classify in VERIFY-019 first:"
              grep -E "\[(Timeout|Unknown)\].*deque_int_(pop|peek)_(front|back)_option" wp_deque_output.txt || true
            fi
            if [ "${OTHER_OWN}" -ne 0 ]; then
              echo "  Own residuals outside BOTH known clusters — this is the"
              echo "  genuinely new one. Candidate (ii), the modular division"
              echo "  goals, did NOT fire in run 1, so its appearance now would"
              echo "  mean the size <= capacity threading has been weakened:"
              grep -E "\[(Timeout|Unknown)\].*deque_int_" wp_deque_output.txt \
                | grep -vE "deque_int_swap_|deque_int_(pop|peek)_(front|back)_option" || true
            fi
            if [ "${OWN_SEEN}" -ne "${PREDICT_OWN}" ]; then
              echo "  ARM D count differs from the revised prediction. This is a"
              echo "  prediction miss to CLASSIFY in VERIFY-019, not a build"
              echo "  failure — report-only mode is exactly for this."
            else
              echo "  ARM D matches the revised prediction: the swap cluster"
              echo "  only, which vec pins too (typed_cast_vec_int_swap_ensures)"
              echo "  and which deque shows is not cast-model-specific."
            fi
            # Loop goals should not exist at all: deque has no loops. Their
            # appearance means a body is not what the source reads as, and
            # would also refute the cover TU's Shape-B attribution.
            LOOP_GOALS=$(grep -cE "\[(Timeout|Unknown)\].*deque_int_.*loop" wp_deque_output.txt || true)
            if [ "${LOOP_GOALS}" -ne 0 ]; then
              note_fail "FAIL: ${LOOP_GOALS} loop goal(s) on deque functions — deque_impl.h contains no loops. Something is not what it appears:"
              grep -E "\[(Timeout|Unknown)\].*deque_int_.*loop" wp_deque_output.txt || true
            fi

            # ── Gate 3: by-name roll-call ─────────────────────────────────
            # With gate 2's exact count and unique names this IS set equality:
            # a swap — one goal regressing while another improves, count
            # unchanged — fails here. Matching is ANCHORED with a trailing
            # ( |$) because one name is a proper prefix of another
            # (..._eq_assert_rte_function_pointer vs ..._2); an unanchored
            # grep would let the shorter be satisfied by the longer.
            CHECKS=(
              # ARM C — contract.h handler pair. Definition-presence only: deque
              #         has zero direct CANON_INVOKE_HANDLER_ calls.
              "typed_contract_default_handler_terminates"
              "typed_contract_default_handler_loop_invariant_established"
              # ARM A — option arm, INHERITANCE. These 32 are option's own roll-call
              #         MINUS the 2 handler goals it counts inside its 34. No
              #         typed_cast_ prefix: same Typed model as option's home unit.
              "typed_option_int_map_terminates_part2"
              "typed_option_int_map_terminates_part3"
              "typed_option_int_map_exits_part1"
              "typed_option_int_map_assert_rte_function_pointer"
              "typed_option_int_map_assigns_exit_part2"
              "typed_option_int_map_assigns_normal_part2"
              "typed_option_int_and_then_terminates_part2"
              "typed_option_int_and_then_terminates_part3"
              "typed_option_int_and_then_exits_part1"
              "typed_option_int_and_then_assert_rte_function_pointer"
              "typed_option_int_and_then_assigns_exit_part2"
              "typed_option_int_and_then_assigns_normal_part2"
              "typed_option_int_or_else_terminates_part1"
              "typed_option_int_or_else_terminates_part2"
              "typed_option_int_or_else_assert_rte_function_pointer"
              "typed_option_int_or_else_assigns_part2"
              "typed_option_int_filter_terminates_part2"
              "typed_option_int_filter_terminates_part3"
              "typed_option_int_filter_exits_part1"
              "typed_option_int_filter_assert_rte_function_pointer"
              "typed_option_int_filter_assigns_exit_part2"
              "typed_option_int_filter_assigns_normal_part2"
              "typed_option_int_combine_with_terminates_part2"
              "typed_option_int_combine_with_terminates_part3"
              "typed_option_int_combine_with_exits_part1"
              "typed_option_int_combine_with_assert_rte_function_pointer"
              "typed_option_int_combine_with_assigns_exit_part2"
              "typed_option_int_combine_with_assigns_normal_part2"
              "typed_option_int_eq_terminates_part2"
              "typed_option_int_eq_terminates_part4"
              "typed_option_int_eq_assert_rte_function_pointer_part2"
              "typed_option_int_eq_assigns_part5"
              # ARM B — result(Bool, Error), FRESH INSTANTIATION, full home contract
              #         set: 20 family-profile + 8 assigns that vec's reduced
              #         surface never emitted. The get_ok/get_err pair
              #         (VERIFY-018 F4) is ABSENT under this configuration — see
              #         the F4 note above; do not add it here on the strength of
              #         vec's roll-call.
              "typed_result_Bool_Error_map_terminates_part2"
              "typed_result_Bool_Error_map_terminates_part3"
              "typed_result_Bool_Error_map_exits"
              "typed_result_Bool_Error_map_assert_rte_function_pointer"
              "typed_result_Bool_Error_map_assigns_exit_part2"
              "typed_result_Bool_Error_map_assigns_normal_part2"
              "typed_result_Bool_Error_map_err_terminates_part2"
              "typed_result_Bool_Error_map_err_terminates_part3"
              "typed_result_Bool_Error_map_err_exits"
              "typed_result_Bool_Error_map_err_assert_rte_function_pointer"
              "typed_result_Bool_Error_map_err_assigns_exit_part2"
              "typed_result_Bool_Error_map_err_assigns_normal_part3"
              "typed_result_Bool_Error_and_then_terminates_part1"
              "typed_result_Bool_Error_and_then_terminates_part2"
              "typed_result_Bool_Error_and_then_assert_rte_function_pointer"
              "typed_result_Bool_Error_and_then_assigns_part1"
              "typed_result_Bool_Error_or_else_terminates_part1"
              "typed_result_Bool_Error_or_else_terminates_part2"
              "typed_result_Bool_Error_or_else_assert_rte_function_pointer"
              "typed_result_Bool_Error_or_else_assigns_part2"
              "typed_result_Bool_Error_eq_terminates_part1"
              "typed_result_Bool_Error_eq_terminates_part2"
              "typed_result_Bool_Error_eq_terminates_part3"
              "typed_result_Bool_Error_eq_terminates_part4"
              "typed_result_Bool_Error_eq_assert_rte_function_pointer"
              "typed_result_Bool_Error_eq_assert_rte_function_pointer_2"
              "typed_result_Bool_Error_eq_assigns_part2"
              "typed_result_Bool_Error_eq_assigns_part4"
              # ARM D — deque's own: the swap cluster ONLY. vec pins the same class as
              #         typed_cast_vec_int_swap_ensures; deque reproduces it under
              #         plain Typed, widening that classification beyond the cast
              #         model. ensures 1-5 (a receives b) prove; 6-10 (b receives
              #         \old(a) via the local temporary) do not — the obstacle is
              #         tmp preservation across the second struct write.
              "typed_deque_int_swap_ensures_6"
              "typed_deque_int_swap_ensures_7"
              "typed_deque_int_swap_ensures_8"
              "typed_deque_int_swap_ensures_9"
              "typed_deque_int_swap_ensures_10"
            )
            MISSING=0
            for goal in "${CHECKS[@]}"; do
              if ! grep -qE "^\[wp\] \[(Timeout|Unknown)\] ${goal}( |$)" wp_deque_output.txt; then
                echo "  MISSING from unproved set (newly proved or renamed): ${goal}"
                MISSING=$((MISSING + 1))
              fi
            done
            if [ "${MISSING}" -ne 0 ]; then
              note_fail "FAIL: ${MISSING} CHECKS goal(s) absent while the count still matched — a swap occurred. Diff the roll-call above against CHECKS and reclassify in VERIFY-019 before ratcheting."
            else
              echo "  Roll-call: all ${EXPECTED_UNPROVED} classified residuals present by name."
            fi

            # ── Accounting ────────────────────────────────────────────────
            # The four arms are disjoint by construction: the goal-name
            # prefixes cannot overlap (typed_option_int_ is not a substring
            # of typed_cast_option_int_, etc), so the sum is a partition,
            # not an over-count.
            echo ""
            echo "  --- Accounting ---"
            ACCOUNTED=$((HANDLER_SEEN + OPTION_SEEN + RESULT_SEEN + OWN_SEEN))
            printf '  %-22s %4s %4s\n' "arm" "obs" "pred"
            printf '  %-22s %4d %4d\n' "ARM C handler"  "${HANDLER_SEEN}" "${PREDICT_HANDLER}"
            printf '  %-22s %4d %4d\n' "ARM A option"   "${OPTION_SEEN}"  "${PREDICT_OPTION}"
            printf '  %-22s %4d %4d\n' "ARM B result"   "${RESULT_SEEN}"  "${PREDICT_RESULT}"
            printf '  %-22s %4d %4d\n' "ARM D own"      "${OWN_SEEN}"     "${PREDICT_OWN}"
            printf '  %-22s %4d %4d\n' "TOTAL"          "${UNPROVED_COUNT}" "${PREDICT_TOTAL}"
            echo "  accounted:   ${ACCOUNTED} of ${UNPROVED_COUNT}"
            echo "  UNACCOUNTED: $((UNPROVED_COUNT - ACCOUNTED)) (predicted 0)"
            if [ "$((UNPROVED_COUNT - ACCOUNTED))" -ne 0 ]; then
              echo "  Unaccounted goals are a residual class nobody predicted."
              echo "  Name them in VERIFY-019 BEFORE run 2 — the point of the"
              echo "  second run is to test a written-down prediction, and a"
              echo "  prediction written after seeing run 2 tests nothing."
              echo "  Candidates most likely hiding here: a core-substrate"
              echo "  goal (would refute the closure claim outright) or an"
              echo "  option/result goal under an unexpected prefix."
            fi

            # Prover-environment note. House wording, per the ptr/slice/
            # memory/arena/pool/region jobs: a zero here is NOT evidence of
            # a degraded prover set. WP tries provers in sequence, so a TU
            # whose goals Alt-Ergo or Z3 close (or which time out) never
            # mentions cvc5 at all. Prover AVAILABILITY is hard-gated in
            # .github/actions/framac-setup, which is what actually matters.
            CVC5_INVOKED=$(grep -cE "CVC5|cvc5" wp_deque_output.txt || true)
            echo ""
            echo "  CVC5 mentions in WP output: ${CVC5_INVOKED}"
          fi
          echo ""
          echo "==============================================="
          if [ "${FAILURES}" -eq 0 ] && [ "${ENFORCE}" -eq 1 ]; then
            echo "VERIFY-019 ENFORCED PASS: 1601/1668 proved, 0 Failed, count"
            echo "      ${UNPROVED_COUNT}/${EXPECTED_UNPROVED}, all ${EXPECTED_UNPROVED} classified residuals verified"
            echo "      by name (set equality). Arms: 2 handler + 32 option"
            echo "      (inheritance) + 28 result(Bool,Error) (fresh) + 5 swap."
            echo "      ZERO core-substrate residuals — deque's closure excludes"
            echo "      every header vec inherited its 89 from, so this is the"
            echo "      first module whose inherited surface is SMALLER than its"
            echo "      predecessor's. Composability confirmed in the direction"
            echo "      no prior module tested."
            echo ""
            echo "      VERIFY-018 F4: CLOSED (contract-surface effect) by the"
            echo "      Typed+Cast control, twice. Follow-up queued as its own"
            echo "      ratchet arc: adding 'requires \\valid(out)' to"
            echo "      vec_verify.h should take VERIFY-018 from 198 to 196."
          elif [ "${FAILURES}" -eq 0 ]; then
            echo "REPORT-ONLY PASS: deque_verify.h analysed, no falsified"
            echo "      contracts. Transcribe the goal list and the ARM A-D"
            echo "      scorecard into VERIFY-019 (naming each arm CONFIRMED"
            echo "      / REFUTED / ADJUSTED), then re-run UNCHANGED for the"
            echo "      name-stability check. Do not edit the driver between"
            echo "      runs — that would restart the count."
          else
            echo "FAIL: ${FAILURES} check(s) missed — see FAIL lines above."
            echo "      ANY change to the residual set, in EITHER direction,"
            echo "      fails this job. The fix is the acknowledged ratchet:"
            echo "      update EXPECTED_PROVED, EXPECTED_UNPROVED, the ARM"
            echo "      predictions and CHECKS together in one commit, with the"
            echo "      reclassification written into VERIFY-019 first. A goal"
            echo "      flipping to Proved is a red run carrying good news —"
            echo "      ratchet DOWN, never widen."
          fi
          if [ "${ENFORCE}" -eq 1 ] && [ "${FAILURES}" -ne 0 ]; then
            exit 1
          fi
          echo "==============================================="
      - name: Upload WP proof output (deque_verify.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-deque
          path: wp_deque_output.txt
          retention-days: 90
  # -------------------------------------------------------------------------
  # borrow.h — ENFORCED, 120s / -wp-split.
  #
  # First verified header in semantics/ with in-place contracts, and the
  # project's first hybrid Shape-A/Shape-B header: the 24 non-macro
  # functions (borrowed_ptr x6, borrowed_str x9, borrowed_bytes x9) carry
  # ACSL and are verified here; DEFINE_BORROWED_SLICE is outside the
  # verified surface, parked with the other single-file macro families in
  # docs/vmacros.md (DEFINE_SLICE precedent: documented + tested, not
  # WP-verified).
  #
  # Verified configuration is the default build (CANON_LIFETIME off,
  # -DCANON_NO_REQUIRE -DNDEBUG): the BORROW_LT_* macros expand to nothing,
  # so WP sees the exact shipped bodies of the ABI guarantee. The
  # lifetime-debug path is runtime-only by construction (OWN-001 §7) and
  # stays covered by borrow_test.c across the CI matrix, including the
  # OWN-002 double-reset regression guards.
  #
  # Composability check #6 — CONFIRMED: the TU's substrate is checked.h +
  # slice.h (no ptr.h, no memory.h — slice.h does not pull them), and the
  # inherited surface is exactly 17 goals re-emitted byte-identically:
  # slice.h's 15 (VERIFY-007/-012) + checked.h's 2 (VERIFY-002, prefix
  # flipped typed_ -> typed_cast_ under this TU's model). Own residuals:
  # exactly 2, both on borrowed_bytes_eq's memcmp call site (the only
  # direct libc call in the header) — the danglingness_s1/s2 pair; the
  # valid_s1/s2 and initialization goals closed via the day-one guarded
  # \valid_read/\initialized requires. Zero function-pointer residuals:
  # borrow.h has no combinators or hooks — the first downstream header
  # since error.h to add no new residual class at all.
  #
  # Cross-stream tie-in: gcov reports borrow.h at 38/40 MC/DC (95.0%,
  # CI #1106) with exactly 2 outcomes open — the NULL-true sides of the
  # one-NULL guard in borrowed_bytes_eq. The named goal dead_by_invariant
  # (an /*@ assert \false */ inside that guard) PROVED at CI #1110 under
  # cbytes_invariant, completing the MCDC-008 cross-stream record
  # (MCDC-002 shape, seventh instance, first in semantics/, first carried
  # by a named assert). This job's proved-set check on dead_by_invariant
  # is the proof-stream regression detector; the per-line coverage debug
  # step in the coverage job is the measurement-stream one.
  #
  # Promoted from report-only to enforced at commit 79ad684 (2026-07-05,
  # "Change borrow.h to enforced status in CI" — the commit that flips
  # ENFORCE=0 -> 1; its Actions run is the record). VERIFY-016/MCDC-008
  # landed in the same PR. Report-only first at
  # 383bf9f (CI #1109, 27 unproved — the final 19 plus 8 call-site
  # chaining goals from slice.h contracts mirrored by shape); aligned to
  # slice.h's real clauses at 262a503 (CI #1110): 2433/2452 proved,
  # exactly 19 unproved (17 inherited + 2 own), 0 Unknown, 0 Failed,
  # zero outside prediction, dead_by_invariant proved. The 19 are the
  # identical named subset of #1109's 27 — name-stable across both runs.
  # No timeout-minutes override: this TU is slice.h-sized, not
  # region.h-sized — the default job budget is ample.
  # -------------------------------------------------------------------------
  frama-c-borrow:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: semantics/borrow.h"
        # borrow.h — Typed+Cast. Expected: 2439 / 2458 proved, exactly 19
        # unproved (VERIFY-016): 17 inherited (slice.h's full 15-goal
        # surface incl. the contract.h handler pair, + checked.h's 2 with
        # the typed_ -> typed_cast_ prefix flip) + 2 borrow-own (memcmp
        # danglingness at borrowed_bytes_eq, the header's only libc call).
        # Also enforces the MCDC-008 closure: the named in-body assert
        # dead_by_invariant must remain in the proved set. Any deviation
        # is a regression.
        #
        # First hybrid Shape-A/Shape-B header: the 24 non-macro functions
        # are annotated in place (slice.h-style); DEFINE_BORROWED_SLICE is
        # outside the verified surface (docs/vmacros.md). Verified
        # configuration is the default build (CANON_LIFETIME off,
        # -DCANON_NO_REQUIRE -DNDEBUG) — the exact shipped bodies of the
        # ABI guarantee; the lifetime-debug path stays runtime-verified by
        # borrow_test.c across the CI matrix (OWN-001 §7).
        #
        # Promoted from report-only at 79ad684 (2026-07-05); see the
        # banner above for the #1109 -> #1110 chronology and VERIFY-016 in
        # docs/deviations.md for the full residual classification.
        # (2026-07-16 retrofit): Failed now gated explicitly via note_fail
        # and EXCLUDED from the pooled count; roll-call regexes tightened
