  # -------------------------------------------------------------------------
  # 7. MISRA C:2012 advisory analysis (Linux only)
  #
  #    Uses Cppcheck's MISRA addon for preliminary compliance checking.
  #    This is NOT a qualified MISRA checker — it covers approximately
  #    60-70% of MISRA C:2012 rules. For certification, replace with
  #    a qualified tool: Polyspace, LDRA, PC-lint, or Parasoft C/C++test.
  #
  #    Findings are advisory — real violations do not fail the build.
  #    Their purpose is to track MISRA compliance progress and identify
  #    deviations that must be documented in docs/deviations.md
  #    (inline via `cppcheck-suppress misra-c2012-X.Y` comments,
  #    honored through --inline-suppr).
  #
  #    The INSTRUMENT, however, is enforced: canary/misra_canary.h
  #    contains intentional violations, and the job FAILS if they are
  #    not detected. Rationale: cppcheck emits MISRA addon findings at
  #    "style" severity, which is silently discarded without
  #    --enable=style — this job previously reported "0 violations"
  #    for that exact reason while the addon's findings were being
  #    filtered out. The canary makes any such silent breakage of the
  #    toolchain (severity filtering, addon resolution, packaging
  #    changes) a hard failure instead of a fake-green zero.
  #
  #    PROJECT-WIDE RULE DEVIATIONS — each maps 1:1 to a record in
  #    docs/deviations.md (do not add a suppression without one):
  #      15.5        MISRA-DEV-001  early-return guard-clause style
  #      2.5         MISRA-DEV-002  standalone-TU unused-macro artifact
  #      20.10       MISRA-DEV-003  ## is the type-instantiation mechanism
  #      3.1         MISRA-DEV-004  // and /* inside doc comments (URLs)
  #      5.6/5.8/5.9 MISRA-DEV-005  instantiation-header identifier artifact
  #      11.5        MISRA-DEV-006  void* generic interface level
  #      20.5        MISRA-DEV-007  #undef template-parameter cleanup
  #      18.4        MISRA-DEV-008  bounded slice/string pointer arithmetic
  #      17.1        MISRA-DEV-009  stdarg in fmt/log entry points (Tier 2)
  #      11.6        MISRA-DEV-010  uintptr_t alignment round-trips
  #                                 (same sites as VERIFY-006/-008)
  #    CANARY INTERACTION: the canary relies on rules 21.6, 14.4/15.1,
  #    and 10.1 — none of which may be added to the list above without
  #    path-scoping the suppression, or the self-test goes blind.
  #
  #    PER-LINE MASKING (measured property of cppcheck's misra output):
  #    at most one misra violation is reported per source line, so a
  #    line violating several rules shows only one until that one is
  #    suppressed or fixed — then the next surfaces. All counts in this
  #    job and in the MISRA-DEV records are counts of VISIBLE findings
  #    under the then-active suppression set, i.e. lower bounds. The
  #    1672-finding baseline unmasked 224 shadowed findings when the
  #    892 deviation-covered findings were suppressed (-> 1004).
  #
  #    Suppressions (tool limitations):
  #      - misra-config:*_impl.h — macro-templated implementation headers
  #        (hashmap_impl.h, deque_impl.h, etc.) emit [misra-config]
  #        errors because Cppcheck cannot resolve macro-instantiated
  #        type names (e.g. HASHMAP_SLOT_NAME) without an instantiation
  #        context. This is a tool limitation, not a code defect
  #        (MISRA-CFG-001). Qualified MISRA checkers handle this
  #        correctly via full preprocessor-aware analysis.
  # -------------------------------------------------------------------------
  misra:
    needs: build
    # PINNED RUNNER — not ubuntu-latest. The misra job's finding set is a
    # function of the cppcheck/misra-addon version, which comes from the
    # runner image's apt archive (24.04 -> cppcheck 2.13.0, newer images
    # -> 2.17+ with expanded MISRA coverage: rules 19.2/8.7/5.7 and
    # macro-body 15.6 descent). During the ubuntu-latest image migration
    # the label is nondeterministic and the Real count flips 780 <-> 1004
    # between pushes. Pin the image = pin the tool = stable baseline.
    # Bump this pin DELIBERATELY (same policy as the Windows cppcheck
    # $Version pin in static-analysis): re-baseline the counts, add/extend
    # deviation records for newly covered rules (19.2 union-backed result,
    # 5.7 instantiation-header tags -> MISRA-DEV-005, 15.6 grows to ~262,
    # 12.3 comma declarators, 8.7 standalone-TU linkage artifact), then
    # move the pin and the expected count in one acknowledged commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Run MISRA C:2012 analysis on library headers
        shell: bash
        run: |
          # SCAN SURFACE (re-baselined 2026-07-25, Commit 12 — see
          # MISRA-SCAN-001 in docs/deviations.md).
          #
          # `*_impl.h` and `*_mangle.h` are INTERNAL TEMPLATE FRAGMENTS: they
          # are never compiled alone and depend on macros (`*_LINKAGE`, type
          # parameters) that their including entry point supplies. Handing them
          # to cppcheck as standalone translation units left those macros
          # undefined, the function signatures unparseable, and produced
          # findings that describe the scan rather than the code. Excluding
          # them does NOT reduce analysis coverage: every fragment is reached
          # through an entry point that IS scanned (verified by include-graph
          # reachability — 28 fragments, 0 unreached), so their contents are
          # still analysed, with configuration, and findings are still reported
          # at their own file:line.
          #
          # `*_decl.h` / `*_defn.h` are deliberately NOT excluded: nothing
          # includes them, so they are user-facing entry points whose content
          # would go entirely unanalysed if dropped.
          HEADERS=$(find \
            "${{ github.workspace }}/core" \
            "${{ github.workspace }}/semantics" \
            "${{ github.workspace }}/data" \
            "${{ github.workspace }}/algo" \
            "${{ github.workspace }}/util" \
            "${{ github.workspace }}/canary" \
            -name "*.h" -type f 2>/dev/null \
            | grep -vE '_(impl|mangle)\.h$' | sort)
          if [ -z "$HEADERS" ]; then
            echo "No header files found — skipping MISRA analysis"
            exit 0
          fi
          echo "Found $(echo "$HEADERS" | wc -l) header files to analyze"
          echo "Toolchain: $(cppcheck --version)" | tee misra_toolchain.txt
          cppcheck \
            --addon=misra \
            --enable=style \
            --inline-suppr \
            --std=c99 \
            --language=c \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            "--suppress=misra-config:*_impl.h" \
            --suppress=misra-c2012-15.5 \
            --suppress=misra-c2012-2.5 \
            --suppress=misra-c2012-20.10 \
            --suppress=misra-c2012-3.1 \
            --suppress=misra-c2012-5.6 \
            --suppress=misra-c2012-5.8 \
            --suppress=misra-c2012-5.9 \
            --suppress=misra-c2012-11.5 \
            --suppress=misra-c2012-20.5 \
            --suppress=misra-c2012-18.4 \
            --suppress=misra-c2012-17.1 \
            --suppress=misra-c2012-11.6 \
            -I "${{ github.workspace }}/core/primitives" \
            -I "${{ github.workspace }}/core" \
            -I "${{ github.workspace }}/semantics" \
            -I "${{ github.workspace }}/data" \
            -I "${{ github.workspace }}/algo" \
            -I "${{ github.workspace }}/util" \
            -I "${{ github.workspace }}" \
            $HEADERS \
            2>&1 | tee misra_report.txt
          echo ""
          # ---- Instrument self-test: the canary MUST be flagged ----
          CANARY=$(grep -c "misra_canary\.h.*\[misra-" misra_report.txt || true)
          if [ "${CANARY}" -eq 0 ]; then
            echo "FAIL: MISRA self-test — canary violations not detected."
            echo "The addon is not producing output; any count is meaningless."
            exit 1
          fi
          TOTAL=$(grep -c "\[misra-" misra_report.txt || true)
          echo "==============================================="
          echo "  MISRA C:2012 Summary"
          echo "==============================================="
          echo "  Toolchain: $(cppcheck --version) (runner-pinned; see job comment)"
          echo "  Canary findings (expected >0): ${CANARY}"
          echo "  Total violations incl. canary: ${TOTAL}"
          echo "  Real violations:               $((TOTAL - CANARY))"
          echo ""
          echo "  Expected real count: 53 (pinned; cppcheck 2.13.0,"
          echo "  suppression set MISRA-DEV-001..012 + 014..017)."
          echo ""
          echo "  The ledger reads as TWO SEGMENTS joined at Commit 12,"
          echo "  because MISRA-SCAN-001 re-baselined the analysis surface"
          echo "  itself (template fragments are not translation units):"
          echo "    pre-2026-07-25 surface: 1672 -> 108"
          echo "    corrected surface:       98 ->  53"
          echo "  -10 of that step is the INSTRUMENT, not the code, and the"
          echo "  two segments are not directly comparable. See"
          echo "  MISRA-SCAN-001 for the reachability proof that excluding"
          echo "  28 fragments loses no analysis coverage."
          echo ""
          echo "  Eighteen rules now held at zero — fourteen by fix"
          echo "  (21.1, 10.4, 15.6, 12.1, 14.4, 17.7, 20.7, 17.8, 10.7,"
          echo "  13.3, 12.3, 14.2, 10.8, 11.8) and four by documented"
          echo "  deviation (19.2 unions, 21.3 allocation, 21.6 stdio,"
          echo "  2.3 static-assertion idiom — MISRA-DEV-014..017)."
          echo ""
          echo "  Two of those rules found REAL DEFECTS rather than style"
          echo "  noise: rule 5.7 exposed eleven public header pairs that"
          echo "  could not be compiled together (Commit 15, guarded by"
          echo "  test/integration/header_combination_test.c), and rule"
          echo "  11.8 exposed ten accessors that took a const pointer and"
          echo "  returned mutable access to the object storage (API-001,"
          echo "  guarded by test/integration/const_correctness_test.c)."
          echo ""
          echo "  NOTE — per-line masking: cppcheck reports at most ONE"
          echo "  misra violation per source line. Counts are therefore a"
          echo "  LOWER BOUND on (line, rule) pairs: suppressing or fixing"
          echo "  a rule can SURFACE previously shadowed violations on the"
          echo "  same lines (measured: suppressing 892 baseline findings"
          echo "  surfaced 224 shadowed ones, 1672 -> 1004, all 224"
          echo "  machine-verified as same-line unmaskings). A count that"
          echo "  RISES after cleanup work is surfacing, not regression —"
          echo "  diff the report artifact against the previous run before"
          echo "  concluding anything."
          echo ""
          echo "  Advisory only — real violations do not fail the build."
          echo ""
          echo "  NOTE: Rule category breakdown (Mandatory/Required/Advisory)"
          echo "  requires a MISRA rule lookup table and is not produced by"
          echo "  Cppcheck alone. For certification, use a qualified tool"
          echo "  (Polyspace, LDRA, PC-lint) that emits categorized output."
          echo ""
          echo "  Deviations documented in: docs/deviations.md"
          echo "  (MISRA-DEV-001..010 project-wide, applied as the"
          echo "  command-line suppressions above; MISRA-DEV-011 inline at"
          echo "  util/time.h; MISRA-DEV-012 inline at 117 template-"
          echo "  machinery macros; MISRA-DEV-014..017 inline at 33"
          echo "  design-identity sites; MISRA-CFG-001 tool."
          echo "  MISRA-DEV-013 is SUPERSEDED — MISRA-SCAN-001 removed the"
          echo "  condition it existed for and its 13 suppressions were"
          echo "  deleted, verified dead beforehand.)"
          echo "==============================================="
          # Real violations are advisory by design. When MISRA compliance
          # is mature, uncomment to enforce a zero-real-violations gate:
          # if [ "$((TOTAL - CANARY))" -gt 0 ]; then
          #   echo "FAIL: $((TOTAL - CANARY)) MISRA violations found"
          #   exit 1
          # fi
      - name: Upload MISRA report
        uses: actions/upload-artifact@v6
        with:
          name: misra-report
          path: |
            misra_report.txt
            misra_toolchain.txt
          
          retention-days: 90
  # -------------------------------------------------------------------------
  # 8. Lifetime-debug build — all platforms, Release + Debug
  #
  #    Builds and runs the full test suite with CANON_LIFETIME=debug,
  #    which defines CANON_LIFETIME_DEBUG project-wide. This activates:
  #      - lifetime_t lt field on Arena, Pool, DynString, every
  #        dynvec_T instantiation, and (Phase 3) smallvec instantiations
  #      - source_lt + captured_id fields on every borrow struct
  #      - _from_lifetime constructors capture the source's token
  #      - BORROW_LT_CHECK_ fires require_msg on every _get if the
  #        captured ID no longer matches the source's current ID
  #
  #    Matrix mirrors the default `build` job — same OS/compiler/
  #    build-type coverage. This catches:
  #      - MSVC vs GCC/Clang struct-padding differences for the
  #        embedded lifetime_t field
  #      - macOS Clang vs Linux Clang alignment behavior of uint64_t
  #        inside struct
  #      - Platform-specific pointer-size assumptions in the
  #        (region_id_t)(uintptr_t)&v ID derivation
  #      - Release-mode codegen differences when LIKELY/UNLIKELY hints
  #        interact with the additional fields
  #
  #    Sanitizers (ASan + UBSan) are enabled in Debug on Linux + macOS
  #    to catch any latent UB the lifetime instrumentation might
  #    introduce — e.g. a forgotten field initialiser leaving
  #    captured_id uninitialised, or pointer arithmetic that the
  #    additional fields perturb. MSVC builds skip ASan (DLL
  #    deployment limitation; see ENABLE_SANITIZERS in CMakeLists.txt).
  #
  #    Previously this job was Linux-Clang only — sufficient evidence
  #    when only arena and borrow embedded lifetime_t (Phase 1). After
  #    Phase 2 broadened the surface to five owning types plus all
  #    macro-generated dynvec instantiations, single-platform coverage
  #    was no longer adequate. The matrix expanded after Phase 2
  #    landed.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # lifetime-token-concurrency — the ONLY concurrent test in the project
  #
  # Canon-C is a single-threaded library (docs/thread-safety.md). It owns no
  # threads and holds no locks, so every other job in this workflow tests
  # sequential code. This job exists because token generation under
  # CANON_LIFETIME_DEBUG is the single place where the library performs a
  # read-modify-write on state shared between the CALLER's threads.
  #
  # WHAT IS AT STAKE. A token is `counter ^ owner-address`. Non-atomically,
  # two concurrent constructions can read the same counter, so two owners can
  # receive the same token — and the token is exactly what the borrow checks
  # compare. A stale borrow then validates against a different live owner:
  # the check PASSES WHEN IT SHOULD FAIL. The debug mode's whole purpose is
  # defeated, silently, in the unsafe direction. Hence a job for one function.
  #
  # WHAT IS GATED AND WHAT IS NOT — read before adding assertions here.
  #   GATED   zero duplicate tokens on an atomic path. Atomicity either holds
  #           or it does not; the direction is deterministic.
  #   GATED   zero TSan races on the atomic path.
  #   GATED   TSan DOES report the race on the forced-fallback path. If it
  #           stops, either TSan regressed or the fallback silently became
  #           atomic — both are things to investigate, not to accept.
  #   NOT     the duplicate COUNT on the fallback path. A data race is
  #   GATED   undefined behaviour, not a scheduled event: the same counter
  #           produced 50000, 50000, 0, 50000, 50000 duplicates across five
  #           consecutive runs on one machine. Requiring the race to appear
  #           would fail roughly one run in five and would assert that UB is
  #           reliable. It is printed for the record and nothing more.
  #
  # This job does not gate any proof baseline and cannot: every WP job runs
  # with CANON_LIFETIME off, so none of this code is in any verified TU.
  # See MISRA-DEV-018 for the rule 1.2 deviation the atomic intrinsics need.
  # -------------------------------------------------------------------------
  lifetime-token-concurrency:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: "Ladder: which atomic level does each configuration select?"
        # The ladder is the fix. A C11-only version of this fix was written
        # first and was WRONG — Canon-C is C99 (CMAKE_C_STANDARD 99,
        # REQUIRED), so it would have been correct code that never compiled
        # in any job or for any caller. This step exists so that regression
        # is visible immediately rather than after a silent fallback.
        run: |
          set -e
          cat > /tmp/level_probe.c <<'PROBE_EOF'
          #define CANON_LIFETIME_DEBUG
          #include "core/primitives/lifetime.h"
          #include <stdio.h>
          int main(void) {
          #ifdef CANON_LIFETIME_ATOMIC_LEVEL_
              printf("%d %d\n", CANON_LIFETIME_ATOMIC_IDS, CANON_LIFETIME_ATOMIC_LEVEL_);
          #else
              printf("%d 4\n", CANON_LIFETIME_ATOMIC_IDS);
          #endif
              return 0;
          }
          PROBE_EOF
          FAILURES=0
          probe() {  # $1 = label, $2 = expected "atomic level", $3.. = flags
            label="$1"; expect="$2"; shift 2
            gcc "$@" -I . -o /tmp/level_probe /tmp/level_probe.c
            got=$(/tmp/level_probe)
            if [ "${got}" = "${expect}" ]; then
              echo "  OK   ${label}: atomic/level = ${got}"
            else
              echo "  FAIL ${label}: atomic/level = ${got}, expected ${expect}"
              FAILURES=$((FAILURES + 1))
            fi
          }
          echo "=== ladder selection ==="
          # THE important row: the project's own standard must NOT fall back.
          probe "C99 (the shipped standard)"  "1 2" -std=c99
          probe "C11"                         "1 1" -std=gnu11
          probe "C99 + NO_GNU_EXTENSIONS"     "0 4" -std=c99 -DCANON_NO_GNU_EXTENSIONS
          probe "C99 + LIFETIME_NO_ATOMICS"   "0 4" -std=c99 -DCANON_LIFETIME_NO_ATOMICS
          echo ""
          if [ "${FAILURES}" -ne 0 ]; then
            echo "FAIL: ${FAILURES} ladder selection(s) wrong."
            echo "      A C99 build falling to level 4 means the fix is"
            echo "      unreachable in the configuration this project ships —"
            echo "      which is the exact defect the ladder was written to"
            echo "      correct. Do not 'fix' this by relaxing the expectation."
            exit 1
          fi
          echo "PASS: every configuration selects the intended level."

      - name: "Gated: zero duplicate tokens on the atomic paths"
        run: |
          set -e
          for std in c99 gnu11; do
            for opt in -O0 -O2; do
              echo "--- -std=${std} ${opt} ---"
              gcc -std=${std} ${opt} -Wall -Wextra -I . -pthread \
                  -o /tmp/lt test/concurrency/lifetime_token_test.c
              /tmp/lt || exit 1
            done
          done
          echo "PASS: no duplicates on any atomic configuration."
          echo "      -O0 is included deliberately: the fallback race does NOT"
          echo "      reproduce without optimisation (the optimiser is what"
          echo "      keeps the counter in a register), so an -O2-only matrix"
          echo "      would miss a level that had quietly stopped being atomic."

      - name: "Reported only: the fallback path"
        # Never gated — see the banner. Printed so the record shows what the
        # conforming-C99 path actually does on this runner.
        run: |
          set -e
          for flag in -DCANON_LIFETIME_NO_ATOMICS -DCANON_NO_GNU_EXTENSIONS; do
            echo "--- ${flag} ---"
            gcc -std=c99 -O2 -Wall -Wextra ${flag} -I . -pthread \
                -o /tmp/lt_fb test/concurrency/lifetime_token_test.c
            /tmp/lt_fb
          done

      - name: "Gated: ThreadSanitizer, both directions"
        # TSan instruments accesses instead of sampling outcomes, so unlike
        # the duplicate count it is a deterministic detector and can be gated
        # in BOTH directions.
        run: |
          set -e
          FAILURES=0

          echo "=== atomic path: expect ZERO races ==="
          gcc -std=c99 -O1 -g -fsanitize=thread -I . -pthread \
              -o /tmp/ts_atomic test/concurrency/lifetime_token_test.c
          /tmp/ts_atomic > /tmp/ts_atomic.log 2>&1 || true
          ATOMIC_RACES=$(grep -c "WARNING: ThreadSanitizer: data race" /tmp/ts_atomic.log || true)
          echo "  races on atomic path: ${ATOMIC_RACES}"
          if [ "${ATOMIC_RACES}" -ne 0 ]; then
            echo "FAIL: the atomic path races. The increment selected by the"
            echo "      ladder is not actually atomic on this toolchain."
            grep -A6 "WARNING: ThreadSanitizer" /tmp/ts_atomic.log | head -20
            FAILURES=$((FAILURES + 1))
          fi

          echo ""
          echo "=== forced fallback: expect the race to BE reported ==="
          gcc -std=c99 -O1 -g -DCANON_LIFETIME_NO_ATOMICS -fsanitize=thread \
              -I . -pthread -o /tmp/ts_fb test/concurrency/lifetime_token_test.c
          /tmp/ts_fb > /tmp/ts_fb.log 2>&1 || true
          FB_RACES=$(grep -c "WARNING: ThreadSanitizer: data race" /tmp/ts_fb.log || true)
          echo "  races on fallback path: ${FB_RACES}"
          if [ "${FB_RACES}" -eq 0 ]; then
            echo "FAIL: TSan found no race on the NON-ATOMIC path. This is a"
            echo "      positive control, and its failure voids the result"
            echo "      above: if TSan cannot see a race that is known to be"
            echo "      there, 'zero races on the atomic path' means nothing."
            echo "      Either TSan regressed or the fallback stopped being"
            echo "      the fallback. Investigate before trusting this job."
            FAILURES=$((FAILURES + 1))
          fi

          echo ""
          if [ "${FAILURES}" -ne 0 ]; then
            echo "FAIL: ${FAILURES} TSan check(s) failed."
            exit 1
          fi
          echo "PASS: atomic path clean, fallback race detected (control held)."

      - name: Upload concurrency logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lifetime-token-concurrency-logs
          path: |
            /tmp/ts_atomic.log
            /tmp/ts_fb.log
          retention-days: 90
          if-no-files-found: ignore

  lifetime-debug:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: clang
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
    steps:
      - uses: actions/checkout@v6
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      - name: Configure CMake (Linux / macOS, CANON_LIFETIME=debug)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          SANITIZERS=OFF
          if [[ "${{ matrix.build_type }}" == "Debug" ]]; then
            SANITIZERS=ON
          fi
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCANON_LIFETIME=debug \
            -DENABLE_SANITIZERS=${SANITIZERS} \
            -S "${{ github.workspace }}"
      - name: Configure CMake (Windows, CANON_LIFETIME=debug)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sanitizers = if ("${{ matrix.build_type }}" -eq "Debug") { "ON" } else { "OFF" }
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCANON_LIFETIME=debug `
            -DENABLE_SANITIZERS="$sanitizers" `
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }}
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # -------------------------------------------------------------------------
  # 12. CompCert — Linux only, INFORMATIONAL, upstream repository only
  #
  #   Compiles and runs the test suite with ccomp, the formally verified C
  #   compiler, as portability evidence: the sources are accepted by a
  #   compiler whose translation is proved to preserve semantics.
  #
  #   LICENSING — read docs/compcert-licensing.md before enabling this.
  #   CompCert's non-commercial release is used here as a CI-only evaluation
  #   tool under the INRIA Non-Commercial License, per written confirmation
  #   from AbsInt (2026-07-10). That permission covers THIS project's
  #   non-commercial evaluation use and does NOT extend to third parties.
  #
  #   The `if:` guard below therefore restricts the job to the upstream
  #   repository. A fork does not run it unless its owner edits this
  #   condition — an explicit, deliberate act — because running it in a
  #   commercial context would be the fork owner's own use of CompCert and
  #   requires their own licence from AbsInt (https://www.absint.com/).
  #   The default is "off for everyone but upstream" rather than "on unless
  #   you notice the docs", so nobody inherits a licensing obligation by
  #   forking.
  #
  #   `continue-on-error: true` keeps this stream INFORMATIONAL, as the
  #   licensing record states. It is portability evidence, not a gate: a
  #   ccomp failure must never block a merge, and no other evidence stream
  #   (WP proofs, MC/DC, MISRA, fuzzing, sanitizers) depends on it.
  # -------------------------------------------------------------------------
  compcert:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'eclipse-canon-c/Canon-C'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Restore opam / CompCert cache
        id: compcert-cache
        uses: actions/cache@v4
        with:
          path: ~/.opam
          # Key tracks the PINNED CompCert version below. Bump both
          # together, deliberately — same policy as the cppcheck $Version
          # pin in static-analysis and the CVC5 pin in framac-setup, and
          # for a sharper reason here: this job's output is evidence, and
          # "compiles cleanly under a formally verified compiler" is a
          # claim about a SPECIFIC compiler. A key that does not track the
          # version would restore a stale toolchain after an upstream
          # release with nothing to signal the change.
          key: opam-Linux-ocaml-4.14.2-compcert-3.17-v1

      - name: Install OCaml and opam
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 pkg-config

      - name: Initialise opam and install CompCert
        if: steps.compcert-cache.outputs.cache-hit != 'true'
        run: |
          # coq-compcert is the non-commercial release (INRIA NCL).
          # VERSION IS PINNED: an unpinned `opam install coq-compcert`
          # takes whatever is latest, so the toolchain behind an evidence
          # claim could change without any commit saying so. Bump this and
          # the cache key together, then re-read the run summary — a new
          # CompCert may accept or reject different constructs.
          # Cold build ~12 min (measured, CI #1205); cached thereafter.
          opam init --bare --disable-sandboxing --yes
          opam switch create compcert 4.14.2 --yes
          eval $(opam env --switch=compcert)
          opam repository add coq-released https://coq.inria.fr/opam/released --yes
          opam install coq-compcert.3.17 --yes

      - name: Record CompCert version (provenance for the licensing record)
        # Also a pin check: if ccomp reports anything other than the pinned
        # version, the cache key and the install line have drifted apart and
        # the evidence claim is about a compiler nobody chose.
        run: |
          eval $(opam env --switch=compcert)
          ccomp -version
          if ! ccomp -version | grep -q "version 3.17"; then
            echo "FAIL: ccomp is not the pinned 3.17 — cache key and install"
            echo "      line have drifted. Reconcile both before trusting"
            echo "      this run as portability evidence."
            exit 1
          fi

      - name: Compile and run the test suite with ccomp
        shell: bash
        run: |
          eval $(opam env --switch=compcert)

          # Canon-C's GNU-extension escape hatches, all pre-existing and
          # documented — none added for CompCert's benefit:
          #
          #   CANON_NO_GNU_EXTENSIONS     range.h's RANGE_FOR falls back from
          #                               typeof() to an isize cast;
          #                               contract.h's CANON_UNREACHABLE_HINT
          #                               becomes ((void)0) instead of
          #                               __builtin_unreachable().
          #   CANON_CHECKED_FORCE_FALLBACK  checked.h uses its portable
          #                               overflow arithmetic instead of
          #                               __builtin_*_overflow.
          #   CANON_BITS_FORCE_FALLBACK   bits.h uses its portable clz/ctz/
          #                               popcount instead of the builtins.
          #
          # The two FORCE_FALLBACK flags are the SAME ones the coverage job
          # uses. They are needed here for a reason worth stating: ccomp
          # delegates preprocessing to the system cpp, so __GNUC__ is defined
          # while the headers are preprocessed and the builtin branches are
          # selected — but ccomp itself does not implement
          # __builtin_add_overflow and friends. Forcing the fallback selects
          # the paths that are portable C99, which is what this job is
          # evidence about.
          #
          # -fall enables CompCert's optional features (struct passing and
          # return by value, bit-fields, etc). Canon-C passes bytes_t, str_t
          # and Result by value throughout, so this is not optional for it.
          CCOMP_FLAGS=(
            -fall
            -DCANON_NO_GNU_EXTENSIONS
            -DCANON_CHECKED_FORCE_FALLBACK
            -DCANON_BITS_FORCE_FALLBACK
            -I core/primitives -I core -I semantics -I .
          )
          # The include set is deliberately NARROW. Tests reference library
          # headers path-qualified from the repo root ("data/bitset.h"), so
          # `-I .` covers them; only nine primitives are included bare
          # (bits.h, checked.h, ptr.h, ...), which is what the other three
          # entries are for. Adding `-I util` breaks the build: it puts
          # util/time.h ahead of the system <time.h> on the search path, so
          # `struct timespec` never gets declared and time_test fails to
          # compile. Verified with GCC under exactly these flags before this
          # job was written: 53/53 translation units compile and run.

          mkdir -p ccomp-out
          COMPILED=0; RAN=0; FAILED_COMPILE=(); FAILED_RUN=()

          # The test suite is the compile surface rather than the headers
          # themselves: Canon-C is header-only, and several headers are not
          # standalone translation units by design — hashmap needs
          # HASHMAP_KEY_TYPE defined by the includer, bitset needs a
          # CANON_OPTION(usize) instantiation (see MISRA-SCAN-001 and the
          # Commit 15 header-combination work). The tests ARE complete TUs,
          # they instantiate what they use, and together they include every
          # public header.
          while IFS= read -r t; do
            n=$(basename "$t" .c)
            if ccomp "${CCOMP_FLAGS[@]}" -o "ccomp-out/$n" "$t" \
                 > "ccomp-out/$n.log" 2>&1; then
              COMPILED=$((COMPILED+1))
              if "./ccomp-out/$n" > "ccomp-out/$n.run.log" 2>&1; then
                RAN=$((RAN+1))
              else
                FAILED_RUN+=("$n")
              fi
            else
              FAILED_COMPILE+=("$n")
            fi
          done < <(find test -name '*_test.c' | sort)

          TOTAL=$(find test -name '*_test.c' | wc -l)
          echo "==============================================="
          echo "  CompCert portability evidence (INFORMATIONAL)"
          echo "==============================================="
          echo "  translation units:  ${TOTAL}"
          echo "  compiled by ccomp:  ${COMPILED}"
          echo "  ran successfully:   ${RAN}"

          if [ ${#FAILED_COMPILE[@]} -gt 0 ]; then
            echo ""
            echo "  did not compile (${#FAILED_COMPILE[@]}):"
            for n in "${FAILED_COMPILE[@]}"; do
              echo "    --- $n ---"
              sed 's/^/      /' "ccomp-out/$n.log" | head -15
            done
          fi
          if [ ${#FAILED_RUN[@]} -gt 0 ]; then
            echo ""
            echo "  compiled but failed at runtime (${#FAILED_RUN[@]}):"
            for n in "${FAILED_RUN[@]}"; do
              echo "    --- $n ---"
              sed 's/^/      /' "ccomp-out/$n.run.log" | tail -15
            done
          fi
          echo "==============================================="
          echo "  This stream is informational — see"
          echo "  docs/compcert-licensing.md for what it does and"
          echo "  does not claim, and for the licensing boundary."
          echo "==============================================="

          # Non-zero exit still surfaces in the log; continue-on-error keeps
          # the run green, per the licensing record's "optional /
          # informational" requirement.
          if [ ${#FAILED_COMPILE[@]} -gt 0 ] || [ ${#FAILED_RUN[@]} -gt 0 ]; then
            exit 1
          fi

      - name: Upload CompCert logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compcert-logs
          path: ccomp-out/*.log
          retention-days: 90
          if-no-files-found: ignore
