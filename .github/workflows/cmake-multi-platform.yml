  # VERIFY-023 — ptr.h address helpers now state their result. PRE-REGISTERED
  # RATCHET across eight enforced jobs, written before the run.
  #
  # ptr_offset, ptr_offset_const, ptr_elem, ptr_elem_const gained one
  # `ensures (u8*)\result == (u8*)base + ...` each. Nothing else changed.
  #
  # PREDICTION, every TU that includes ptr.h:
  #   goals  +4 (one ensures goal per helper), proved +4, residual set
  #   UNCHANGED by name. Pins below are moved by exactly that. If -wp-split
  #   fragments an ensures across the null/nonnull branch the delta is +8,
  #   the jobs go red at gate 0, and the correcting commit records the
  #   actual delta -- a red run is the measurement, not a failure of it.
  #
  # SCORED AT CI #1284: delta was +6, not +4 -- ptr_offset and ptr_offset_const
  # split their new ensures across the null/nonnull branch, ptr_elem and
  # ptr_elem_const did not. Residuals: ptr, memory, bitset unchanged by name;
  # arena -8, pool -24 (arena's 8 + 16 own), region -8, vec -8. Zero moved
  # the bad way. Of the 24 distinct goals that closed I predicted 2 (pool's
  # in_bounds pair) and named 8 others (ptr_span) that did NOT close. The
  # classifications those 24 carried in VERIFY-009/-010 -- "fits
  # arithmetic", "free_bytes helpers", "call-site obligations" -- were
  # wrong: they were the callee's opaque result, and closed the moment the
  # callee stated it. Pins below are now the OBSERVED figures.
