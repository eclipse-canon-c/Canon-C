            -variadic-no-translation \
            -wp -wp-rte \
            -wp-model "${WP_MODEL}" \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            semantics/diag.h 2>&1 | tee wp_diag_output.txt
          WP_EXIT=${PIPESTATUS[0]}
