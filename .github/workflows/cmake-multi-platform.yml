            echo "      (If the abort mentions 'Invalid infinite range', the"
            echo "      -variadic-no-translation flag or the __FRAMAC__ stdio"
            echo "      axioms in diag.h have been removed/broken.)"
            echo ""
            echo "First diagnostic lines from WP output:"
            grep -E "^\[(kernel|wp)" wp_diag_output.txt | head -20 || true
          else
            TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_diag_output.txt || true)
            UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_diag_output.txt || true)
            FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_diag_output.txt || true)
            INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_diag_output.txt || true)
            STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_diag_output.txt || true)
            UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
            echo "  Timeouts: ${TIMEOUT_COUNT}"
            echo "  Unknown:  ${UNKNOWN_COUNT}   (0-1 — the diag_init memset goal oscillates Timeout/Unknown)"
            echo "  Failed:   ${FAILED_COUNT}"
            echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
            if [ "${FAILED_COUNT}" -ne 0 ]; then
