            exit 1
          fi
          # Gate 0 — pinned goal surface.
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "1753 / 1755" ]; then
