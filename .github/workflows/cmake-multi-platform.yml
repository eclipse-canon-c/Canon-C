  # -------------------------------------------------------------------------
  # semantics/result — second Shape-B macro-module driver, default Typed
  # model (by-value tagged struct, no void* casts — like error.h and option,
  # so no CVC5-presence check). WP runs over vmacros/vdrivers/result_verify.h,
  # which instantiates the REAL shipped macros at (int, VErr) (docs/vmacros.md).
  #
  # Expected: 185 / 215 proved, exactly 30 unproved (VERIFY-015):
  #   (a) 2 inherited — contract.h handler non-termination (VERIFY-006 cat-4
  #       pair). Definition-presence inheritance ONLY: result's entire panic
  #       surface (unwrap / unwrap_err / expect / get_* NULL guard) is plain
  #       require_msg, compiled out under -DCANON_NO_REQUIRE, so unlike
  #       option's expect no result function contains a handler call and all
  #       of them prove fully.
  #   (b) 28 own — function-pointer dispatch (OWN-003 class, second
  #       recurrence after option/VERIFY-014) across the five dispatching
  #       combinators: map 6, map_err 6, and_then 4, or_else 4, eq 8. eq
  #       carries the largest cluster: TWO pointers (eq_ok, eq_err) across
  #       two calling branches, one rte_function_pointer goal per pointer.
  #       For each combinator the non-calling branch is proved and the
  #       calling branch is the residual.
  #
  # NO union-goal residuals: result is the first union-typed module, and all
  # union-member postconditions proved — under WP's union field model, which
  # WP flags with [wp:union] "might be unsound" warnings. Soundness rests on
  # the no-type-punning discipline documented in VERIFY-015 (every union
  # read, in bodies and specs alike, is guarded by the is_ok value that
  # selected the write). The warnings are expected and not failures.
  #
  # The residual set is name-stable: category (b) is deterministic (each goal
  # resolves in Qed 2-6ms then buckets as unprovable — \valid_function will
  # not prove in FC29), not solver-capacity-bound. Only the 2 category-(a)
  # goals are genuine full timeouts, identical to the pair pinned in six
  # other headers. The by-name roll-call below pins all 30: if a future
  # Frama-C implements \valid_function, the count stays 30 but a name check
  # fails, which is the signal to revisit rather than silently absorb.
  #
  # NOTE (2026-07-16): this driver verifies the family at (int, VErr). The
  # vec TU separately instantiates result(Bool, Error) — a FRESH
  # instantiation, a new verification subject, NOT covered by this job's
  # evidence (VERIFY-018 Correction note; instantiation-identity rule in
  # docs/vmacros.md). This job's residual profile is the comparison
  # baseline for that fresh instance's 22 goals.
  # -------------------------------------------------------------------------
  frama-c-result:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: vmacros/vdrivers/result_verify.h"
        # (2026-07-16 retrofit): Failed gated at zero and excluded from
        # the pooled count; Proved-line warning promoted to a hard pin.
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            vmacros/vdrivers/result_verify.h 2>&1 | tee wp_result_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (result_verify.h) exit status: ${WP_EXIT}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_result_output.txt || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            echo ""
            echo "FAIL: WP did not produce a verification summary."
            echo "      frama-c aborted before running WP, likely due to an"
            echo "      ACSL syntax error in result_verify.h or an include"
            echo "      resolution failure. Check the WP output above for"
            echo "      [kernel:annot-error] or [kernel] User Error messages."
            echo ""
            echo "First diagnostic lines from WP output:"
            grep -E "^\[(kernel|wp)" wp_result_output.txt | head -10 || true
            echo "==============================================="
            exit 1
          fi
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_result_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_result_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_result_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_result_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_result_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          EXPECTED_UNPROVED=30
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED (not timeout/unknown) —"
            echo "      a contract in result_verify.h is falsified:"
            grep -E "^\[wp\] \[Failed\]" wp_result_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_result_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_result_output.txt
            exit 1
          fi
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "185 / 215" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 185 / 215)."
            echo "      The goal surface drifted — reclassify in VERIFY-015,"
            echo "      then ratchet this pin, EXPECTED_UNPROVED, and CHECKS"
            echo "      together in one acknowledged commit."
            exit 1
          fi
          if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
            echo ""
            echo "FAIL: unexpected number of unproved goals."
            echo "      Expected exactly ${EXPECTED_UNPROVED} documented unproved goals."
            echo "      See docs/verification.md (result section) and"
            echo "      docs/deviations.md (VERIFY-015) for the full list."
            echo ""
            echo "Observed unproved goals:"
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\]" wp_result_output.txt || true
            exit 1
          fi
          CHECKS=(
            # (a) inherited — contract.h handler non-termination (VERIFY-006 cat 4)
            "typed_contract_default_handler_terminates"
            "typed_contract_default_handler_loop_invariant_established"
            # (b) own — function-pointer dispatch (OWN-003 class), 5 combinators
            # map (6)
            "typed_result_int_VErr_map_terminates_part2"
            "typed_result_int_VErr_map_terminates_part3"
            "typed_result_int_VErr_map_exits"
            "typed_result_int_VErr_map_assert_rte_function_pointer"
            "typed_result_int_VErr_map_assigns_exit_part2"
            "typed_result_int_VErr_map_assigns_normal_part2"
            # map_err (6) — note assigns_normal_part3, not part2: -wp-split
            # numbering artifact, pinned as observed
            "typed_result_int_VErr_map_err_terminates_part2"
            "typed_result_int_VErr_map_err_terminates_part3"
            "typed_result_int_VErr_map_err_exits"
            "typed_result_int_VErr_map_err_assert_rte_function_pointer"
            "typed_result_int_VErr_map_err_assigns_exit_part2"
            "typed_result_int_VErr_map_err_assigns_normal_part3"
            # and_then (4) — returns f's Result directly (no rewrap), hence
            # the smaller cluster than map's
            "typed_result_int_VErr_and_then_terminates_part1"
            "typed_result_int_VErr_and_then_terminates_part2"
            "typed_result_int_VErr_and_then_assert_rte_function_pointer"
            "typed_result_int_VErr_and_then_assigns_part1"
            # or_else (4)
            "typed_result_int_VErr_or_else_terminates_part1"
            "typed_result_int_VErr_or_else_terminates_part2"
            "typed_result_int_VErr_or_else_assert_rte_function_pointer"
            "typed_result_int_VErr_or_else_assigns_part2"
            # eq (8) — TWO pointers, two calling branches; one
            # rte_function_pointer goal per pointer
            "typed_result_int_VErr_eq_terminates_part1"
            "typed_result_int_VErr_eq_terminates_part2"
            "typed_result_int_VErr_eq_terminates_part3"
            "typed_result_int_VErr_eq_terminates_part4"
            "typed_result_int_VErr_eq_assert_rte_function_pointer"
            "typed_result_int_VErr_eq_assert_rte_function_pointer_2"
            "typed_result_int_VErr_eq_assigns_part2"
            "typed_result_int_VErr_eq_assigns_part4"
          )
          for goal in "${CHECKS[@]}"; do
            if ! grep -qE "\[(Timeout|Unknown)\].*${goal}" wp_result_output.txt; then
              echo "FAIL: expected unproved goal ${goal} not observed."
              exit 1
            fi
          done
          echo "PASS: result verified — 185/215 proved, 30 documented"
          echo "      residuals all observed (VERIFY-015): 2 inherited"
          echo "      (contract.h handler) + 28 own (five combinators,"
          echo "      function-pointer dispatch; eq largest with two"
          echo "      pointers). Second Shape-B module; every"
          echo "      non-combinator function proved fully, including all"
          echo "      union-member postconditions (first union-typed"
          echo "      module — see VERIFY-015 union-model note)."
          echo "==============================================="
      - name: Upload WP proof output (result)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-result
          path: wp_result_output.txt
          retention-days: 90
  
  
  # -------------------------------------------------------------------------
  # data/vec — third Shape-B macro-module driver, FIRST data/-layer module,
  # and the first driver on the Typed+Cast model: unlike option/result
  # (by-value structs, plain Typed), vec crosses void* boundaries —
  # (int*)mem_alloc(bytes), int* buffers through mem_copy/mem_move's void*
  # parameters. The model, prover set, and timeout match the memory.h and
  # arena.h jobs exactly (their contracts are the ones vec's call sites
  # must discharge), so the CVC5-presence check from those jobs applies.
  #
  # WP runs over vmacros/vdrivers/vec_verify.h, which instantiates the REAL
  # shipped macros at int via the DEFINE_VEC_STRUCTS / DEFINE_VEC_FUNCTIONS
  # split (docs/vmacros.md). Verified config: -DCANON_NO_REQUIRE -DNDEBUG,
  # CANON_LIFETIME off — under it vec's entire panic surface (3 require_msg,
  # 10 ensure_msg, zero direct handler calls) compiles away; the driver's
  # requires clauses are load-bearing.
  #
  # ENFORCED (promoted from report-only after 3 runs; option/result house
  # style, exact-match). Baseline: CI #1202 (Commit 16/16b ratchet; orig. CI #1152) — 5231/5429 proved,
  # 198 unproved, 0 Failed, classified in
  # docs/verification.md and docs/deviations.md VERIFY-018 (incl.
  # Correction note 2026-07-16) and the driver header:
  #   inherited 123 — byte-identical to the substrate's pinned lists: the
  #     91-goal core arm equals arena.h's CHECKS verbatim (both units run
  #     Typed+Cast — no prefix map applies; -wp-split fragment indices and
  #     the three Unknown sub-verdicts reproduced on the same goals), and
  #     the 32-goal option arm equals option's roll-call modulo the
  #     typed_ -> typed_cast_ prefix, fragment indices included
  #     (machine-diffed against the frozen #1154 artifacts)
  #   fresh instantiation 22 — result(Bool, Error): a type pair NOT
  #     verified in VERIFY-015's home unit (int, VErr), so a NEW
  #     verification subject co-resident in this TU, not inheritance.
  #     20 goals match the family's home profile family/count/split-
  #     exactly; 8 home assigns goals are never emitted (this driver
  #     attaches no assigns clauses to result functions — per this run's
  #     pedantic-assigns warnings); 2 union get_ok/get_err rte_mem_access
  #     goals are new (attribution open — VERIFY-018 F4)
  #   vec-own 53 = (e) 2 allocation-model (\fresh/\freeable unimplemented)
  #              + (g) 24 fill macro-body-loop cluster (unprovable by
  #                construction: ACSL loop annotations cannot survive macro
  #                definition — forward-flag for deque's shift loops)
  #              + (d) 5 element-transfer ensures (mem_copy/mem_move are
  #                frame-only) + (h) 22 Typed+Cast int<->char bridging
  #   (The CI baseline label was originally recorded as 143 inherited +
  #    53 own; the 2026-07-16 Correction note reclassified to 121 + 75
  #    with the SAME 196 names — no gate or count changed. Those are the
  #    #1154 figures and are left as recorded; API-001 later took the set
  #    to 198 = 123 + 75 at #1202.)
  # Gates: pinned Proved line, 0 Failed ever, exact count, by-name roll-call
  # (= set equality). ANY change to the residual set, either direction,
  # fails CI; the fix is the acknowledged ratchet — update the pinned
  # Proved line, EXPECTED_UNPROVED, and CHECKS together in one commit.
  # A goal flipping to Proved on a fast prover day is a red run carrying
  # good news: ratchet down, do not widen.
  # -------------------------------------------------------------------------
  frama-c-vec:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: vmacros/vdrivers/vec_verify.h (VERIFY-018, enforced)"
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I data \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            vmacros/vdrivers/vec_verify.h 2>&1 | tee wp_vec_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (vec_verify.h) exit status: ${WP_EXIT}"
          echo "  MODE: ENFORCED — VERIFY-018 baseline, exact match."
          echo "  baseline: VERIFY-023 ratchet: 5285/5473, 188 unproved"
          echo "            prior: CI #1202 (16b): 5231/5429, 198 — the 2 goals"
          echo "            removed are the F4 pair, now discharged by contract."
          echo "  model=Typed+Cast provers=alt-ergo,z3,cvc5 timeout=120 split=on"
          echo "  config=-DCANON_NO_REQUIRE -DNDEBUG (CANON_LIFETIME off)"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_vec_output.txt || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            echo ""
            echo "FAIL: WP did not produce a verification summary."
            echo "      frama-c aborted before running WP, likely due to an"
            echo "      ACSL syntax error in vec_verify.h or an include"
            echo "      resolution failure. Check the WP output above for"
            echo "      [kernel:annot-error] or [kernel] User Error messages."
            echo ""
            echo "First diagnostic lines from WP output:"
            grep -E "^\[(kernel|wp)" wp_vec_output.txt | head -10 || true
            echo "==============================================="
            exit 1
          fi
          # Prover-environment check (informational, kept from report-only):
          # if CVC5 vanished from the prover set, its 8 baseline goals will
          # flip and the gates below will fail — this warning names the
          # likely cause before the confusing diff does.
          CVC5_INVOKED=$(grep -cE "CVC5|cvc5" wp_vec_output.txt || true)
          if [ "${CVC5_INVOKED}" -eq 0 ]; then
            echo "WARNING: CVC5 does not appear in WP output."
            echo "         The triple-prover setup may have degraded to"
            echo "         dual-prover. Check the prover configuration step;"
            echo "         expect gate failures below if so."
          fi
          # Gate 0 — pinned goal surface (promotion checklist step 3).
          # Catches silent drift of the goal set itself (a function dropping
          # out of the TU, a deleted contract, an include-graph change)
          # that gates 1-3 could miss.
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "5285 / 5473" ]; then
            echo "FAIL: proved-goal summary changed (baseline: 5285 / 5473)."
            echo "      The goal surface drifted — reclassify in VERIFY-018,"
            echo "      then ratchet this pin, EXPECTED_UNPROVED, and CHECKS"
            echo "      together in one acknowledged commit."
            exit 1
          fi
          # VERIFY-018 baseline residual count.
          # RATCHETED 198 -> 196 (VERIFY-018 F4 demonstration). get_ok and
          # get_err were previously among the uncontracted remainder, so
          # -wp-rte's memory-access obligation for each union read had
          # nothing to discharge it. Contracting them (vec_verify.h, shapes
          # copied from deque_verify.h) discharged exactly those two and
          # nothing else. Fully accounted: the two contracts ADD 38 goals
          # (5429 -> 5467), all 38 prove, and 2 previously-unproved goals
          # flip, so proved moves +40 (5231 -> 5271) and the residual set
          # loses exactly the F4 pair. Ratchet DOWN, per this job's rule.
          EXPECTED_UNPROVED=188
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_vec_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_vec_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[Failed\]" wp_vec_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_vec_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_vec_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved: ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
          # Gate 1 — no Failed verdicts, ever. Timeout/Unknown are the
          # classified residual verdicts; Failed means a contract is WRONG.
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED (not timeout) —"
            echo "      a contract in vec_verify.h is falsified:"
            grep -E "^\[wp\] \[Failed\]" wp_vec_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_vec_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_vec_output.txt
            exit 1
          fi
          # Gate 2 — exact count.
          if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
            echo "FAIL: unproved count ${UNPROVED_COUNT} != ${EXPECTED_UNPROVED}."
            echo "      Higher: regression or new residual — classify in"
            echo "      VERIFY-018 before touching this job. Lower: a goal"
            echo "      newly proved — ratchet CHECKS, EXPECTED_UNPROVED and"
            echo "      the pinned Proved line down in the same PR. Diff"
            echo "      against CHECKS below:"
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Invalid|Stepout)\]" wp_vec_output.txt || true
            exit 1
          fi
          # Gate 3 — by-name roll-call: every classified residual must be
          # present. With gate 2's exact count and unique names, presence
          # of all of them == set equality (a swap — one goal regressing
          # while another improves, count unchanged — fails here).
          CHECKS=(
            "typed_cast_contract_default_handler_loop_invariant_established"
            "typed_cast_contract_default_handler_terminates"
            "typed_cast_option_int_map_terminates_part2"
            "typed_cast_option_int_map_terminates_part3"
            "typed_cast_option_int_map_exits_part1"
            "typed_cast_option_int_map_assert_rte_function_pointer"
            "typed_cast_option_int_map_assigns_exit_part2"
            "typed_cast_option_int_map_assigns_normal_part2"
            "typed_cast_option_int_and_then_terminates_part2"
            "typed_cast_option_int_and_then_terminates_part3"
