name: Canon-C CC (VERIFY-025)

# ---------------------------------------------------------------------------
# What this workflow is
#
# VERIFY-025 showed that ACSL inside macro bodies survives preprocessing under
# `cpp -CC` (GCC keeps comments through macro expansion) and that Frama-C 29
# attaches the collapsed contract to the instantiated function. The contracts
# for six macro families now live in the DEFINE_*/IMPL_* macros themselves.
#
# The main workflow's driver jobs (frama-c-{slice,result,option,borrow,vec,
# deque}) still run under the default `-C`, where macro-body annotations are
# invisible, so they verify the OLD prototype contracts in *_verify.h. This
# workflow verifies the NEW macro-body contracts through the bare
# *_cc_experiment.h drivers (struct + functions, no prototypes, no contracts)
# under `-CC`, and diffs the residual set by name against the enforced
# driver pin. (VERIFY-039 G11: option's six combinators and result's five
# state the same contracts in the macro bodies and in the home drivers,
# option_verify.h and result_verify.h, which were repaired first. Since
# G11's repair at (Bool, Error), deque_verify.h's transcription and
# vec_verify.h's and the queue's copies state them too, and frama-c-deque
# and frama-c-vec pin the residual names cc_pins/deque.txt and
# cc_pins/vec.txt list.)
#
# MODE: ENFORCED since the run after three set-identical report-only runs
# (CC #1, #2, #3 — 2026-09-20/21). Gates, per family: (0) the pinned
# proved-goal line, (1) zero Failed/Invalid/Stepout, (2) the exact residual
# count, (3) a by-name roll-call — (2)+(3) is set equality. Any change in
# either direction is red; the remedy is an acknowledged commit updating
# pin, count and roll-call together (the ratchet, docs/verification.md).
#
# Where the pins live: proved line and count in the matrix below; the
# by-name roll-call in vmacros/vdrivers/cc_pins/<family>.txt, one goal per
# line. A ratchet edits all three in one commit. (The first enforced push,
# 6087356, embedded the six roll-calls as heredocs in this file; GitHub's
# workflow parser rejected that file at startup while actionlint accepted
# it, so the lists moved out.)
#
# The diff against the driver job's pin (read from the main workflow at run
# time, never copied) is kept as ADVISORY output: it says how the macro-body
# contract surface differs from the prototype surface, which is information,
# not a gate.
#
# Flags per family are the driver job's flags plus `-CC`; the memory model is
# the family's home model (Typed for result/option/deque, Typed+Cast for
# slice/borrow/vec). Any difference in the residual set is therefore
# attributable to the contract surface — the prototype set vs the macro-body
# set — and nothing else.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "master" ]
    paths:
      - 'core/**'
      - 'semantics/**'
      - 'data/**'
      - 'vmacros/vdrivers/*_cc_experiment.h'
      - 'vmacros/vdrivers/cc_pins/*.txt'
      - '.github/workflows/frama-c-cc.yml'
      - '.github/actions/framac-setup/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frama-c-cc:
    name: frama-c-cc-${{ matrix.family }}
    # Pinned, not ubuntu-latest: see the runner note in
    # cmake-multi-platform.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.budget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # VERIFY-039 G14 to G17 predicted pins, every family: the contract
          # handler's pair closes (G14); ptr.h's eight close in vec and
          # vec_struct (G16); slice.h's five at memcmp and strlen close, and
          # bytes_equal and str_equal gain six proved parts, in slice, borrow,
          # vec and vec_struct (G17), where borrow also gains a proved goal at
          # borrowed_str_from_cstr's call. Before: slice 572 / 587 and 15,
          # result 207 / 215 and 8, option 222 / 230 and 8, borrow
          # 2777 / 2798 and 21, vec 5475 / 5587 and 112, deque 1656 / 1675
          # and 19, vec_struct 5473 / 5585 and 112.
          - { family: slice,  model: "Typed+Cast", budget: 120, driver_job: frama-c-slice,  proved: "583 / 591",   unproved: 8   }
          # result, option, vec, deque, vec_struct: VERIFY-039 G11 predicted
          # pins. The combinators' macro bodies state the home drivers'
          # contracts: each family's termination, exit and frame goals close
          # (option's 26, result's 22, at every instantiation), only the
          # run-time checks on the pointer stay, and option's eq gains 7
          # frame goals. Before: result 185 / 215 and 30, option 189 / 223
          # and 34, vec 5420 / 5580 and 160, deque 1601 / 1668 and 67,
          # vec_struct 5418 / 5578 and 160.
          - { family: result, model: "Typed",      budget: 120, driver_job: frama-c-result, proved: "207 / 213",   unproved: 6   }
          - { family: option, model: "Typed",      budget: 120, driver_job: frama-c-option, proved: "222 / 228",   unproved: 6   }
          # borrow: VERIFY-039 G13 predicted pin. borrowed_str_eq requires, as
          # str_equal now does, that no byte compared holds a dangling
          # address; WP does not implement \dangling, so the two goals at its
          # call for str_equal's no_dangling_a and no_dangling_b are added,
          # unproved. Before: 2777 / 2796 and 19.
          - { family: borrow, model: "Typed+Cast", budget: 120, driver_job: frama-c-borrow, proved: "2789 / 2803", unproved: 14  }
          # vec: +20 at VERIFY-033/034 (arena_alloc{,_aligned} frame clauses,
          # 2 clauses x 2 functions x 5 split parts; CC #13 measured 5394/5586,
          # 192 unproved, roll-call unchanged). Ratcheted by VERIFY-034 addendum.
          # VERIFY-039 G1 (CC #28): out separated from the buffer; pop's and
          # remove's false frame fragments closed, two call-site goals added.
          # VERIFY-039 G2 (predicted pin): arena's try wrappers; their six goals
          # close in every unit that includes arena.h.
          # VERIFY-039 G3 (CC #31): mem_zero states its zeros; +3 goals, all
          # proved. Arena's two zero-content goals stayed, against the
          # prediction: the byte-type bridge (VERIFY-039 G3, scored).
          # VERIFY-039 G18 (predicted pin): mem_alloc's and mem_free's frames
          # name the heap's state, __fc_heap_status, and close; free's null
          # frame gains a part on each path, both proved. Before: 5479 / 5576
          # and 97.
          # VERIFY-040 round 1 (predicted pins): vec's and vec_struct's swap
          # requires its operands the same or separated, and its first
          # postcondition proves; deque's swap states its exchange as
          # two conjunctions and admits a == b. Before: vec 5483 / 5578 and 95,
          # deque 1656 / 1673 and 17, vec_struct 5481 / 5576 and 95.
          # VERIFY-040 round 2 (predicted pins): append_array states its
          # frame above the new elements, six parts added, and extend its
          # frame as two postconditions, its ok clause's five parts gone, the
          # unproved one among them, in vec and vec_struct. Before: vec
          # 5484 / 5578 and 94, vec_struct 5482 / 5576 and 94. Measured at
          # CC #56: vec 5490 / 5583 and vec_struct 5488 / 5581, 93 each, two
          # goals more each than predicted, both proved, the roll-calls as
          # predicted (VERIFY-040 round 2, scored, and the count probe).
          # VERIFY-040 round 3 (predicted pins, from the round 3 probe's
          # run #1, which measured fill under -CC): IMPL_VEC_FILL's loop
          # carries its invariants, frame and variant; fill's 24 pinned
          # goals close, its two termination goals no longer scheduled,
          # and its summary entries go from 48 to 64, all proved, in vec
          # and vec_struct. Before: vec 5490 / 5583 and 93, vec_struct
          # 5488 / 5581 and 93.
          - { family: vec,    model: "Typed+Cast", budget: 300, driver_job: frama-c-vec,    proved: "5530 / 5599", unproved: 69  }
          - { family: deque,  model: "Typed",      budget: 300, driver_job: frama-c-deque,  proved: "1653 / 1665", unproved: 12  }
          # vec_struct: VERIFY-037/038 — vec and option at a struct type (Rec).
          # First pinned as a prediction (38404b9); measured at CC #27; ratcheted
          # with VERIFY-039 G1 at CC #28, which also corrected one
          # mis-transcribed name in cc_pins/vec_struct.txt.
          # VERIFY-039 G2: predicted pin, as cc-vec's; G3 ratcheted at CC #31.
          # VERIFY-039 G18: predicted pin, as cc-vec's. Before: 5477 / 5574
          # and 97.
          # VERIFY-040 round 3: predicted pin, as cc-vec's. Before:
          # 5488 / 5581 and 93.
          - { family: vec_struct, model: "Typed+Cast", budget: 300, driver_job: frama-c-vec, proved: "5528 / 5597", unproved: 69  }
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/framac-setup

      - name: "Positive control: does -CC actually reach the macro bodies?"
        shell: bash
        run: |
          # If -CC is not taking effect, the bare driver has no contracts at
          # all and WP would verify nothing but RTE guards. Check that the
          # preprocessed TU contains at least one ACSL block that is NOT in a
          # prototype (i.e. survives expansion inside a function definition).
          DRV="vmacros/vdrivers/${{ matrix.family }}_cc_experiment.h"
          N=$(gcc -E -CC -I core/primitives -I core -I semantics -I data -I . \
                -DCANON_NO_REQUIRE -DNDEBUG -x c "${DRV}" 2>/dev/null \
              | grep -c '/\*@' || true)
          echo "ACSL blocks visible after -CC preprocessing: ${N}"
          if [ "${N}" -lt 1 ]; then
            echo "FAIL: -CC produced no ACSL blocks in the preprocessed TU."
            echo "      The instrument is not measuring what it claims to; stop."
            exit 1
          fi
          echo "CONTROL ESTABLISHED — the comparison below is meaningful."

      - name: "WP under -CC: ${{ matrix.family }} (macro-body contracts, bare driver)"
        shell: bash
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-model "${{ matrix.model }}" \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -CC \
              -I core/primitives \
              -I core \
              -I semantics \
              -I data \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            "vmacros/vdrivers/${{ matrix.family }}_cc_experiment.h" \
            2>&1 | tee "wp_cc_${{ matrix.family }}_output.txt"
          echo "WP_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e

      - name: "Report: residual diff against the enforced driver pin (read at run time)"
        shell: bash
        run: |
          OUT="wp_cc_${{ matrix.family }}_output.txt"
          WF=".github/workflows/cmake-multi-platform.yml"
          FAM="${{ matrix.family }}"
          JOB="${{ matrix.driver_job }}"

          echo "==============================================================="
          echo "  -CC (${FAM}) — VERIFY-025 — REPORT-ONLY"
          echo "  frama-c exit: ${WP_EXIT}   model: ${{ matrix.model }}"
          echo "==============================================================="
          PROVED=$(grep -E '^\[wp\] Proved goals:' "${OUT}" | tail -1)
          echo "  ${PROVED}"
          FAILED=$(grep -cE '^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]' "${OUT}" || true)
          echo "  Failed/Invalid/Stepout: ${FAILED}   <-- any nonzero here is a REAL finding"

          # observed residuals
          grep -E '^\[wp\] \[(Timeout|Unknown)\] ' "${OUT}" | awk '{print $3}' | sort -u > /tmp/cc_resid.txt
          echo "  Total unproved (T+U): $(wc -l < /tmp/cc_resid.txt)"

          # baseline: every roll-call array in the driver job. Most jobs keep one
          # CHECKS=( ... ); borrow keeps INHERITED=( 10 ) and OWN_CHECKS=( 4 ).
          # Union them all, bounded to the job's own section of the workflow.
          START=$(grep -n "^  ${JOB}:" "${WF}" | head -1 | cut -d: -f1)
          END=$(awk -v s="${START}" 'NR>s && /^  [a-z0-9-]+:$/ {print NR; exit}' "${WF}")
          [ -z "${END}" ] && END=$(wc -l < "${WF}")
          sed -n "${START},${END}p" "${WF}" \
            | awk '/(CHECKS|INHERITED)=\(/ {f=1} f {print} f && /^ *\)/ {f=0}' \
            | grep -o '"typed[a-z_]*_[^"]*"' | tr -d '"' | sort -u > /tmp/drv_checks.txt
          PIN_N=$(wc -l < /tmp/drv_checks.txt)
          # The value of the assignment only: since the VERIFY-036 F3 ratchet the
          # line also carries a comment listing earlier counts (VERIFY-038).
          EXPECTED=$(awk -v s="${START}" 'NR>=s && /EXPECTED_UNPROVED=/ {print; exit}' "${WF}" \
            | grep -o 'EXPECTED_UNPROVED=[0-9]*' | head -1 | cut -d= -f2)
          echo "  driver pin (${JOB}): ${PIN_N} names, EXPECTED_UNPROVED=${EXPECTED}"
          if [ -z "${EXPECTED}" ] || [ "${PIN_N}" -ne "${EXPECTED}" ]; then
            echo "  WARNING: parsed ${PIN_N} names but the driver job pins ${EXPECTED};"
            echo "           the run-time extraction disagrees with the count — treat"
            echo "           the diff below as advisory until this is resolved."
          fi

          echo
          echo "  --- Pinned under the driver (-C), NOT residual under -CC (closed) ---"
          comm -23 /tmp/drv_checks.txt /tmp/cc_resid.txt | sed 's/^/    /'
          echo "  count: $(comm -23 /tmp/drv_checks.txt /tmp/cc_resid.txt | wc -l)"
          echo
          echo "  --- Residual under -CC, NOT pinned under the driver (new) ---"
          comm -13 /tmp/drv_checks.txt /tmp/cc_resid.txt | sed 's/^/    /'
          echo "  count: $(comm -13 /tmp/drv_checks.txt /tmp/cc_resid.txt | wc -l)"
          echo
          echo "  --- Present in both ---"
          echo "  count: $(comm -12 /tmp/drv_checks.txt /tmp/cc_resid.txt | wc -l)"
          echo
          echo "  Full -CC residual list (name-stability record):"
          sed 's/^/    /' /tmp/cc_resid.txt
          echo "==============================================================="
          echo "  (advisory diff ends; the gates are the next step)"
          echo "==============================================================="

      - name: "Gates 0-3: proved line, zero refutations, exact count, roll-call (ENFORCED)"
        shell: bash
        run: |
          OUT="wp_cc_${{ matrix.family }}_output.txt"
          FAM="${{ matrix.family }}"
          ENFORCE=1
          FAILURES=0

          # --- pinned roll-call for this family (the ratchet edits these files) ---
          PINFILE="vmacros/vdrivers/cc_pins/${FAM}.txt"
          if [ ! -f "${PINFILE}" ]; then
            echo "FAIL: pin file ${PINFILE} missing — the gate cannot run without it."
            exit 1
          fi
          cp "${PINFILE}" /tmp/cc_pin.txt
          sed -i 's/^[[:space:]]*//; /^$/d' /tmp/cc_pin.txt
          sort -u /tmp/cc_pin.txt -o /tmp/cc_pin.txt
          PIN_N=$(wc -l < /tmp/cc_pin.txt)

          echo "==============================================================="
          echo "  -CC (${FAM}) — ENFORCED — pinned at CC #3 (2026-09-21)"
          echo "==============================================================="

          # (0) proved-goal line
          PROVED_LINE=$(grep -E '^\[wp\] Proved goals:' "${OUT}" | tail -1 | sed 's/^\[wp\] Proved goals: *//; s/  */ /g')
          if [ "${PROVED_LINE}" != "${{ matrix.proved }}" ]; then
            echo "FAIL (0): proved-goal summary '${PROVED_LINE}' != pinned '${{ matrix.proved }}'."
            echo "          The goal surface drifted — reclassify in VERIFY-025, then"
            echo "          ratchet proved, unproved and the roll-call together."
            FAILURES=$((FAILURES+1))
          else
            echo "  (0) proved line: ${PROVED_LINE}  OK"
          fi

          # (1) zero refutations / prover errors. WP 29 prints a prover
          #     failure as [Failure], so the check matches both (VERIFY-040).
          BAD=$(grep -cE '^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]' "${OUT}" || true)
          if [ "${BAD}" -ne 0 ]; then
            echo "FAIL (1): ${BAD} Failed/Invalid/Stepout goal(s) — a REAL finding, never ratchet this."
            FAILURES=$((FAILURES+1))
          else
            echo "  (1) Failed/Invalid/Stepout: 0  OK"
          fi

          # (2) exact count
          grep -E '^\[wp\] \[(Timeout|Unknown)\] ' "${OUT}" | awk '{print $3}' | sort -u > /tmp/cc_resid.txt
          N=$(wc -l < /tmp/cc_resid.txt)
          if [ "${N}" -ne "${{ matrix.unproved }}" ]; then
            echo "FAIL (2): unproved count ${N} != pinned ${{ matrix.unproved }}."
            FAILURES=$((FAILURES+1))
          else
            echo "  (2) unproved count: ${N}  OK"
          fi

          # (3) roll-call: set equality
          MISSING=$(comm -23 /tmp/cc_pin.txt /tmp/cc_resid.txt)
          UNPINNED=$(comm -13 /tmp/cc_pin.txt /tmp/cc_resid.txt)
          echo "  (3) roll-call: pinned ${PIN_N}, missing $(echo -n "${MISSING}" | grep -c . || true), unpinned $(echo -n "${UNPINNED}" | grep -c . || true)"
          if [ -n "${MISSING}" ]; then
            echo "FAIL (3): pinned residual(s) now PROVED — RATCHET, in an acknowledged commit:"
            echo "${MISSING}" | sed 's/^/      /'
            FAILURES=$((FAILURES+1))
          fi
          if [ -n "${UNPINNED}" ]; then
            echo "FAIL (3): NEW unproved goal(s) not in the pin — INVESTIGATE:"
            echo "${UNPINNED}" | sed 's/^/      /'
            FAILURES=$((FAILURES+1))
          fi

          echo "==============================================================="
          if [ "${ENFORCE}" -eq 1 ] && [ "${FAILURES}" -gt 0 ]; then
            echo "  VERIFY-025 ENFORCED FAIL: ${FAILURES} check(s) above."
            exit 1
          fi
          echo "  VERIFY-025 ENFORCED: all gates green."
          echo "==============================================================="

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wp-cc-${{ matrix.family }}
          path: wp_cc_${{ matrix.family }}_output.txt
          retention-days: 90
