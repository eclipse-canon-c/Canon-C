  # -------------------------------------------------------------------------
  # 12. CompCert — Linux only, INFORMATIONAL, upstream repository only
  #
  #   Compiles and runs the test suite with ccomp, the formally verified C
  #   compiler, as portability evidence: the sources are accepted by a
  #   compiler whose translation is proved to preserve semantics.
  #
  #   LICENSING — read docs/compcert-licensing.md before enabling this.
  #   CompCert's non-commercial release is used here as a CI-only evaluation
  #   tool under the INRIA Non-Commercial License, per written confirmation
  #   from AbsInt (2026-07-10). That permission covers THIS project's
  #   non-commercial evaluation use and does NOT extend to third parties.
  #
  #   The `if:` guard below therefore restricts the job to the upstream
  #   repository. A fork does not run it unless its owner edits this
  #   condition — an explicit, deliberate act — because running it in a
  #   commercial context would be the fork owner's own use of CompCert and
  #   requires their own licence from AbsInt (https://www.absint.com/).
  #   The default is "off for everyone but upstream" rather than "on unless
  #   you notice the docs", so nobody inherits a licensing obligation by
  #   forking.
  #
  #   `continue-on-error: true` keeps this stream INFORMATIONAL, as the
  #   licensing record states. It is portability evidence, not a gate: a
  #   ccomp failure must never block a merge, and no other evidence stream
  #   (WP proofs, MC/DC, MISRA, fuzzing, sanitizers) depends on it.
  # -------------------------------------------------------------------------
  compcert:
    runs-on: ubuntu-24.04
    if: github.repository == 'eclipse-canon-c/Canon-C'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Restore opam / CompCert cache
        id: compcert-cache
        uses: actions/cache@v5
        with:
          path: ~/.opam
          # Key tracks the PINNED CompCert version below. Bump both
          # together, deliberately — same policy as the cppcheck $Version
          # pin in static-analysis and the CVC5 pin in framac-setup, and
          # for a sharper reason here: this job's output is evidence, and
          # "compiles cleanly under a formally verified compiler" is a
          # claim about a SPECIFIC compiler. A key that does not track the
          # version would restore a stale toolchain after an upstream
          # release with nothing to signal the change.
          key: opam-Linux-ocaml-4.14.2-compcert-3.17-v1

      - name: Install OCaml and opam
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 pkg-config

      - name: Initialise opam and install CompCert
        if: steps.compcert-cache.outputs.cache-hit != 'true'
        run: |
          # coq-compcert is the non-commercial release (INRIA NCL).
          # VERSION IS PINNED: an unpinned `opam install coq-compcert`
          # takes whatever is latest, so the toolchain behind an evidence
          # claim could change without any commit saying so. Bump this and
          # the cache key together, then re-read the run summary — a new
          # CompCert may accept or reject different constructs.
          # Cold build ~12 min (measured, CI #1205); cached thereafter.
          opam init --bare --disable-sandboxing --yes
          opam switch create compcert 4.14.2 --yes
          eval $(opam env --switch=compcert)
          opam repository add coq-released https://coq.inria.fr/opam/released --yes
          opam install coq-compcert.3.17 --yes

      - name: Record CompCert version (provenance for the licensing record)
        # Also a pin check: if ccomp reports anything other than the pinned
        # version, the cache key and the install line have drifted apart and
        # the evidence claim is about a compiler nobody chose.
        run: |
          eval $(opam env --switch=compcert)
          ccomp -version
          if ! ccomp -version | grep -q "version 3.17"; then
            echo "FAIL: ccomp is not the pinned 3.17 — cache key and install"
            echo "      line have drifted. Reconcile both before trusting"
            echo "      this run as portability evidence."
            exit 1
          fi

      - name: Compile and run the test suite with ccomp
        shell: bash
        run: |
          eval $(opam env --switch=compcert)

          # Canon-C's GNU-extension escape hatches, all pre-existing and
          # documented — none added for CompCert's benefit:
          #
          #   CANON_NO_GNU_EXTENSIONS     range.h's RANGE_FOR falls back from
          #                               typeof() to an isize cast;
          #                               contract.h's CANON_UNREACHABLE_HINT
          #                               becomes ((void)0) instead of
          #                               __builtin_unreachable().
          #   CANON_CHECKED_FORCE_FALLBACK  checked.h uses its portable
          #                               overflow arithmetic instead of
          #                               __builtin_*_overflow.
          #   CANON_BITS_FORCE_FALLBACK   bits.h uses its portable clz/ctz/
          #                               popcount instead of the builtins.
          #
          # The two FORCE_FALLBACK flags are the SAME ones the coverage job
          # uses. They are needed here for a reason worth stating: ccomp
          # delegates preprocessing to the system cpp, so __GNUC__ is defined
          # while the headers are preprocessed and the builtin branches are
          # selected — but ccomp itself does not implement
          # __builtin_add_overflow and friends. Forcing the fallback selects
          # the paths that are portable C99, which is what this job is
          # evidence about.
          #
          # -fall enables CompCert's optional features (struct passing and
          # return by value, bit-fields, etc). Canon-C passes bytes_t, str_t
          # and Result by value throughout, so this is not optional for it.
          CCOMP_FLAGS=(
            -fall
            -DCANON_NO_GNU_EXTENSIONS
            -DCANON_CHECKED_FORCE_FALLBACK
            -DCANON_BITS_FORCE_FALLBACK
            -I core/primitives -I core -I semantics -I .
          )
          # The include set is deliberately NARROW. Tests reference library
          # headers path-qualified from the repo root ("data/bitset.h"), so
          # `-I .` covers them; only nine primitives are included bare
          # (bits.h, checked.h, ptr.h, ...), which is what the other three
          # entries are for. Adding `-I util` breaks the build: it puts
          # util/time.h ahead of the system <time.h> on the search path, so
          # `struct timespec` never gets declared and time_test fails to
          # compile. Verified with GCC under exactly these flags before this
          # job was written: 53/53 translation units compile and run.

          mkdir -p ccomp-out
          COMPILED=0; RAN=0; FAILED_COMPILE=(); FAILED_RUN=()

          # The test suite is the compile surface rather than the headers
          # themselves: Canon-C is header-only, and several headers are not
          # standalone translation units by design — hashmap needs
          # HASHMAP_KEY_TYPE defined by the includer, bitset needs a
          # CANON_OPTION(usize) instantiation (see MISRA-SCAN-001 and the
          # Commit 15 header-combination work). The tests ARE complete TUs,
          # they instantiate what they use, and together they include every
          # public header.
          while IFS= read -r t; do
            n=$(basename "$t" .c)
            # A test may have a second source, X_defs.c beside X_test.c,
            # linked in as CMake does (separate_compilation_test, VERIFY-049).
            extra=(); d="${t%_test.c}_defs.c"; [ -f "$d" ] && extra=("$d")
            if ccomp "${CCOMP_FLAGS[@]}" -o "ccomp-out/$n" "$t" "${extra[@]}" \
                 > "ccomp-out/$n.log" 2>&1; then
              COMPILED=$((COMPILED+1))
              if "./ccomp-out/$n" > "ccomp-out/$n.run.log" 2>&1; then
                RAN=$((RAN+1))
              else
                FAILED_RUN+=("$n")
              fi
            else
              FAILED_COMPILE+=("$n")
            fi
          done < <(find test -name '*_test.c' | sort)

          TOTAL=$(find test -name '*_test.c' | wc -l)
          echo "==============================================="
          echo "  CompCert portability evidence (INFORMATIONAL)"
          echo "==============================================="
          echo "  translation units:  ${TOTAL}"
          echo "  compiled by ccomp:  ${COMPILED}"
          echo "  ran successfully:   ${RAN}"
          echo "::notice title=compcert::${COMPILED} / ${TOTAL} compiled, ${RAN} ran"   # VERIFY-050

          if [ ${#FAILED_COMPILE[@]} -gt 0 ]; then
            echo ""
            echo "  did not compile (${#FAILED_COMPILE[@]}):"
            for n in "${FAILED_COMPILE[@]}"; do
              echo "    --- $n ---"
              sed 's/^/      /' "ccomp-out/$n.log" | head -15
            done
          fi
          if [ ${#FAILED_RUN[@]} -gt 0 ]; then
            echo ""
            echo "  compiled but failed at runtime (${#FAILED_RUN[@]}):"
            for n in "${FAILED_RUN[@]}"; do
              echo "    --- $n ---"
              sed 's/^/      /' "ccomp-out/$n.run.log" | tail -15
            done
          fi
          echo "==============================================="
          echo "  This stream is informational — see"
          echo "  docs/compcert-licensing.md for what it does and"
          echo "  does not claim, and for the licensing boundary."
          echo "==============================================="

          # Non-zero exit still surfaces in the log; continue-on-error keeps
          # the run green, per the licensing record's "optional /
          # informational" requirement.
          if [ ${#FAILED_COMPILE[@]} -gt 0 ] || [ ${#FAILED_RUN[@]} -gt 0 ]; then
            exit 1
          fi

      - name: Upload CompCert logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compcert-logs
          path: ccomp-out/*.log
          retention-days: 90
          if-no-files-found: ignore
