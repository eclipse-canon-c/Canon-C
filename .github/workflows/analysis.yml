name: "3 · Static analysis & coverage"
# clang-tidy and Cppcheck, MISRA C:2012 (advisory), MC/DC and branch
# coverage (GCC 14), and CompCert (informational, upstream only).
# Map: .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    # Documentation-only pushes change nothing a gate measures; skip them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'tools/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 2. Static analysis
  # -------------------------------------------------------------------------
  static-analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-tidy and Cppcheck (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck
      - name: Restore Cppcheck build (macOS)
        if: matrix.os == 'macos-latest'
        id: cppcheck-macos-cache
        uses: actions/cache@v5
        with:
          path: ~/cppcheck-pinned
          # Key tracks the PINNED version and commit in the next step.
          # Bump all three together, deliberately.
          key: cppcheck-${{ runner.os }}-${{ runner.arch }}-2.19.0-9730a448fb7e9c205b7ec47b7ba88c5406954538-v1
      - name: Install Cppcheck (macOS)
        # PINNED to 2.19.0, the Windows leg's version. The step used to
        # run `brew install cppcheck`, which takes whatever Homebrew ships.
        # At CI #1366 the leg failed on ten warnings in test/ that
        # Homebrew's current 2.22.0 gives and 2.19.0, 2.20.0 and 2.21.0 do
        # not (VERIFY-039, CI #1366 read). Homebrew keeps no versioned
        # cppcheck formula, so the release is built from source: the
        # commit the 2.19.0 tag names is fetched by hash from the
        # project's repository (cppcheck-opensource/cppcheck, formerly
        # danmar/cppcheck), checked, built with CMake and cached. The
        # cache is saved only when the job passes. Bump version, commit
        # and cache key together, deliberately, and re-check the
        # suppressions when bumping (the Windows $Version policy).
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CPPCHECK_VERSION: "2.19.0"
          CPPCHECK_COMMIT: "9730a448fb7e9c205b7ec47b7ba88c5406954538"
          CACHE_HIT: ${{ steps.cppcheck-macos-cache.outputs.cache-hit }}
        run: |
          PREFIX="${HOME}/cppcheck-pinned"
          if [ "${CACHE_HIT}" != "true" ]; then
            SRC="${RUNNER_TEMP}/cppcheck-src"
            BUILD="${RUNNER_TEMP}/cppcheck-build"
            git init -q "${SRC}"
            git -C "${SRC}" fetch -q --depth 1 \
              https://github.com/cppcheck-opensource/cppcheck.git "${CPPCHECK_COMMIT}"
            git -C "${SRC}" checkout -q FETCH_HEAD
            ACTUAL=$(git -C "${SRC}" rev-parse HEAD)
            if [ "${ACTUAL}" != "${CPPCHECK_COMMIT}" ]; then
              echo "cppcheck commit mismatch. Expected ${CPPCHECK_COMMIT}, got ${ACTUAL}"
              exit 1
            fi
            cmake -S "${SRC}" -B "${BUILD}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
              -DUSE_MATCHCOMPILER=Off \
              -DBUILD_GUI=Off \
              -DBUILD_TESTS=Off
            cmake --build "${BUILD}" -j "$(sysctl -n hw.ncpu)"
            cmake --install "${BUILD}"
          fi
          VERSION_LINE=$("${PREFIX}/bin/cppcheck" --version)
          echo "${VERSION_LINE}"
          if [ "${VERSION_LINE}" != "Cppcheck ${CPPCHECK_VERSION}" ]; then
            echo "cppcheck version mismatch. Expected ${CPPCHECK_VERSION}"
            exit 1
          fi
          echo "${PREFIX}/bin" >> "${GITHUB_PATH}"
      - name: Install Cppcheck (Windows)
        # Pinned direct download from the official GitHub release —
        # same pattern as the CVC5 install in framac-setup, for the
        # same reason: deterministic tool versions. winget was removed
        # after 0x8a15000f stale-source failures on hosted runners
        # (winget depends on msstore source state the runner images
        # don't reliably ship). Note: the repo has moved to
        # cppcheck-opensource/cppcheck; GitHub redirects danmar/ URLs.
        # Bump $Version deliberately — cppcheck version changes can
        # move findings, so re-check suppressions when bumping.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Version  = "2.19.0"
          $Checksum = "AAC15F6DC2B404B3B2562015419F11D91F391E686279CABD20627A8435782128"
          $Url = "https://github.com/danmar/cppcheck/releases/download/$Version/cppcheck-$Version-x64-Setup.msi"
          Invoke-WebRequest -Uri $Url -OutFile cppcheck.msi
          $Actual = (Get-FileHash cppcheck.msi -Algorithm SHA256).Hash
          if ($Actual -ne $Checksum) {
            Write-Error "cppcheck MSI checksum mismatch. Expected $Checksum, got $Actual"
            exit 1
          }
          Start-Process msiexec.exe -ArgumentList '/i','cppcheck.msi','/qn','/norestart' -Wait
          $Exe = Get-ChildItem "C:\Program Files\Cppcheck" -Filter "cppcheck.exe" `
            -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Exe) {
            Write-Error "cppcheck.exe not found after MSI install"
            exit 1
          }
          Add-Content $env:GITHUB_PATH $Exe.DirectoryName
          & $Exe.FullName --version
      - name: Configure CMake for compile_commands.json (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -S "${{ github.workspace }}"
      - name: Run clang-tidy (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          SKIP="dynstring_test.c dynvec_test.c"
          FILES=""
          for f in $(find "${{ github.workspace }}/test" -name "*.c" 2>/dev/null | sort); do
            if ! grep -qE '[^[:space:]]' "$f"; then continue; fi
            BASENAME=$(basename "$f")
            SKIP_THIS=0
            for s in $SKIP; do
              if [ "$BASENAME" = "$s" ]; then SKIP_THIS=1; break; fi
            done
            if [ "$SKIP_THIS" = "1" ]; then continue; fi
            FILES="$FILES $f"
          done
          if [ -z "$FILES" ]; then
            echo "No files to analyse — skipping clang-tidy"
            exit 0
          fi
          clang-tidy \
            -p build \
            --extra-arg="-I${{ github.workspace }}/core/primitives" \
            --extra-arg="-I${{ github.workspace }}/core" \
            --extra-arg="-I${{ github.workspace }}" \
            $FILES
      - name: Run Cppcheck (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cppcheck \
            --enable=warning \
            --std=c99 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            "--suppress=returnDanglingLifetime:*slice_test.c" \
            "--suppress=returnDanglingLifetime:*borrow_test.c" \
            "--suppress=returnDanglingLifetime:*array_test.c" \
            "--suppress=returnDanglingLifetime:*any_all_test.c" \
            "--suppress=returnDanglingLifetime:*filter_test.c" \
            "--suppress=returnDanglingLifetime:*find_test.c" \
            "--suppress=returnDanglingLifetime:*fold_test.c" \
            "--suppress=returnDanglingLifetime:*map_test.c" \
            "--suppress=returnDanglingLifetime:*reverse_test.c" \
            "--suppress=returnDanglingLifetime:*search_test.c" \
            "--suppress=returnDanglingLifetime:*sort_test.c" \
            "--suppress=returnDanglingLifetime:*unique_test.c" \
            "--suppress=literalWithCharPtrCompare:*diag_test.c" \
            "--suppress=arrayIndexOutOfBounds:*diag.h" \
            "--suppress=ctunullpointer:*deque_test.c" \
            "--suppress=ctunullpointer:*vec_test.c" \
            "--suppress=ctunullpointer:*hashmap_test.c" \
            "--suppress=ctunullpointer:*queue_test.c" \
            "--suppress=ctunullpointer:*stack_test.c" \
            "--suppress=ctunullpointer:*array_test.c" \
            -I "${{ github.workspace }}/core/primitives" \
            -I "${{ github.workspace }}/core" \
            -I "${{ github.workspace }}/semantics" \
            -I "${{ github.workspace }}/data" \
            -I "${{ github.workspace }}/algo" \
            -I "${{ github.workspace }}/util" \
            -I "${{ github.workspace }}" \
            "${{ github.workspace }}/test"
      - name: Run Cppcheck (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cppcheck `
            --enable=warning `
            --std=c99 `
            --error-exitcode=1 `
            --suppress=missingIncludeSystem `
            --suppress=toomanyconfigs `
            "--suppress=returnDanglingLifetime:*slice_test.c" `
            "--suppress=returnDanglingLifetime:*borrow_test.c" `
            "--suppress=returnDanglingLifetime:*array_test.c" `
            "--suppress=returnDanglingLifetime:*any_all_test.c" `
            "--suppress=returnDanglingLifetime:*filter_test.c" `
            "--suppress=returnDanglingLifetime:*find_test.c" `
            "--suppress=returnDanglingLifetime:*fold_test.c" `
            "--suppress=returnDanglingLifetime:*map_test.c" `
            "--suppress=returnDanglingLifetime:*reverse_test.c" `
            "--suppress=returnDanglingLifetime:*search_test.c" `
            "--suppress=returnDanglingLifetime:*sort_test.c" `
            "--suppress=returnDanglingLifetime:*unique_test.c" `
            "--suppress=literalWithCharPtrCompare:*diag_test.c" `
            "--suppress=arrayIndexOutOfBounds:*diag.h" `
            "--suppress=ctunullpointer:*deque_test.c" `
            "--suppress=ctunullpointer:*vec_test.c" `
            "--suppress=ctunullpointer:*hashmap_test.c" `
            "--suppress=ctunullpointer:*queue_test.c" `
            "--suppress=ctunullpointer:*stack_test.c" `
            "--suppress=ctunullpointer:*array_test.c" `
            -I "${{ github.workspace }}/core/primitives" `
            -I "${{ github.workspace }}/core" `
            -I "${{ github.workspace }}/semantics" `
            -I "${{ github.workspace }}/data" `
            -I "${{ github.workspace }}/algo" `
            -I "${{ github.workspace }}/util" `
            -I "${{ github.workspace }}" `
            "${{ github.workspace }}/test"

  # -------------------------------------------------------------------------
  # 7. MISRA C:2012 advisory analysis (Linux only)
  #
  #    Uses Cppcheck's MISRA addon for preliminary compliance checking.
  #    This is NOT a qualified MISRA checker — it covers approximately
  #    60-70% of MISRA C:2012 rules. For certification, replace with
  #    a qualified tool: Polyspace, LDRA, PC-lint, or Parasoft C/C++test.
  #
  #    Findings are advisory — real violations do not fail the build.
  #    Their purpose is to track MISRA compliance progress and identify
  #    deviations that must be documented in docs/deviations.md
  #    (inline via `cppcheck-suppress misra-c2012-X.Y` comments,
  #    honored through --inline-suppr).
  #
  #    The INSTRUMENT, however, is enforced: canary/misra_canary.h
  #    contains intentional violations, and the job FAILS if they are
  #    not detected. Rationale: cppcheck emits MISRA addon findings at
  #    "style" severity, which is silently discarded without
  #    --enable=style — this job previously reported "0 violations"
  #    for that exact reason while the addon's findings were being
  #    filtered out. The canary makes any such silent breakage of the
  #    toolchain (severity filtering, addon resolution, packaging
  #    changes) a hard failure instead of a fake-green zero.
  #
  #    PROJECT-WIDE RULE DEVIATIONS — each maps 1:1 to a record in
  #    docs/deviations.md (do not add a suppression without one):
  #      15.5        MISRA-DEV-001  early-return guard-clause style
  #      2.5         MISRA-DEV-002  standalone-TU unused-macro artifact
  #      20.10       MISRA-DEV-003  ## is the type-instantiation mechanism
  #      3.1         MISRA-DEV-004  // and /* inside doc comments (URLs)
  #      5.6/5.8/5.9 MISRA-DEV-005  instantiation-header identifier artifact
  #      11.5        MISRA-DEV-006  void* generic interface level
  #      20.5        MISRA-DEV-007  #undef template-parameter cleanup
  #      18.4        MISRA-DEV-008  bounded slice/string pointer arithmetic
  #      17.1        MISRA-DEV-009  stdarg in fmt/log entry points (Tier 2)
  #      11.6        MISRA-DEV-010  uintptr_t alignment round-trips
  #                                 (same sites as VERIFY-006/-008)
  #    CANARY INTERACTION: the canary relies on rules 21.6, 14.4/15.1,
  #    and 10.1 — none of which may be added to the list above without
  #    path-scoping the suppression, or the self-test goes blind.
  #
  #    PER-LINE MASKING (measured property of cppcheck's misra output):
  #    at most one misra violation is reported per source line, so a
  #    line violating several rules shows only one until that one is
  #    suppressed or fixed — then the next surfaces. All counts in this
  #    job and in the MISRA-DEV records are counts of VISIBLE findings
  #    under the then-active suppression set, i.e. lower bounds. The
  #    1672-finding baseline unmasked 224 shadowed findings when the
  #    892 deviation-covered findings were suppressed (-> 1004).
  #
  #    Suppressions (tool limitations):
  #      - misra-config:*_impl.h — macro-templated implementation headers
  #        (hashmap_impl.h, deque_impl.h, etc.) emit [misra-config]
  #        errors because Cppcheck cannot resolve macro-instantiated
  #        type names (e.g. HASHMAP_SLOT_NAME) without an instantiation
  #        context. This is a tool limitation, not a code defect
  #        (MISRA-CFG-001). Qualified MISRA checkers handle this
  #        correctly via full preprocessor-aware analysis.
  # -------------------------------------------------------------------------
  misra:
    # PINNED RUNNER — not ubuntu-latest. The misra job's finding set is a
    # function of the cppcheck/misra-addon version, which comes from the
    # runner image's apt archive (24.04 -> cppcheck 2.13.0, newer images
    # -> 2.17+ with expanded MISRA coverage: rules 19.2/8.7/5.7 and
    # macro-body 15.6 descent). During the ubuntu-latest image migration
    # the label is nondeterministic and the Real count flips 780 <-> 1004
    # between pushes. Pin the image = pin the tool = stable baseline.
    # Bump this pin DELIBERATELY (same policy as the Windows cppcheck
    # $Version pin in static-analysis): re-baseline the counts, add/extend
    # deviation records for newly covered rules (19.2 union-backed result,
    # 5.7 instantiation-header tags -> MISRA-DEV-005, 15.6 grows to ~262,
    # 12.3 comma declarators, 8.7 standalone-TU linkage artifact), then
    # move the pin and the expected count in one acknowledged commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Run MISRA C:2012 analysis on library headers
        shell: bash
        run: |
          # SCAN SURFACE (re-baselined 2026-07-25, Commit 12 — see
          # MISRA-SCAN-001 in docs/deviations.md).
          #
          # `*_impl.h` and `*_mangle.h` are INTERNAL TEMPLATE FRAGMENTS: they
          # are never compiled alone and depend on macros (`*_LINKAGE`, type
          # parameters) that their including entry point supplies. Handing them
          # to cppcheck as standalone translation units left those macros
          # undefined, the function signatures unparseable, and produced
          # findings that describe the scan rather than the code. Excluding
          # them does NOT reduce analysis coverage: every fragment is reached
          # through an entry point that IS scanned (verified by include-graph
          # reachability — 28 fragments, 0 unreached), so their contents are
          # still analysed, with configuration, and findings are still reported
          # at their own file:line.
          #
          # `*_decl.h` / `*_defn.h` are deliberately NOT excluded: nothing
          # includes them, so they are user-facing entry points whose content
          # would go entirely unanalysed if dropped.
          HEADERS=$(find \
            "${{ github.workspace }}/core" \
            "${{ github.workspace }}/semantics" \
            "${{ github.workspace }}/data" \
            "${{ github.workspace }}/algo" \
            "${{ github.workspace }}/util" \
            "${{ github.workspace }}/canary" \
            -name "*.h" -type f 2>/dev/null \
            | grep -vE '_(impl|mangle)\.h$' | sort)
          if [ -z "$HEADERS" ]; then
            echo "No header files found — skipping MISRA analysis"
            exit 0
          fi
          echo "Found $(echo "$HEADERS" | wc -l) header files to analyze"
          echo "Toolchain: $(cppcheck --version)" | tee misra_toolchain.txt
          cppcheck \
            --addon=misra \
            --enable=style \
            --inline-suppr \
            --std=c99 \
            --language=c \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            "--suppress=misra-config:*_impl.h" \
            --suppress=misra-c2012-15.5 \
            --suppress=misra-c2012-2.5 \
            --suppress=misra-c2012-20.10 \
            --suppress=misra-c2012-3.1 \
            --suppress=misra-c2012-5.6 \
            --suppress=misra-c2012-5.8 \
            --suppress=misra-c2012-5.9 \
            --suppress=misra-c2012-11.5 \
            --suppress=misra-c2012-20.5 \
            --suppress=misra-c2012-18.4 \
            --suppress=misra-c2012-17.1 \
            --suppress=misra-c2012-11.6 \
            -I "${{ github.workspace }}/core/primitives" \
            -I "${{ github.workspace }}/core" \
            -I "${{ github.workspace }}/semantics" \
            -I "${{ github.workspace }}/data" \
            -I "${{ github.workspace }}/algo" \
            -I "${{ github.workspace }}/util" \
            -I "${{ github.workspace }}" \
            $HEADERS \
            2>&1 | tee misra_report.txt
          echo ""
          # ---- Instrument self-test: the canary MUST be flagged ----
          CANARY=$(grep -c "misra_canary\.h.*\[misra-" misra_report.txt || true)
          if [ "${CANARY}" -eq 0 ]; then
            echo "FAIL: MISRA self-test — canary violations not detected."
            echo "The addon is not producing output; any count is meaningless."
            exit 1
          fi
          TOTAL=$(grep -c "\[misra-" misra_report.txt || true)
          echo "==============================================="
          echo "  MISRA C:2012 Summary"
          echo "==============================================="
          echo "  Toolchain: $(cppcheck --version) (runner-pinned; see job comment)"
          echo "  Canary findings (expected >0): ${CANARY}"
          echo "  Total violations incl. canary: ${TOTAL}"
          echo "  Real violations:               $((TOTAL - CANARY))"
          echo "::notice title=misra::real $((TOTAL - CANARY)); canary ${CANARY}; total ${TOTAL}"   # VERIFY-050
          echo ""
          echo "  Expected real count: 55 (pinned; cppcheck 2.13.0,"
          echo "  suppression set MISRA-DEV-001..012 + 014..017)."
          echo "  53 -> 54 at VERIFY-031 run 1 (f6e54ca): one 21.2 at"
          echo "  data/stringbuf.h's __FRAMAC__-only vsnprintf axiom — the"
          echo "  same shape as semantics/diag.h's two (snprintf, fprintf)."
          echo "  54 -> 55 at VERIFY-044 (predicted from a local scan):"
          echo "  CANON_RESULT(_Bool, Error) lets cppcheck, which does not"
          echo "  read <stdbool.h>, see the names the compiler sees. Two 5.5"
          echo "  go (log.h, fold_impl.h); two 5.7 (same two lines) and one"
          echo "  2.3 (fold.h's result_bool_Error typedef) appear."
          echo ""
          echo "  The ledger reads as TWO SEGMENTS joined at Commit 12,"
          echo "  because MISRA-SCAN-001 re-baselined the analysis surface"
          echo "  itself (template fragments are not translation units):"
          echo "    pre-2026-07-25 surface: 1672 -> 108"
          echo "    corrected surface:       98 ->  53 -> 54"
          echo "  (53 at the campaign's close; the 54th is the VERIFY-031"
          echo "  axiom above — a recorded addition, not a regression.)"
          echo "  -10 of that step is the INSTRUMENT, not the code, and the"
          echo "  two segments are not directly comparable. See"
          echo "  MISRA-SCAN-001 for the reachability proof that excluding"
          echo "  28 fragments loses no analysis coverage."
          echo ""
          echo "  Eighteen rules now held at zero — fourteen by fix"
          echo "  (21.1, 10.4, 15.6, 12.1, 14.4, 17.7, 20.7, 17.8, 10.7,"
          echo "  13.3, 12.3, 14.2, 10.8, 11.8) and four by documented"
          echo "  deviation (19.2 unions, 21.3 allocation, 21.6 stdio,"
          echo "  2.3 static-assertion idiom — MISRA-DEV-014..017)."
          echo ""
          echo "  Two of those rules found REAL DEFECTS rather than style"
          echo "  noise: rule 5.7 exposed eleven public header pairs that"
          echo "  could not be compiled together (Commit 15, guarded by"
          echo "  test/integration/header_combination_test.c), and rule"
          echo "  11.8 exposed ten accessors that took a const pointer and"
          echo "  returned mutable access to the object storage (API-001,"
          echo "  guarded by test/integration/const_correctness_test.c)."
          echo ""
          echo "  NOTE — per-line masking: cppcheck reports at most ONE"
          echo "  misra violation per source line. Counts are therefore a"
          echo "  LOWER BOUND on (line, rule) pairs: suppressing or fixing"
          echo "  a rule can SURFACE previously shadowed violations on the"
          echo "  same lines (measured: suppressing 892 baseline findings"
          echo "  surfaced 224 shadowed ones, 1672 -> 1004, all 224"
          echo "  machine-verified as same-line unmaskings). A count that"
          echo "  RISES after cleanup work is surfacing, not regression —"
          echo "  diff the report artifact against the previous run before"
          echo "  concluding anything."
          echo ""
          echo "  Advisory only — real violations do not fail the build."
          echo ""
          echo "  NOTE: Rule category breakdown (Mandatory/Required/Advisory)"
          echo "  requires a MISRA rule lookup table and is not produced by"
          echo "  Cppcheck alone. For certification, use a qualified tool"
          echo "  (Polyspace, LDRA, PC-lint) that emits categorized output."
          echo ""
          echo "  Deviations documented in: docs/deviations.md"
          echo "  (MISRA-DEV-001..010 project-wide, applied as the"
          echo "  command-line suppressions above; MISRA-DEV-011 inline at"
          echo "  util/time.h; MISRA-DEV-012 inline at 117 template-"
          echo "  machinery macros; MISRA-DEV-014..017 inline at 34"
          echo "  design-identity sites; MISRA-CFG-001 tool."
          echo "  MISRA-DEV-013 is SUPERSEDED — MISRA-SCAN-001 removed the"
          echo "  condition it existed for and its 13 suppressions were"
          echo "  deleted, verified dead beforehand.)"
          echo "==============================================="
          # Real violations are advisory by design. When MISRA compliance
          # is mature, uncomment to enforce a zero-real-violations gate:
          # if [ "$((TOTAL - CANARY))" -gt 0 ]; then
          #   echo "FAIL: $((TOTAL - CANARY)) MISRA violations found"
          #   exit 1
          # fi
      - name: Upload MISRA report
        uses: actions/upload-artifact@v6
        with:
          name: misra-report
          path: |
            misra_report.txt
            misra_toolchain.txt
          
          retention-days: 90

  # -------------------------------------------------------------------------
  # 6. MC/DC coverage — GCC 14 -fcondition-coverage (Linux only)
  #
  #    -DCANON_CHECKED_FORCE_FALLBACK and -DCANON_BITS_FORCE_FALLBACK are
  #    passed so the fallback paths in checked.h and bits.h are exercised.
  #    Without these flags, GCC expands builtins to single instructions
  #    with no branches, the #else fallback blocks become dead code, and
  #    gcov reports 0% MC/DC on them. Forcing the fallback makes coverage
  #    measure the same code Frama-C is proving — the two tracks stay
  #    consistent.
  # -------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC 14 and lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 lcov
      - name: Configure CMake with MC/DC coverage instrumentation
        # CANON_CHECKED_FORCE_FALLBACK: exercise the same fallback path WP
        #   verifies (otherwise GCC expands __builtin_*_overflow to single
        #   instructions with no branches for gcov to see).
        # CANON_BITS_FORCE_FALLBACK: same rationale for bits.h — forces the
        #   portable fallback paths for popcount, clz, ctz, and bswap
        #   instead of compiler builtins.
        # CANON_NO_REQUIRE: compiles CHECKED_ASSERT_RESULT(result) out to
        #   nothing. Without this, every function contains a runtime NULL
        #   assertion whose NULL branch is structurally unreachable (the
        #   ACSL `requires \valid(result)` clause proves it for every
        #   caller), yet gcov counts it as an uncovered branch. Defining
        #   CANON_NO_REQUIRE removes the assertion from the preprocessed
        #   source, keeping MC/DC measurement focused on real branches.
        #   The frama-c job passes the same flag for the same reason, so
        #   the WP and coverage evidence streams stay aligned.
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fcondition-coverage -DCANON_CHECKED_FORCE_FALLBACK -DCANON_BITS_FORCE_FALLBACK -DCANON_NO_REQUIRE" \
            -DENABLE_SANITIZERS=OFF \
            -DENABLE_COVERAGE_TUS=ON \
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build build
      - name: Run tests
        working-directory: build
        # contract_test is excluded here: the coverage build defines
        # CANON_NO_REQUIRE, which compiles require()/require_msg() into
        # ((void)0). contract_test's entire purpose is to verify that
        # those macros fire when preconditions are violated, so with
        # the macros disabled every assertion in the test fails by
        # design. contract_test still runs (and passes) in every other
        # CI job — build, valgrind, fuzzing — where CANON_NO_REQUIRE is
        # not defined. Excluding it here is honest about what the
        # coverage build measures: the fallback path of the Canon-C
        # library headers, not the assertion infrastructure itself.
        # Also excluded: the two test/integration/ guards. They are
        # COMPILE-TIME assertions — header_combination_test proves public
        # headers can be combined, const_correctness_test proves read-only
        # accessors reject mutable use (API-001). Neither adds behavioural
        # coverage, but both include many headers shallowly, and the MC/DC
        # aggregation below takes the MAX condition total per file across
        # translation units. A broad-but-shallow TU therefore DISPLACES a
        # narrow-but-thorough one as the max and lowers the reported
        # percentage for files nobody changed. Excluding them keeps the
        # report measuring behavioural coverage. They still run in every
        # other job, where their failure modes (compile errors) surface.
        run: ctest --build-config Debug --output-on-failure --exclude-regex '^(contract_test|header_combination_test|const_correctness_test)$'
      - name: Run MC/DC cover TUs (Shape-B modules)
        working-directory: build
        # Cover TUs are not ctests — run them directly so their .gcda is
        # written. They exit 0; they exist to emit coverage, not to assert.
        run: |
          ./option_cover
          ./result_cover
          ./vec_cover
          ./deque_cover
          ./deque_cover
          ./vec_range_cover
          ./vec_fmt_cover
          ./stack_cover
      
      - name: Collect branch coverage data (lcov)
        run: |
          lcov --capture \
            --directory build \
            --output-file coverage_raw.info \
            --rc branch_coverage=1 \
            --ignore-errors unused \
            --gcov-tool gcov-14
          lcov --remove coverage_raw.info \
            '/usr/*' \
            '*/test/*' \
            --output-file coverage.info \
            --rc branch_coverage=1 \
            --ignore-errors unused
      - name: Collect MC/DC condition coverage (gcov-14 --conditions)
        run: |
          cd build
          for gcda in $(find . -name "*.gcda" | sort); do
            gcov-14 --conditions "$gcda" 2>/dev/null
          done > gcov_output.txt 2>&1
          awk '
            /^File / {
              current = $0
              sub(/^File /, "", current)
              gsub(/'\''/, "", current)
              have_file = 1
              next
            }
            /^Condition outcomes covered:/ {
              if (have_file) {
                print current "\t" $0
                have_file = 0
              }
            }
          ' gcov_output.txt | \
            grep -v "/test/" | \
            sed "s|${{ github.workspace }}/||" | \
            tee mcdc_per_file.txt
          python3 << 'PYEOF'
          import re
          best = {}
          with open("mcdc_per_file.txt") as f:
              for line in f:
                  parts = line.strip().split("\t")
                  if len(parts) < 2:
                      continue
                  filename = parts[0].strip()
                  m = re.search(r"([\d.]+)% of (\d+)", parts[1])
                  if not m:
                      continue
                  pct = float(m.group(1))
                  total = int(m.group(2))
                  hit = int(total * pct / 100 + 0.5)
                  if filename not in best:
                      best[filename] = (pct, hit, total)
                  else:
                      cur_pct, cur_hit, cur_total = best[filename]
                      if total > cur_total or (total == cur_total and pct > cur_pct):
                          best[filename] = (pct, hit, total)
          results = [(v[0], v[1], v[2], v[2]-v[1], k) for k, v in best.items()]
          results.sort()
          total_hit = sum(r[1] for r in results)
          total_all = sum(r[2] for r in results)
          overall = 100.0 * total_hit / total_all if total_all else 0
          print()
          print("=" * 85)
          print("  Canon-C MC/DC Condition Coverage (GCC 14 -fcondition-coverage)")
          print("=" * 85)
          print(f"  {'File':<50} {'MC/DC%':>8} {'Hit':>5} {'Total':>6} {'Missed':>7}")
          print("-" * 85)
          for pct, hit, total, missed, f in results:
              print(f"  {f:<50} {pct:>7.1f}% {hit:>5} {total:>6} {missed:>7}")
          print("-" * 85)
          print(f"  {'TOTAL':<50} {overall:>7.1f}% {total_hit:>5} {total_all:>6} {total_all-total_hit:>7}")
          print("=" * 85)
          covers = "; ".join(f"{f} {hit}/{total}" for pct, hit, total, missed, f in results
                             if f.startswith("vmacros/coverage/"))
          print(f"::notice title=coverage::MC/DC {total_hit} / {total_all}; {covers}")   # VERIFY-050
          with open("mcdc_summary.txt", "w") as out:
              out.write(f"{overall:.1f}\n")
              out.write(f"{total_hit}\n")
              out.write(f"{total_all}\n")
          PYEOF
