        # guards are ((void)0) and those calls are UB — see F1 in
        # deque_verify.h, the peek_*/pop_* NULL-guard asymmetry.
        #
        # NOTE: deque is Shape B; conditions attribute to deque_cover.c
        # itself (direct DEFINE_DEQUE instantiation — vec_cover's
