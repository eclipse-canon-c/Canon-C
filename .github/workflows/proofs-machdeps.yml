name: "11 · Proofs: machine models"
# VERIFY-060 (docs/deviations.md). The ten core/ units, proved at nine
# machine models besides Frama-C's default x86_64, at which proofs-core.yml
# proves them:
#   - from tools/machdeps/, generated from the targets' compilers, committed
#     and drift-checked by machdeps.yml: Cortex-M4 (read with -enums
#     gcc-short-enums, arm-none-eabi's enum layout), RV32 and RV64 bare
#     metal, 32-bit Arm, RV64 and AArch64 Linux, and big-endian 32-bit
#     PowerPC Linux;
#   - Frama-C's own ppc_32 (big-endian) and msvc_x86_64 (LLP64).
# Each job runs its unit's x86_64 proof command from proofs-core.yml with the
# model added, reports the proved line and the unproved goals by name, and
# fails unless both are its pins: tools/machdeps/pins/<unit>.<class>.txt, one
# file per unit and class of models (ilp32, lp64, llp64), since the models of
# a class gave the same results at phase B's three runs. Enforced since phase
# C. Each pinned residual is one the x86_64 job pins too
# (tools/machdeps/check_pins.py, run by 8 · Records). Ninety jobs, about 24
# runner-hours a run, so it runs only when core/, the models, this file or
# the Frama-C setup change, and by hand; at most 30 at once. The char control
# of phase B's run 2 is a probe now (probes.yml).
# Map: .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    paths:
      - 'core/**'
      - 'tools/machdeps/**'
      - '.github/workflows/proofs-machdeps.yml'
      - '.github/actions/framac-setup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp:
    name: "frama-c-${{ matrix.unit.name }} @ ${{ matrix.model.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.unit.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        model:
          - { name: cortex_m4,           class: ilp32, args: "-machdep tools/machdeps/machdep_cortex_m4.yaml -enums gcc-short-enums" }
          - { name: rv32_ilp32,          class: ilp32, args: "-machdep tools/machdeps/machdep_rv32_ilp32.yaml" }
          - { name: rv64_lp64,           class: lp64,  args: "-machdep tools/machdeps/machdep_rv64_lp64.yaml" }
          - { name: arm_linux_gnueabihf, class: ilp32, args: "-machdep tools/machdeps/machdep_arm_linux_gnueabihf.yaml" }
          - { name: rv64_linux_gnu,      class: lp64,  args: "-machdep tools/machdeps/machdep_rv64_linux_gnu.yaml" }
          - { name: aarch64_linux_gnu,   class: lp64,  args: "-machdep tools/machdeps/machdep_aarch64_linux_gnu.yaml" }
          - { name: ppc32_linux_gnu,     class: ilp32, args: "-machdep tools/machdeps/machdep_ppc32_linux_gnu.yaml" }
          - { name: ppc_32,              class: ilp32, args: "-machdep ppc_32" }
          - { name: msvc_x86_64,         class: llp64, args: "-machdep msvc_x86_64" }
        # Each unit's memory model and extra definitions are its x86_64 job's
        # (proofs-core.yml). minutes leaves room for a slow setup: run 1 saw
        # one of 47 minutes.
        unit:
          - { name: checked,  file: core/primitives/checked.h,  wp_model: "",                     defs: "", minutes: 120 }
          - { name: bits,     file: core/primitives/bits.h,     wp_model: "",                     defs: "", minutes: 120 }
          - { name: compare,  file: core/primitives/compare.h,  wp_model: "-wp-model Typed+Cast", defs: "", minutes: 120 }
          - { name: ptr,      file: core/primitives/ptr.h,      wp_model: "-wp-model Typed+Cast", defs: "", minutes: 120 }
          - { name: slice,    file: core/slice.h,               wp_model: "-wp-model Typed+Cast", defs: "", minutes: 120 }
          - { name: memory,   file: core/memory.h,              wp_model: "-wp-model Typed+Cast", defs: "", minutes: 240 }
          - { name: arena,    file: core/arena.h,               wp_model: "-wp-model Typed+Cast", defs: "", minutes: 240 }
          - { name: pool,     file: core/pool.h,                wp_model: "-wp-model Typed+Cast", defs: "", minutes: 240 }
          - { name: region,   file: core/region.h,              wp_model: "-wp-model Typed+Cast", defs: "", minutes: 300 }
          - { name: lifetime, file: core/primitives/lifetime.h, wp_model: "-wp-model Typed",      defs: "-DCANON_LIFETIME_DEBUG -DCANON_LIFETIME_NO_ATOMICS", minutes: 120 }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: ${{ matrix.unit.file }} at ${{ matrix.model.name }} (VERIFY-060, enforced)"
        env:
          MODEL_ARGS: ${{ matrix.model.args }}
          WP_MODEL: ${{ matrix.unit.wp_model }}
          DEFS: ${{ matrix.unit.defs }}
          UNIT: ${{ matrix.unit.file }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          # The unit's x86_64 command (proofs-core.yml), with the model added.
          # shellcheck disable=SC2086
          frama-c -wp -wp-rte ${MODEL_ARGS} ${WP_MODEL} \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" -I core/primitives -I core -I . ${DEFS} -DCANON_NO_REQUIRE -DNDEBUG" \
            "${UNIT}" 2>&1 | tee wp_output.txt
          echo "WP exit status: ${PIPESTATUS[0]}"
          exit 0
      - name: "The proved line, and the unproved goals by name"
        if: always()
        run: |
          echo "== ${{ matrix.unit.name }} at ${{ matrix.model.name }}"
          grep -E "^\[wp\] Proved goals:" wp_output.txt || echo "NO WP SUMMARY"
          grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Failure|Invalid|Stepout)\]" wp_output.txt \
            | sed -E 's/^\[wp\] \[([A-Za-z]+)\] (Goal )?([^ ]+).*/UNPROVED \3 \1/' | sort || true
      - name: "Gate: the pins of the model's class (VERIFY-060, enforced)"
        env:
          PIN: tools/machdeps/pins/${{ matrix.unit.name }}.${{ matrix.model.class }}.txt
        run: |
          want=$(grep -E '^proved ' "${PIN}" | sed 's/^proved //')
          got=$(grep -E "^\[wp\] Proved goals:" wp_output.txt | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
          { grep -E '^typed' "${PIN}" || true; } | sort > want_names.txt
          { grep -E "^\[wp\] \[(Timeout|Unknown)\]" wp_output.txt || true; } \
            | sed -E 's/^\[wp\] \[[A-Za-z]+\] (Goal )?([^ ]+).*/\2/' | sort -u > got_names.txt
          bad=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" wp_output.txt || true)
          fail=0
          if [ "${got}" != "${want}" ]; then
            echo "FAIL: proved ${got:-none}, pinned ${want} (${PIN})"
            fail=1
          fi
          if [ "${bad:-0}" != 0 ]; then
            echo "FAIL: ${bad} Failed, Invalid or Stepout verdict(s)"
            fail=1
          fi
          if ! diff want_names.txt got_names.txt > names.diff; then
            echo "FAIL: the unproved goals are not ${PIN}'s (< pinned, > this run):"
            cat names.diff
            fail=1
          fi
          if [ "${fail}" = 0 ]; then
            echo "PASS: proved ${got}, and the $(wc -l < got_names.txt) unproved goals of ${PIN}"
          fi
          exit "${fail}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wp-${{ matrix.unit.name }}-${{ matrix.model.name }}
          path: wp_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        if: always()
        run: |
          P=$(grep -E "^\[wp\] Proved goals:" wp_output.txt | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
          U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" wp_output.txt || true)
          B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" wp_output.txt || true)
          W=$(grep -E '^proved ' "tools/machdeps/pins/${{ matrix.unit.name }}.${{ matrix.model.class }}.txt" | sed 's/^proved //' || true)
          echo "::notice title=frama-c-${{ matrix.unit.name }} @ ${{ matrix.model.name }}::proved ${P:-none} (pin ${W:-?}, ${{ matrix.model.class }}); unproved ${U:-?}; failed/invalid/stepout ${B:-?}"
