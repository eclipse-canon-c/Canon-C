name: G19 probe (VERIFY-039, a loop's frame stated for one behaviour under WP 29)

# ---------------------------------------------------------------------------
# VERIFY-039 G19 — an experiment, not a gate. It runs when the probe, its
# script, this file or the toolchain pins change, and on demand; it never
# touches the enforced jobs, and its result is scored in docs/deviations.md,
# VERIFY-039 G19.
#
# QUESTION: does WP 29 take a loop's frame stated for one behaviour,
# `for b: loop assigns`, as the loop's effect in every behaviour's goals,
# where it checks the frame only in b's? region_end's loop states its frame
# so since G19's repair, and WP's proofs of region_end's goals after a hook
# are read in the record on that answer.
#
# PROBE: tools/probes/verify-039/g19_probe.py runs WP, as frama-c-region runs
# region.h, on tools/probes/verify-039/p_loop_frame_bhv.c: f(), whose loop's
# frame is stated for one behaviour and whose postcondition is false for the
# other, and g(), the control, its frame stated for the behaviour in which
# the loop writes; the first step builds and runs its main(), which shows
# both postconditions false. The probe's first run, at 8304c61, also ran WP
# on core/region.h and on two copies of it with the contracts G19's and
# G20's decisions recommend; G19's repair wrote them into core/region.h,
# and those runs left the probe with it.
#
# PREDICTED before it ran (docs/deviations.md, VERIFY-039, "G19 — committed
# prediction for the probe", run F, and "G19 and G20 — the repair:
# committed prediction"). The report step prints MATCH or MISS, with its
# confidence, for each part. The log needs a sign-in, so the step also posts
# its verdicts, each function's goals property by property, and each goal not
# proved as WP printed it, as notices on the run page, and an error
# annotation for each MISS, up to nine and a count of the rest; it exits 1 on
# a MISS.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "master" ]
    paths:
      - 'tools/probes/verify-039/p_loop_frame_bhv.c'
      - 'tools/probes/verify-039/g19_probe.py'
      - '.github/workflows/g19-probe.yml'
      - '.github/actions/framac-setup/**'
  workflow_dispatch:

jobs:
  g19-probe:
    # Pinned, not ubuntu-latest: see the runner note in
    # cmake-multi-platform.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "C: f()'s and g()'s postconditions at run time"
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            tools/probes/verify-039/p_loop_frame_bhv.c -o p_loop_frame_bhv
          ./p_loop_frame_bhv

      - name: "WP: F on f() and g()"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-039/g19_probe.py run

      - name: "Report F: a loop's frame stated for one behaviour"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g19_probe.py report F

      - name: Upload WP output (G19 probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g19-probe
          path: wp_*
          retention-days: 90
