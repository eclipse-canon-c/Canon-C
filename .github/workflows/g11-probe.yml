name: G11 probe (VERIFY-039, the recommended combinator contracts under WP 29)

# ---------------------------------------------------------------------------
# VERIFY-039 G11 — an experiment, not a gate. It runs when the probe, its
# script, this file or the toolchain pins change, and on demand; it never
# touches the enforced jobs, and its result is scored in docs/deviations.md,
# VERIFY-039 G11.
#
# QUESTION: G11 recommends that each combinator require its pointer to be a
# valid function where it calls it, claim termination and no exit only where
# it calls none, and state its empty frame only in the behaviours that call
# none. Under WP 29, which goals of that shape prove, and what does a caller
# get? And how many goals does each combinator have today, unit by unit, so
# that each surface's repair can be predicted to the goal?
#
# PROBE: tools/probes/verify-039/p_combinator_contracts.c instantiates the
# shipped macro bodies at option<int>, result<int, VErr> and
# result<bool, Error> with the recommended contracts, and two clients of
# option_int_map. The first step runs its main() under the sanitizers. Then
# tools/probes/verify-039/g11_probe.py runs WP, each run restricted with
# -wp-fct and otherwise as its unit runs it: A1 and A2 prove the probe's
# sixteen combinators and two clients under Typed and Typed+Cast; B1 to B7
# generate, without proving, the goals of today's combinators in
# option_verify.h, result_verify.h, deque_verify.h, vec_verify.h,
# bitset_verify.h, range_verify.h and data/priority_queue.h, to count them.
#
# PREDICTED before it ran (docs/deviations.md, VERIFY-039, "G11 — committed
# prediction for the probe"). The three report steps print MATCH or MISS,
# with its confidence, for each part. The log needs a sign-in, so each step
# also posts its verdicts, then each run's goals function by function, as
# notices on the run page, and an error annotation for each MISS, up to
# nine and a count of the rest; each exits 1 on a MISS.
#
# SINCE G11'S REPAIRS (a4f8f5f to ec6a30b) every unit B counts states the
# recommended contracts. The comparison now checks that each unit's
# combinators have the probe's goals, property by property; run #1, before
# the repairs, checked the deltas (VERIFY-039, "G11 — probe scored"). Run
# #2's prediction: "G11 — the declarations and the probe: committed
# prediction".
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "master" ]
    paths:
      - 'tools/probes/verify-039/p_combinator_contracts.c'
      - 'tools/probes/verify-039/g11_probe.py'
      - '.github/workflows/g11-probe.yml'
      - '.github/actions/framac-setup/**'
  workflow_dispatch:

jobs:
  g11-probe:
    # Pinned, not ubuntu-latest: see the runner note in
    # cmake-multi-platform.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "C: the recommended contracts' claims at run time"
        run: |
          gcc -std=c99 -Wall -Wextra -DCANON_NO_REQUIRE -DNDEBUG \
            -I core/primitives -I core -I semantics -I . \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            tools/probes/verify-039/p_combinator_contracts.c -o p_combinator_contracts
          ./p_combinator_contracts

      - name: "WP: A1 and A2 prove the probe; B1 to B7 count today's goals"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-039/g11_probe.py run

      - name: "Report A: the recommended contracts"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g11_probe.py report A

      - name: "Report B: today's goals per combinator"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g11_probe.py report B

      - name: "Report: each unit against the recommended contracts"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g11_probe.py report compare

      - name: Upload WP output (G11 probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-g11-probe
          path: wp_*
          retention-days: 90
