name: "14 · Eva: programs that use Canon-C"

# ---------------------------------------------------------------------------
# VERIFY-066 (docs/deviations.md). Map: .github/workflows/README.md.
#
# WP proves each function against its contract. Whether a program that calls
# the library meets the contracts is the program's question: Eva, Frama-C's
# abstract interpreter, answers it for a program, from main. It reports each
# place where a runtime error may happen (an alarm) and each call whose
# precondition may not hold.
#
# tools/eva/programs/ holds one small program per verified unit, which
# includes the unit's file with the unit's own flags and calls its functions
# as a user would (tools/eva/README.md). Each is compiled with GCC and run
# under AddressSanitizer and UndefinedBehaviorSanitizer, and analysed by Eva
# at the ten machine models the proofs use (x86_64, and the nine of
# proofs-machdeps.yml). Report-only until VERIFY-066's third run (ENFORCE
# in tools/eva/eva.py).
#
# MdR, Frama-C's Markdown Report plug-in, writes each run's statuses as
# SARIF too. The total job uploads the properties the pins hold open, at
# every model, as one run, to GitHub's code scanning, category eva: the
# alarms from MdR's SARIF, the assertion and the preconditions from
# Report's table, which MdR's SARIF gives the kind pass (tools/eva/mdr.py,
# VERIFY-082).
#
# E-ACSL, Frama-C's runtime assertion checker, makes each program check its
# annotations as it runs: the e-acsl job instruments, compiles and runs the
# 27 at x86_64, the host's model (tools/eva/eacsl.py, VERIFY-083).
#
# Aorai, Frama-C's plug-in for call-order rules, instruments a program with
# an automaton, and Eva then says whether the program keeps the rule: the
# aorai job checks three rules the library's documentation states, each
# written in tools/aorai/, on the programs that use them and on programs
# that keep and break each (tools/aorai/aorai.py, VERIFY-085).
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "master" ]
    paths:
      - 'core/**'
      - 'semantics/**'
      - 'data/**'
      - 'vmacros/vdrivers/**'
      - 'tools/eva/**'
      - 'tools/aorai/**'
      - 'tools/agreement/agreement.py'
      - 'tools/machdeps/machdep_*.yaml'
      - '.github/actions/framac-setup/**'
      - '.github/workflows/eva.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: "Each program compiled and run (GCC, ASan, UBSan)"
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: "Compile each program and run it"
        run: |
          gcc --version | head -1
          python3 tools/eva/eva.py native
      - name: "Notice"
        if: ${{ !cancelled() }}
        run: cat notices_1.txt 2>/dev/null || true

  # VERIFY-083: each program instrumented by E-ACSL (e-acsl-gcc.sh, the
  # segment model, --keep-going), compiled, and run without address
  # randomization (setarch -R), which the segment model needs. A program
  # is as E-ACSL runs it when it runs to its END with no CHECK failed, no
  # annotation failed and no unsound verdict. Each program's result is
  # pinned (tools/eva/eacsl_pins.txt), and one not as pinned fails the job
  # (VERIFY-083's run 2).
  e-acsl:
    name: "E-ACSL: each program checks its annotations as it runs"
    runs-on: ubuntu-24.04
    # Setup can take 47 minutes when its cache misses (VERIFY-060 run 1).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "GMP, which E-ACSL's runtime links"
        # On a cache hit the setup installs opam alone, not libgmp-dev.
        run: sudo apt-get install -y --no-install-recommends libgmp-dev
      - name: "E-ACSL on every program"
        run: |
          eval $(opam env --switch=frama-c)
          frama-c -version
          command -v e-acsl-gcc.sh
          python3 tools/eva/eacsl.py run
      - name: Upload the instrumented programs, their runs and the summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eacsl
          path: eacsl_out
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - name: "Notices: E-ACSL"
        if: ${{ !cancelled() }}
        run: cat notices_eacsl.txt 2>/dev/null || true

  # VERIFY-085: each case of tools/aorai/aorai.py, a program and one of the
  # automata of tools/aorai/, instrumented by Aorai and run by Eva at x86_64
  # with tools/eva/eva.py's options; a case follows its rule when none of
  # Aorai's properties is invalid or unknown and the program reaches its
  # END, and breaks it when the one call it marks refused violates one of
  # Aorai's preconditions. And each program of tools/aorai/programs/
  # compiled and run, and again with CANON_LIFETIME_DEBUG, whose run-time
  # checks see the views rules. Since run 2 (ENFORCE in tools/aorai/aorai.py),
  # a case not as CASES says, or a program not as LIFETIME_DEBUG says, fails
  # the job; report-only in runs 1 and 1b.
  aorai:
    name: "Aorai: the call-order rules each program keeps"
    runs-on: ubuntu-24.04
    # Setup can take 47 minutes when its cache misses (VERIFY-060 run 1).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: "The cases against the files"
        run: python3 tools/aorai/aorai.py check
      - name: "Each program compiled and run, and with CANON_LIFETIME_DEBUG"
        run: |
          gcc --version | head -1
          python3 tools/aorai/aorai.py native
      - uses: ./.github/actions/framac-setup
      - name: "Aorai and Eva on each case"
        run: |
          eval $(opam env --switch=frama-c)
          frama-c -version
          python3 tools/aorai/aorai.py run
      - name: Upload Frama-C's logs, Report's tables and the summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aorai
          path: aorai_out
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - name: "Notices: Aorai"
        if: ${{ !cancelled() }}
        run: cat notices_aorai.txt 2>/dev/null || true
      - name: "Notice: the programs run"
        if: ${{ !cancelled() }}
        run: cat notices_aorai_native.txt 2>/dev/null || true

  eva:
    name: "eva @ ${{ matrix.model }}"
    runs-on: ubuntu-24.04
    # Setup can take 47 minutes when its cache misses (VERIFY-060 run 1).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The models of tools/eva/eva.py (MODELS); 8 · Records checks that
        # the two lists are the same.
        model: [x86_64, cortex_m4, rv32_ilp32, rv64_lp64, arm_linux_gnueabihf,
                rv64_linux_gnu, aarch64_linux_gnu, ppc32_linux_gnu, ppc_32,
                msvc_x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "Eva on every program at ${{ matrix.model }}"
        run: |
          eval $(opam env --switch=frama-c)
          frama-c -version
          python3 tools/eva/eva.py run "${{ matrix.model }}"
      - name: Upload Eva's output, the statuses and the summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eva-${{ matrix.model }}
          path: eva_out
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      # GitHub keeps ten notices of a step: the script writes them ten to a
      # file, and each file is posted by a step of its own.
      - name: "Notices: programs 1 to 10"
        if: ${{ !cancelled() }}
        run: cat notices_1.txt 2>/dev/null || true
      - name: "Notices: programs 11 to 20"
        if: ${{ !cancelled() }}
        run: cat notices_2.txt 2>/dev/null || true
      - name: "Notices: programs 21 to 27"
        if: ${{ !cancelled() }}
        run: cat notices_3.txt 2>/dev/null || true

  total:
    name: "eva total"
    needs: eva
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Code scanning's upload needs security-events: write (VERIFY-082); the
    # other jobs keep the workflow's contents: read.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: "eva-*"
          path: eva_out
          merge-multiple: true
      - name: "The totals, by machine model"
        run: python3 tools/eva/eva.py report eva_out
      - name: "Notices"
        if: ${{ !cancelled() }}
        run: cat notices_1.txt 2>/dev/null || true
      - name: Upload the table of every program at every model
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eva-summary
          path: eva_summary.tsv
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      # VERIFY-082: eva.sarif is written only when every program has its
      # SARIF at every model, and uploaded only then.
      - name: "MdR's SARIF of the properties the pins hold open (VERIFY-082)"
        run: python3 tools/eva/mdr.py merge eva_out eva.sarif
      - name: "Notices: MdR"
        if: ${{ !cancelled() }}
        run: cat notices_mdr.txt 2>/dev/null || true
      - name: "Upload to code scanning"
        if: ${{ success() && hashFiles('eva.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eva.sarif
          category: eva
      - name: Upload the SARIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eva-sarif
          path: eva.sarif
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
