name: "9 · Probes (closed experiments)"
# The probes of VERIFY-039 and VERIFY-040, merged into one workflow by
# VERIFY-050: G4, G11, G13, G19, Count and Round 3; and VERIFY-057's pointer
# probe, VERIFY-060's char probe, VERIFY-066's Eva error probe, VERIFY-073's
# diag_push probe and VERIFY-079's vec_range probe, added since. Each is an
# experiment, not a gate; its result is scored in
# docs/deviations.md. Each job still runs only when its own paths change, as
# its workflow did: the `changes` job compares the push with the commit it
# moved master from and sets one output per probe. A manual run runs them
# all. Each job's banner keeps its old workflow's header. Map:
# .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    paths:
      - 'tools/probes/verify-039/p_frame_typed.c'
      - '.github/workflows/probes.yml'
      - 'core/memory.h'
      - '.github/actions/framac-setup/**'
      - 'tools/probes/verify-039/p_combinator_contracts.c'
      - 'tools/probes/verify-039/g11_probe.py'
      - 'tools/probes/verify-039/p_dangling_calls.c'
      - 'tools/probes/verify-039/p_dangling_forms.c'
      - 'tools/probes/verify-039/g13_probe.py'
      - 'core/slice.h'
      - 'semantics/borrow.h'
      - 'tools/probes/verify-039/p_loop_frame_bhv.c'
      - 'tools/probes/verify-039/g19_probe.py'
      - 'tools/probes/verify-040/count_probe.py'
      - 'tools/probes/verify-040/round3_probe.py'
      - 'tools/probes/verify-040/p_padding_lemmas.h'
      - 'tools/probes/verify-057/pointer_probe.py'
      - 'core/primitives/ptr.h'
      - 'data/vec/**'
      - 'data/deque/**'
      - 'data/stack.h'
      - 'vmacros/vdrivers/**'
      - 'data/priority_queue.h'
      - 'data/stringbuf.h'
      - 'core/region.h'
      - 'semantics/borrow.h'
      - 'tools/machdeps/flip_char.py'
      - 'tools/machdeps/machdep_aarch64_linux_gnu.yaml'
      - 'core/arena.h'
      - 'tools/probes/verify-066/**'
      - 'tools/eva/eva.py'
      - 'tools/eva/programs/arena.c'
      - 'tools/eva/programs/eva_program.h'
      - 'tools/agreement/agreement.py'
      - 'tools/probes/verify-073/**'
      - 'tools/eva/programs/diag.c'
      - 'tools/probes/verify-079/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Which probes this push concerns: each probe's paths, as its own workflow
  # listed them, matched against the files the push changed.
  # -------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      g4: ${{ steps.f.outputs.g4 }}
      g11: ${{ steps.f.outputs.g11 }}
      g13: ${{ steps.f.outputs.g13 }}
      g19: ${{ steps.f.outputs.g19 }}
      count: ${{ steps.f.outputs.count }}
      round3: ${{ steps.f.outputs.round3 }}
      pointer: ${{ steps.f.outputs.pointer }}
      char: ${{ steps.f.outputs.char }}
      evaerror: ${{ steps.f.outputs.evaerror }}
      diagpush: ${{ steps.f.outputs.diagpush }}
      vecrange: ${{ steps.f.outputs.vecrange }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FILTERS: '{"g4": ["tools/probes/verify-039/p_frame_typed.c", ".github/workflows/probes.yml", "core/memory.h", ".github/actions/framac-setup/**"], "g11": ["tools/probes/verify-039/p_combinator_contracts.c", "tools/probes/verify-039/g11_probe.py", ".github/workflows/probes.yml", ".github/actions/framac-setup/**"], "g13": ["tools/probes/verify-039/p_dangling_calls.c", "tools/probes/verify-039/p_dangling_forms.c", "tools/probes/verify-039/g13_probe.py", ".github/workflows/probes.yml", ".github/actions/framac-setup/**", "core/memory.h", "core/slice.h", "semantics/borrow.h"], "g19": ["tools/probes/verify-039/p_loop_frame_bhv.c", "tools/probes/verify-039/g19_probe.py", ".github/workflows/probes.yml", ".github/actions/framac-setup/**"], "count": ["tools/probes/verify-040/count_probe.py", ".github/workflows/probes.yml", ".github/actions/framac-setup/**"], "round3": ["tools/probes/verify-040/round3_probe.py", "tools/probes/verify-040/p_padding_lemmas.h", ".github/workflows/probes.yml", ".github/actions/framac-setup/**"], "pointer": ["tools/probes/verify-057/pointer_probe.py", ".github/workflows/probes.yml", ".github/actions/framac-setup/**", "core/primitives/ptr.h", "data/vec/**", "data/deque/**", "data/stack.h", "vmacros/vdrivers/**", "data/priority_queue.h", "data/stringbuf.h", "core/region.h", "semantics/borrow.h"], "char": ["tools/machdeps/flip_char.py", "tools/machdeps/machdep_aarch64_linux_gnu.yaml", "core/arena.h", ".github/workflows/probes.yml", ".github/actions/framac-setup/**"], "evaerror": ["tools/probes/verify-066/**", ".github/workflows/probes.yml", ".github/actions/framac-setup/**", "core/arena.h", "tools/eva/eva.py", "tools/eva/programs/arena.c", "tools/eva/programs/eva_program.h", "tools/agreement/agreement.py"], "diagpush": ["tools/probes/verify-073/**", ".github/workflows/probes.yml", ".github/actions/framac-setup/**", "tools/agreement/agreement.py", "tools/eva/eva.py", "tools/eva/programs/diag.c", "tools/eva/programs/eva_program.h"], "vecrange": ["tools/probes/verify-079/**", ".github/workflows/probes.yml", ".github/actions/framac-setup/**", "tools/agreement/agreement.py"]}'
        run: |
          python3 - <<'PY'
          import json, os, subprocess, fnmatch
          filters = json.loads(os.environ["FILTERS"])
          before = os.environ.get("BEFORE", "")
          changed = None
          if os.environ["EVENT"] == "push" and before and before.strip("0"):
              r = subprocess.run(["git", "diff", "--name-only", before, "HEAD"],
                                 capture_output=True, text=True)
              if r.returncode == 0:
                  changed = [l for l in r.stdout.splitlines() if l]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, pats in filters.items():
                  hit = changed is None or any(fnmatch.fnmatch(c, p) for c in changed for p in pats)
                  out.write(f"{key}={'true' if hit else 'false'}\n")
                  print(f"{key}: {'run' if hit else 'skip'}")
          PY

  # -------------------------------------------------------------------------
  # G4 probe (VERIFY-039, frames across byte-level writes)
  #
  # VERIFY-039 G4 — an experiment, not a gate. It runs when the probe, this
  # file, core/memory.h or the toolchain pins change, and on demand; it never
  # touches the enforced jobs, and its result is scored in docs/deviations.md,
  # VERIFY-039 G4.
  #
  # QUESTION: in WP's typed model a write stated through `char *` changes only
  # the `sint8` array (VERIFY-039 G3), and WP 29 frames a call to mem_zero by
  # its complete behaviours' `assigns` (it has no default clause). Does a frame
  # across such a call, at another type, therefore prove whatever the write's
  # range — including when the frame is false in C?
  #
  # PROBE: tools/probes/verify-039/p_frame_typed.c zeroes an `int`, a `u8` and
  # a `char` through mem_zero and states of each that it is unchanged
  # (`_frame`, false in C) and that it is zero (`_zero`, true in C). The first
  # step checks those C facts at run time. The second runs WP under the units'
  # own options (Typed+Cast, -wp-rte, -wp-split, Alt-Ergo/Z3/CVC5, 120 s, the
  # same -cpp-extra-args as frama-c-memory), restricted to the six named
  # postconditions with -wp-prop.
  #
  # PINNED at run #1 (1e6434c; VERIFY-039 G4, probe scored): six goals
  # scheduled; proved g4_int_frame, g4_u8_frame and g4_char_zero; not proved
  # g4_int_zero, g4_u8_zero and g4_char_frame; "Proved goals: 4 / 7". The
  # seventh is not one of the six: WP's reachability pass closes the
  # annotations of dead statements without consulting -wp-prop, and counted
  # one ("Unreachable: 1"). The prediction said 3 / 6; that part missed.
  # The WP step prints MATCH or MISS for the names, for the count, and for
  # the accounting (the listed goals explain the summary), and exits 0 only if
  # all three match. A red run means WP's behaviour here changed: read the log
  # and record it.
  # -------------------------------------------------------------------------
  g4-probe:
    needs: changes
    if: needs.changes.outputs.g4 == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "C: the six claims at run time"
        run: |
          gcc -std=c99 -Wall -Wextra -DCANON_NO_REQUIRE -DNDEBUG -I. \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            tools/probes/verify-039/p_frame_typed.c -o p_frame_typed
          ./p_frame_typed

      - name: "WP: the six claims in the typed model"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -wp-prop g4_int_frame,g4_int_zero,g4_u8_frame,g4_u8_zero,g4_char_frame,g4_char_zero \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            tools/probes/verify-039/p_frame_typed.c 2>&1 | tee wp_g4_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (p_frame_typed.c) exit status: ${WP_EXIT}"
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_g4_output.txt || true)
          echo "  ${PROVED_LINE:-no summary line: WP did not run to the end}"
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oE '[0-9]+ / [0-9]+' | head -1 || true)
          SCHEDULED=$(grep -oE "^\[wp\] [0-9]+ goals scheduled" wp_g4_output.txt | grep -oE "[0-9]+" | head -1 || true)
          echo "  goals scheduled: ${SCHEDULED:-none reported} (pinned: 6, the six postconditions)"
          # WP 29 tags: [Timeout] [Unknown] [Stepout] [Invalid]; a prover
          # failure prints as [Failure] ([Failed] only in smoke tests), and a
          # goal with no result prints nothing, which the accounting catches.
          grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Failure|Invalid|Stepout|NoResult)\] typed" wp_g4_output.txt \
            | awk '{print $3}' | sort -u > g4_not_proved.txt
          printf '%s\n' \
            typed_cast_g4_zero_int_ensures_g4_int_zero \
            typed_cast_g4_zero_u8_ensures_g4_u8_zero \
            typed_cast_g4_zero_char_ensures_g4_char_frame | sort -u > g4_predicted.txt
          echo "  not proved, observed:"
          sed 's/^/    /' g4_not_proved.txt
          echo "  not proved, pinned:"
          sed 's/^/    /' g4_predicted.txt
          echo "  the not-proved goals as WP prints them:"
          grep -E "^\[wp\] \[[A-Za-z]+\] typed_cast_g4_" wp_g4_output.txt | sed 's/^/    /' || true
          echo "==============================================="
          MISS=0
          if [ "${PROVED_COUNT}" = "4 / 7" ] && [ "${SCHEDULED}" = "6" ]; then
            echo "MATCH (count): Proved goals: 4 / 7, six scheduled"
          else
            echo "MISS (count): observed '${PROVED_COUNT}' with '${SCHEDULED}' scheduled, pinned '4 / 7' with 6"
            MISS=1
          fi
          LISTED=$(wc -l < g4_not_proved.txt)
          ACCOUNTED=0
          if [ -n "${PROVED_COUNT}" ]; then
            P=${PROVED_COUNT%% /*}
            T=${PROVED_COUNT##*/ }
            if [ $((T - P)) -eq "${LISTED}" ]; then
              echo "MATCH (accounting): ${LISTED} listed = ${T} - ${P}"
              ACCOUNTED=1
            else
              echo "MISS (accounting): ${LISTED} listed, but the summary leaves $((T - P)) unproved"
              MISS=1
            fi
          else
            echo "MISS (accounting): no summary to account for"
            MISS=1
          fi
          if cmp -s g4_not_proved.txt g4_predicted.txt; then
            echo "MATCH (names): the not-proved set is the pinned one"
          else
            echo "MISS (names): observed less pinned, then pinned less observed:"
            comm -23 g4_not_proved.txt g4_predicted.txt | sed 's/^/    + /'
            comm -13 g4_not_proved.txt g4_predicted.txt | sed 's/^/    - /'
            MISS=1
          fi
          for g in int u8; do
            if grep -qx "typed_cast_g4_zero_${g}_ensures_g4_${g}_frame" g4_not_proved.txt; then
              echo "  g4_${g}_frame (false in C): NOT proved"
            elif [ "${ACCOUNTED}" = "1" ] && [ "${SCHEDULED}" = "6" ]; then
              echo "  g4_${g}_frame (false in C): PROVED"
            else
              echo "  g4_${g}_frame (false in C): not listed as unproved, but the six goals are not all accounted for; read the log"
            fi
          done
          echo "==============================================="
          exit ${MISS}

  # -------------------------------------------------------------------------
  # G11 probe (VERIFY-039, the recommended combinator contracts under WP 29)
  #
  # VERIFY-039 G11 — an experiment, not a gate. It runs when the probe, its
  # script, this file or the toolchain pins change, and on demand; it never
  # touches the enforced jobs, and its result is scored in docs/deviations.md,
  # VERIFY-039 G11.
  #
  # QUESTION: G11 recommends that each combinator require its pointer to be a
  # valid function where it calls it, claim termination and no exit only where
  # it calls none, and state its empty frame only in the behaviours that call
  # none. Under WP 29, which goals of that shape prove, and what does a caller
  # get? And how many goals does each combinator have today, unit by unit, so
  # that each surface's repair can be predicted to the goal?
  #
  # PROBE: tools/probes/verify-039/p_combinator_contracts.c instantiates the
  # shipped macro bodies at option<int>, result<int, VErr> and
  # result<bool, Error> with the recommended contracts, and two clients of
  # option_int_map. The first step runs its main() under the sanitizers. Then
  # tools/probes/verify-039/g11_probe.py runs WP, each run restricted with
  # -wp-fct and otherwise as its unit runs it: A1 and A2 prove the probe's
  # sixteen combinators and two clients under Typed and Typed+Cast; B1 to B7
  # generate, without proving, the goals of today's combinators in
  # option_verify.h, result_verify.h, deque_verify.h, vec_verify.h,
  # bitset_verify.h, range_verify.h and data/priority_queue.h, to count them.
  #
  # PREDICTED before it ran (docs/deviations.md, VERIFY-039, "G11 — committed
  # prediction for the probe"). The three report steps print MATCH or MISS,
  # with its confidence, for each part. The log needs a sign-in, so each step
  # also posts its verdicts, then each run's goals function by function, as
  # notices on the run page, and an error annotation for each MISS, up to
  # nine and a count of the rest; each exits 1 on a MISS.
  #
  # SINCE G11'S REPAIRS (a4f8f5f to ec6a30b) every unit B counts states the
  # recommended contracts. The comparison now checks that each unit's
  # combinators have the probe's goals, property by property; run #1, before
  # the repairs, checked the deltas (VERIFY-039, "G11 — probe scored"). Run
  # #2's prediction: "G11 — the declarations and the probe: committed
  # prediction".
  # -------------------------------------------------------------------------
  g11-probe:
    needs: changes
    if: needs.changes.outputs.g11 == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "C: the recommended contracts' claims at run time"
        run: |
          gcc -std=c99 -Wall -Wextra -DCANON_NO_REQUIRE -DNDEBUG \
            -I core/primitives -I core -I semantics -I . \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            tools/probes/verify-039/p_combinator_contracts.c -o p_combinator_contracts
          ./p_combinator_contracts

      - name: "WP: A1 and A2 prove the probe; B1 to B7 count today's goals"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-039/g11_probe.py run

      - name: "Report A: the recommended contracts"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g11_probe.py report A

      - name: "Report B: today's goals per combinator"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g11_probe.py report B

      - name: "Report: each unit against the recommended contracts"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g11_probe.py report compare

      - name: Upload WP output (G11 probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-g11-probe
          path: wp_*
          retention-days: 90

  # -------------------------------------------------------------------------
  # G13 probe (VERIFY-039, memcmp's danglingness precondition under Eva and WP 29)
  #
  # VERIFY-039 G13 — an experiment, not a gate. It runs when the probe, its
  # script, this file, the toolchain pins or the three headers whose contracts
  # report E reads (core/memory.h, core/slice.h, semantics/borrow.h) change,
  # and on demand; it never touches the enforced jobs, and its result is
  # scored in docs/deviations.md, VERIFY-039 G13.
  #
  # QUESTION: memcmp's libc contract requires that no byte it compares hold
  # (bits of) a dangling address (danglingness:s1/s2, non_escaping). Do the
  # shipped contracts of the eight functions that call memcmp admit a call
  # that makes it false? And how does WP 29 translate the requirement, as
  # libc's predicate and as the quantifier written out, where a contract
  # states it?
  #
  # PROBE: tools/probes/verify-039/p_dangling_calls.c has nine entry points,
  # each comparing the bytes of two pointers to a freed block through one of
  # mem_compare, mem_equal, mem_equal_bytes, bytes_equal, str_equal,
  # str_starts_with, str_ends_with, borrowed_bytes_eq and borrowed_str_eq;
  # Eva runs from each. tools/probes/verify-039/p_dangling_forms.c has seven
  # functions that state the requirement each way, and two entry points for
  # Eva; WP runs on the seven as the Typed+Cast units run their headers.
  # tools/probes/verify-039/g13_probe.py runs both and reads them.
  #
  # PREDICTED before it ran (docs/deviations.md, VERIFY-039, "G13 — committed
  # prediction for the probe"); run #1 held in every part. G13's repair has
  # the nine functions require the quantifier written out, so since then the
  # probe expects Eva to reject each call at the function's own first such
  # clause, not at memcmp inside ("G13 — repair, with the macOS cppcheck pin:
  # committed prediction"); p_dangling_forms.c and its predictions are
  # unchanged. The two report steps print MATCH or MISS, with its confidence,
  # for each part. The log needs a sign-in, so each step also posts its
  # verdicts, and what each run found, as notices on the run page, and an
  # error annotation for each MISS; each exits 1 on a MISS.
  # -------------------------------------------------------------------------
  g13-probe:
    needs: changes
    if: needs.changes.outputs.g13 == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "Eva from the nine calls; WP on the two forms"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-039/g13_probe.py run

      - name: "Report E: the calls under Eva"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g13_probe.py report E

      - name: "Report W: the two forms under WP 29"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g13_probe.py report W

      - name: Upload Eva and WP output (G13 probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g13-probe
          path: |
            eva_*.txt
            wp_forms*
          retention-days: 90

  # -------------------------------------------------------------------------
  # G19 probe (VERIFY-039, a loop's frame stated for one behaviour under WP 29)
  #
  # VERIFY-039 G19 — an experiment, not a gate. It runs when the probe, its
  # script, this file or the toolchain pins change, and on demand; it never
  # touches the enforced jobs, and its result is scored in docs/deviations.md,
  # VERIFY-039 G19.
  #
  # QUESTION: does WP 29 take a loop's frame stated for one behaviour,
  # `for b: loop assigns`, as the loop's effect in every behaviour's goals,
  # where it checks the frame only in b's? region_end's loop states its frame
  # so since G19's repair, and WP's proofs of region_end's goals after a hook
  # are read in the record on that answer.
  #
  # PROBE: tools/probes/verify-039/g19_probe.py runs WP, as frama-c-region runs
  # region.h, on tools/probes/verify-039/p_loop_frame_bhv.c: f(), whose loop's
  # frame is stated for one behaviour and whose postcondition is false for the
  # other, and g(), the control, its frame stated for the behaviour in which
  # the loop writes; the first step builds and runs its main(), which shows
  # both postconditions false. The probe's first run, at 8304c61, also ran WP
  # on core/region.h and on two copies of it with the contracts G19's and
  # G20's decisions recommend; G19's repair wrote them into core/region.h,
  # and those runs left the probe with it.
  #
  # PREDICTED before it ran (docs/deviations.md, VERIFY-039, "G19 — committed
  # prediction for the probe", run F, and "G19 and G20 — the repair:
  # committed prediction"). The report step prints MATCH or MISS, with its
  # confidence, for each part. The log needs a sign-in, so the step also posts
  # its verdicts, each function's goals property by property, and each goal not
  # proved as WP printed it, as notices on the run page, and an error
  # annotation for each MISS, up to nine and a count of the rest; it exits 1 on
  # a MISS.
  # -------------------------------------------------------------------------
  g19-probe:
    needs: changes
    if: needs.changes.outputs.g19 == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "C: f()'s and g()'s postconditions at run time"
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            tools/probes/verify-039/p_loop_frame_bhv.c -o p_loop_frame_bhv
          ./p_loop_frame_bhv

      - name: "WP: F on f() and g()"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-039/g19_probe.py run

      - name: "Report F: a loop's frame stated for one behaviour"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-039/g19_probe.py report F

      - name: Upload WP output (G19 probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g19-probe
          path: wp_*
          retention-days: 90

  # -------------------------------------------------------------------------
  # Count probe (VERIFY-040 round 2, WP 29's goals at vec's append_array and extend)
  #
  # VERIFY-040 round 2 — an experiment, not a gate. It runs when the probe's
  # script, this file or the toolchain pins change, and on demand; it never
  # touches the enforced jobs, and its result is scored in docs/deviations.md,
  # VERIFY-040, "the count probe".
  #
  # QUESTION: CI #1375 and CC #56 measured five goals more in each vec unit
  # than round 1's pins, where round 2's prediction, which counted WP 25's
  # parts, said three. The logs print no proved goal, so they do not say which
  # clause WP 29 splits otherwise than WP 25: extend's old ok frame, or the new
  # postconditions.
  #
  # PROBE: tools/probes/verify-040/count_probe.py runs WP as frama-c-vec runs
  # vmacros/vdrivers/vec_verify.h, on vec_int_append_array and vec_int_extend,
  # with Qed, WP's simplifier, as the only prover (-wp-prover qed) and with
  # -wp-print, on the driver as committed and on the driver as it was at
  # bd9466e, before round 2 (from git, hence the full history below). It
  # counts their goals from WP's summary lines, as the CI does, and property
  # by property from WP's statistics report, and reads extend's frames from
  # the print; goal names, where WP writes them, are posted, not scored.
  #
  # PREDICTED before it ran (docs/deviations.md, VERIFY-040, "the count probe:
  # committed prediction"). The report step prints MATCH or MISS, with its
  # confidence, for each part, or NO DATA where a part has nothing to read.
  # The log needs a sign-in, so the step also posts its verdicts, each run's
  # goals property by property and extend's frames as WP printed them as
  # notices on the run page, and an error annotation for each MISS or NO
  # DATA; it exits 1 on a MISS, else 2 on NO DATA. The WP step fails if a run
  # fails or writes no statistics.
  # -------------------------------------------------------------------------
  count-probe:
    needs: changes
    if: needs.changes.outputs.count == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/framac-setup

      - name: "WP: the two functions, as committed and at bd9466e, Qed alone"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-040/count_probe.py run

      - name: "Report: the goals, counted and named"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-040/count_probe.py report

      - name: Upload WP output (count probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: count-probe
          path: wp_*
          retention-days: 90

  # -------------------------------------------------------------------------
  # Round 3 probe (VERIFY-040 round 3, bitset's padding lemmas)
  #
  # VERIFY-040 round 3 — an experiment, not a gate. It runs when the probe's
  # script, its lemma file, this file or the toolchain pins change, and on
  # demand; it never touches the enforced jobs, and its results are scored in
  # docs/deviations.md, VERIFY-040 round 3: run #1 against "the probe's
  # committed prediction", the runs since against "the fix push: committed
  # prediction".
  #
  # QUESTION: block 7's change is lemmas for the bit-level steps of its four
  # goals. A lemma WP does not prove is not admissible, and in data/bitset.h
  # every goal of the unit could rest on it, so it is tried here: whether the
  # CI's provers prove the lemmas decides block 7's verdict, and whether the
  # four goals prove with them says what the block is needed for. Run #1 also
  # measured block 1's change, an invariant, a frame and a variant for fill's
  # loop, in a copy of the tree; the fix push wrote it into IMPL_VEC_FILL, and
  # those runs were retired with it.
  #
  # PROBE: tools/probes/verify-040/round3_probe.py runs WP as frama-c-bitset
  # runs its driver (Typed+Cast, -wp-rte, -wp-split, its preprocessing), with
  # the CI's provers, Alt-Ergo, Z3 and CVC5 at 120 s, on
  # tools/probes/verify-040/p_padding_lemmas.h, which includes bitset's driver
  # and states the three lemmas: the lemmas, each a goal of its own, and the
  # four functions of block 7's goals, which have the lemmas as hypotheses.
  #
  # PREDICTED before it ran. The report step prints MATCH or MISS, with its
  # confidence, for each part, or NO DATA where a part has nothing to read. The
  # log needs a sign-in, so the step also posts its verdicts and each run's
  # counts as notices on the run page, and an error annotation for each MISS
  # or NO DATA; it exits 1 on a MISS, else 2 on NO DATA. The WP step fails if
  # a run fails or writes no statistics.
  # -------------------------------------------------------------------------
  round3-probe:
    needs: changes
    if: needs.changes.outputs.round3 == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "WP: bitset's three lemmas, and the four functions with them"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-040/round3_probe.py run

      - name: "Report: the parts, against the prediction"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-040/round3_probe.py report

      - name: Upload WP output (round 3 probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: round3-probe
          path: wp_*
          retention-days: 90

  # -------------------------------------------------------------------------
  # Pointer probe (VERIFY-057, pointer arithmetic outside its object)
  #
  # VERIFY-057 — an experiment, not a gate. It runs when its script, this
  # file or the toolchain pins change, and on demand; it never touches the
  # enforced jobs, and its results are scored in docs/deviations.md,
  # VERIFY-057. Since VERIFY-058 it also runs when core/primitives/ptr.h
  # changes: VERIFY-058's repair of ptr.h's contracts is measured by it.
  # Since VERIFY-062, also when data/vec/, data/deque/, data/stack.h, the
  # drivers in vmacros/vdrivers/, data/priority_queue.h, data/stringbuf.h or
  # core/region.h change: VERIFY-062's containers and queries are measured
  # by it. Since VERIFY-063, also when semantics/borrow.h changes.
  #
  # QUESTION: -wp-rte does not check the pointers a unit computes or reads;
  # C leaves one outside its object (or past one-past-the-end) undefined.
  # Frama-C checks it only under -warn-invalid-pointer, which adds a
  # pointer_value assertion, \object_pointer(p). No enforced job sets it.
  #
  # PROBE: tools/probes/verify-057/pointer_probe.py runs each unit as its
  # job runs it (file, preprocessing, memory model), with the option added,
  # proving only the pointer_value goals (-wp-prop pointer_value), with the
  # CI's provers at 120 s. One matrix job per unit; each posts a notice with
  # its line and unproved names. PREDICTED before it ran (VERIFY-057). It
  # fails only when WP writes no summary.
  # -------------------------------------------------------------------------
  pointer-probe:
    needs: changes
    if: needs.changes.outputs.pointer == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        unit: [frama-c-checked, frama-c-bits, frama-c-compare, frama-c-ptr,
               frama-c-slice, frama-c-memory, frama-c-arena, frama-c-pool,
               frama-c-region, frama-c-lifetime, frama-c-error, frama-c-option,
               frama-c-result, frama-c-borrow, frama-c-diag, frama-c-vec,
               frama-c-deque, frama-c-bitset, frama-c-priority-queue,
               frama-c-range, frama-c-vec-range, frama-c-vec-fmt,
               frama-c-stringbuf, frama-c-stack, frama-c-array,
               frama-c-hashmap]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "WP with -warn-invalid-pointer: ${{ matrix.unit }}'s pointer_value goals"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-057/pointer_probe.py run ${{ matrix.unit }}

      - name: "Report: the line and the unproved names"
        if: ${{ !cancelled() }}
        run: python3 tools/probes/verify-057/pointer_probe.py report ${{ matrix.unit }}

      - name: Upload WP output (pointer probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pointer-probe-${{ matrix.unit }}
          path: wp_*.txt
          retention-days: 90

  # -------------------------------------------------------------------------
  # Char probe (VERIFY-060, the dependence of two arena goals on char)
  #
  # VERIFY-060 phase B's control, a probe since phase C: an experiment, not a
  # gate on the proofs. It runs when flip_char.py, the AArch64 model,
  # core/arena.h, this file or the toolchain pins change, and on demand.
  #
  # QUESTION: arena proves the first part of the zeroing ensures of
  # arena_alloc_zero and arena_alloc_aligned_zero at every model where char
  # is unsigned, and not at x86_64, msvc_x86_64 or gcc_x86_32, where it is
  # signed. Is char's signedness what decides it? (The likely mechanism is
  # VERIFY-039 G3's: a write stated through `char *` changes only WP's
  # `sint8` array where char is signed, and u8 is `uint8`.)
  #
  # PROBE: tools/machdeps/flip_char.py copies a model with char_is_unsigned
  # and __CHAR_UNSIGNED__ changed and nothing else: Frama-C's x86_64 with
  # char unsigned, the AArch64 model with char signed. arena is proved at
  # each by frama-c-arena's command.
  #
  # PINNED at phase B's runs 2 and 3 (VERIFY-060): at x86_64 with char
  # unsigned, 3539 / 3570, the two goals proved; at AArch64 with char signed,
  # 3537 / 3570, both unproved. The verdict step prints MATCH or MISS for the
  # line and for the two goals, and exits 0 only if both match. A red run
  # means the two goals no longer follow char: read the log and record it.
  # -------------------------------------------------------------------------
  char-probe:
    needs: changes
    if: needs.changes.outputs.char == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        control:
          - { name: x86_64_unsigned_char, frama_c_model: x86_64, file: "",                                             char: unsigned, proved: "3539 / 3570", two: proved }
          - { name: aarch64_signed_char,  frama_c_model: "",     file: tools/machdeps/machdep_aarch64_linux_gnu.yaml, char: signed,   proved: "3537 / 3570", two: unproved }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "The control model: char's signedness changed, nothing else"
        env:
          FRAMA_C_MODEL: ${{ matrix.control.frama_c_model }}
          FILE: ${{ matrix.control.file }}
          CHAR: ${{ matrix.control.char }}
        run: |
          eval $(opam env --switch=frama-c)
          src="${FILE}"
          if [ -n "${FRAMA_C_MODEL}" ]; then
            src="$(frama-c -print-share-path)/machdeps/machdep_${FRAMA_C_MODEL}.yaml"
          fi
          python3 tools/machdeps/flip_char.py "${src}" machdep_control.yaml "${CHAR}"
          echo "== diff ${src} machdep_control.yaml"
          diff "${src}" machdep_control.yaml || true
          frama-c -machdep machdep_control.yaml tools/machdeps/check.c \
            -constfold -print -print-libc -ocode check_control.c > check_control.log 2>&1 || true
          grep -E "probe_(char_min|macro_char_unsigned) *=" check_control.c || echo "check.c not read"

      - name: "WP: core/arena.h at the control model"
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          # frama-c-arena's command (proofs-core.yml), at the control model.
          frama-c -wp -wp-rte -machdep machdep_control.yaml -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" -I core/primitives -I core -I . -DCANON_NO_REQUIRE -DNDEBUG" \
            core/arena.h 2>&1 | tee wp_output.txt
          echo "WP exit status: ${PIPESTATUS[0]}"
          exit 0

      - name: "Verdict: MATCH or MISS"
        env:
          WANT_PROVED: ${{ matrix.control.proved }}
          WANT_TWO: ${{ matrix.control.two }}
        run: |
          got=$(grep -E "^\[wp\] Proved goals:" wp_output.txt | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
          fail=0
          if [ "${got}" = "${WANT_PROVED}" ]; then
            echo "MATCH: proved ${got}"
          else
            echo "MISS: proved ${got:-none}, pinned ${WANT_PROVED}"
            fail=1
          fi
          for g in typed_cast_arena_alloc_zero_ensures_3_part1 \
                   typed_cast_arena_alloc_aligned_zero_ensures_3_part1; do
            if grep -qE "^\[wp\] \[(Timeout|Unknown)\] (Goal )?${g}( |$)" wp_output.txt; then
              state=unproved
            else
              state=proved
            fi
            if [ "${state}" = "${WANT_TWO}" ]; then
              echo "MATCH: ${g} ${state}"
            else
              echo "MISS: ${g} ${state}, pinned ${WANT_TWO}"
              fail=1
            fi
          done
          exit "${fail}"

      - name: Upload WP output (char probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: char-probe-${{ matrix.control.name }}
          path: |
            wp_output.txt
            machdep_control.yaml
          retention-days: 90

  # -------------------------------------------------------------------------
  # Eva error probe (VERIFY-066, Frama-C 29's error on entering arena_alloc)
  #
  # VERIFY-066: an experiment, not a gate. It runs when the probe, this file,
  # the toolchain pins, core/arena.h, or what the probe reads of 14 · Eva
  # (tools/eva/eva.py, arena.c's program, tools/agreement/agreement.py)
  # change, and on demand.
  #
  # QUESTION: Frama-C 29's Eva stops on entering arena_alloc, in every
  # program that calls it, with the uncaught exception
  # Eva__Eval_terms.Reduce_to_bottom, while it decides which of the
  # function's behaviours is active (VERIFY-066, the fix's run). Does a small
  # program reproduce it, and which construct of arena_can_fit raises it: the
  # \let, which Frama-C evaluates since 28, or the address converted to an
  # integer? Is there a way around it that keeps the contract's meaning?
  #
  # PROBE: tools/probes/verify-066/eva_error_probe.py runs Eva on six small
  # programs, each as `frama-c -eva FILE` (r0_full.c, arena_alloc
  # standalone; r1_min.c, its smallest form; r1_min.c without \let, without
  # the conversion, with one behaviour, without a body), and on
  # tools/eva/programs/arena.c with 14 · Eva's command at x86_64: as it is,
  # with arena_can_fit's \let as before VERIFY-067 in a copy of
  # core/arena.h, and with arena_alloc read by its contract. Report-only: it
  # prints each outcome, with the backtrace and the last call of each run
  # that stops, posts one notice per variant and exits 0. Its predictions
  # and their scores are VERIFY-066's and VERIFY-067's, in
  # docs/deviations.md.
  #
  # ANSWER (#14, on 2b38ddb): a \let bound to an address converted to an
  # integer, in a behaviour's assumes. Since VERIFY-067, core/arena.h writes
  # arena_can_fit without \let; the probe keeps watching the error.
  # -------------------------------------------------------------------------
  evaerror-probe:
    needs: changes
    if: needs.changes.outputs.evaerror == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    # Setup can take 47 minutes when its cache misses (VERIFY-060 run 1).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "Eva on each variant"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-066/eva_error_probe.py

      - name: "Notices"
        if: ${{ !cancelled() }}
        run: cat notices_evaerror.txt 2>/dev/null || true

      - name: Upload each variant's output (Eva error probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaerror-probe
          path: evaerror_out
          retention-days: 90

  # -------------------------------------------------------------------------
  # diag_push probe (VERIFY-073, diag_push's contract before it lands)
  #
  # VERIFY-073: an experiment, not a gate. It runs when the probe, this file,
  # the toolchain pins, or what the probe reads of 13 · Prover agreement and
  # 14 · Eva (tools/agreement/agreement.py, tools/eva/eva.py, diag.c's
  # program) change, and on demand.
  #
  # QUESTION: with diag_push's contract stating the earlier frames kept
  # whole, file and func NULL or strings outside *d, the new frame
  # renderable, and a full chain shifted one frame at a time instead of with
  # memmove, what do frama-c-diag's WP command, its prover agreement and
  # 14 · Eva's diag.c give? Run 1 left 6 parts of push_frame_strings
  # unproved; run 1b asks which of four variants proves them, and whether a
  # program proved with WP alone can then push twice and render. The
  # enforced jobs read semantics/diag.h as it is; VERIFY-073's change pins
  # what this probe measures.
  #
  # PROBE: tools/probes/verify-073/diagpush_probe.py applies a patch to a
  # copy of the checkout, or finds it applied, and runs WP there. Run 1b's
  # steps: diag_push's goals with each variant (diag_push.patch, P0, and
  # A to D under variants/), and p_caller.c, a program proved with WP alone
  # that pushes two frames and renders them, with each variant. Run 1's
  # steps, with diag_push.patch: frama-c-diag's command, WP with each prover
  # alone, and Eva on diag.c at the ten models. The file steps names the
  # steps that run. Report-only: it prints the goals not proved, the
  # would-be tools/agreement/pins/frama-c-diag.txt and each Eva block's
  # difference from its pin, posts notices, and fails only if a patch
  # neither applies nor is found applied, or a step gives no data. GitHub
  # reads a workflow command behind spaces too (VERIFY-073 run 1), so the
  # probe prints the enforced tools' commands behind "| ": a difference from
  # their pins is what the probe measures, not an error here. Each step's
  # files are the artifact diagpush-probe. Its predictions and their scores
  # are VERIFY-073's, in docs/deviations.md.
  # -------------------------------------------------------------------------
  diagpush-probe:
    needs: changes
    if: needs.changes.outputs.diagpush == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    # WP with three provers, then with each alone, then Eva at ten models;
    # setup can take 47 minutes when its cache misses (VERIFY-060 run 1).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      # Each step runs if tools/probes/verify-073/steps names it, and
      # otherwise posts that it did not run.
      - name: "WP: diag_push with each variant (run 1b)"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-073/diagpush_probe.py variants

      - name: "WP: a caller, two pushes and a render, with each variant (run 1b)"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-073/diagpush_probe.py caller

      - name: "WP: frama-c-diag's command, with the patch"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-073/diagpush_probe.py wp

      - name: "Prover agreement: frama-c-diag, each prover alone, with the patch"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-073/diagpush_probe.py agree

      - name: "Eva: diag.c at the ten models, with the patch"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-073/diagpush_probe.py eva

      - name: Upload each step's output (diag_push probe)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagpush-probe
          path: diagpush_out
          retention-days: 90

  # -------------------------------------------------------------------------
  # vec_range probe (VERIFY-079, vec_int_extend_from_range's two slow goals)
  #
  # VERIFY-079: an experiment, not a gate. It runs when the probe, this file,
  # the toolchain pins, or what the probe reads of 13 · Prover agreement
  # (tools/agreement/agreement.py) change, and on demand.
  #
  # QUESTION: frama-c-vec-range proves parts 3 and 4 of the preservation of
  # vec_int_extend_from_range's loop invariant 5 only with Alt-Ergo, which
  # alone took 89 s and 38 s on them (VERIFY-065) where the limit is 120 s,
  # so a slower runner could fail the job's pin. What makes them hard, and
  # which annotations make them easy? Run 1 measured three assertions in the
  # loop's body (A), the invariant over values no store changes (B), and
  # both (C): none did. Run 1b prints the goals, and measures where the
  # frame of the earlier slots costs: an assertion of it after the store
  # (D), one after the call to range_next too (E), and WP's by-reference
  # model (R). The enforced jobs read data/vec/vec_range.h as it is; the
  # change VERIFY-079 makes, if it makes one, pins what this probe measures.
  #
  # PROBE: tools/probes/verify-079/vecrange_probe.py applies each version to
  # a copy of the checkout, P0 being the header as it is, and runs WP on
  # vec_int_extend_from_range alone, otherwise as frama-c-vec-range runs it:
  # once with Alt-Ergo, Z3 and CVC5 together, as the proof job runs them,
  # and once with each alone, as 13 · Prover agreement runs them. Its step
  # goals prints P0's invariants as WP gives them to the provers. The file
  # steps names the steps that run, and the job's slots run them in its
  # order. Report-only: it prints each goal's prover and time, the goals one
  # or two provers prove alone, and the pin file's lines for the function
  # that would go and come; it posts notices, and fails only if WP gives no
  # summary or no report for P0, the checkout as it is, or is stopped after
  # an hour. Each step's files are the artifact vecrange-probe. Its
  # predictions and their scores are VERIFY-079's, in docs/deviations.md.
  # -------------------------------------------------------------------------
  vecrange-probe:
    needs: changes
    if: needs.changes.outputs.vecrange == 'true'
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    # Four WP runs of one function a version, about 9 minutes in run 1;
    # setup can take 47 minutes when its cache misses (VERIFY-060 run 1).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      # Slot N runs the N-th step tools/probes/verify-079/steps names (a
      # version, goals or report), and nothing past the file's last: the file
      # alone decides what runs (VERIFY-079 run 1b). One step a slot, since
      # GitHub keeps ten notices of a step.
      - name: "Step 1 of tools/probes/verify-079/steps"
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 1

      - name: "Step 2 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 2

      - name: "Step 3 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 3

      - name: "Step 4 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 4

      - name: "Step 5 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 5

      - name: "Step 6 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 6

      - name: "Step 7 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
          python3 tools/probes/verify-079/vecrange_probe.py --nth 7

      - name: "Step 8 of tools/probes/verify-079/steps"
        if: ${{ !cancelled() }}
        run: |
          eval $(opam env --switch=frama-c)
