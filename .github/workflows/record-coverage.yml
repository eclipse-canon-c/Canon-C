name: Record coverage (argument blocks vs roll-calls)

# ---------------------------------------------------------------------------
# The gates pin the residual set by name. Nothing pins the record's claim about
# which written argument covers which residual — the one evidence class no gate
# checks (paper §5.7). This job joins the two: every goal listed in an argument
# block's table must still be a pinned residual, and every block must still
# cover something. It would have reported VERIFY-009 category 2d as empty on
# 2026-09-06, the day VERIFY-023 closed its two goals; it was found by hand on
# 2026-09-21.
#
# MODE: STRICT (--strict --complete). The job ran advisory until VERIFY-039's
# main pass filed every pinned residual by name, so that the join is total.
# It fails on a listed goal no longer pinned, a block that covers nothing or
# names no goal, a heading count that is not its block's live count, a proved
# goal filed and pinned, a block or filing the script cannot read, a filing
# that cites no block in force, a goal filed twice, a Units cell that differs
# from the pins, a pinned goal in a retired block's table, and a pinned name
# in no goal table. A name whose pins the push itself changes is reported as
# pending and does not fail it (--pending-from, the push's base): a repair's
# ratchet is pushed before the score that restates the record, and at the
# next push the names it changed are no longer pending.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "master" ]
    paths:
      - 'docs/deviations.md'
      - '.github/workflows/cmake-multi-platform.yml'
      - 'vmacros/vdrivers/cc_pins/*.txt'
      - 'tools/record_coverage.py'
      - '.github/workflows/record-coverage.yml'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  record-coverage:
    # Pinned, not ubuntu-latest: see the runner note in
    # cmake-multi-platform.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: "Join docs/deviations.md to the roll-calls (strict)"
        # The base is the pull request's, or the commit the push moved the
        # branch from; a manual run has none. The checkout holds one commit,
        # so the base is fetched for the script to read its pins.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ARGS=(--strict --complete)
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --no-tags --depth=1 origin "$BASE"; then
              ARGS+=(--pending-from "$BASE")
            else
              echo "::notice::the base $BASE could not be fetched: no name is taken as pending"
            fi
          fi
          echo "python3 tools/record_coverage.py ${ARGS[*]}"
          python3 tools/record_coverage.py "${ARGS[@]}"
