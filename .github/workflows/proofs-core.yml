name: "4 · Proofs: core/"
# Frama-C WP proofs of core/ and core/primitives/, one job per unit, each
# enforced on its pins; frama-c-arena-32 and frama-c-win64 re-run units at
# other machine models. Map: .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    # Documentation-only pushes change nothing a gate measures; skip them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'tools/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 5. Formal verification — Frama-C (Linux only)
  #
  #   The single monolithic `frama-c` job has been split into one job per
  #   verified header. Each job:
  #       checkout  ->  uses: ./.github/actions/framac-setup  ->  WP wrapper  ->  upload
  #   The composite action reproduces the six setup steps (opam, cvc5, why3)
  #   that the jobs share; the opam switch is cached on a key all jobs use,
  #   so only the first cold job builds it and the rest restore in ~30s.
  #
  #   Why per-header jobs instead of one serial job: steps within a job run
  #   serially, separate jobs run in parallel. The workflow now gates on the
  #   slowest single header (~vec) instead of the sum of all of them, which
  #   keeps every header comfortably under GitHub's 6h per-job ceiling.
  #   Enforcement is unchanged — each WP step proves the same translation unit
  #   against the same baseline regardless of which job hosts it.
  #
  #   ENFORCED (hard proved/unproved baselines), all fifteen: checked, bits,
  #   compare, ptr, slice, memory, arena, pool, region, error, option,
  #   result, vec, borrow, diag. Region runs 120s/split in its own isolated
  #   job (long run, ~1h40m); vec likewise (~2h50m, timeout-minutes: 240).
  #
  #   GATE POLICY (uniform as of 2026-07-16; previously vec-only for gates
  #   0 and 1 — the retrofit is itself a ratchet commit):
  #     Gate 0 — pinned Proved line (goal-surface drift is a hard failure)
  #     Gate 1 — zero Failed, Invalid or Stepout verdicts, ever. The WP
  #              manual gives wp.verdict ::= none | valid | unknown |
  #              timeout | stepout | invalid | failed. Failed is a PROVER
  #              ERROR, not a refutation — an offline cache miss also
  #              yields Failed — and Invalid is the refutation verdict.
  #              All three are categorically different from a residual,
  #              are gated explicitly, and are EXCLUDED from the pooled
  #              residual count (residual = Timeout ∪ Unknown).
  #              Note these are defence in depth, not a hole being closed:
  #              gates 0 and 2 already pin both (Proved / Total) and the
  #              exact T+U count, and Total − Proved == the pinned count in
  #              every job, so a goal landing in any other verdict already
  #              breaks that equality and trips gate 2. The named gates
  #              turn that arithmetic detection into a diagnosis.
  #              (VERIFY-040, 2026-10-20: WP 29 prints a prover failure as
  #              [Failure], which a check for [Failed] does not match, as
  #              VERIFY-039 G3 found; every verdict check matches both since
  #              this note. frama-c-lifetime pinned its total and its count
  #              but not its proved line, so a goal in any other verdict
  #              passed it; it pins the line since this note, and the
  #              equality above holds in every job. A goal with no result
  #              matches no named gate, whatever WP 29 prints for it; the
  #              pinned proved line and the pinned count catch it in every
  #              job (frama-c-arena-32: its proved line and its residual
  #              set's identity with the 64-bit run).)
  #     Gate 2 — exact residual count
  #     Gate 3 — by-name roll-call; with gate 2 and unique names this is
  #              set equality. Full roll-calls everywhere except bits
  #              (6/15 sampled — completion pending a wp-proof-bits pull;
  #              see the bits job comment).
  #
  #   Eva is intentionally NOT run on these headers: Eva needs an entry point
  #   to anchor abstract interpretation, and these are header-only modules of
  #   static inline functions with no main(). WP proves the contracts and the
  #   absence of runtime errors for every function independently, so Eva is
  #   not needed. When Canon-C grows real translation units (verification
  #   driver files for macro-instantiated modules, or test files compiled as
  #   standalone programs), Eva can run on those.
  #
  #   Provers: Alt-Ergo 2.6.3 + Z3 4.15.2 + CVC5 1.2.1 (triple-prover). Every
  #   remaining unproved goal is demonstrated triple-prover-resistant. See the
  #   composite action for the install + why3 registration procedure.
  # =========================================================================
  frama-c-checked:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: core/primitives/checked.h"
        # WP is expected to leave exactly 2 goals unproven:
        #   typed_checked_add_overflow_ensures
        #   typed_checked_add_u64_overflow_ensures
        # Both are 64-bit unsigned add wraparound assertions that the
        # triple-prover setup (Alt-Ergo 2.6.3 + Z3 4.15.2 + CVC5 1.2.1)
        # cannot discharge in WP's integer memory model. They are
        # discharged manually by a modular-arithmetic argument recorded
        # in docs/verification.md under "Manually discharged goals".
        # (2026-07-16 retrofit): Unknown is now pooled with Timeout (the
        # documented oscillation class), Failed is gated explicitly at
        # zero, and the Proved line is a hard pin — house style.
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/checked.h 2>&1 | tee wp_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP exit status: ${WP_EXIT}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_output.txt || true)
          echo "  ${PROVED_LINE}"
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[(Failed|Failure)\]" wp_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          EXPECTED_UNPROVED=2
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
          # Gate 1 — no Failed verdicts, ever (falsified contract).
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED (not timeout/unknown) —"
            echo "      a contract in checked.h is falsified:"
            grep -E "^\[wp\] \[(Failed|Failure)\]" wp_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_output.txt
            exit 1
          fi
          # Gate 0 — pinned goal surface.
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "1753 / 1755" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 1753 / 1755)."
            echo "      The goal surface drifted — reclassify in VERIFY-002,"
            echo "      then ratchet this pin and the expected count together"
            echo "      in one acknowledged commit."
            exit 1
          fi
          # Gate 2 — exact count.
          if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
            echo "FAIL: unexpected number of unproved goals."
            echo "      Expected exactly ${EXPECTED_UNPROVED} (the manually discharged goals)."
            echo "      See docs/verification.md for details."
            exit 1
          fi
          # Gate 3 — by-name roll-call.
          EXPECTED_GOAL_1="typed_checked_add_overflow_ensures"
          EXPECTED_GOAL_2="typed_checked_add_u64_overflow_ensures"
          if ! grep -qE "\[(Timeout|Unknown)\].*${EXPECTED_GOAL_1}" wp_output.txt; then
            echo "FAIL: expected residual ${EXPECTED_GOAL_1} not observed."
            exit 1
          fi
          if ! grep -qE "\[(Timeout|Unknown)\].*${EXPECTED_GOAL_2}" wp_output.txt; then
            echo "FAIL: expected residual ${EXPECTED_GOAL_2} not observed."
            exit 1
          fi
          echo "PASS: WP discharged all goals automatically except the 2 manually"
          echo "      verified obligations documented in docs/verification.md."
          echo "==============================================="
      - name: Upload WP proof output (checked.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-checked
          path: wp_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        # Posts the WP summary as an annotation, readable through the API
        # without the log. Reads the job's WP output files; changes no gate.
        if: always()
        run: |
          for f in wp_*.txt; do
            [ -f "$f" ] || continue
            P=$(grep -E "^\[wp\] Proved goals:" "$f" | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
            [ -n "$P" ] || continue
            U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" "$f" || true)
            B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "$f" || true)
            echo "::notice title=${{ github.job }}::${f}: proved ${P}; unproved ${U}; failed/invalid/stepout ${B}"
          done

  frama-c-bits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: core/primitives/bits.h"
        # WP is expected to leave exactly 12 goals unproven (as Timeout
        # or Unknown — WP may classify the same goal differently across
        # runs depending on solver heuristics).
        # These are all WP model limitations on bitwise reasoning — not
        # code defects. Categories:
        #   - Bitwise complement (~) in specs: bits_clear, bits_insert's
        #     normal (2)
        #   - SWAR popcount magic constants: bits_popcount (1)
        #   - Rotation shift RTE: bits_rotl, bits_rotr (2)
        #   - Minimality through bit-smearing: bits_next_power_of_two (4)
        #   - Byte swap signed overflow + spec: bits_bswap16/32/64 (3)
        # 15 until VERIFY-039 G15: bits_insert's full_width and the two
        # rotations' postconditions shifted past 64 bits, false for some
        # calls; stated as C computes them since, they prove.
        # The 12 are documented in docs/deviations.md (VERIFY-003, and
        # VERIFY-039's batch 6 and G15).
        # (2026-07-16 retrofit): Failed gated at zero; Proved line pinned
        # hard. KNOWN GAP: the roll-call below is a 6-name SAMPLE, not the
        # full 12 — count+sample is weaker than set equality. TODO: pull
        # the full 12 names from a recent wp-proof-bits artifact and
        # extend CHECKS to the complete set (see ci-fix-plan P2).
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/bits.h 2>&1 | tee wp_bits_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (bits.h) exit status: ${WP_EXIT}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_bits_output.txt || true)
          echo "  ${PROVED_LINE}"
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_bits_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_bits_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[(Failed|Failure)\]" wp_bits_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_bits_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_bits_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          EXPECTED_UNPROVED=12   # VERIFY-039 G14 to G17 predicted: 15 -> 12 (G15)
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED (not timeout/unknown) —"
            echo "      a contract in bits.h is falsified:"
            grep -E "^\[wp\] \[(Failed|Failure)\]" wp_bits_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_bits_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_bits_output.txt
            exit 1
          fi
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          # VERIFY-039 G14 to G17 predicted: G15's three proved, no goal added
          # or removed (742 / 757 before).
          if [ "${PROVED_COUNT}" != "745 / 757" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 745 / 757)."
            echo "      The goal surface drifted — reclassify in VERIFY-003/4,"
            echo "      then ratchet this pin and the expected count together"
            echo "      in one acknowledged commit."
            exit 1
          fi
          if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
            echo "FAIL: unexpected number of unproved goals."
            echo "      Expected exactly ${EXPECTED_UNPROVED} documented unproved goals."
            echo "      See docs/verification.md for details."
            exit 1
          fi
          CHECKS=(
            "typed_bits_clear_ensures"
            "typed_bits_popcount_ensures"
            "typed_bits_insert_normal_ensures"
            "typed_bits_next_power_of_two_normal_ensures"
            "typed_bits_bswap16_assert_rte_signed_overflow"
            "typed_bits_bswap64_ensures"
          )
          for goal in "${CHECKS[@]}"; do
            if ! grep -qE "\[(Timeout|Unknown)\].*${goal}" wp_bits_output.txt; then
              echo "FAIL: expected unproved goal ${goal} not observed."
              exit 1
            fi
          done
          echo "PASS: WP discharged all goals automatically except the 12"
          echo "      documented unproved goals. See docs/verification.md."
          echo "      (roll-call: 6-name sample — full-set completion pending)"
          echo "==============================================="
      - name: Upload WP proof output (bits.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-bits
          path: wp_bits_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        # Posts the WP summary as an annotation, readable through the API
        # without the log. Reads the job's WP output files; changes no gate.
        if: always()
        run: |
          for f in wp_*.txt; do
            [ -f "$f" ] || continue
            P=$(grep -E "^\[wp\] Proved goals:" "$f" | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
            [ -n "$P" ] || continue
            U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" "$f" || true)
            B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "$f" || true)
            echo "::notice title=${{ github.job }}::${f}: proved ${P}; unproved ${U}; failed/invalid/stepout ${B}"
          done

  frama-c-compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: core/primitives/compare.h"
        # compare.h achieved 208/208 (100%) with Typed+Cast model.
        # All 28 comparator functions are fully proved — functional
        # correctness, RTE absence, and assigns \nothing.
        # See docs/deviations.md, entry VERIFY-005.
        # (2026-07-16 retrofit): Failed gated at zero explicitly (it was
        # previously invisible to the T+U-only count); Proved line pinned.
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/compare.h 2>&1 | tee wp_compare_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (compare.h) exit status: ${WP_EXIT}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_compare_output.txt || true)
          echo "  ${PROVED_LINE}"
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_compare_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_compare_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[(Failed|Failure)\]" wp_compare_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_compare_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_compare_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected 0)"
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED —"
            echo "      a contract in compare.h is falsified:"
            grep -E "^\[wp\] \[(Failed|Failure)\]" wp_compare_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_compare_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_compare_output.txt
            exit 1
          fi
          if [ "${UNPROVED_COUNT}" -ne 0 ]; then
            echo "FAIL: compare.h should have 0 unproved goals."
            echo "      Found ${UNPROVED_COUNT} unproved goals — this is a regression."
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Failure|Invalid|Stepout)\]" wp_compare_output.txt || true
            exit 1
          fi
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          if [ "${PROVED_COUNT}" != "208 / 208" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 208 / 208)."
            echo "      This indicates added or removed functions — reclassify"
            echo "      in VERIFY-005 and ratchet the pin in one commit."
            exit 1
          fi
          echo "PASS: compare.h fully verified — 208/208 goals proved,"
          echo "      0 residuals. All 28 comparators proved correct."
          echo "==============================================="
      - name: Upload WP proof output (compare.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-compare
          path: wp_compare_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        # Posts the WP summary as an annotation, readable through the API
        # without the log. Reads the job's WP output files; changes no gate.
        if: always()
        run: |
          for f in wp_*.txt; do
            [ -f "$f" ] || continue
            P=$(grep -E "^\[wp\] Proved goals:" "$f" | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
            [ -n "$P" ] || continue
            U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" "$f" || true)
            B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "$f" || true)
            echo "::notice title=${{ github.job }}::${f}: proved ${P}; unproved ${U}; failed/invalid/stepout ${B}"
          done

  # -------------------------------------------------------------------------
  # VERIFY-023 — ptr.h address helpers now state their result. PRE-REGISTERED
  # RATCHET across eight enforced jobs, written before the run.
  #
  # ptr_offset, ptr_offset_const, ptr_elem, ptr_elem_const gained one
  # `ensures (u8*)\result == (u8*)base + ...` each. Nothing else changed.
  #
  # PREDICTION, every TU that includes ptr.h:
  #   goals  +4 (one ensures goal per helper), proved +4, residual set
  #   UNCHANGED by name. Pins below are moved by exactly that. If -wp-split
  #   fragments an ensures across the null/nonnull branch the delta is +8,
  #   the jobs go red at gate 0, and the correcting commit records the
  #   actual delta -- a red run is the measurement, not a failure of it.
  #
  # SCORED AT CI #1284: delta was +6, not +4 -- ptr_offset and ptr_offset_const
  # split their new ensures across the null/nonnull branch, ptr_elem and
  # ptr_elem_const did not. Residuals: ptr, memory, bitset unchanged by name;
  # arena -8, pool -24 (arena's 8 + 16 own), region -8, vec -8. Zero moved
  # the bad way. Of the 24 distinct goals that closed I predicted 2 (pool's
  # in_bounds pair) and named 8 others (ptr_span) that did NOT close. The
  # classifications those 24 carried in VERIFY-009/-010 -- "fits
  # arithmetic", "free_bytes helpers", "call-site obligations" -- were
  # wrong: they were the callee's opaque result, and closed the moment the
  # callee stated it. Pins below are now the OBSERVED figures.
  #   ptr     1943/1953 -> 1949/1959   memory  2823/2866 -> 2829/2872
  #   arena   3430/3521 -> 3444/3527, 91 -> 83   (arena-32 moves with it)
  #   pool    3884/4003 -> 3914/4009, 119 -> 95  region 3578/3692 -> 3592/3698, 114 -> 106
  #   vec     5271/5467 -> 5285/5473, 196 -> 188 bitset 4839/5002 -> 4845/5008, 163
  #
  # WHERE RESIDUALS MIGHT MOVE, and would be good news arriving as a red run:
  #   pool    pool_get_in_bounds_ensures_part4, pool_get_const_in_bounds_
  #           ensures_part4 -- pool_get's result comes from ptr_elem, which
  #           was opaque. If these flip to Proved, ratchet DOWN to 117.
  #   arena   the 8 arena_alloc*_call_ptr_span_requires* goals, if ptr_span's
  #           preconditions reason about an offset ptr_offset produced.
  #   Every other pinned residual is memcmp/danglingness, alignment
  #   arithmetic, allocation-model or function-pointer class and does not
  #   touch these helpers' results. Predicted: no other name moves.
  #
  # THE BAD DIRECTION, named so the prediction can fail honestly: a callee
  # ensures is a HYPOTHESIS in every caller, so prover contexts grow. arena,
  # pool and region already run hundreds of goals near the 120s timeout. A
  # goal that proved at 90s could time out at 121s, flipping a pinned PROVED
  # goal to residual -- a regression, and a red run that is NOT good news.
  # Judged unlikely for one pointer equality; not measurable from here. If
  # it happens the fix is not to revert ptr.h (the ensures restate the
  # bodies and cannot be false) but to record which goal became
  # timeout-sensitive and why. That is a finding about proof fragility.
  #
  # WHAT CANNOT HAPPEN: Failed or Invalid. (u8*)p + n IS the body.
  #
  # priority_queue (report-only): own residuals fall from 170. Registered
  # in that job's banner.
  #
  # NOT included, deliberately: slice, borrow, diag, deque, option, result,
  # error, checked, bits, compare, lifetime -- verified by preprocessing
  # that none of their TUs contain ptr_elem_const. Their pins do not move.
  # -------------------------------------------------------------------------
  frama-c-ptr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: core/primitives/ptr.h"
        # ptr.h uses Typed+Cast memory model for the same reason as
        # compare.h. Expected result: 1952 / 1958 proved (VERIFY-039 G14
        # to G17), exactly 6 unproved, all true: checked.h's overflow
        # postconditions (2), align_up's and align_down's formulas (2),
        # align_padding's formula and ptr_align_padding's bound (2). Any
        # deviation is a regression and fails the job. 1959 / 1975 and 16
        # until then: the handler pair (G14), ptr_align_up's and
        # ptr_align_padding's calls (G16) and the six part2s of
        # ptr_align_up's and ptr_align_down's nonnull ensures (VERIFY-026,
        # VERIFY-027, G16) closed.
        # PIN NOTE (2026-07-16): the pin is the FULL-RUN figure 1943/1953,
        # per the documented dual accounting (VERIFY-006 "CI run note";
        # verification.md ptr.h Baseline note; changelog 2026-04-27):
        # ptr.h's OWN baseline is 1729/1739; the +214 are checked.h's 12
        # div/mod functions (c3df659, CI #804), counted in checked.h's own
        # row — zero of them residual in this TU, same 10 named goals
        # before and after. The pre-retrofit wrapper carried the old pin
        # as a documented WARN-and-PASS; the retrofit pins the full-run
        # figure hard, which is what WP reports and what gate 0 compares.
        # (2026-07-16 retrofit): Failed gated at zero and EXCLUDED from the
        # pooled count (a Timeout->Failed flip previously passed count and
        # roll-call); Proved-line warning promoted to a hard pin.
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            core/primitives/ptr.h 2>&1 | tee wp_ptr_output.txt
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (ptr.h) exit status: ${WP_EXIT}"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" wp_ptr_output.txt || true)
          echo "  ${PROVED_LINE}"
          TIMEOUT_COUNT=$(grep -cE "^\[wp\] \[Timeout\]" wp_ptr_output.txt || true)
          UNKNOWN_COUNT=$(grep -cE "^\[wp\] \[Unknown\]" wp_ptr_output.txt || true)
          FAILED_COUNT=$(grep -cE "^\[wp\] \[(Failed|Failure)\]" wp_ptr_output.txt || true)
          INVALID_COUNT=$(grep -cE "^\\[wp\\] \\[Invalid\\]" wp_ptr_output.txt || true)
          STEPOUT_COUNT=$(grep -cE "^\\[wp\\] \\[Stepout\\]" wp_ptr_output.txt || true)
          UNPROVED_COUNT=$((TIMEOUT_COUNT + UNKNOWN_COUNT))
          EXPECTED_UNPROVED=6   # VERIFY-039 G14 to G17 predicted: 16 -> 6
          echo "  Timeouts: ${TIMEOUT_COUNT}"
          echo "  Unknown:  ${UNKNOWN_COUNT}"
          echo "  Failed:   ${FAILED_COUNT}"
          echo "  Total unproved (T+U): ${UNPROVED_COUNT} (expected ${EXPECTED_UNPROVED})"
          if [ "${FAILED_COUNT}" -ne 0 ]; then
            echo "FAIL: ${FAILED_COUNT} goal(s) FAILED (not timeout/unknown) —"
            echo "      a contract in ptr.h is falsified:"
            grep -E "^\[wp\] \[(Failed|Failure)\]" wp_ptr_output.txt
            exit 1
          fi
          if [ "${INVALID_COUNT}" -ne 0 ]; then
            echo "FAIL: ${INVALID_COUNT} goal(s) INVALID — a contract is"
            echo "      FALSIFIED with a counter-example. Invalid is WP's"
            echo "      refutation verdict; Failed is a prover error. This"
            echo "      is categorically different from a residual and can"
            echo "      never be pinned:"
            grep -E "^\\[wp\\] \\[Invalid\\]" wp_ptr_output.txt
            exit 1
          fi
          if [ "${STEPOUT_COUNT}" -ne 0 ]; then
            echo "FAIL: ${STEPOUT_COUNT} goal(s) hit a prover STEP limit."
            echo "      Stepout is a non-proved verdict this project has"
            echo "      never observed. It is deliberately NOT pooled into"
            echo "      the residual count, because the residual set is"
            echo "      defined as Timeout u Unknown. If this fires, decide"
            echo "      whether to pool it and update the definition first:"
            grep -E "^\\[wp\\] \\[Stepout\\]" wp_ptr_output.txt
            exit 1
          fi
          PROVED_COUNT=$(echo "${PROVED_LINE}" | grep -oP '\d+ / \d+' | head -1 || true)
          # VERIFY-039 G14 to G17 predicted: 22 goals removed and 5 added
          # (1959 / 1975 before).
          if [ "${PROVED_COUNT}" != "1952 / 1958" ]; then
            echo "FAIL: proved-goal summary changed (pinned: 1952 / 1958)."
            echo "      The goal surface drifted — reclassify in VERIFY-006"
            echo "      (VERIFY-039 for the alignment parts), then ratchet"
            echo "      this pin, EXPECTED_UNPROVED, and CHECKS together in"
            echo "      one acknowledged commit."
            exit 1
          fi
          if [ "${UNPROVED_COUNT}" -ne "${EXPECTED_UNPROVED}" ]; then
            echo "FAIL: unexpected number of unproved goals."
            echo "      Expected exactly ${EXPECTED_UNPROVED} documented unproved goals."
            echo "      See docs/deviations.md: VERIFY-006, and VERIFY-039's"
            echo "      batch 6 and G14 to G17."
            echo ""
            echo "Observed unproved goals:"
            grep -E "^\[wp\] \[(Timeout|Unknown|Failed|Failure|Invalid|Stepout)\]" wp_ptr_output.txt || true
            exit 1
          fi
          CHECKS=(
            "typed_cast_checked_add_overflow_ensures"
            "typed_cast_checked_add_u64_overflow_ensures"
            "typed_cast_align_up_ensures"
            "typed_cast_align_down_ensures"
            "typed_cast_align_padding_ensures"
            "typed_cast_ptr_align_padding_nonnull_ensures_part2"
          )
          for goal in "${CHECKS[@]}"; do
            if ! grep -qE "\[(Timeout|Unknown)\].*${goal}" wp_ptr_output.txt; then
              echo "FAIL: expected unproved goal ${goal} not observed."
              exit 1
            fi
          done
          CVC5_INVOKED=$(grep -cE "CVC5|cvc5" wp_ptr_output.txt || true)
          echo "  CVC5 mentions in WP output: ${CVC5_INVOKED}"
          if [ "${CVC5_INVOKED}" -eq 0 ]; then
            echo "NOTE: cvc5 discharged nothing in this TU. That is NOT"
            echo "      evidence of a degraded prover set — WP tries provers"
            echo "      in sequence, so a TU whose goals Alt-Ergo or Z3 close"
            echo "      (or which time out) never mentions cvc5 at all. This"
            echo "      job has read 0 here in every green run on record."
            echo "      Prover AVAILABILITY is what matters, and it is hard-"
            echo "      gated in .github/actions/framac-setup."
          fi
          echo "PASS: WP discharged all goals automatically except the 6"
          echo "      documented unproved goals, all true: VERIFY-006's and"
          echo "      VERIFY-039's batch 6."
          echo "==============================================="
      - name: Upload WP proof output (ptr.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-ptr
          path: wp_ptr_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        # Posts the WP summary as an annotation, readable through the API
        # without the log. Reads the job's WP output files; changes no gate.
        if: always()
        run: |
          for f in wp_*.txt; do
            [ -f "$f" ] || continue
            P=$(grep -E "^\[wp\] Proved goals:" "$f" | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
            [ -n "$P" ] || continue
            U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" "$f" || true)
            B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "$f" || true)
            echo "::notice title=${{ github.job }}::${f}: proved ${P}; unproved ${U}; failed/invalid/stepout ${B}"
          done

