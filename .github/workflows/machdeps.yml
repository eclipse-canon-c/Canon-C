name: "10 · Machine models"
# VERIFY-060, phases A to B (docs/deviations.md). Frama-C ships no machine
# model for Arm or RISC-V. This job generates the seven the core/ proofs of
# proofs-machdeps.yml use (Cortex-M4, RV32 and RV64 bare metal; 32-bit Arm,
# RV64, AArch64 and big-endian 32-bit PowerPC Linux) with Frama-C 29's
# make-machdep and the cross-compilers of tools/machdeps/packages.txt,
# compares each with its committed copy in tools/machdeps/ (the drift check),
# and reads what Frama-C sees at each, and at its own x86_64, gcc_x86_32,
# ppc_32 and msvc_x86_64: sizes, alignments, typedefs and compiler macros
# (tools/machdeps/check.c), whether each core/ unit parses, and whether a
# unit's code changes in GCC mode. The drift check is a gate since phase C:
# a model that no longer regenerates the same fails the job, and is
# regenerated, reviewed and committed again. The reads stay report-only.
# Map: .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/machdeps.yml'
      - 'tools/machdeps/**'
      - '.github/actions/framac-setup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machdeps:
    name: "machine models (VERIFY-060, drift check enforced)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "Install the cross-compilers"
        # Without the packages apt recommends (VERIFY-060, phase C): with them
        # this step downloaded 955 MB, a 463 MB Arm C++ library among them,
        # and stalled at the Ubuntu mirror for 3 hours 40 minutes (10 · Machine
        # models #6, attempt 1). packages.txt lists the C library headers the
        # Linux compilers recommend, which make-machdep reads. The limit fails
        # a stalled install in 30 minutes; a re-run usually takes one.
        timeout-minutes: 30
        run: |
          sudo apt-get update
          xargs -a tools/machdeps/packages.txt sudo apt-get install -y --no-install-recommends
          for cc in arm-none-eabi-gcc riscv64-unknown-elf-gcc arm-linux-gnueabihf-gcc \
                    riscv64-linux-gnu-gcc aarch64-linux-gnu-gcc powerpc-linux-gnu-gcc; do
            "$cc" --version | head -1
          done
      - name: "Frama-C's own machine models, and make-machdep's interface"
        run: |
          eval $(opam env --switch=frama-c)
          frama-c -version
          frama-c -machdep help
          frama-c -enums help || true
          frama-c-script make-machdep --help || true
          share=$(frama-c -print-share-path)
          for m in ppc_32 msvc_x86_64 gcc_x86_32 x86_64; do
            echo "-- Frama-C's own machdep_${m}.yaml:"
            cat "${share}/machdeps/machdep_${m}.yaml" || true
          done
      - name: "Generate the seven models"
        continue-on-error: true   # a model it fails to make is MISSING at the drift check
        run: |
          eval $(opam env --switch=frama-c)
          tools/machdeps/generate.sh out
      - name: "Drift check: each committed model regenerates the same (enforced)"
        run: python3 tools/machdeps/compare.py tools/machdeps out
      - name: "What Frama-C sees at each model, whether each core/ unit parses, and the mode control"
        if: ${{ !cancelled() }}
        continue-on-error: true   # report-only
        run: |
          eval $(opam env --switch=frama-c)
          models=(tools/machdeps/machdep_*.yaml)
          for g in out/machdep_*.yaml; do
            [ -e "tools/machdeps/$(basename "$g")" ] || models+=("$g")
          done
          tools/machdeps/check.sh out/check "${models[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: machdeps
          path: out/
