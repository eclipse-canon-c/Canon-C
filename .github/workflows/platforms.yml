name: "2 · Platforms"
# Portability beyond the build matrix: musl, Linux AArch64, C11 to C23,
# 32-bit Arm, big-endian s390x and 32-bit PowerPC under qemu, the
# embedded compile checks (Cortex-M, RISC-V, AVR), the tests on Cortex-M0+
# and Cortex-M4 under QEMU, on MSP430X under the GDB simulator, on
# bare-metal AArch64 (Cortex-A78AE, Cortex-R82) and on Cortex-R5F and
# Cortex-R52 under QEMU, and on Renesas RH850 and RX and bare-metal 32-bit
# PowerPC under GDB's simulators, with toolchains built from Ubuntu's
# source packages, as is ARC's, for which the headers and tests are
# compiled; the platform tiers
# for dsPIC and PIC24's core, with Microchip's XC-DSC, fetched from
# Microchip; and finite math, refused, with GCC and Clang. Map:
# .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    # Documentation-only pushes change nothing a gate measures; skip them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/probes.yml'   # 9 · Probes only: nothing here reads it (VERIFY-080)
      - '.github/workflows/smoke.yml'    # 16 · Smoke tests only: nothing here reads it (VERIFY-088)
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/probes.yml'   # 9 · Probes only: nothing here reads it (VERIFY-080)
      - '.github/workflows/smoke.yml'    # 16 · Smoke tests only: nothing here reads it (VERIFY-088)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1c. musl libc — Alpine, GCC (VERIFY-043)
  #
  #    The only C library in the matrix outside glibc, Apple's, MSVC's UCRT
  #    and MinGW's. It found a real defect before any job ran it:
  #    stringbuf.h's vsnprintf size argument (VERIFY-031 G2), whose musl leg
  #    that record noted as follow-up. Sanitizers OFF: musl does not support
  #    ASan. The image is pinned by version, as the runner is (VERIFY-039's
  #    rule: move it deliberately).
  # -------------------------------------------------------------------------
  musl:
    runs-on: ubuntu-24.04
    container: alpine:3.20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Install toolchain
        run: apk add --no-cache build-base cmake git
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=OFF \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1d. Linux AArch64 — GCC and clang (VERIFY-043)
  #
  #    On AArch64 Linux, plain char is unsigned, unlike every other target in
  #    the matrix (Apple keeps it signed on arm64). Sanitizers in Debug, as
  #    the build job runs them. The runner label is pinned.
  # -------------------------------------------------------------------------
  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        c_compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          SANITIZERS=OFF
          if [ "${{ matrix.build_type }}" = "Debug" ]; then SANITIZERS=ON; fi
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=${SANITIZERS} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1e. Later C standards — C11, C17 and C23, GCC 14 and clang (VERIFY-044)
  #
  #    Every other job compiles as C99, the project default. Canon-C claims
  #    "C99 or later"; this job holds it to that under the later standards,
  #    C23 among them (bool a keyword, unreachable() a standard macro).
  #    Debug with sanitizers. --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  c-standards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        c_std: [11, 17, 23]
        c_compiler: [gcc-14, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_C_STANDARD=${{ matrix.c_std }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -S .
      - name: Check the requested standard reached the compiler
        run: |
          find build -name flags.make -exec grep -hoE -- '-std=[a-z0-9]+' {} + | sort | uniq -c
          if find build -name flags.make -exec grep -lE -- '-std=(c|gnu)99' {} + | grep -q .; then
            echo "::error::-std=c99 found in a C${{ matrix.c_std }} build"; exit 1
          fi
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1f. Big-endian — Linux s390x, GCC cross-compiler, run under qemu-user
  #     (VERIFY-045)
  #
  #    Every other target in the matrix is little-endian. s390x is
  #    big-endian with 64-bit pointers. The tests are cross-compiled and
  #    CTest runs each one through qemu-s390x (CMAKE_CROSSCOMPILING_EMULATOR).
  #    No sanitizers: their runtimes are not reliable under qemu-user.
  #    --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  big-endian:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v6
      - name: Install the s390x cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          s390x-linux-gnu-gcc --version | head -1
          qemu-s390x --version | head -1
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Check the binaries are big-endian s390x
        run: |
          file build/bitset_test
          file build/bitset_test | grep -q "MSB.*IBM S/390"
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1f2. Big-endian, 32-bit — Linux PowerPC, GCC cross-compiler, run under
  #      qemu-user (VERIFY-095)
  #
  #    s390x, above, is big-endian with 64-bit pointers; 32-bit PowerPC is
  #    big-endian with 32-bit ones, so a 32-bit size_t meets the other byte
  #    order. Its char is unsigned, and a uint64_t in a struct is aligned to
  #    8 bytes, where i386 aligns it to 4: each build type runs with
  #    CANON_LIFETIME=debug too, for the lifetime_t field in each owner. It
  #    has no lock-free 64-bit atomic, so lifetime.h's counter calls
  #    libatomic, which CMakeLists.txt links where its check finds that
  #    needed; the job names the test binaries linked with it. Packages
  #    through .github/actions/apt-install (VERIFY-093). No sanitizers, as
  #    above. --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  big-endian-32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        lifetime: ["off", "debug"]   # quoted: YAML 1.1 reads a bare off as false
    steps:
      - uses: actions/checkout@v6
      - name: Install the PowerPC cross toolchain and qemu-user
        # From the Actions cache, or from Canonical's archive before Azure's
        # mirror (VERIFY-093); the limit fails a stalled install in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: big-endian-32
          packages: gcc-powerpc-linux-gnu libc6-dev-powerpc-cross qemu-user
      - name: Show the compiler's and qemu's versions
        run: |
          powerpc-linux-gnu-gcc --version | head -1
          qemu-ppc --version | head -1
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=powerpc \
            -DCMAKE_C_COMPILER=powerpc-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-ppc;-L;/usr/powerpc-linux-gnu" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCANON_LIFETIME=${{ matrix.lifetime }} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Check the binaries are 32-bit big-endian PowerPC, and which need libatomic
        run: |
          file build/bitset_test
          file build/bitset_test | grep -q "ELF 32-bit MSB.*PowerPC"
          all=0; need=""
          for f in $(find build -maxdepth 1 -type f -perm -u+x -name '*_test' | sort); do
            all=$((all + 1))
            if readelf -d "$f" | grep -q 'NEEDED.*libatomic'; then need="$need ${f#build/}"; fi
          done
          echo "linked with libatomic:$need"
          # No title: a notice's properties are separated by commas
          # (VERIFY-095), so the leg is in the message.
          echo "::notice::big-endian-32 ${{ matrix.build_type }} ${{ matrix.lifetime }}: $(echo $need | wc -w) of $all test binaries linked with libatomic"
          case " $need " in
            *" lifetime_test "*) ;;
            *) echo "::error::lifetime_test is not linked with libatomic"; exit 1 ;;
          esac
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1f3. 32-bit Arm — Linux armhf, GCC cross-compiler, run under qemu-user
  #      (VERIFY-112)
  #
  #    Ubuntu's arm-linux-gnueabihf: Armv7-A, Thumb-2, VFPv3-D16 and the
  #    hard-float ABI. As on 32-bit PowerPC, above, size_t has 32 bits,
  #    char is unsigned and a uint64_t in a struct is aligned to 8 bytes:
  #    each build type runs with CANON_LIFETIME=debug too. Unlike it, the
  #    bytes are little-endian and the 64-bit atomic is lock-free (LDREXD
  #    and STREXD), so CMakeLists.txt's check links no test with libatomic;
  #    the job names the test binaries that hold the atomic inline, and
  #    fails if one is linked with libatomic or lifetime_test holds no
  #    LDREXD. Packages through .github/actions/apt-install (VERIFY-093).
  #    No sanitizers, as above. --no-tests=error: a leg that finds no test
  #    fails.
  # -------------------------------------------------------------------------
  armhf:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        lifetime: ["off", "debug"]   # quoted: YAML 1.1 reads a bare off as false
    steps:
      - uses: actions/checkout@v6
      - name: Install the armhf cross toolchain and qemu-user
        # From the Actions cache, or from Canonical's archive before Azure's
        # mirror (VERIFY-093); the limit fails a stalled install in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: armhf
          packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Show the compiler's and qemu's versions
        run: |
          arm-linux-gnueabihf-gcc --version | head -1
          qemu-arm --version | head -1
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCANON_LIFETIME=${{ matrix.lifetime }} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Check the binaries are Armv7-A, Thumb-2 and hard float, and where the 64-bit atomic is
        run: |
          file build/bitset_test
          file build/bitset_test | grep -q "ELF 32-bit LSB.*ARM, EABI5"
          attrs=$(arm-linux-gnueabihf-readelf -A build/bitset_test)
          echo "$attrs"
          for want in "Tag_CPU_arch: v7" "Tag_CPU_arch_profile: Application" \
                      "Tag_ABI_VFP_args: VFP registers"; do
            grep -q "$want" <<< "$attrs" || { echo "::error::bitset_test lacks $want"; exit 1; }
          done
          # Tag_THUMB_ISA_use says Thumb-2 is allowed, and says so of Arm
          # code too; a Thumb function's address is odd.
          syms=$(arm-linux-gnueabihf-readelf -s build/bitset_test)
          main=$(awk '$4 == "FUNC" && $8 == "main" && !n++ { print $2 }' <<< "$syms")
          case "$main" in
            *[13579bdf]) echo "main at 0x$main: Thumb code" ;;
            *) echo "::error::bitset_test's main, at 0x$main, is not Thumb code"; exit 1 ;;
          esac
          # Read whole, not piped into grep -q: under pipefail, grep's early
          # exit stops objdump with SIGPIPE, and the test reads as false.
          all=0; need=""; inline=""
          for f in $(find build -maxdepth 1 -type f -perm -u+x -name '*_test' | sort); do
            all=$((all + 1))
            dyn=$(arm-linux-gnueabihf-readelf -d "$f")
            grep -q 'NEEDED.*libc\.so\.6' <<< "$dyn" || { echo "::error::${f#build/}: no libc.so.6 in readelf -d"; exit 1; }
            if grep -q 'NEEDED.*libatomic' <<< "$dyn"; then need="$need ${f#build/}"; fi
            dis=$(arm-linux-gnueabihf-objdump -d "$f")
            if grep -qw ldrexd <<< "$dis"; then inline="$inline ${f#build/}"; fi
          done
          echo "linked with libatomic:$need"
          echo "the 64-bit atomic inline (LDREXD):$inline"
          # No title, as big-endian-32's: the leg is in the message.
          echo "::notice::armhf ${{ matrix.build_type }} ${{ matrix.lifetime }}: Armv7-A, Thumb-2, hard float; $(echo "$need" | wc -w) of $all test binaries linked with libatomic, $(echo "$inline" | wc -w) with the 64-bit atomic inline (LDREXD)"
          if [ -n "$need" ]; then echo "::error::linked with libatomic:$need"; exit 1; fi
          case " $inline " in
            *" lifetime_test "*) ;;
            *) echo "::error::lifetime_test holds no LDREXD"; exit 1 ;;
          esac
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1g. Bare-metal Arm — compile only (VERIFY-046)
  #
  #    arm-none-eabi-gcc with newlib, Cortex-M0+ and Cortex-M4 (hard float),
  #    at -O0, -Os and -O2, under the project's warning flags. Every public
  #    header is compiled as its own translation unit, and every test file.
  #    Nothing is linked or run: this backs the README's bare-metal section
  #    as far as compiling goes. On this target enums are short
  #    (-fshort-enums) and int32_t is long, which no hosted target has.
  #    The lists, and what is left out and why, are in the script.
  #
  #    VERIFY-048 adds picolibc on the same two cores, RISC-V RV32 (rv32imac,
  #    ilp32) and RV64 (rv64imac, lp64) with picolibc, and an AVR step: the
  #    README's platform tiers at a 16-bit size_t (tools/avr_tier_check.sh).
  #
  #    VERIFY-070 adds code size and build cost, header by header
  #    (tools/size/size.py): each header's own functions, all of them kept,
  #    for Cortex-M0+, Cortex-M4 and RV32 at -Os and -O2, as shipped and with
  #    the run-time checks off; and the Canon-C each header brings
  #    after preprocessing, as tokens since its run 2. Every figure is
  #    pinned (tools/size/pins.txt) and compared: report-only in its run 2,
  #    a difference fails the job from its run 3.
  # -------------------------------------------------------------------------
  embedded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the Arm, RISC-V and AVR toolchains, newlib and picolibc
        # Without the packages apt recommends, as machdeps.yml installs its
        # cross-compilers (VERIFY-060): with them apt had 844 MB to get, 463
        # MB of it the Arm C++ library, which these C compile checks do not
        # use, and the step took 2 h 48 min at a stalled Ubuntu mirror
        # (2 · Platforms #37; VERIFY-061, phase A's run 2). Every package the
        # checks use is named here. Their files, 380 MB, come from the
        # Actions cache, or from Canonical's archive before Azure's mirror,
        # which sent them at 0.1 MB/s on 2026-11-19 (VERIFY-093). The limit
        # fails a stalled install in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: embedded
          packages: >-
            gcc-arm-none-eabi libnewlib-arm-none-eabi
            picolibc-arm-none-eabi gcc-riscv64-unknown-elf
            picolibc-riscv64-unknown-elf gcc-avr avr-libc
      - name: Compile for Cortex-M (newlib, picolibc) and RISC-V RV32, RV64 (picolibc)
        run: tools/embedded_compile_check.sh
      - name: AVR — the platform tiers at a 16-bit size_t (VERIFY-048)
        run: tools/avr_tier_check.sh
      - name: Code size and build cost, header by header (VERIFY-070)
        run: python3 tools/size/size.py run size_out
      - name: Upload the sizes
        uses: actions/upload-artifact@v6
        with:
          name: code-size
          path: size_out/
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1h. Metrics — each function's complexity, header by header (VERIFY-081)
  #
  #    Frama-C's Metrics plug-in on the units tools/size/size.py measures:
  #    each public header alone, a generic module instantiated for u32, a
  #    function counted for the header whose module defines it, the code
  #    as shipped (NDEBUG). Each function's cyclomatic complexity is pinned
  #    (tools/metrics/pins.txt) and compared; its other counts (statements,
  #    decisions, loops, calls, ...) go to metrics.csv. Nothing is proved:
  #    the counts are syntactic. Report-only in VERIFY-081's run 1; since
  #    its run 2, a complexity not as pinned fails the job.
  # -------------------------------------------------------------------------
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: Each function's complexity, header by header (VERIFY-081)
        run: |
          eval $(opam env --switch=frama-c)
          frama-c -version
          python3 tools/metrics/metrics.py run metrics_out
      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: metrics
          path: metrics_out/
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1i. Cortex-M under QEMU — the tests run (VERIFY-089)
  #
  #    The embedded job compiles the tests for Cortex-M; this one runs them
  #    there. arm-none-eabi-gcc with newlib or picolibc; each test is run
  #    under qemu-system-arm through semihosting, which carries its output
  #    and exit status to the host: Cortex-M0+ code (Armv6-M, soft float,
  #    which faults on an unaligned access) on QEMU's micro:bit, whose
  #    Cortex-M0 runs it, and Cortex-M4 with hard float on mps2-an386. Each
  #    at Debug, Release, RelWithDebInfo and MinSizeRel, with
  #    CANON_LIFETIME_NO_ATOMICS defined. The tests that do not pass there
  #    are pinned, each with its reason (tools/cortexm/pins.txt).
  #
  #    Two toolchains: Ubuntu 24.04's packages (GCC 13.2, newlib and
  #    picolibc), enforced since VERIFY-089's run 2; and the Arm GNU
  #    Toolchain 15.3.Rel2 (GCC 15.3, its own newlib), fetched from Arm
  #    with its checksum pinned, enforced since run 3. GCC 15.3 compiles
  #    option_test right at -O2 and -Os, where GCC 13.2 does not.
  # -------------------------------------------------------------------------
  cortex-m:
    name: ${{ matrix.toolchain == 'ubuntu' && format('cortex-m ({0}, {1})', matrix.cpu, matrix.libc) || format('cortex-m ({0}, {1}, {2})', matrix.cpu, matrix.libc, matrix.toolchain) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ubuntu]
        cpu: [m0plus, m4]
        libc: [newlib, picolibc]
        include:
          - { toolchain: arm-15.3.rel2, cpu: m0plus, libc: newlib }
          - { toolchain: arm-15.3.rel2, cpu: m4, libc: newlib }
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      # The Arm GNU Toolchain 15.3.Rel2's x86_64 package for arm-none-eabi,
      # where Arm publishes it, and its SHA-256 as Arm's meta-arm layer
      # (gcc-arm-none-eabi_15.3.rel2.bb) and arm-none-eabi-gcc-action pin it.
      ARM_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz
      ARM_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU, and Ubuntu's Arm toolchain, newlib and picolibc
        # Without the packages apt recommends, as the embedded job installs
        # them, and as it does, from the Actions cache first (VERIFY-093);
        # the limit fails a stalled mirror in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: cortex-m-${{ matrix.toolchain }}
          packages: ${{ matrix.toolchain == 'ubuntu' && 'qemu-system-arm gcc-arm-none-eabi libnewlib-arm-none-eabi picolibc-arm-none-eabi' || 'qemu-system-arm' }}
      - name: Cache the Arm GNU Toolchain's package
        if: matrix.toolchain != 'ubuntu'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain.tar.xz
          key: arm-gnu-toolchain-${{ env.ARM_SHA256 }}
      - name: Fetch the Arm GNU Toolchain, its checksum checked
        if: matrix.toolchain != 'ubuntu'
        timeout-minutes: 15
        run: |
          pkg="$RUNNER_TEMP/arm-gnu-toolchain.tar.xz"
          [ -f "$pkg" ] || curl -fsSL --retry 3 -o "$pkg" "$ARM_URL"
          echo "$ARM_SHA256  $pkg" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/arm-gnu-toolchain"
          tar -xJf "$pkg" -C "$RUNNER_TEMP/arm-gnu-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
      - name: "The tests on Cortex-M under QEMU: ${{ matrix.cpu }}, ${{ matrix.libc }}, ${{ matrix.toolchain }}"
        env:
          CPU: ${{ matrix.cpu }}
          LIBC: ${{ matrix.libc }}
        run: python3 tools/cortexm/cortexm.py run "$CPU" "$LIBC" --toolchain "$TOOLCHAIN"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cortex-m-${{ matrix.toolchain }}-${{ matrix.cpu }}-${{ matrix.libc }}
          path: |
            cortexm_out/*.json
            cortexm_out/*.build.log
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1j. MSP430X under the GDB simulator — the tests at a 16-bit int
  #     (VERIFY-096)
  #
  #    TI's msp430-elf-gcc (the Mitto Systems GCC 9.3.1.11, its newlib),
  #    and msp430-elf-run, the GDB simulator the toolchain ships, which
  #    carries a test's output and exit status through newlib's simulator
  #    runtime (-msim). int has 16 bits at both models; size_t and
  #    pointers 16 at the small model, 20 at the large (__int20). A size_t
  #    below 32 bits is Tier 1's refusal, so the tests that build are
  #    those below Tier 1. tools/msp430/msp430.py builds each model at the
  #    four build types, after a probe that the simulator carries a
  #    program's output and exit status and a file probe, and holds the
  #    outcomes against tools/msp430/pins.txt: report-only at VERIFY-096's
  #    run, enforced since VERIFY-097.
  # -------------------------------------------------------------------------
  msp430:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [small, large]
    env:
      # TI's MSP430-GCC-OPENSOURCE 9.3.1.2, its toolchain for x86-64 Linux,
      # where TI publishes it, and its SHA-256 as three recipes that fetch
      # the same file pin it (two Nix derivations, lwext4's CI image).
      TI_URL: https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-LlCjWuAbzH/9.3.1.2/msp430-gcc-9.3.1.11_linux64.tar.bz2
      TI_SHA256: b60851b61565e3ddd2193298a3fac5120c2402597174106cc5f8482b9e9986e6
    steps:
      - uses: actions/checkout@v6
      - name: Cache TI's MSP430 toolchain's package
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/msp430-gcc.tar.bz2
          key: msp430-gcc-${{ env.TI_SHA256 }}
      - name: Fetch TI's MSP430 toolchain, its checksum checked
        timeout-minutes: 15
        run: |
          pkg="$RUNNER_TEMP/msp430-gcc.tar.bz2"
          [ -f "$pkg" ] || curl -fsSL --retry 3 -o "$pkg" "$TI_URL"
          echo "$TI_SHA256  $pkg" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/msp430-gcc"
          tar -xjf "$pkg" -C "$RUNNER_TEMP/msp430-gcc" --strip-components=1
          echo "$RUNNER_TEMP/msp430-gcc/bin" >> "$GITHUB_PATH"
      - name: "The tests on MSP430X under the GDB simulator: ${{ matrix.model }} model"
        timeout-minutes: 90
        env:
          MODEL: ${{ matrix.model }}
        run: python3 tools/msp430/msp430.py run "$MODEL"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: msp430-${{ matrix.model }}
          path: |
            msp430_out/*.json
            msp430_out/*.build.log
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1k. AArch64, bare metal, under QEMU — Cortex-A78AE and Cortex-R82
  #     (VERIFY-099)
  #
  #    build-arm64 runs the tests on AArch64 Linux, with glibc; this job
  #    runs them with no operating system: Ubuntu's aarch64-linux-gnu-gcc
  #    with picolibc's specs in place of glibc, under qemu-system-aarch64's
  #    virt board, through semihosting, which carries a test's output and
  #    exit status. QEMU 8.2 models neither core: each is compiled for with
  #    its -mcpu and run on QEMU's max CPU, which has the instructions of
  #    both. tools/aarch64/aarch64.py builds each core at the four build
  #    types, after a probe that QEMU carries a program's output and exit
  #    status, and holds the outcomes against tools/aarch64/pins.txt,
  #    enforced from VERIFY-099's run 1: the pins were measured before it
  #    with the packages this job installs.
  # -------------------------------------------------------------------------
  aarch64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        core: [a78ae, r82]
    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU, and Ubuntu's AArch64 GCC and picolibc
        # Without the packages apt recommends, as the cortex-m job installs
        # its own, and as it does, from the Actions cache first
        # (VERIFY-093); the limit fails a stalled mirror in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: aarch64
          packages: qemu-system-arm gcc-aarch64-linux-gnu picolibc-aarch64-linux-gnu
      - name: "The tests on bare-metal AArch64 under QEMU: ${{ matrix.core }}"
        timeout-minutes: 30
        env:
          CORE: ${{ matrix.core }}
        run: python3 tools/aarch64/aarch64.py run "$CORE"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aarch64-${{ matrix.core }}
          path: |
            aarch64_out/*.json
            aarch64_out/*.build.log
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1k2. Cortex-R5F and Cortex-R52, bare metal, on QEMU's models (VERIFY-113)
  #
  #    armhf runs the tests on 32-bit Arm Linux; this job runs them on Arm's
  #    32-bit real-time cores, with no operating system: Ubuntu's
  #    arm-none-eabi-gcc with picolibc, each test on qemu-system-arm's model
  #    of the core, cortex-r5f or cortex-r52, on QEMU's empty machine
  #    (tools/cortexr/qemu.sh), through semihosting, which carries a test's
  #    output and exit status. tools/cortexr/cortexr.py builds each core at
  #    the four build types, after a probe that QEMU carries a program's
  #    output and exit status, and holds the outcomes against
  #    tools/cortexr/pins.txt, enforced from VERIFY-113's run 1: the pins
  #    were measured before it with the packages this job installs.
  # -------------------------------------------------------------------------
  cortex-r:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        core: [r5, r52]
    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU, and Ubuntu's arm-none-eabi GCC and picolibc
        # Without the packages apt recommends, newlib among them, and from the
        # Actions cache first (VERIFY-093); the limit fails a stalled mirror
        # in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: cortex-r
          packages: qemu-system-arm gcc-arm-none-eabi picolibc-arm-none-eabi
      - name: "The tests on bare-metal Cortex-R on QEMU: ${{ matrix.core }}"
        timeout-minutes: 30
        env:
          CORE: ${{ matrix.core }}
        run: python3 tools/cortexr/cortexr.py run "$CORE"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cortex-r-${{ matrix.core }}
          path: |
            cortexr_out/*.json
            cortexr_out/*.build.log
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1l. Renesas RH850 and RX under GDB's simulators (VERIFY-101, VERIFY-102)
  #
  #    No package ships a compiler for them, but Ubuntu ships the sources
  #    of one: tools/renesas/build.sh builds binutils 2.42, GCC 13.3.0 (C),
  #    newlib 4.4.0 and GDB 15.1's simulator for the variant's target,
  #    v850-elf or rx-elf, from the release tarballs of Ubuntu's
  #    binutils-source, gcc-13-source, newlib-source and gdb-source, each
  #    package checked against Ubuntu's signed index as apt-install checks
  #    them. Each target's toolchain is kept in the Actions cache, its key
  #    the target, the packages' versions and build.sh's hash; a leg that
  #    misses it builds it. tools/renesas/renesas.py builds each test for
  #    the variant at the four build types: RH850's V850E3V5 with its FPU
  #    and without, linked with tools/renesas/open.c's _open, which
  #    newlib's V850 port gets wrong; the RX600 with its FPU (GCC's
  #    default, finite math), without it, and without it with big-endian
  #    data, linked with tools/msp430/tmpfile.c's tmpfile(), the last with
  #    crt files whose arrays are data, and the two without the FPU with
  #    the libraries built without it, which GCC's driver does not pick,
  #    their binaries holding none of its instructions (VERIFY-111). It
  #    runs each test under the target's simulator after a probe that the
  #    simulator carries a program's output and exit status, and holds the
  #    outcomes against tools/renesas/pins.txt, enforced from each record's
  #    run 1: the pins were measured before it with the same toolchain.
  # -------------------------------------------------------------------------
  renesas:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [rh850, rh850-soft, rx, rx-nofpu, rx-be]
    steps:
      - uses: actions/checkout@v6
      - name: The variant's target
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          target=$(python3 tools/renesas/renesas.py target "$VARIANT")
          echo "TARGET=$target" >> "$GITHUB_ENV"
      - name: Install Ubuntu's sources of binutils, GCC, newlib and GDB, and GCC's libraries
        # Without the packages apt recommends, from the Actions cache first
        # (VERIFY-093); the limit fails a stalled mirror in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: renesas
          packages: binutils-source gcc-13-source newlib-source gdb-source libgmp-dev libmpfr-dev libmpc-dev flex bison
      - name: The toolchain's cache key
        id: key
        run: |
          versions=$(dpkg-query -W -f='${Package} ${Version}\n' binutils-source gcc-13-source newlib-source gdb-source)
          echo "$versions"
          echo "versions=$(echo "$versions" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the toolchain
        id: toolchain
        uses: actions/cache@v5
        with:
          path: ~/renesas-toolchain/${{ env.TARGET }}
          key: renesas-${{ env.TARGET }}-${{ steps.key.outputs.versions }}-${{ hashFiles('tools/renesas/build.sh') }}
      - name: Build the toolchain from the sources
        if: steps.toolchain.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          mkdir -p "$RUNNER_TEMP/renesas-build"
          cd "$RUNNER_TEMP/renesas-build"
          sh "$GITHUB_WORKSPACE/tools/renesas/build.sh" "$TARGET" "$HOME/renesas-toolchain/$TARGET"
      - name: "The tests on Renesas cores under GDB's simulators: ${{ matrix.variant }}"
        timeout-minutes: 60
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          export PATH="$HOME/renesas-toolchain/$TARGET/bin:$PATH"
          python3 tools/renesas/renesas.py run "$VARIANT"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renesas-${{ matrix.variant }}
          path: |
            renesas_out/*.json
            renesas_out/*.build.log
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1m. ARC (Synopsys DesignWare), compiled only (VERIFY-106)
  #
  #    GCC has an ARC port, and tools/renesas/build.sh builds it as it
  #    builds RH850's and RX's, from the release tarballs of Ubuntu's
  #    binutils-source, gcc-13-source, newlib-source and gdb-source: binutils
  #    2.42, GCC 13.3.0 (C) and newlib 4.4.0 for arc-elf32, kept in the
  #    Actions cache, its key the target, the packages' versions and
  #    build.sh's hash. Neither GDB nor QEMU has an ARC simulator, so
  #    nothing runs: tools/embedded_compile_check.sh compiles every public
  #    header and every test, as the embedded job does for RISC-V, for the
  #    ARCv2 EM (em4), the ARCv2 HS (hs38) and the ARCompact ARC700, at -O0,
  #    -Os and -O2.
  # -------------------------------------------------------------------------
  arc:
    runs-on: ubuntu-24.04
    env:
      TARGET: arc-elf32
    steps:
      - uses: actions/checkout@v6
      - name: Install Ubuntu's sources of binutils, GCC, newlib and GDB, and GCC's libraries
        # Without the packages apt recommends, from the Actions cache first
        # (VERIFY-093): the renesas jobs' entry, the list being theirs. The
        # limit fails a stalled mirror in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: renesas
          packages: binutils-source gcc-13-source newlib-source gdb-source libgmp-dev libmpfr-dev libmpc-dev flex bison
      - name: The toolchain's cache key
        id: key
        run: |
          versions=$(dpkg-query -W -f='${Package} ${Version}\n' binutils-source gcc-13-source newlib-source gdb-source)
          echo "$versions"
          echo "versions=$(echo "$versions" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the toolchain
        # An entry of its own, beside the renesas jobs' v850-elf and rx-elf.
        id: toolchain
        uses: actions/cache@v5
        with:
          path: ~/gcc-toolchain/${{ env.TARGET }}
          key: gcc-${{ env.TARGET }}-${{ steps.key.outputs.versions }}-${{ hashFiles('tools/renesas/build.sh') }}
      - name: Build the toolchain from the sources
        if: steps.toolchain.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          mkdir -p "$RUNNER_TEMP/gcc-build"
          cd "$RUNNER_TEMP/gcc-build"
          sh "$GITHUB_WORKSPACE/tools/renesas/build.sh" "$TARGET" "$HOME/gcc-toolchain/$TARGET"
      - name: Compile the headers and tests for ARC (no run)
        timeout-minutes: 60
        env:
          CANON_COMPILE_TITLE: arc
          CANON_COMPILE_TARGETS: |
            arc-elf32-gcc -mcpu=em4
            arc-elf32-gcc -mcpu=hs38
            arc-elf32-gcc -mcpu=arc700
        run: |
          export PATH="$HOME/gcc-toolchain/$TARGET/bin:$PATH"
          tools/embedded_compile_check.sh

  # -------------------------------------------------------------------------
  # 1n. dsPIC and PIC24's core, with Microchip's XC-DSC (VERIFY-107,
  #     VERIFY-108)
  #
  #    XC-DSC 4.00 (8 July 2026), Microchip's compiler for dsPIC33, every
  #    optimization level without a key: its archive for Linux, fetched from
  #    Microchip, its SHA-256 pinned before anything in it runs, and kept in
  #    the Actions cache by it, as msp430's package is. At XC-DSC's virtual
  #    devices generic-16dsp (dsPIC's core) and generic-16bit (the core
  #    without the DSP instructions, PIC24's), tools/dspic/probe.sh reports
  #    what the compiler is: its version and devices, its type sizes, its
  #    optimization levels; and tools/tier_check.sh checks the README's
  #    platform tiers there, as at AVR, int, size_t and pointers having 16
  #    bits. VERIFY-107's run 1 measured them; enforced since VERIFY-108:
  #    the probe's output must be tools/dspic/probe.pinned, run 1's, and the
  #    tier check's must hold. Using XC-DSC accepts Microchip's licence for
  #    it, as the author chose (VERIFY-107).
  # -------------------------------------------------------------------------
  dspic:
    runs-on: ubuntu-24.04
    env:
      XC_DSC_URL: https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/xc-dsc-v4.00-full-install-linux64.tar.xz
      # Microchip's download page shows it abbreviated, "4fa70007... acef";
      # VERIFY-107's run 1 measured it whole, both ends Microchip's.
      XC_DSC_SHA256: 4fa70007bf28e246c39ec280270f510a8e003993671297c412ccf8e57c8eacef
    steps:
      - uses: actions/checkout@v6
      - name: Cache Microchip's XC-DSC 4.00's archive
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/xc-dsc.tar.xz
          key: xc-dsc-${{ env.XC_DSC_SHA256 }}
      - name: Fetch Microchip's XC-DSC 4.00, its SHA-256 checked
        timeout-minutes: 20
        run: |
          pkg="$RUNNER_TEMP/xc-dsc.tar.xz"
          [ -f "$pkg" ] || curl -fsSL --retry 3 -o "$pkg" "$XC_DSC_URL"
          echo "$XC_DSC_SHA256  $pkg" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/xc-dsc"
          tar -xJf "$pkg" -C "$RUNNER_TEMP/xc-dsc"
          # Where VERIFY-107's run 1 found the driver.
          bin="$RUNNER_TEMP/xc-dsc/xc-dsc-v4.00/bin"
          if [ ! -x "$bin/xc-dsc-gcc" ]; then
            echo "FAIL: no xc-dsc-v4.00/bin/xc-dsc-gcc in the archive"; exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: What XC-DSC is, as pinned
        timeout-minutes: 10
        env:
          PINS: tools/dspic/probe.pinned
        run: tools/dspic/probe.sh
      - name: The platform tiers at a 16-bit size_t, at generic-16dsp and generic-16bit
        timeout-minutes: 20
        env:
          CC: xc-dsc-gcc
          F64_FLAGS: -fno-short-double
        run: |
          for cpu in generic-16dsp generic-16bit; do
            TARGET_FLAGS="-mcpu=$cpu" TITLE="dspic $cpu" tools/tier_check.sh
          done

  # -------------------------------------------------------------------------
  # 1o. Finite math, refused (VERIFY-110)
  #
  #    compare.h's float comparators order NaN, and random.h's float ranges
  #    refuse an infinite bound, by tests that finite math lets the compiler
  #    fold away: -ffinite-math-only, -ffast-math and -Ofast, and GCC's RX
  #    port with its FPU, whatever the command line (VERIFY-102). Each of
  #    the two refuses it with an #error unless CANON_ALLOW_FINITE_MATH is
  #    defined. tools/finite_math_check.py checks it with the runner's GCC
  #    and Clang: the two refused under each of the three flags, compiling
  #    with the macro and without finite math, and every public header,
  #    under -ffinite-math-only, compiling or refused by one of the two,
  #    and compiling with the macro. Compile only.
  # -------------------------------------------------------------------------
  finite-math:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Finite math refused, with GCC and Clang
        timeout-minutes: 10
        run: python3 -I tools/finite_math_check.py

  # -------------------------------------------------------------------------
  # 1p. 32-bit PowerPC, bare metal, under GDB's simulator (VERIFY-119)
  #
  #    tools/renesas/build.sh, unchanged, builds binutils 2.42, GCC 13.3.0
  #    (C), newlib 4.4.0 and GDB 15.1's simulator of PowerPC, psim, for
  #    powerpc-eabi, from the same release tarballs of Ubuntu's source
  #    packages as the renesas jobs' toolchains. It is kept in the Actions
  #    cache, an entry of its own beside the renesas jobs' and arc's, which
  #    analysis.yml's compcert-ppc shares. tools/renesas/renesas.py builds
  #    each test at the four build types, for 32-bit PowerPC, big-endian,
  #    with its FPU (ppc) and without (ppc-soft), and runs it under psim,
  #    linked with -msim, libgloss's system calls for psim, with
  #    tools/msp430/tmpfile.c's tmpfile(), psim's lseek failing; with the
  #    start file of tools/renesas/psim_start.S, libgloss's defining an
  #    __atexit that newlib defines too; and with the linker's own script,
  #    each section of data ending on a word, as psim maps a program
  #    section by section and stops a load across a section's end. The
  #    outcomes are held against tools/renesas/pins.txt, enforced from
  #    run 1: the pins were measured before it with the same toolchain.
  # -------------------------------------------------------------------------
  powerpc:
    runs-on: ubuntu-24.04
    env:
      TARGET: powerpc-eabi
    strategy:
      fail-fast: false
      matrix:
        variant: [ppc, ppc-soft]
    steps:
      - uses: actions/checkout@v6
      - name: Install Ubuntu's sources of binutils, GCC, newlib and GDB, and GCC's libraries
        # Without the packages apt recommends, from the Actions cache first
        # (VERIFY-093): the renesas jobs' entry, the list being theirs. The
        # limit fails a stalled mirror in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: renesas
          packages: binutils-source gcc-13-source newlib-source gdb-source libgmp-dev libmpfr-dev libmpc-dev flex bison
      - name: The toolchain's cache key
        id: key
        run: |
          versions=$(dpkg-query -W -f='${Package} ${Version}\n' binutils-source gcc-13-source newlib-source gdb-source)
          echo "$versions"
          echo "versions=$(echo "$versions" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the toolchain
        # The entry analysis.yml's compcert-ppc restores, by the same key.
        id: toolchain
        uses: actions/cache@v5
        with:
          path: ~/gcc-toolchain/${{ env.TARGET }}
          key: gcc-${{ env.TARGET }}-${{ steps.key.outputs.versions }}-${{ hashFiles('tools/renesas/build.sh') }}
      - name: Build the toolchain from the sources
        if: steps.toolchain.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          mkdir -p "$RUNNER_TEMP/gcc-build"
          cd "$RUNNER_TEMP/gcc-build"
          sh "$GITHUB_WORKSPACE/tools/renesas/build.sh" "$TARGET" "$HOME/gcc-toolchain/$TARGET"
      - name: "The tests on 32-bit PowerPC under GDB's simulator: ${{ matrix.variant }}"
        timeout-minutes: 60
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          export PATH="$HOME/gcc-toolchain/$TARGET/bin:$PATH"
          python3 tools/renesas/renesas.py run "$VARIANT"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: powerpc-${{ matrix.variant }}
          path: |
            renesas_out/*.json
            renesas_out/*.build.log
          if-no-files-found: warn
          retention-days: 90
