name: "2 · Platforms"
# Portability beyond the build matrix: musl, Linux AArch64, C11 to C23,
# big-endian s390x under qemu, and the embedded compile checks (Cortex-M,
# RISC-V, AVR). Map: .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    # Documentation-only pushes change nothing a gate measures; skip them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1c. musl libc — Alpine, GCC (VERIFY-043)
  #
  #    The only C library in the matrix outside glibc, Apple's, MSVC's UCRT
  #    and MinGW's. It found a real defect before any job ran it:
  #    stringbuf.h's vsnprintf size argument (VERIFY-031 G2), whose musl leg
  #    that record noted as follow-up. Sanitizers OFF: musl does not support
  #    ASan. The image is pinned by version, as the runner is (VERIFY-039's
  #    rule: move it deliberately).
  # -------------------------------------------------------------------------
  musl:
    runs-on: ubuntu-24.04
    container: alpine:3.20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Install toolchain
        run: apk add --no-cache build-base cmake git
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=OFF \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1d. Linux AArch64 — GCC and clang (VERIFY-043)
  #
  #    On AArch64 Linux, plain char is unsigned, unlike every other target in
  #    the matrix (Apple keeps it signed on arm64). Sanitizers in Debug, as
  #    the build job runs them. The runner label is pinned.
  # -------------------------------------------------------------------------
  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        c_compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          SANITIZERS=OFF
          if [ "${{ matrix.build_type }}" = "Debug" ]; then SANITIZERS=ON; fi
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=${SANITIZERS} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1e. Later C standards — C11, C17 and C23, GCC 14 and clang (VERIFY-044)
  #
  #    Every other job compiles as C99, the project default. Canon-C claims
  #    "C99 or later"; this job holds it to that under the later standards,
  #    C23 among them (bool a keyword, unreachable() a standard macro).
  #    Debug with sanitizers. --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  c-standards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        c_std: [11, 17, 23]
        c_compiler: [gcc-14, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_C_STANDARD=${{ matrix.c_std }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -S .
      - name: Check the requested standard reached the compiler
        run: |
          find build -name flags.make -exec grep -hoE -- '-std=[a-z0-9]+' {} + | sort | uniq -c
          if find build -name flags.make -exec grep -lE -- '-std=(c|gnu)99' {} + | grep -q .; then
            echo "::error::-std=c99 found in a C${{ matrix.c_std }} build"; exit 1
          fi
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1f. Big-endian — Linux s390x, GCC cross-compiler, run under qemu-user
  #     (VERIFY-045)
  #
  #    Every other target in the matrix is little-endian. s390x is
  #    big-endian with 64-bit pointers. The tests are cross-compiled and
  #    CTest runs each one through qemu-s390x (CMAKE_CROSSCOMPILING_EMULATOR).
  #    No sanitizers: their runtimes are not reliable under qemu-user.
  #    --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  big-endian:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v6
      - name: Install the s390x cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          s390x-linux-gnu-gcc --version | head -1
          qemu-s390x --version | head -1
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Check the binaries are big-endian s390x
        run: |
          file build/bitset_test
          file build/bitset_test | grep -q "MSB.*IBM S/390"
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1g. Bare-metal Arm — compile only (VERIFY-046)
  #
  #    arm-none-eabi-gcc with newlib, Cortex-M0+ and Cortex-M4 (hard float),
  #    at -O0, -Os and -O2, under the project's warning flags. Every public
  #    header is compiled as its own translation unit, and every test file.
  #    Nothing is linked or run: this backs the README's bare-metal section
  #    as far as compiling goes. On this target enums are short
  #    (-fshort-enums) and int32_t is long, which no hosted target has.
  #    The lists, and what is left out and why, are in the script.
  #
  #    VERIFY-048 adds picolibc on the same two cores, RISC-V RV32 (rv32imac,
  #    ilp32) and RV64 (rv64imac, lp64) with picolibc, and an AVR step: the
  #    README's platform tiers at a 16-bit size_t (tools/avr_tier_check.sh).
  # -------------------------------------------------------------------------
  embedded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the Arm, RISC-V and AVR toolchains, newlib and picolibc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi \
            picolibc-arm-none-eabi gcc-riscv64-unknown-elf \
            picolibc-riscv64-unknown-elf gcc-avr avr-libc
      - name: Compile for Cortex-M (newlib, picolibc) and RISC-V RV32, RV64 (picolibc)
        run: tools/embedded_compile_check.sh
      - name: AVR — the platform tiers at a 16-bit size_t (VERIFY-048)
        run: tools/avr_tier_check.sh
