name: "2 · Platforms"
# Portability beyond the build matrix: musl, Linux AArch64, C11 to C23,
# big-endian s390x under qemu, the embedded compile checks (Cortex-M,
# RISC-V, AVR), and the tests on Cortex-M0+ and Cortex-M4 under QEMU.
# Map: .github/workflows/README.md.
on:
  push:
    branches: [ "master" ]
    # Documentation-only pushes change nothing a gate measures; skip them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/probes.yml'   # 9 · Probes only: nothing here reads it (VERIFY-080)
      - '.github/workflows/smoke.yml'    # 16 · Smoke tests only: nothing here reads it (VERIFY-088)
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/probes.yml'   # 9 · Probes only: nothing here reads it (VERIFY-080)
      - '.github/workflows/smoke.yml'    # 16 · Smoke tests only: nothing here reads it (VERIFY-088)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1c. musl libc — Alpine, GCC (VERIFY-043)
  #
  #    The only C library in the matrix outside glibc, Apple's, MSVC's UCRT
  #    and MinGW's. It found a real defect before any job ran it:
  #    stringbuf.h's vsnprintf size argument (VERIFY-031 G2), whose musl leg
  #    that record noted as follow-up. Sanitizers OFF: musl does not support
  #    ASan. The image is pinned by version, as the runner is (VERIFY-039's
  #    rule: move it deliberately).
  # -------------------------------------------------------------------------
  musl:
    runs-on: ubuntu-24.04
    container: alpine:3.20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Install toolchain
        run: apk add --no-cache build-base cmake git
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=OFF \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1d. Linux AArch64 — GCC and clang (VERIFY-043)
  #
  #    On AArch64 Linux, plain char is unsigned, unlike every other target in
  #    the matrix (Apple keeps it signed on arm64). Sanitizers in Debug, as
  #    the build job runs them. The runner label is pinned.
  # -------------------------------------------------------------------------
  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        c_compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          SANITIZERS=OFF
          if [ "${{ matrix.build_type }}" = "Debug" ]; then SANITIZERS=ON; fi
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=${SANITIZERS} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1e. Later C standards — C11, C17 and C23, GCC 14 and clang (VERIFY-044)
  #
  #    Every other job compiles as C99, the project default. Canon-C claims
  #    "C99 or later"; this job holds it to that under the later standards,
  #    C23 among them (bool a keyword, unreachable() a standard macro).
  #    Debug with sanitizers. --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  c-standards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        c_std: [11, 17, 23]
        c_compiler: [gcc-14, clang]
    steps:
      - uses: actions/checkout@v6
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_C_STANDARD=${{ matrix.c_std }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -S .
      - name: Check the requested standard reached the compiler
        run: |
          find build -name flags.make -exec grep -hoE -- '-std=[a-z0-9]+' {} + | sort | uniq -c
          if find build -name flags.make -exec grep -lE -- '-std=(c|gnu)99' {} + | grep -q .; then
            echo "::error::-std=c99 found in a C${{ matrix.c_std }} build"; exit 1
          fi
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1f. Big-endian — Linux s390x, GCC cross-compiler, run under qemu-user
  #     (VERIFY-045)
  #
  #    Every other target in the matrix is little-endian. s390x is
  #    big-endian with 64-bit pointers. The tests are cross-compiled and
  #    CTest runs each one through qemu-s390x (CMAKE_CROSSCOMPILING_EMULATOR).
  #    No sanitizers: their runtimes are not reliable under qemu-user.
  #    --no-tests=error: a leg that finds no test fails.
  # -------------------------------------------------------------------------
  big-endian:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v6
      - name: Install the s390x cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          s390x-linux-gnu-gcc --version | head -1
          qemu-s390x --version | head -1
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S .
      - name: Build
        run: cmake --build build -j
      - name: Check the binaries are big-endian s390x
        run: |
          file build/bitset_test
          file build/bitset_test | grep -q "MSB.*IBM S/390"
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # 1g. Bare-metal Arm — compile only (VERIFY-046)
  #
  #    arm-none-eabi-gcc with newlib, Cortex-M0+ and Cortex-M4 (hard float),
  #    at -O0, -Os and -O2, under the project's warning flags. Every public
  #    header is compiled as its own translation unit, and every test file.
  #    Nothing is linked or run: this backs the README's bare-metal section
  #    as far as compiling goes. On this target enums are short
  #    (-fshort-enums) and int32_t is long, which no hosted target has.
  #    The lists, and what is left out and why, are in the script.
  #
  #    VERIFY-048 adds picolibc on the same two cores, RISC-V RV32 (rv32imac,
  #    ilp32) and RV64 (rv64imac, lp64) with picolibc, and an AVR step: the
  #    README's platform tiers at a 16-bit size_t (tools/avr_tier_check.sh).
  #
  #    VERIFY-070 adds code size and build cost, header by header
  #    (tools/size/size.py): each header's own functions, all of them kept,
  #    for Cortex-M0+, Cortex-M4 and RV32 at -Os and -O2, as shipped and with
  #    the run-time checks off; and the Canon-C each header brings
  #    after preprocessing, as tokens since its run 2. Every figure is
  #    pinned (tools/size/pins.txt) and compared: report-only in its run 2,
  #    a difference fails the job from its run 3.
  # -------------------------------------------------------------------------
  embedded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the Arm, RISC-V and AVR toolchains, newlib and picolibc
        # Without the packages apt recommends, as machdeps.yml installs its
        # cross-compilers (VERIFY-060): with them apt had 844 MB to get, 463
        # MB of it the Arm C++ library, which these C compile checks do not
        # use, and the step took 2 h 48 min at a stalled Ubuntu mirror
        # (2 · Platforms #37; VERIFY-061, phase A's run 2). Every package the
        # checks use is named here. Their files, 380 MB, come from the
        # Actions cache, or from Canonical's archive before Azure's mirror,
        # which sent them at 0.1 MB/s on 2026-11-19 (VERIFY-093). The limit
        # fails a stalled install in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: embedded
          packages: >-
            gcc-arm-none-eabi libnewlib-arm-none-eabi
            picolibc-arm-none-eabi gcc-riscv64-unknown-elf
            picolibc-riscv64-unknown-elf gcc-avr avr-libc
      - name: Compile for Cortex-M (newlib, picolibc) and RISC-V RV32, RV64 (picolibc)
        run: tools/embedded_compile_check.sh
      - name: AVR — the platform tiers at a 16-bit size_t (VERIFY-048)
        run: tools/avr_tier_check.sh
      - name: Code size and build cost, header by header (VERIFY-070)
        run: python3 tools/size/size.py run size_out
      - name: Upload the sizes
        uses: actions/upload-artifact@v6
        with:
          name: code-size
          path: size_out/
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1h. Metrics — each function's complexity, header by header (VERIFY-081)
  #
  #    Frama-C's Metrics plug-in on the units tools/size/size.py measures:
  #    each public header alone, a generic module instantiated for u32, a
  #    function counted for the header whose module defines it, the code
  #    as shipped (NDEBUG). Each function's cyclomatic complexity is pinned
  #    (tools/metrics/pins.txt) and compared; its other counts (statements,
  #    decisions, loops, calls, ...) go to metrics.csv. Nothing is proved:
  #    the counts are syntactic. Report-only in VERIFY-081's run 1; since
  #    its run 2, a complexity not as pinned fails the job.
  # -------------------------------------------------------------------------
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: Each function's complexity, header by header (VERIFY-081)
        run: |
          eval $(opam env --switch=frama-c)
          frama-c -version
          python3 tools/metrics/metrics.py run metrics_out
      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: metrics
          path: metrics_out/
          retention-days: 90

  # -------------------------------------------------------------------------
  # 1i. Cortex-M under QEMU — the tests run (VERIFY-089)
  #
  #    The embedded job compiles the tests for Cortex-M; this one runs them
  #    there. arm-none-eabi-gcc with newlib or picolibc; each test is run
  #    under qemu-system-arm through semihosting, which carries its output
  #    and exit status to the host: Cortex-M0+ code (Armv6-M, soft float,
  #    which faults on an unaligned access) on QEMU's micro:bit, whose
  #    Cortex-M0 runs it, and Cortex-M4 with hard float on mps2-an386. Each
  #    at Debug, Release, RelWithDebInfo and MinSizeRel, with
  #    CANON_LIFETIME_NO_ATOMICS defined. The tests that do not pass there
  #    are pinned, each with its reason (tools/cortexm/pins.txt).
  #
  #    Two toolchains: Ubuntu 24.04's packages (GCC 13.2, newlib and
  #    picolibc), enforced since VERIFY-089's run 2; and the Arm GNU
  #    Toolchain 15.3.Rel2 (GCC 15.3, its own newlib), fetched from Arm
  #    with its checksum pinned, enforced since run 3. GCC 15.3 compiles
  #    option_test right at -O2 and -Os, where GCC 13.2 does not.
  # -------------------------------------------------------------------------
  cortex-m:
    name: ${{ matrix.toolchain == 'ubuntu' && format('cortex-m ({0}, {1})', matrix.cpu, matrix.libc) || format('cortex-m ({0}, {1}, {2})', matrix.cpu, matrix.libc, matrix.toolchain) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ubuntu]
        cpu: [m0plus, m4]
        libc: [newlib, picolibc]
        include:
          - { toolchain: arm-15.3.rel2, cpu: m0plus, libc: newlib }
          - { toolchain: arm-15.3.rel2, cpu: m4, libc: newlib }
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      # The Arm GNU Toolchain 15.3.Rel2's x86_64 package for arm-none-eabi,
      # where Arm publishes it, and its SHA-256 as Arm's meta-arm layer
      # (gcc-arm-none-eabi_15.3.rel2.bb) and arm-none-eabi-gcc-action pin it.
      ARM_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz
      ARM_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU, and Ubuntu's Arm toolchain, newlib and picolibc
        # Without the packages apt recommends, as the embedded job installs
        # them, and as it does, from the Actions cache first (VERIFY-093);
        # the limit fails a stalled mirror in 30 minutes.
        timeout-minutes: 30
        uses: ./.github/actions/apt-install
        with:
          cache-name: cortex-m-${{ matrix.toolchain }}
          packages: ${{ matrix.toolchain == 'ubuntu' && 'qemu-system-arm gcc-arm-none-eabi libnewlib-arm-none-eabi picolibc-arm-none-eabi' || 'qemu-system-arm' }}
      - name: Cache the Arm GNU Toolchain's package
        if: matrix.toolchain != 'ubuntu'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain.tar.xz
          key: arm-gnu-toolchain-${{ env.ARM_SHA256 }}
      - name: Fetch the Arm GNU Toolchain, its checksum checked
        if: matrix.toolchain != 'ubuntu'
        timeout-minutes: 15
        run: |
          pkg="$RUNNER_TEMP/arm-gnu-toolchain.tar.xz"
          [ -f "$pkg" ] || curl -fsSL --retry 3 -o "$pkg" "$ARM_URL"
          echo "$ARM_SHA256  $pkg" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/arm-gnu-toolchain"
          tar -xJf "$pkg" -C "$RUNNER_TEMP/arm-gnu-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
      - name: "The tests on Cortex-M under QEMU: ${{ matrix.cpu }}, ${{ matrix.libc }}, ${{ matrix.toolchain }}"
        env:
          CPU: ${{ matrix.cpu }}
          LIBC: ${{ matrix.libc }}
        run: python3 tools/cortexm/cortexm.py run "$CPU" "$LIBC" --toolchain "$TOOLCHAIN"
      - name: Upload the builds' logs and summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cortex-m-${{ matrix.toolchain }}-${{ matrix.cpu }}-${{ matrix.libc }}
          path: |
            cortexm_out/*.json
            cortexm_out/*.build.log
          if-no-files-found: warn
          retention-days: 90
