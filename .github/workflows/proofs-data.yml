            -wp -wp-rte \
            -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -CC \
              -I core/primitives \
              -I core \
              -I semantics \
              -I data \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            vmacros/vdrivers/vec_fmt_verify.h 2>&1 | tee ${OUT}
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (vec_fmt.h) exit status: ${WP_EXIT}"
          echo "  MODE: report-only (ENFORCE=${ENFORCE})  MODEL: Typed+Cast  PREPROCESSING: -CC"
          echo "==============================================="
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" ${OUT} || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            note_fail "FAIL: WP did not produce a verification summary."
            grep -E "^\[(kernel|wp)" ${OUT} | head -20 || true
          else
            T=$(grep -cE '^\[wp\] \[Timeout\]' ${OUT} || true)
            U=$(grep -cE '^\[wp\] \[Unknown\]' ${OUT} || true)
            F=$(grep -cE '^\[wp\] \[(Failed|Failure)\]' ${OUT} || true)
            I=$(grep -cE '^\[wp\] \[Invalid\]' ${OUT} || true)
            S=$(grep -cE '^\[wp\] \[Stepout\]' ${OUT} || true)
            echo "  Timeouts: ${T}  Unknown: ${U}  Failed: ${F}  Invalid: ${I}  Stepout: ${S}"
            echo "  Total unproved (T+U): $((T + U))"
            if [ "${F}" -ne 0 ] || [ "${I}" -ne 0 ]; then
              echo "  !!! Failed/Invalid present -- read these first:"
              grep -E '^\[wp\] \[(Failed|Failure|Invalid)\]' ${OUT} || true
            fi
            echo ""
            echo "  --- All unproved goals (name-stability record) ---"
            grep -E '^\[wp\] \[(Timeout|Unknown|Failed|Failure|Invalid|Stepout)\]' ${OUT} || echo "  (none)"
            grep -E '^\[wp\] \[(Timeout|Unknown)\]' ${OUT} | awk '{print $3}' | sort -u > /tmp/vf_all.txt
            grep -E 'vec_int_to_stringbuf' /tmp/vf_all.txt > /tmp/vf_own.txt || true
            grep -vE 'vec_int_to_stringbuf' /tmp/vf_all.txt > /tmp/vf_rest.txt || true
            echo ""
            echo "  ============ VERIFY-042 EVIDENCE (not gating) ============"
            grep -E 'vec_int_to_stringbuf_cb_' /tmp/vf_own.txt > /tmp/vf_cb.txt || true
            grep -vE 'vec_int_to_stringbuf_cb_' /tmp/vf_own.txt > /tmp/vf_fmt.txt || true
            echo "  own, to_stringbuf (P5 pred 0): $(wc -l < /tmp/vf_fmt.txt)"
            show /tmp/vf_fmt.txt
            echo "  own, to_stringbuf_cb (P6 pred: the function-pointer check, the loop"
            echo "      invariant's preservation, the variant's decrease, likely items[i]'s access): $(wc -l < /tmp/vf_cb.txt)"
            show /tmp/vf_cb.txt
            echo "  P3: stringbuf_append_fmt's preconditions at the call, unproved (pred: sb_ok, fmt_sep none; fmt_ok L):"
            grep -E 'call_stringbuf_append_fmt_requires' /tmp/vf_own.txt > /tmp/vf_p3.txt || true; show /tmp/vf_p3.txt "(none)"
            # P2: the inherited set, computed at run time from the pins of
            # frama-c-stringbuf and cc-vec's result names, never copied.
            python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import record_coverage as rc
          from collections import defaultdict
          by = defaultdict(set)
          for n, us in rc.pinned_names().items():
              for u in us:
                  by[u].add(n)
          pred = by['frama-c-stringbuf'] | {n for n in by['cc-vec'] if n.startswith('typed_result_Bool_Error_')}
          obs = {rc.norm(l.strip()) for l in open('/tmp/vf_rest.txt') if l.strip()}
          print('  P2  inherited and fresh: observed %d, predicted %d (pred 43)' % (len(obs), len(pred)))
          for t, s in (('predicted, not observed', sorted(pred - obs)), ('observed, not predicted', sorted(obs - pred))):
              print('      %s: %d' % (t, len(s)))
              for n in s:
                  print('        ' + n)
          PY
            echo "  ==========================================================="
          fi
          if [ "${ENFORCE}" -eq 1 ] && [ -n "${PROVED_LINE}" ]; then
            # ===============================================================
            # ENFORCED as of VERIFY-042 run 3, pinned from runs 1 and 2 (CI
            # #1388 at cf28c02 and the job's re-run, workflow run
            # 40592358164): 5239 / 5286, 47 residuals, name-identical in
            # both runs. 43 are inherited or fresh, equal by name to
            # frama-c-stringbuf's 37 and result at (Bool, Error)'s six as
            # cc-vec pins them; 4 are vec_fmt.h's own, all of
            # to_stringbuf_cb, filed under VERIFY-042's two blocks (the
            # callback's run-time check; the loop's state across the call).
            # A pinned name that starts proving is a RATCHET; a new name is a
            # finding. Neither is ever absorbed silently.
            # ===============================================================
            EXPECTED_PROVED="5239 / 5286"   # VERIFY-042 runs 1 and 2
            EXPECTED_UNPROVED=47
            PIN_NAMES=(
            "typed_cast_align_down_ensures"
            "typed_cast_align_padding_ensures"
            "typed_cast_align_up_ensures"
            "typed_cast_arena_alloc_aligned_zero_ensures_3_part1"
            "typed_cast_arena_alloc_zero_ensures_3_part1"
            "typed_cast_borrowed_bytes_eq_call_memcmp_requires_danglingness_s1"
            "typed_cast_borrowed_bytes_eq_call_memcmp_requires_danglingness_s2"
            "typed_cast_borrowed_str_eq_call_str_equal_requires_no_dangling_a"
            "typed_cast_borrowed_str_eq_call_str_equal_requires_no_dangling_b"
            "typed_cast_bytes_equal_call_memcmp_requires_danglingness_s1"
            "typed_cast_bytes_equal_call_memcmp_requires_danglingness_s2"
            "typed_cast_checked_add_overflow_ensures"
            "typed_cast_checked_add_u64_overflow_ensures"
            "typed_cast_mem_align_normal_ensures_2_part3"
            "typed_cast_mem_align_normal_ensures_part3"
            "typed_cast_mem_align_to_normal_ensures_2_part3"
            "typed_cast_mem_align_to_normal_ensures_part3"
            "typed_cast_mem_alloc_array_checked_nonoverflow_ensures_part3"
            "typed_cast_mem_alloc_nonzero_size_ensures_part2"
            "typed_cast_mem_compare_call_memcmp_requires_danglingness_s1"
            "typed_cast_mem_compare_call_memcmp_requires_danglingness_s2"
            "typed_cast_mem_equal_bytes_call_memcmp_requires_danglingness_s1"
            "typed_cast_mem_equal_bytes_call_memcmp_requires_danglingness_s2"
            "typed_cast_mem_equal_call_memcmp_requires_danglingness_s1"
            "typed_cast_mem_equal_call_memcmp_requires_danglingness_s2"
            "typed_cast_mem_free_call_free_requires_freeable"
            "typed_cast_mem_get_alignment_nonnull_ensures_2_part2"
            "typed_cast_mem_get_alignment_nonnull_ensures_part2"
            "typed_cast_mem_is_aligned_nonnull_aligned_ensures"
            "typed_cast_mem_is_aligned_nonnull_unaligned_ensures"
            "typed_cast_ptr_align_padding_nonnull_ensures_part2"
            "typed_cast_result_Bool_Error_and_then_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_eq_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_eq_assert_rte_function_pointer_2"
            "typed_cast_result_Bool_Error_map_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_map_err_assert_rte_function_pointer"
            "typed_cast_result_Bool_Error_or_else_assert_rte_function_pointer"
            "typed_cast_str_ends_with_call_memcmp_requires_danglingness_s1"
            "typed_cast_str_ends_with_call_memcmp_requires_danglingness_s2"
            "typed_cast_str_equal_call_memcmp_requires_danglingness_s1"
            "typed_cast_str_equal_call_memcmp_requires_danglingness_s2"
            "typed_cast_str_starts_with_call_memcmp_requires_danglingness_s1"
            "typed_cast_str_starts_with_call_memcmp_requires_danglingness_s2"
            "typed_cast_vec_int_to_stringbuf_cb_assert_rte_function_pointer"
            "typed_cast_vec_int_to_stringbuf_cb_assert_rte_mem_access_3"
            "typed_cast_vec_int_to_stringbuf_cb_loop_invariant_preserved"
            "typed_cast_vec_int_to_stringbuf_cb_loop_variant_decrease"
            )
            echo ""
            echo "==============================================="
            echo "  MODE: ENFORCED (VERIFY-042)"
            echo "==============================================="
            PROVED_COUNT=$(printf '%s' "${PROVED_LINE}" | sed -E 's/^.*Proved goals: *//; s/[[:space:]]+$//')
            if [ "${PROVED_COUNT}" != "${EXPECTED_PROVED}" ]; then
              note_fail "FAIL: proved-goal summary ${PROVED_COUNT} != pinned ${EXPECTED_PROVED}."
            fi
            if [ "${F}" -ne 0 ] || [ "${I}" -ne 0 ]; then
              note_fail "FAIL: ${F} Failed / ${I} Invalid goal(s) -- a REAL finding, never pinnable."
            fi
            printf '%s\n' "${PIN_NAMES[@]}" | sort -u > /tmp/vf_pin.txt
            PIN_N=$(wc -l < /tmp/vf_pin.txt)
            comm -23 /tmp/vf_pin.txt /tmp/vf_all.txt > /tmp/vf_missing.txt
            comm -13 /tmp/vf_pin.txt /tmp/vf_all.txt > /tmp/vf_unpinned.txt
            echo "  --- Roll-call (set equality, ${PIN_N} pinned = 37 stringbuf + 6 result + 4 own) ---"
            echo "    missing (pinned, now proved):    $(wc -l < /tmp/vf_missing.txt)"; show /tmp/vf_missing.txt
            echo "    unpinned (new, unproved):        $(wc -l < /tmp/vf_unpinned.txt)"; show /tmp/vf_unpinned.txt
            if [ "${PIN_N}" -ne "${EXPECTED_UNPROVED}" ]; then
              note_fail "FAIL: pin list has ${PIN_N} names, EXPECTED_UNPROVED is ${EXPECTED_UNPROVED} -- the job is inconsistent."
            fi
            if [ -s /tmp/vf_missing.txt ] || [ -s /tmp/vf_unpinned.txt ]; then
              echo "FAIL: residual set differs from the pin by name."
              echo "        missing  -> a pinned residual now proves: RATCHET."
              echo "        unpinned -> a NEW residual appeared: INVESTIGATE."
              FAILURES=$((FAILURES + 1))
            fi
            if [ "${FAILURES}" -eq 0 ]; then
              echo "PASS: vec_fmt.h verified -- ${PROVED_COUNT} proved, ${EXPECTED_UNPROVED}"
              echo "      residuals, 43 inherited or fresh and 4 own, each filed, all observed by name (VERIFY-042)."
            else
              echo "VERIFY-042 ENFORCED FAIL: ${FAILURES} check(s) above."
            fi
            echo "==============================================="
          fi
          if [ "${FAILURES}" -ne 0 ]; then exit 1; fi
      - name: Upload WP proof output (vec_fmt.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-vec-fmt
          path: wp_vec_fmt_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        # Posts the WP summary as an annotation, readable through the API
        # without the log. Reads the job's WP output files; changes no gate.
        if: always()
        run: |
          for f in wp_*.txt; do
            [ -f "$f" ] || continue
            P=$(grep -E "^\[wp\] Proved goals:" "$f" | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
            [ -n "$P" ] || continue
            U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" "$f" || true)
            B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "$f" || true)
            echo "::notice title=${{ github.job }}::${f}: proved ${P}; unproved ${U}; failed/invalid/stepout ${B}"
          done

  frama-c-stringbuf:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP: data/stringbuf.h (VERIFY-035, ENFORCED)"
        # stringbuf.h — module 19, Shape A in place, no driver. Typed+Cast
        # (the header casts char* <-> u8* itself).
        # Run 1 (CI #1319, f6e54ca) was the detection test on the unfixed
        # bodies: 4810/4913, 81 inherited by name, 22 own (VERIFY-031
        # "Run 1 — observed"). Run 2 applies G1-G6 plus the helper's missing
        # \valid(sb). Its pre-registered expectation (VERIFY-031 "Run 2"):
        #   inherited 81, same names
        #   own exactly 3, all stringbuf_init_arena (A2 — arena_alloc has no
        #   frame on buffer/capacity; deferred to its own arc)
        #   every run-1 family other than A2 closes, including append_n's
        #   three (hypothesis H-n: the cause was valid_read_nstring)
        # Run 2 (CI #1320, 600f238): 4716/4802, 81 inherited, 5 own — A2's
        # 3, plus the wrapper's no_buffer assigns and one append_n src_read
        # part. Run 3 adds the wrapper guard and append_n's `readable` loop
        # invariant; expectation: own exactly A2's 3.
        # Run 3 (CI #1321, fc924e2): 4744/4828, 81 inherited, own exactly A2's
        # 3 — every prediction held.
        # VERIFY-033 run (CI #1322, b785d52): arena_alloc{,_aligned} gain
        # frame_buffer/frame_capacity. 4767/4848, 81 inherited, own 0 — A2
        # closed (predicted 4751/4832: the +4 was +20, VERIFY-034 F2).
        # Name-stability: #1322 (b785d52) and #1324 (50045d2), stringbuf.h
        # unchanged since fc924e2, report the same 81 names; Timeout/Unknown
        # split differs (78/3 vs 76/5), the names do not.
        # ENFORCED from VERIFY-035. Gates, all exact:
        #   (0) a summary exists
        #   (1) zero Failed / Invalid / Stepout
        #   (2) proved line == 4789 / 4826   (VERIFY-008 overlap fix predicted: mem_regions_overlap's goals 37 -> 31, all proved, 4795 / 4832 before; VERIFY-039 G18 predicted: memory.h's two frames prove, no goal added or removed; G14 to G17 predicted: 22 goals removed and 12 added: 4793 / 4832; G13 predicted: two goals added, both unproved: 4788 / 4842; G3 ratchet: 4788 / 4840; G2: 4785 / 4837; G3 predicted 4790 / 4840)
        #   (3) Timeout + Unknown == 37   (VERIFY-039 G18 predicted: 39 -> 37; G14 to G17 predicted: 54 -> 39; G13 predicted: 52 -> 54; G2: 52, unchanged at G3, which predicted 50; F4: 58)
        #   (4) roll-call: the unproved names == the 37 pinned below, by
        #       set equality (nothing missing, nothing extra; own == 0)
        # A ratchet edits (2), (3) and the INHERITED roll-call together.
        run: |
          eval $(opam env --switch=frama-c)
          ENFORCE=1            # VERIFY-035: enforced
          WP_MODEL="Typed+Cast"
          OUT=wp_stringbuf_output.txt
          FAILURES=0
          note_fail() { echo "$1"; FAILURES=$((FAILURES + 1)); }
          show() { if [ -s "$1" ]; then sed 's/^/      /' "$1"; else echo "      ${2:-(none)}"; fi; }
          set +e
          frama-c \
            -wp -wp-rte \
            -wp-model "${WP_MODEL}" \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -I core/primitives \
              -I core \
              -I semantics \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            data/stringbuf.h 2>&1 | tee ${OUT}
          WP_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "==============================================="
          echo "  WP (stringbuf.h) exit status: ${WP_EXIT}"
          echo "  MODE: ENFORCED (ENFORCE=${ENFORCE})  MODEL: ${WP_MODEL}"
          echo "  pinned: 4789 / 4826, 37 unproved, all inherited (VERIFY-035; VERIFY-036 F1, F3, F4, F5; VERIFY-039 G2; G3 added three proved goals; G13 two unproved; G14 to G17 closed fifteen; G18 two)"
          echo "==============================================="
          echo "  --- Q1/Q2: kernel messages about variadics / merged specs ---"
          grep -nE "variadic|Variadic|va_list|two contracts|Merging" ${OUT} | head -20 || echo "      (none)"
          PROVED_LINE=$(grep -E "^\[wp\] Proved goals:" ${OUT} || true)
          echo "  ${PROVED_LINE}"
          if [ -z "${PROVED_LINE}" ]; then
            note_fail "FAIL: WP did not produce a verification summary."
            echo "      On run 1 this is VERIFY-031 Q1 firing: the kernel or WP"
            echo "      rejected the variadic definitions. The pre-registered"
            echo "      rule: repeat as run 1b with -variadic-no-translation,"
            echo "      identical contracts. First diagnostics:"
            grep -E "^\[(kernel|wp|variadic)" ${OUT} | head -25 || true
          else
            T=$(grep -cE '^\[wp\] \[Timeout\]' ${OUT} || true)
            U=$(grep -cE '^\[wp\] \[Unknown\]' ${OUT} || true)
            F=$(grep -cE '^\[wp\] \[(Failed|Failure)\]' ${OUT} || true)
            I=$(grep -cE '^\[wp\] \[Invalid\]' ${OUT} || true)
            S=$(grep -cE '^\[wp\] \[Stepout\]' ${OUT} || true)
            echo "  Timeouts: ${T}  Unknown: ${U}  Failed: ${F}  Invalid: ${I}  Stepout: ${S}"
            echo "  Total unproved (T+U): $((T + U))"
            if [ "${F}" -ne 0 ] || [ "${I}" -ne 0 ] || [ "${S}" -ne 0 ]; then
              echo ""
              echo "  !!! Failed/Invalid/Stepout present — read these first:"
              grep -E '^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]' ${OUT} || true
            fi
            echo ""
            echo "  --- All unproved goals (name-stability record) ---"
            grep -E '^\[wp\] \[(Timeout|Unknown|Failed|Failure|Invalid|Stepout)\]' ${OUT} || echo "  (none)"
            grep -E '^\[wp\] \[(Timeout|Unknown)\]' ${OUT} | awk '{print $3}' | sort -u > /tmp/sb_all.txt
            # P2's predicted inherited set, by name: frama-c-arena's 79 pinned
            # names verbatim + borrow.h's 2 own memcmp-danglingness goals,
            # 81 when written and 52 after the closures the echo below lists;
            # 54 since VERIFY-039 G13's repair added borrow.h's 2 at
            # borrowed_str_eq's call to str_equal; 39 since G14 to G17
            # closed fifteen; 37 since G18 closed memory.h's two frames.
            INHERITED=(
            "typed_cast_align_down_ensures"
            "typed_cast_align_padding_ensures"
            "typed_cast_align_up_ensures"
            "typed_cast_arena_alloc_aligned_zero_ensures_3_part1"
            "typed_cast_arena_alloc_zero_ensures_3_part1"
            "typed_cast_borrowed_bytes_eq_call_memcmp_requires_danglingness_s1"
            "typed_cast_borrowed_bytes_eq_call_memcmp_requires_danglingness_s2"
            "typed_cast_borrowed_str_eq_call_str_equal_requires_no_dangling_a"
            "typed_cast_borrowed_str_eq_call_str_equal_requires_no_dangling_b"
            "typed_cast_bytes_equal_call_memcmp_requires_danglingness_s1"
            "typed_cast_bytes_equal_call_memcmp_requires_danglingness_s2"
            "typed_cast_checked_add_overflow_ensures"
            "typed_cast_checked_add_u64_overflow_ensures"
            "typed_cast_mem_align_normal_ensures_2_part3"
            "typed_cast_mem_align_normal_ensures_part3"
            "typed_cast_mem_align_to_normal_ensures_2_part3"
            "typed_cast_mem_align_to_normal_ensures_part3"
            "typed_cast_mem_alloc_array_checked_nonoverflow_ensures_part3"
            "typed_cast_mem_alloc_nonzero_size_ensures_part2"
            "typed_cast_mem_compare_call_memcmp_requires_danglingness_s1"
            "typed_cast_mem_compare_call_memcmp_requires_danglingness_s2"
            "typed_cast_mem_equal_bytes_call_memcmp_requires_danglingness_s1"
            "typed_cast_mem_equal_bytes_call_memcmp_requires_danglingness_s2"
            "typed_cast_mem_equal_call_memcmp_requires_danglingness_s1"
            "typed_cast_mem_equal_call_memcmp_requires_danglingness_s2"
            "typed_cast_mem_free_call_free_requires_freeable"
            "typed_cast_mem_get_alignment_nonnull_ensures_2_part2"
            "typed_cast_mem_get_alignment_nonnull_ensures_part2"
            "typed_cast_mem_is_aligned_nonnull_aligned_ensures"
            "typed_cast_mem_is_aligned_nonnull_unaligned_ensures"
            "typed_cast_ptr_align_padding_nonnull_ensures_part2"
            "typed_cast_str_ends_with_call_memcmp_requires_danglingness_s1"
            "typed_cast_str_ends_with_call_memcmp_requires_danglingness_s2"
            "typed_cast_str_equal_call_memcmp_requires_danglingness_s1"
            "typed_cast_str_equal_call_memcmp_requires_danglingness_s2"
            "typed_cast_str_starts_with_call_memcmp_requires_danglingness_s1"
            "typed_cast_str_starts_with_call_memcmp_requires_danglingness_s2"
            )
            printf '%s\n' "${INHERITED[@]}" | sort -u > /tmp/sb_inh_pred.txt
            comm -12 /tmp/sb_inh_pred.txt /tmp/sb_all.txt > /tmp/sb_inh.txt
            comm -23 /tmp/sb_inh_pred.txt /tmp/sb_all.txt > /tmp/sb_inh_missing.txt
            comm -13 /tmp/sb_inh_pred.txt /tmp/sb_all.txt > /tmp/sb_own.txt
            # Run-1 families, each predicted CLOSED in run 2 except A2.
            grep -E '_stringbuf_append_bytes_requires_(no_overlap|add_pos)|call_mem_copy' /tmp/sb_own.txt > /tmp/sb_g16.txt || true
            grep -E 'stringbuf_append_bytes_assert_rte'                              /tmp/sb_own.txt > /tmp/sb_rte.txt || true
            grep -E 'stringbuf_append_fmt(_va)?_.*failure_unchanged'                 /tmp/sb_own.txt > /tmp/sb_p4.txt || true
            grep -E 'stringbuf_append_fmt(_va)?_.*vsnprintf.*requires'               /tmp/sb_own.txt > /tmp/sb_p5.txt || true
            grep -E 'stringbuf_append_n_'                                            /tmp/sb_own.txt > /tmp/sb_an.txt || true
            grep -E 'stringbuf_init_arena'                                           /tmp/sb_own.txt > /tmp/sb_ia.txt || true
            cat /tmp/sb_g16.txt /tmp/sb_rte.txt /tmp/sb_p4.txt /tmp/sb_p5.txt /tmp/sb_an.txt /tmp/sb_ia.txt | sort -u > /tmp/sb_grouped.txt
            comm -23 /tmp/sb_own.txt /tmp/sb_grouped.txt > /tmp/sb_other.txt
            echo ""
            echo "  ================ EVIDENCE (families from the arc, VERIFY-031..035) ================"
            echo "  P2  inherited observed: $(wc -l < /tmp/sb_inh.txt) of 37 pinned (run 1's 81, less VERIFY-036 F1, F3, F4, F5 and VERIFY-039 G2, plus G13's 2, less G14 to G17's 15 and G18's 2)"
            echo "      predicted but not observed: $(wc -l < /tmp/sb_inh_missing.txt)"; show /tmp/sb_inh_missing.txt
            echo "  own (everything outside the 37): $(wc -l < /tmp/sb_own.txt)   (run 1: 22, run 2: 5, run 3: 3, VERIFY-033 pred: 0)"
            echo "  A2  init_arena (VERIFY-033 F3 pred: none — run 3 had 3):"
            show /tmp/sb_ia.txt
            echo "  G1/G6 helper seam: no_overlap, add_pos, mem_copy (pred: none):"
            show /tmp/sb_g16.txt
            echo "  helper rte, the missing valid(sb) requires (pred: none):"
            show /tmp/sb_rte.txt
            echo "  G3 failure_unchanged in the fmt pair (pred: none):"
            show /tmp/sb_p4.txt
            echo "  G2/G5 vsnprintf call preconditions (pred: none):"
            show /tmp/sb_p5.txt
            echo "  H-n append_n (pred: none — run 1 had 3, run 2 had 1):"
            show /tmp/sb_an.txt
            echo "  anything else own (pred: none — run 2 had the wrapper's no_buffer assigns):"
            show /tmp/sb_other.txt
            echo "  ========================================================================"
            if [ "${ENFORCE}" = "1" ]; then
              echo ""
              echo "  ================ VERIFY-035 GATES (ENFORCED) ================"
              BAD=$((F + I + S))
              if [ "${BAD}" -ne 0 ]; then note_fail "FAIL (1): ${BAD} Failed/Invalid/Stepout goal(s) — a REAL finding, never ratchet this."; else echo "  (1) Failed/Invalid/Stepout: 0  OK"; fi
              if ! echo "${PROVED_LINE}" | grep -q "Proved goals: 4789 / 4826"; then
                note_fail "FAIL (2): proved-goal summary changed (pinned: 4789 / 4826). Reclassify in VERIFY-035, then ratchet (2), (3) and the roll-call together."
              else echo "  (2) proved: 4789 / 4826  OK"; fi
              if [ "$((T + U))" -ne 37 ]; then note_fail "FAIL (3): unproved count $((T + U)) != 37."; else echo "  (3) unproved count: 37  OK"; fi
              NMISS=$(wc -l < /tmp/sb_inh_missing.txt); NOWN=$(wc -l < /tmp/sb_own.txt)
              if [ "${NMISS}" -ne 0 ] || [ "${NOWN}" -ne 0 ]; then
                note_fail "FAIL (4): roll-call — pinned 37, missing ${NMISS}, unpinned ${NOWN} (lists above)."
              else echo "  (4) roll-call: pinned 37, missing 0, unpinned 0  OK"; fi
              echo "  ============================================================="
            fi
          fi
          if [ "${FAILURES}" -ne 0 ]; then echo "  VERIFY-035 ENFORCED FAIL: ${FAILURES} check(s) above."; exit 1; fi
      - name: Upload WP proof output (stringbuf.h)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-stringbuf
          path: wp_stringbuf_output.txt
          retention-days: 90
      - name: "Result annotation (VERIFY-050)"
        # Posts the WP summary as an annotation, readable through the API
        # without the log. Reads the job's WP output files; changes no gate.
        if: always()
        run: |
          for f in wp_*.txt; do
            [ -f "$f" ] || continue
            P=$(grep -E "^\[wp\] Proved goals:" "$f" | tail -1 | grep -oE "[0-9]+ / [0-9]+" || true)
            [ -n "$P" ] || continue
            U=$(grep -cE "^\[wp\] \[(Timeout|Unknown)\]" "$f" || true)
            B=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "$f" || true)
            echo "::notice title=${{ github.job }}::${f}: proved ${P}; unproved ${U}; failed/invalid/stepout ${B}"
          done

  # -------------------------------------------------------------------------
  # data/stack.h (VERIFY-049).
  #
  # The unit: vmacros/vdrivers/stack_verify.h, which is cc-vec's driver
  # (vec_cc_experiment.h) plus DEFINE_STACK(static inline, int). stack.h's
  # contracts are in its macro body, so the unit is preprocessed with -CC,
  # with cc-vec's flags and model (Typed+Cast). Its unproved goals are
  # predicted to be cc-vec's 69, by name (vmacros/vdrivers/cc_pins/vec.txt),
  # plus the stack's own, which VERIFY-049 predicts.
  #
  # ENFORCED since VERIFY-049 run 3: the proved line, an empty own set and
  # the 69 inherited names are pinned (pins from run 2). A Failed, Invalid or
  # Stepout goal, or a missing summary, always fails it. The result is also
  # emitted as an annotation, readable without the log.
  # -------------------------------------------------------------------------
  frama-c-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup
      - name: "WP under -CC: data/stack.h at int"
        run: |
          eval $(opam env --switch=frama-c)
          ENFORCE=1   # VERIFY-049: enforced at run 3; pins from run 2 (Frama-C stack #2, f5cc32d)
          PIN_PROVED="5714 / 5783"
          OUT=wp_stack_output.txt
          set +e
          frama-c -wp -wp-rte \
            -wp-model Typed+Cast \
            -wp-prover alt-ergo,z3,cvc5 \
            -wp-timeout 120 \
            -wp-split \
            -cpp-extra-args=" \
              -CC \
              -I core/primitives \
              -I core \
              -I semantics \
              -I data \
              -I . \
              -DCANON_NO_REQUIRE \
              -DNDEBUG" \
            vmacros/vdrivers/stack_verify.h > "${OUT}" 2>&1
          WP_EXIT=$?
          set -e
          echo "frama-c exit: ${WP_EXIT}   model: Typed+Cast   preprocessing: -CC"
          PROVED=$(grep -E "^\[wp\] Proved goals:" "${OUT}" | grep -oE "[0-9]+ / [0-9]+" | tail -1)
          if ! grep -E "^\[wp\] Proved goals:" "${OUT}"; then
            echo "FAIL: WP produced no summary."; grep -E "^\[(kernel|wp)" "${OUT}" | head -30; exit 1
          fi
          BAD=$(grep -cE "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "${OUT}" || true)
          if [ "${BAD}" -ne 0 ]; then
            echo "FAIL: ${BAD} goal(s) Failed, Invalid or Stepout:"
            grep -E "^\[wp\] \[(Failed|Failure|Invalid|Stepout)\]" "${OUT}"; exit 1
          fi
          grep -oE "^\[wp\] \[(Timeout|Unknown)\] [A-Za-z0-9_]+" "${OUT}" | awk '{print $3}' | sort -u > unproved.txt
          grep -E '_stack_int_' unproved.txt > own.txt || true
          grep -vE '_stack_int_' unproved.txt > inherited.txt || true
          sort -u vmacros/vdrivers/cc_pins/vec.txt > pins_vec.txt
          echo "=== unproved: $(wc -l < unproved.txt) (inherited $(wc -l < inherited.txt), own $(wc -l < own.txt)) ==="
          echo "=== own (stack_int_*) ==="; sed 's/^/    /' own.txt
          echo "=== inherited, not among cc-vec's 69 ==="; comm -13 pins_vec.txt inherited.txt | sed 's/^/    /'
          echo "=== cc-vec's 69, not unproved here ==="; comm -23 pins_vec.txt inherited.txt | sed 's/^/    /'
          FAILS=0
          if cmp -s pins_vec.txt inherited.txt; then
            echo "INHERITED SAME: the 69 cc-vec names, exactly."
          else
            echo "DIFFERS: the inherited set is not cc-vec's (above)."; FAILS=$((FAILS + 1))
          fi
          if [ -s own.txt ]; then
            echo "DIFFERS: own goals unproved (above); the pin is none."; FAILS=$((FAILS + 1))
          else
            echo "OWN NONE: every stack_int goal is proved."
          fi
          if [ "${PROVED}" = "${PIN_PROVED}" ]; then
            echo "PROVED SAME: ${PROVED}"
          else
            echo "DIFFERS: proved ${PROVED}, pinned ${PIN_PROVED}."; FAILS=$((FAILS + 1))
          fi
          echo "::notice title=frama-c-stack::proved ${PROVED} (pin ${PIN_PROVED}); unproved $(wc -l < unproved.txt): inherited $(wc -l < inherited.txt), own $(wc -l < own.txt); ${FAILS} difference(s)"
          if [ "${FAILS}" -ne 0 ] && [ "${ENFORCE}" -eq 1 ]; then
            echo "FAIL: ${FAILS} difference(s) from the pins."; exit 1
          fi
      - name: Upload WP output (stack)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wp-proof-stack
          path: |
            wp_stack_output.txt
            unproved.txt
            own.txt
            inherited.txt
          retention-days: 90
