name: "13 · Prover agreement"

# ---------------------------------------------------------------------------
# How many of the three provers prove each goal, each running alone:
# measured by VERIFY-064, made a check on every push that can change it by
# VERIFY-065 (docs/deviations.md). Map: .github/workflows/README.md.
#
# Every proof job gives Alt-Ergo, Z3 and CVC5 together each goal that Qed,
# WP's simplifier, does not close. The first to succeed proves it, and WP
# stops the other two; even with -wp-run-all-provers, WP's report keeps one
# prover per goal. So this workflow proves each unit a push can affect three
# times, once with each prover alone and otherwise as its job proves it, and
# sorts the goals by how many provers prove each alone
# (tools/agreement/agreement.py).
#
# WHICH UNITS: the first job asks the compiler which repository files each
# unit includes, with the unit's own flags, with and without Frama-C's
# macros, and runs the units that include a changed file. A change to the
# script, this file or the Frama-C setup, or to a header under the watched
# folders that no unit includes, runs every unit; a change to a unit's pins
# runs that unit; a manual run runs every unit. 8 · Records checks that the
# script's flags are the proof jobs' and that every file a unit includes is
# under the paths below.
#
# THE GATE: in each unit, the goals no prover proves alone must be the names
# its proof job pins, and the goals one or two provers prove must be those
# of tools/agreement/pins/UNIT.txt; a proof slower than 60 s is listed and
# left out. Report-only until VERIFY-065's third run (ENFORCE in the script).
# A unit runs in three jobs, at most 30 jobs at once, the longest units
# first; WP is stopped 340 minutes after its job started, so that what it
# wrote is uploaded inside GitHub's six hours.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "master" ]
    paths:
      - 'core/**'
      - 'semantics/**'
      - 'data/**'
      - 'vmacros/vdrivers/**'
      - 'tools/agreement/**'
      - '.github/actions/framac-setup/**'
      - '.github/workflows/prover-agreement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: "Which units the push can affect"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      units: ${{ steps.affected.outputs.units }}
    steps:
      - uses: actions/checkout@v6
      - id: affected
        name: "The units that include a changed file"
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
            mapfile -t files < <(git diff --no-renames --name-only "$BEFORE" "$GITHUB_SHA")
            printf 'changed: %s\n' "${files[@]}"
            units=$(python3 tools/agreement/agreement.py affected "${files[@]}")
          else
            echo "A manual run, or no base to compare with: every unit."
            units=$(python3 tools/agreement/agreement.py affected --all)
          fi
          echo "units=$units" >> "$GITHUB_OUTPUT"
          n=$(python3 -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$units")
          echo "::notice title=agreement units::$n unit(s): $units"

  run:
    name: "agree ${{ matrix.unit }} ${{ matrix.prover }}"
    needs: changes
    if: ${{ needs.changes.outputs.units != '[]' }}
    # Pinned, not ubuntu-latest: see the runner note in
    # ci.yml (VERIFY-039, runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        unit: ${{ fromJSON(needs.changes.outputs.units) }}
        prover: [alt-ergo, z3, cvc5]
    steps:
      - name: "The job's start, from which WP's limit is counted"
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "WP, ${{ matrix.prover }} alone: ${{ matrix.unit }}"
        run: |
          eval $(opam env --switch=frama-c)
          left=$(( JOB_START + 340 * 60 - $(date +%s) ))
          if [ "$left" -lt 60 ]; then left=60; fi
          AGREE_SECONDS=$left python3 tools/agreement/agreement.py run \
            "${{ matrix.unit }}" "${{ matrix.prover }}"

      - name: Upload WP's output and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agree-${{ matrix.unit }}-${{ matrix.prover }}
          path: agree_*
          if-no-files-found: warn
          retention-days: 90
          # A re-run of a job replaces its first attempt's artifact.
          overwrite: true

  sort:
    name: "agreement ${{ matrix.unit }}"
    needs: [changes, run]
    if: ${{ !cancelled() && needs.changes.outputs.units != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.changes.outputs.units) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          # The braces keep frama-c-vec's pattern from taking vec-range's
          # and vec-fmt's artifacts too.
          pattern: "agree-${{ matrix.unit }}-{alt-ergo,z3,cvc5}"
          path: agree
          merge-multiple: true
      - name: "Sort ${{ matrix.unit }}'s goals, and compare them with its pins"
        run: python3 tools/agreement/agreement.py unit "${{ matrix.unit }}" agree
      # GitHub keeps ten notices of a step: the script writes them ten to a
      # file, and each file is posted by a step of its own.
      - name: "Notices: the counts, and the first names"
        if: ${{ !cancelled() }}
        run: cat notices_1.txt 2>/dev/null || true
      - name: "Notices: names, continued"
        if: ${{ !cancelled() }}
        run: cat notices_2.txt 2>/dev/null || true
      - name: "Notices: names, continued further"
        if: ${{ !cancelled() }}
        run: cat notices_3.txt 2>/dev/null || true
      - name: "Notices: the last names"
        if: ${{ !cancelled() }}
        run: cat notices_4.txt 2>/dev/null || true

  total:
    name: "agreement total"
    needs: [changes, sort]
    if: ${{ !cancelled() && needs.changes.outputs.units != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: "agree-*"
          path: agree
          merge-multiple: true
      - name: "The totals"
        run: python3 tools/agreement/agreement.py total agree
      - name: Upload every goal's class
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agreement
          path: agreement.tsv
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
