name: "1 · Build & test"
# Builds and runs the test suite: Linux, Windows (MSVC, MinGW, Cygwin),
# FreeBSD and macOS (Apple silicon and Intel), Release and Debug with
# sanitizers; i386;
# Valgrind; libFuzzer; the lifetime token under concurrency and the
# lifetime-debug build. Start here.
# Map of every workflow: .github/workflows/README.md (VERIFY-050).
#
# NOTE — Dr. Memory (Windows memory checker) is intentionally omitted.
#   Dr. Memory crashes internally on Windows Server 2022 (the current
#   windows-latest runner, Build 26100) with an unrecoverable internal
#   fault at startup. This is a known upstream bug with no available fix
#   or workaround as of the time of writing. Memory safety on Windows is
#   covered by the MSVC build with /W4 /WX and by Valgrind on Linux.
#   Re-enable dr-memory when upstream ships a compatible release.
#
# NOTE — the Linux runner is pinned: every Linux job runs on ubuntu-24.04,
#   never ubuntu-latest (docs/deviations.md, VERIFY-039, runner pin).
#   GitHub moves the ubuntu-latest label to Ubuntu 26.04 between 2026-10-19
#   and 2026-11-19 (actions/runner-images#14748). While a label migrates,
#   the image it names can differ from push to push (the misra job's
#   lesson; see its banner) and between the jobs of one run, each of which
#   gets its own runner. What the gates measure depends on the image: the
#   gcc that preprocesses every Frama-C unit, the system the cached opam
#   switch is restored onto (the cache key names runner.os, which is Linux
#   on any Ubuntu), and the apt-installed tools (cppcheck, clang-tidy,
#   gcc-14, lcov, valgrind, clang, gcc-multilib). Move the label
#   DELIBERATELY, as its own predicted change, never by drift.
on:
  push:
    branches: [ "master" ]
    # Documentation-only pushes change nothing a gate measures; skip them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/probes.yml'   # 9 · Probes only: nothing here reads it (VERIFY-080)
      - '.github/workflows/smoke.yml'    # 16 · Smoke tests only: nothing here reads it (VERIFY-088)
      - 'tools/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/probes.yml'   # 9 · Probes only: nothing here reads it (VERIFY-080)
      - '.github/workflows/smoke.yml'    # 16 · Smoke tests only: nothing here reads it (VERIFY-088)
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. Build + test — all platforms, Release and Debug
  # -------------------------------------------------------------------------
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; macos-15-intel, x86-64 macOS,
        # GitHub's last Intel image, until it retires with macOS 15 in fall
        # 2027 (VERIFY-123), the baseline of compcert (x86_64-macos).
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc
          - os: ubuntu-24.04
            c_compiler: clang
          - os: macos-latest
            c_compiler: clang
          - os: macos-15-intel
            c_compiler: clang
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-24.04
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-15-intel
            c_compiler: cl
          - os: macos-15-intel
            c_compiler: gcc
    steps:
      - uses: actions/checkout@v6
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          SANITIZERS=OFF
          if [[ "${{ matrix.build_type }}" == "Debug" ]]; then
            SANITIZERS=ON
          fi
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=${SANITIZERS} \
            -S "${{ github.workspace }}"
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sanitizers = if ("${{ matrix.build_type }}" -eq "Debug") { "ON" } else { "OFF" }
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DENABLE_SANITIZERS="$sanitizers" `
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }}
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # -------------------------------------------------------------------------
  # 1b. 32-bit build + test — Linux GCC -m32
  #
  #    Exercises the width axis nothing else in the matrix hits: on -m32,
  #    size_t is EXACTLY 32 bits (CANON_USIZE_MAX == 2^32-1), the minimum
  #    Tier 1 promises to support. This is where the arena overflow-guard
  #    unreachability argument (MCDC-003 / VERIFY-009, which reasons "on
  #    both 32-bit and 64-bit platforms") actually runs, instead of being
  #    asserted from a 64-bit-only matrix.
  #
  #    Sanitizers OFF: -m32 ASan/UBSan need the 32-bit runtime libs and are
  #    historically flaky to stand up. Once green, -m32 UBSan (the higher-
  #    value one for width-dependent overflow/shift UB) can be a follow-up.
  # -------------------------------------------------------------------------
  build-32bit:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v6
      - name: Install 32-bit GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Configure CMake (-m32)
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DENABLE_SANITIZERS=OFF \
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # -------------------------------------------------------------------------
  # 1c. MinGW build + test — Windows, MSYS2 UCRT64 (GCC-on-Windows)
  #
  #    Fills the one (compiler, OS) pairing the `build` job excludes that
  #    has a large real-world user base: the MSYS2/MinGW-w64 toolchain.
  #    The compiler frontend is already covered by Linux GCC; the value
  #    here is the C RUNTIME — UCRT instead of glibc. This is where the
  #    classic C99 format-specifier landmine lives: usize is size_t, and
  #    %zu / %llu against the wrong Windows CRT misbehaves. UCRT64 is the
  #    correct, fixed target; this cell proves the stdio surface (contract
  #    handler, diag.h, log.h, snprintf formatters) is sound on a Windows
  #    libc under -Wall -Wextra -Wpedantic -Werror.
  #
  #    Sanitizers OFF: ASan/UBSan support on MinGW is limited. Windows
  #    memory safety remains covered by the MSVC /W4 /WX build and by
  #    Valgrind on Linux.
  #
  #    Notes on the invocation:
  #      - Ninja is used (the path of least resistance inside the msys2
  #        shell). It is a single-config generator, so the build type is
  #        fixed at configure time — that is why the Build and Test steps
  #        do not pass --config / --build-config like the multi-config jobs.
  #      - -S . (not ${{ github.workspace }}) because the Windows workspace
  #        path with backslashes confuses the msys2 bash shell; "." resolves
  #        cleanly from the checkout directory.
  # -------------------------------------------------------------------------
  mingw:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=OFF \
            -S .
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1d. Cygwin build + test — Windows, Cygwin's GCC (VERIFY-126)
  #
  #    Cygwin is POSIX on Windows: GCC for x86_64-pc-cygwin, and Cygwin's
  #    C library, newlib's, in cygwin1.dll. Its data model is LP64, where
  #    MSVC's and MinGW-w64's Windows is LLP64; its wchar_t has 16 bits
  #    and its calling convention is Windows' x64 one, as theirs. Its GCC
  #    defines __CYGWIN__ and __unix__, not _WIN32, so that the tests take
  #    their POSIX branches on Windows here: rename replacing a name that
  #    exists, a file replaced while it is held open. It is the baseline
  #    that CompCert's x86_64-cygwin is to be read against (item 9b).
  #
  #    Cygwin is installed by the Cygwin project's own action, as MSYS2 by
  #    its own above, which checks the installer's hash and Authenticode
  #    signature and setup.ini's signature (the author's choice of
  #    2026-11-25). Cygwin's bash runs every step after it, without a
  #    login, so that the checkout stays the working directory, and with
  #    -o igncr; the checkout's line ends are LF (the action's advice).
  #    That bash keeps the runner's PATH after Cygwin's /usr/bin, so that
  #    each tool the job runs is checked to be Cygwin's, and CMake is
  #    given Cygwin's make: it looks for gmake through the whole PATH
  #    before make, and took one of the runner's own, which cannot read
  #    Cygwin's paths (VERIFY-126; VERIFY-127). Sanitizers OFF, as at
  #    MinGW. A notice per leg gives the compiler, its data model, and how
  #    many test binaries need cygwin1.dll and libatomic's DLL.
  # -------------------------------------------------------------------------
  cygwin:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: D:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Check out with LF line ends
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
      - uses: cygwin/cygwin-install-action@v7
        with:
          install-dir: 'D:\cygwin'
          packages: gcc-core make cmake
      - name: Show Cygwin's tools, its compiler and its data model
        run: |
          # Each tool the job runs is Cygwin's, in /usr/bin; and every gmake
          # on the PATH, which CMake would take before any make.
          for t in gcc make cmake ctest objdump; do
            p=$(command -v "$t" || true)
            case "$p" in
              /usr/bin/*) echo "$t: $p" ;;
              *) echo "::error::$t is '$p', not Cygwin's"; exit 1 ;;
            esac
          done
          gmakes=$(type -ap gmake | paste -sd ' ' - || true)
          echo "gmake on the PATH: ${gmakes:-none}"
          gcc --version | sed -n 1p
          machine=$(gcc -dumpmachine)
          if [ "$machine" != x86_64-pc-cygwin ]; then
            echo "::error::gcc is $machine's, not Cygwin's"; exit 1
          fi
          mkdir -p probe
          cat > probe/model.c <<'PROBE'
          #include <limits.h>
          #include <stdarg.h>
          #include <stddef.h>
          #include <stdio.h>

          int main(void)
          {
              printf("int %u, long %u, long long %u, void * %u, wchar_t %u, "
                     "long double %u, va_list %u; char %s",
                     (unsigned)sizeof(int), (unsigned)sizeof(long),
                     (unsigned)sizeof(long long), (unsigned)sizeof(void *),
                     (unsigned)sizeof(wchar_t), (unsigned)sizeof(long double),
                     (unsigned)sizeof(va_list), (CHAR_MIN < 0) ? "signed" : "unsigned");
          #if defined(__CYGWIN__)
              printf("; __CYGWIN__");
          #endif
          #if defined(_WIN32)
              printf(", _WIN32\n");
          #else
              printf(", not _WIN32\n");
          #endif
              return 0;
          }
          PROBE
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -o probe/model probe/model.c
          ./probe/model | tee probe/model.txt
      - name: Configure CMake
        run: |
          # Cygwin's make, named: CMake's own search takes a gmake first.
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_MAKE_PROGRAM:FILEPATH=/usr/bin/make \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=OFF \
            -S .
          grep '^CMAKE_MAKE_PROGRAM' build/CMakeCache.txt
      - name: Build
        run: cmake --build build -j 4
      - name: Check the test binaries are Cygwin's
        run: |
          # Each one's DLLs, from its import table: cygwin1.dll, Cygwin's
          # C library; libatomic's would be cygatomic-1.dll.
          all=0; cygwin=0; atomic=""
          for f in $(find build -maxdepth 1 -type f -name '*_test.exe' | sort); do
            all=$((all + 1))
            dlls=$(objdump -p "$f" | sed -n 's/^[[:space:]]*DLL Name: //p')
            if grep -qx 'cygwin1.dll' <<< "$dlls"; then
              cygwin=$((cygwin + 1))
            else
              echo "::error::${f#build/} does not need cygwin1.dll"
            fi
            if grep -q 'cygatomic' <<< "$dlls"; then atomic="$atomic ${f#build/}"; fi
          done
          echo "linked with libatomic:$atomic"
          # No title, as armeb's: the leg is in the message.
          echo "::notice::cygwin ${{ matrix.build_type }}: $(gcc -dumpmachine), GCC $(gcc -dumpfullversion); $(cat probe/model.txt); $cygwin of $all test binaries need cygwin1.dll, $(echo "$atomic" | wc -w) libatomic's DLL"
          if [ "$cygwin" != "$all" ] || [ "$all" = 0 ]; then exit 1; fi
          if [ -n "$atomic" ]; then echo "::error::linked with libatomic:$atomic"; exit 1; fi
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # -------------------------------------------------------------------------
  # 1e. FreeBSD build + test — FreeBSD 15.1, its own Clang (VERIFY-133)
  #
  #    FreeBSD on x86-64: its own C library and its base system's Clang,
  #    LP64 as Linux. GitHub has no FreeBSD runner, so the job boots the
  #    FreeBSD project's own VM image, its BASIC-CLOUDINIT variant, under
  #    QEMU with KVM on the Ubuntu runner (the author's choice of
  #    2026-11-26): the image checked against the SHA-256 that FreeBSD
  #    15.1's announcement gives, pinned below, and against
  #    download.freebsd.org's CHECKSUM.SHA256. FreeBSD's nuageinit reads a
  #    seed disk labelled cidata, made here: the default user, freebsd,
  #    with a key made for the run, and cmake-core and ninja from
  #    FreeBSD's own package repository. The job waits until the first
  #    boot, and a reboot it may ask for, is over; then copies the tree in
  #    over SSH, and configures, builds and tests there with FreeBSD's
  #    Clang, sanitizers off. A notice per leg gives the compiler, its
  #    data model and what CTest passed. It is the baseline that
  #    CompCert's x86_64-bsd is to be read against (item 9b).
  # -------------------------------------------------------------------------
  freebsd:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      FREEBSD_URL: https://download.freebsd.org/releases/VM-IMAGES/15.1-RELEASE/amd64/Latest
      FREEBSD_IMAGE: FreeBSD-15.1-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz
      # The image's SHA-256, as FreeBSD 15.1's announcement gives it.
      FREEBSD_SHA256: e4ca4db889f8559c9b9dfcacc70405c038476f4b6d41649b152d3809a2ed9e1f
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          # GitHub's documented step: /dev/kvm for the runner's user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU and genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
          qemu-system-x86_64 --version | sed -n 1p
      - name: Restore FreeBSD's image
        uses: actions/cache@v5
        with:
          path: freebsd-vm/${{ env.FREEBSD_IMAGE }}
          key: freebsd-15.1-cloudinit-ufs-${{ env.FREEBSD_SHA256 }}
      - name: Fetch FreeBSD's image and check it
        run: |
          mkdir -p freebsd-vm
          cd freebsd-vm
          if [ ! -f "$FREEBSD_IMAGE" ]; then
            curl -fsSL --retry 3 -o "$FREEBSD_IMAGE" "$FREEBSD_URL/$FREEBSD_IMAGE"
          fi
          echo "$FREEBSD_SHA256  $FREEBSD_IMAGE" | sha256sum -c -
          curl -fsSL --retry 3 -o CHECKSUM.SHA256 "$FREEBSD_URL/CHECKSUM.SHA256"
          line=$(grep -F "($FREEBSD_IMAGE)" CHECKSUM.SHA256 || true)
          echo "download.freebsd.org: $line"
          case "$line" in
            *"$FREEBSD_SHA256"*) ;;
            *) echo "::error::CHECKSUM.SHA256 does not give the pinned SHA-256"; exit 1 ;;
          esac
      - name: Prepare the disk and its seed
        run: |
          cd freebsd-vm
          xz -dc "$FREEBSD_IMAGE" > disk.qcow2
          qemu-img resize disk.qcow2 16G
          ssh-keygen -q -t ed25519 -N '' -C canon-c-ci -f vmkey
          mkdir -p seed
          printf 'instance-id: canon-c-ci\nlocal-hostname: canon-freebsd\n' > seed/meta-data
          {
            echo '#cloud-config'
            echo 'ssh_authorized_keys:'
            echo "  - $(cat vmkey.pub)"
            echo 'packages:'
            echo '  - cmake-core'
            echo '  - ninja'
          } > seed/user-data
          genisoimage -quiet -output seed.iso -volid cidata -joliet -rock \
            seed/user-data seed/meta-data
          # The helper: a command run in FreeBSD, as freebsd, over SSH.
          cat > vm <<EOF
          #!/bin/sh
          exec ssh -q -o BatchMode=yes -o ConnectTimeout=10 \\
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \\
            -i "$PWD/vmkey" -p 2222 freebsd@127.0.0.1 "\$@"
          EOF
          chmod +x vm
      - name: Boot FreeBSD
        run: |
          cd freebsd-vm
          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 2 -m 4096 \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw,readonly=on \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=n0 \
            -display none -serial file:console.log \
            -daemonize -pidfile qemu.pid
          # Ready when SSH answers, the first boot is over (no /firstboot),
          # the packages are in, and the boot time reads the same twice,
          # 15 s apart, so that a reboot asked for at the end of the first
          # boot has come and gone. 20 minutes at most.
          prev=""; t=0; ready=no
          while [ "$t" -lt 1200 ]; do
            if now=$(./vm 'test ! -e /firstboot && command -v cmake > /dev/null && command -v ninja > /dev/null && sysctl -n kern.boottime' 2> /dev/null); then
              if [ -n "$prev" ] && [ "$now" = "$prev" ]; then ready=yes; break; fi
              prev=$now
            else
              prev=""
            fi
            sleep 15; t=$((t + 15))
          done
          if [ "$ready" != yes ]; then
            echo "::error::FreeBSD was not ready in 20 minutes"; exit 1
          fi
          echo "ready after $t s"
      - name: Show FreeBSD, its compiler and its data model
        run: |
          cd freebsd-vm
          ./vm 'freebsd-version -kru; uname -mrs; cc --version | sed -n 1p; cmake --version | sed -n 1p; printf "ninja "; ninja --version'
          machine=$(./vm 'cc -dumpmachine')
          case "$machine" in
            x86_64-unknown-freebsd15.*) echo "cc: $machine" ;;
            *) echo "::error::cc is '$machine', not FreeBSD 15's at x86-64"; exit 1 ;;
          esac
          ./vm 'mkdir -p probe && cat > probe/model.c' <<'PROBE'
          #include <limits.h>
          #include <stdarg.h>
          #include <stddef.h>
          #include <stdio.h>

          int main(void)
          {
              printf("int %u, long %u, long long %u, void * %u, wchar_t %u, "
                     "long double %u, va_list %u; char %s",
                     (unsigned)sizeof(int), (unsigned)sizeof(long),
                     (unsigned)sizeof(long long), (unsigned)sizeof(void *),
                     (unsigned)sizeof(wchar_t), (unsigned)sizeof(long double),
                     (unsigned)sizeof(va_list), (CHAR_MIN < 0) ? "signed" : "unsigned");
          #if defined(__FreeBSD__)
              printf("; __FreeBSD__ %d", __FreeBSD__);
          #endif
          #if defined(__linux__)
              printf(", __linux__\n");
          #else
              printf(", not __linux__\n");
          #endif
              return 0;
          }
          PROBE
          ./vm 'cc -std=c99 -Wall -Wextra -Wpedantic -Werror -o probe/model probe/model.c && ./probe/model' \
            | tee model.txt
      - name: Copy the tree in, configure and build
        run: |
          cd freebsd-vm
          tar -C .. --exclude=./freebsd-vm --exclude=./.git -cf - . \
            | ./vm 'rm -rf canon && mkdir canon && tar -xf - -C canon'
          ./vm "cd canon && cmake -B build -G Ninja -DCMAKE_C_COMPILER=cc -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_SANITIZERS=OFF -S . && cmake --build build -j 2"
      - name: Test
        run: |
          cd freebsd-vm
          rc=0
          ./vm 'cd canon/build && ctest --output-on-failure' > ctest.log 2>&1 || rc=$?
          cat ctest.log
          # CTest's summary, "N% tests passed, F tests failed out of T".
          summary=$(grep -E '^[0-9]+% tests passed, [0-9]+ tests failed out of [0-9]+' ctest.log | tail -n 1 || true)
          total=$(printf '%s\n' "$summary" | sed -nE 's/.* out of ([0-9]+).*/\1/p')
          failed=$(printf '%s\n' "$summary" | sed -nE 's/^[0-9]+% tests passed, ([0-9]+) tests failed.*/\1/p')
          passed=$(( ${total:-0} - ${failed:-0} ))
          # No title, as cygwin's: the leg is in the message.
          echo "::notice::freebsd ${{ matrix.build_type }}: $(./vm 'cc -dumpmachine'), Clang $(./vm 'cc -dumpversion'); $(cat model.txt); $passed of ${total:-0} tests passed"
          exit "$rc"
      - name: Show FreeBSD's console and nuageinit's log, on failure
        if: failure()
        run: |
          cd freebsd-vm || exit 0
          if [ -f console.log ]; then tail -n 80 console.log; fi
          if [ -x vm ]; then ./vm 'tail -n 60 /var/log/nuageinit.log' || true; fi

  # -------------------------------------------------------------------------
  # 3. Valgrind — Linux only
  # -------------------------------------------------------------------------
  valgrind:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Configure CMake (no sanitizers — conflicts with Valgrind)
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=OFF \
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build build
      - name: Test under Valgrind
        working-directory: build
        run: |
          ctest \
            --build-config Debug \
            --output-on-failure \
            --overwrite MemoryCheckCommand=$(which valgrind) \
            --overwrite MemoryCheckCommandOptions="--error-exitcode=1 --leak-check=full --track-origins=yes --show-leak-kinds=all" \
            -T memcheck

  # -------------------------------------------------------------------------
  # 4. Fuzzing — Linux only
  # -------------------------------------------------------------------------
  fuzzing:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang with libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      - name: Configure CMake
        run: |
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_FUZZING=ON \
            -S "${{ github.workspace }}"
      - name: Build fuzz targets
        run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config Debug
      - name: Run fuzz targets
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config Debug --output-on-failure

  # -------------------------------------------------------------------------
  # 8. Lifetime-debug build — all platforms, Release + Debug
  #
  #    Builds and runs the full test suite with CANON_LIFETIME=debug,
  #    which defines CANON_LIFETIME_DEBUG project-wide. This activates:
  #      - lifetime_t lt field on Arena, Pool, DynString, every
  #        dynvec_T instantiation, and (Phase 3) smallvec instantiations
  #      - source_lt + captured_id fields on every borrow struct
  #      - _from_lifetime constructors capture the source's token
  #      - BORROW_LT_CHECK_ fires require_msg on every _get if the
  #        captured ID no longer matches the source's current ID
  #
  #    Matrix mirrors the default `build` job — same OS/compiler/
  #    build-type coverage. This catches:
  #      - MSVC vs GCC/Clang struct-padding differences for the
  #        embedded lifetime_t field
  #      - macOS Clang vs Linux Clang alignment behavior of uint64_t
  #        inside struct
  #      - Platform-specific pointer-size assumptions in the
  #        (region_id_t)(uintptr_t)&v ID derivation
  #      - Release-mode codegen differences when LIKELY/UNLIKELY hints
  #        interact with the additional fields
  #
  #    Sanitizers (ASan + UBSan) are enabled in Debug on Linux + macOS
  #    to catch any latent UB the lifetime instrumentation might
  #    introduce — e.g. a forgotten field initialiser leaving
  #    captured_id uninitialised, or pointer arithmetic that the
  #    additional fields perturb. MSVC builds skip ASan (DLL
  #    deployment limitation; see ENABLE_SANITIZERS in CMakeLists.txt).
  #
  #    Previously this job was Linux-Clang only — sufficient evidence
  #    when only arena and borrow embedded lifetime_t (Phase 1). After
  #    Phase 2 broadened the surface to five owning types plus all
  #    macro-generated dynvec instantiations, single-platform coverage
  #    was no longer adequate. The matrix expanded after Phase 2
  #    landed.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # lifetime-token-concurrency — the ONLY concurrent test in the project
  #
  # Canon-C is a single-threaded library (docs/thread-safety.md). It owns no
  # threads and holds no locks, so every other job in this workflow tests
  # sequential code. This job exists because token generation under
  # CANON_LIFETIME_DEBUG is the single place where the library performs a
  # read-modify-write on state shared between the CALLER's threads.
  #
  # WHAT IS AT STAKE. A token is `counter ^ owner-address`. Non-atomically,
  # two concurrent constructions can read the same counter, so two owners can
  # receive the same token — and the token is exactly what the borrow checks
  # compare. A stale borrow then validates against a different live owner:
  # the check PASSES WHEN IT SHOULD FAIL. The debug mode's whole purpose is
  # defeated, silently, in the unsafe direction. Hence a job for one function.
  #
  # WHAT IS GATED AND WHAT IS NOT — read before adding assertions here.
  #   GATED   zero duplicate tokens on an atomic path. Atomicity either holds
  #           or it does not; the direction is deterministic.
  #   GATED   zero TSan races on the atomic path.
  #   GATED   TSan DOES report the race on the forced-fallback path. If it
  #           stops, either TSan regressed or the fallback silently became
  #           atomic — both are things to investigate, not to accept.
  #   NOT     the duplicate COUNT on the fallback path. A data race is
  #   GATED   undefined behaviour, not a scheduled event: the same counter
  #           produced 50000, 50000, 0, 50000, 50000 duplicates across five
  #           consecutive runs on one machine. Requiring the race to appear
  #           would fail roughly one run in five and would assert that UB is
  #           reliable. It is printed for the record and nothing more.
  #
  # This job does not gate any proof baseline and cannot: every WP job but
  # frama-c-lifetime runs without CANON_LIFETIME_DEBUG, and frama-c-lifetime
  # proves level 4 alone, so no atomic level (1 to 3) is in any verified TU.
  # See MISRA-DEV-018 for the rule 1.2 deviation the atomic intrinsics need.
  # -------------------------------------------------------------------------
  lifetime-token-concurrency:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: "Ladder: which atomic level does each configuration select?"
        # The ladder is the fix. A C11-only version of this fix was written
        # first and was WRONG — Canon-C is C99 (CMAKE_C_STANDARD 99,
        # REQUIRED), so it would have been correct code that never compiled
        # in any job or for any caller. This step exists so that regression
        # is visible immediately rather than after a silent fallback.
        run: |
          set -e
          cat > /tmp/level_probe.c <<'PROBE_EOF'
          #define CANON_LIFETIME_DEBUG
          #include "core/primitives/lifetime.h"
          #include <stdio.h>
          int main(void) {
          #ifdef CANON_LIFETIME_ATOMIC_LEVEL_
              printf("%d %d\n", CANON_LIFETIME_ATOMIC_IDS, CANON_LIFETIME_ATOMIC_LEVEL_);
          #else
              printf("%d 4\n", CANON_LIFETIME_ATOMIC_IDS);
          #endif
              return 0;
          }
          PROBE_EOF
          FAILURES=0
          probe() {  # $1 = label, $2 = expected "atomic level", $3.. = flags
            label="$1"; expect="$2"; shift 2
            gcc "$@" -I . -o /tmp/level_probe /tmp/level_probe.c
            got=$(/tmp/level_probe)
            if [ "${got}" = "${expect}" ]; then
              echo "  OK   ${label}: atomic/level = ${got}"
            else
              echo "  FAIL ${label}: atomic/level = ${got}, expected ${expect}"
              FAILURES=$((FAILURES + 1))
            fi
          }
          echo "=== ladder selection ==="
          # THE important row: the project's own standard must NOT fall back.
          probe "C99 (the shipped standard)"  "1 2" -std=c99
          probe "C11"                         "1 1" -std=gnu11
          probe "C99 + NO_GNU_EXTENSIONS"     "0 4" -std=c99 -DCANON_NO_GNU_EXTENSIONS
          probe "C99 + LIFETIME_NO_ATOMICS"   "0 4" -std=c99 -DCANON_LIFETIME_NO_ATOMICS
          echo ""
          if [ "${FAILURES}" -ne 0 ]; then
            echo "FAIL: ${FAILURES} ladder selection(s) wrong."
            echo "      A C99 build falling to level 4 means the fix is"
            echo "      unreachable in the configuration this project ships —"
            echo "      which is the exact defect the ladder was written to"
            echo "      correct. Do not 'fix' this by relaxing the expectation."
            exit 1
          fi
          echo "PASS: every configuration selects the intended level."

      - name: "Gated: zero duplicate tokens on the atomic paths"
        run: |
          set -e
          for std in c99 gnu11; do
            for opt in -O0 -O2; do
              echo "--- -std=${std} ${opt} ---"
              gcc -std=${std} ${opt} -Wall -Wextra -I . -pthread \
                  -o /tmp/lt test/concurrency/lifetime_token_test.c
              /tmp/lt || exit 1
            done
          done
          echo "PASS: no duplicates on any atomic configuration."
          echo "      -O0 is included deliberately: the fallback race does NOT"
          echo "      reproduce without optimisation (the optimiser is what"
          echo "      keeps the counter in a register), so an -O2-only matrix"
          echo "      would miss a level that had quietly stopped being atomic."

      - name: "Reported only: the fallback path"
        # Never gated — see the banner. Printed so the record shows what the
        # conforming-C99 path actually does on this runner.
        run: |
          set -e
          for flag in -DCANON_LIFETIME_NO_ATOMICS -DCANON_NO_GNU_EXTENSIONS; do
            echo "--- ${flag} ---"
            gcc -std=c99 -O2 -Wall -Wextra ${flag} -I . -pthread \
                -o /tmp/lt_fb test/concurrency/lifetime_token_test.c
            /tmp/lt_fb
          done

      - name: "Gated: ThreadSanitizer, both directions"
        # TSan instruments accesses instead of sampling outcomes, so unlike
        # the duplicate count it is a deterministic detector and can be gated
        # in BOTH directions.
        run: |
          set -e
          FAILURES=0

          echo "=== atomic path: expect ZERO races ==="
          gcc -std=c99 -O1 -g -fsanitize=thread -I . -pthread \
              -o /tmp/ts_atomic test/concurrency/lifetime_token_test.c
          /tmp/ts_atomic > /tmp/ts_atomic.log 2>&1 || true
          ATOMIC_RACES=$(grep -c "WARNING: ThreadSanitizer: data race" /tmp/ts_atomic.log || true)
          echo "  races on atomic path: ${ATOMIC_RACES}"
          if [ "${ATOMIC_RACES}" -ne 0 ]; then
            echo "FAIL: the atomic path races. The increment selected by the"
            echo "      ladder is not actually atomic on this toolchain."
            grep -A6 "WARNING: ThreadSanitizer" /tmp/ts_atomic.log | head -20
            FAILURES=$((FAILURES + 1))
          fi

          echo ""
          echo "=== forced fallback: expect the race to BE reported ==="
          gcc -std=c99 -O1 -g -DCANON_LIFETIME_NO_ATOMICS -fsanitize=thread \
              -I . -pthread -o /tmp/ts_fb test/concurrency/lifetime_token_test.c
          /tmp/ts_fb > /tmp/ts_fb.log 2>&1 || true
          FB_RACES=$(grep -c "WARNING: ThreadSanitizer: data race" /tmp/ts_fb.log || true)
          echo "  races on fallback path: ${FB_RACES}"
          if [ "${FB_RACES}" -eq 0 ]; then
            echo "FAIL: TSan found no race on the NON-ATOMIC path. This is a"
            echo "      positive control, and its failure voids the result"
            echo "      above: if TSan cannot see a race that is known to be"
            echo "      there, 'zero races on the atomic path' means nothing."
            echo "      Either TSan regressed or the fallback stopped being"
            echo "      the fallback. Investigate before trusting this job."
            FAILURES=$((FAILURES + 1))
          fi

          echo ""
          if [ "${FAILURES}" -ne 0 ]; then
            echo "FAIL: ${FAILURES} TSan check(s) failed."
            exit 1
          fi
          echo "PASS: atomic path clean, fallback race detected (control held)."

      - name: Upload concurrency logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lifetime-token-concurrency-logs
          path: |
            /tmp/ts_atomic.log
            /tmp/ts_fb.log
          retention-days: 90
          if-no-files-found: ignore

  lifetime-debug:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; macos-15-intel, x86-64 macOS,
        # GitHub's last Intel image, until it retires with macOS 15 in fall
        # 2027 (VERIFY-123), the baseline of compcert (x86_64-macos).
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc
          - os: ubuntu-24.04
            c_compiler: clang
          - os: macos-latest
            c_compiler: clang
          - os: macos-15-intel
            c_compiler: clang
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-24.04
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-15-intel
            c_compiler: cl
          - os: macos-15-intel
            c_compiler: gcc
    steps:
      - uses: actions/checkout@v6
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      - name: Configure CMake (Linux / macOS, CANON_LIFETIME=debug)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          SANITIZERS=OFF
          if [[ "${{ matrix.build_type }}" == "Debug" ]]; then
            SANITIZERS=ON
          fi
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCANON_LIFETIME=debug \
            -DENABLE_SANITIZERS=${SANITIZERS} \
            -S "${{ github.workspace }}"
      - name: Configure CMake (Windows, CANON_LIFETIME=debug)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sanitizers = if ("${{ matrix.build_type }}" -eq "Debug") { "ON" } else { "OFF" }
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCANON_LIFETIME=debug `
            -DENABLE_SANITIZERS="$sanitizers" `
            -S "${{ github.workspace }}"
      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }}
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
